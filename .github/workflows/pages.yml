# Install as .github/workflows/pages.yml in the approved public static repository.
# Enable GitHub Pages / GitHub Actions in that repository's Settings first.
name: Publish approved static library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check catalog and release links
        run: python3 scripts/check_catalog.py
      - name: Check study questions and review records
        run: node --test scripts/check_study.cjs
      - name: Check deck authoring and cumulative updates
        run: node --test scripts/check_deck_maker.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for the Pages artifact
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            if [[ "$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f "name=$PAGES_ARTIFACT_NAME" --jq '.total_count')" == 1 ]]; then
              exit 0
            fi
            sleep 3
          done
          echo '::error::The uploaded Pages artifact is missing from this workflow run.'
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
