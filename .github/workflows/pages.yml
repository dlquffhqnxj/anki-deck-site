# Install as .github/workflows/pages.yml in the approved public static repository.
# Enable GitHub Pages / GitHub Actions in that repository's Settings first.
name: Publish approved static library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check catalog and release links
        run: python3 scripts/check_catalog.py
      - name: Check study questions and review records
        run: node --test scripts/check_study.cjs
      - name: Check deck authoring and cumulative updates
        run: node --test scripts/check_deck_maker.cjs
      - name: Keep each published producer version immutable
        run: |
          version=$(node scripts/deck_maker_release.cjs --version)
          tag="deck-maker-v$version"
          existing=$(git ls-remote --tags origin "refs/tags/$tag")
          if [[ -n "$existing" ]]; then
            git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            git diff --quiet "$tag" HEAD -- deck-maker/index.html || {
              echo '::error::Increment the deck maker version and add its changelog entry before deploying changed code.'
              exit 1
            }
          fi
      - name: Build the public ten-card practice preview
        run: |
          node scripts/deck_maker_release.cjs "$RUNNER_TEMP/deck-maker-release"
          mkdir -p deck-maker/contrast
          cp "$RUNNER_TEMP/deck-maker-release/JLPT_Grammar_Contrast_10_Preview.html" deck-maker/contrast/index.html
      - name: Stage verified Munkyeol furigana dictionaries
        run: python3 munkyeol/stage-dictionaries.py munkyeol/furigana
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for the Pages artifact
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            if [[ "$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f "name=$PAGES_ARTIFACT_NAME" --jq '.total_count')" == 1 ]]; then
              exit 0
            fi
            sleep 3
          done
          echo '::error::The uploaded Pages artifact is missing from this workflow run.'
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Allow the uploaded Pages artifact to propagate
        if: steps.deployment.outcome == 'failure'
        run: sleep 12
      - uses: actions/deploy-pages@v4
        id: retry_deployment
        if: steps.deployment.outcome == 'failure'
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

  deck-maker-release:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Archive each published deck maker version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node scripts/deck_maker_release.cjs --version)
          tag="deck-maker-v$version"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == false ]]; then exit 0; fi
          dest="$RUNNER_TEMP/deck-maker-release"
          node scripts/deck_maker_release.cjs "$dest"
          assets=("$dest/Anki_Deck_Operations_v$version.html" "$dest/JLPT_Grammar_Contrast_10.apkg" "$dest/JLPT_Grammar_Contrast_10_Preview.html")
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" --clobber "${assets[@]}"
            gh release edit "$tag" --draft=false --latest=false --notes-file "$dest/notes.md"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --latest=false \
              --title "독립 웹 덱 제작기 v$version" --notes-file "$dest/notes.md" "${assets[@]}"
          fi
