<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anki Deck 플랫폼 v1.3.0 미리보기</title>
<style>
:root {
  color-scheme: light only;
  --kr-bg:#f2f0e8;
  --kr-surface:#fffefa;
  --kr-soft:#f8f5ec;
  --kr-surface-3:#eef5eb;
  --kr-text:#242a24;
  --kr-muted:#687168;
  --kr-line:#d5d9cf;
  --kr-green:#41664b;
  --kr-accent:#8a672f;
  --kr-pale:#f1f5ed;
  --kr-good:#316b3d;
  --kr-good-bg:#e7f2e6;
  --kr-bad:#a64841;
  --kr-bad-bg:#f8e8e5;
  --kr-shadow:0 14px 36px rgba(48,57,47,.11);
}

html, body, .card, body.nightMode, body.night_mode, .nightMode, .night_mode {
  color-scheme:light only !important;
  background:var(--kr-bg) !important;
  color:var(--kr-text) !important;
}

* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
.card {
  min-height:100vh;
  margin:0;
  padding:28px 16px 80px;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK KR","Malgun Gothic",sans-serif;
  font-size:17px;
  line-height:1.7;
  text-align:left;
  word-break:keep-all;
  overflow-wrap:anywhere;
}

.kr-card {
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:clamp(18px,4vw,28px);
  color:var(--kr-text) !important;
  background:var(--kr-surface) !important;
  border:1px solid var(--kr-line);
  border-radius:22px;
  box-shadow:var(--kr-shadow);
  word-break:keep-all;
  overflow:hidden;
}

.kr-meta {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  align-items:center;
  margin:0 0 18px;
  color:var(--kr-muted);
  font-size:12px;
  letter-spacing:.01em;
}
.kr-brand { color:var(--kr-green); font-weight:800; }
.kr-dot { color:var(--kr-line); }
.kr-pill {
  display:inline-flex;
  align-items:center;
  min-height:28px;
  padding:3px 10px;
  color:var(--kr-muted);
  background:rgba(255,255,255,.75);
  border:1px solid var(--kr-line);
  border-radius:999px;
  font-size:12px;
}

.kr-hero {
  margin:0;
  padding:0;
  text-align:center;
  background:transparent !important;
  border:0;
  box-shadow:none;
}
.kr-section {
  margin:16px 0 0;
  padding:18px 20px;
  background:var(--kr-soft) !important;
  border:1px solid var(--kr-line);
  border-radius:16px;
}
.kr-prompt { margin:0 0 14px; color:#59645a; font-size:15px; }
.kr-glyph {
  margin:10px 0 18px;
  font-family:"Noto Sans CJK JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:clamp(72px,20vw,104px);
  font-weight:500;
  line-height:1.15;
  letter-spacing:.02em;
}
.kr-word-prompt {
  margin:8px 0 12px;
  font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif;
  font-size:clamp(40px,10vw,58px);
  line-height:1.35;
}
.kr-write-hint { margin:8px 0 20px; font-size:clamp(26px,7vw,36px); font-weight:750; line-height:1.4; }
.kr-footnote { margin:12px 0 0; color:var(--kr-muted); font-size:12px; line-height:1.65; }
.kr-small-title { display:block; margin:0 0 8px; color:var(--kr-muted); font-size:12px; font-weight:700; letter-spacing:.03em; }
.kr-answer {
  display:grid;
  grid-template-columns:148px minmax(0,1fr);
  gap:22px;
  align-items:center;
  text-align:left;
}
.kr-answer .kr-glyph { margin:0; font-size:92px; line-height:1; text-align:center; }
.kr-answer-main { color:var(--kr-green); font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif; font-size:23px; font-weight:800; line-height:1.5; }
.kr-answer-meaning { margin-top:5px; font-size:17px; }
.kr-section h3 { margin:0 0 11px; color:var(--kr-green); font-size:14px; }
.kr-reading-row { display:grid; grid-template-columns:44px 1fr; gap:10px; padding:7px 0; }
.kr-reading-row label { padding-top:3px; color:var(--kr-muted); font-size:12px; }
.kr-ja { font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif; }
.kr-facts { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; color:var(--kr-muted); font-size:12px; }
.kr-facts span { padding:4px 8px; background:#fff; border:1px solid var(--kr-line); border-radius:8px; }

.kr-memory {
  padding:20px;
  background:var(--kr-surface) !important;
  border-left:4px solid #a7b89f;
}
.kr-memory-content { margin-top:3px; }
.kr-memory p { margin:0; font-size:18px; line-height:1.85; }
.kr-memory .kr-footnote { margin-top:11px; font-size:11px; line-height:1.6; }
.kr-mnemonic {
  display:grid;
  grid-template-columns:148px minmax(0,1fr);
  gap:22px;
  align-items:center;
  margin:0;
  padding:0;
}
.kr-mnemonic + .kr-mnemonic { margin-top:18px; padding-top:18px; border-top:1px solid var(--kr-line); }
.kr-mnemonic > img {
  width:148px;
  max-width:100%;
  height:auto;
  background:#fff;
  border:1px solid #d0d5ca;
  border-radius:16px;
}
.kr-mnemonic figcaption { min-width:0; }
.kr-memory-origin { display:block; margin:0 0 7px; color:var(--kr-green); font-size:11px; font-weight:800; letter-spacing:.04em; }
.kr-mnemonic figcaption p { margin:0; font-size:18px; line-height:1.85; word-break:keep-all; overflow-wrap:anywhere; }
.kr-mnemonic small { display:block; margin-top:11px; color:var(--kr-muted); font-size:11px; }

.kr-word-list { display:grid; gap:0; }
.kr-word { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--kr-line); }
.kr-word:last-child { border:0; }
.kr-word ruby { font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif; font-size:22px; white-space:normal; }
.kr-word rt { color:var(--kr-green); font-size:11px; }
.kr-word span { color:var(--kr-muted); font-size:14px; text-align:right; }
.kr-parent-source { margin-bottom:14px; }
.kr-parent-source > p, .kr-word-origins { color:var(--kr-muted); font-size:12px; }
.kr-card[data-kind="word"] .kr-answer { grid-template-columns:auto minmax(0,1fr); }
.kr-card[data-kind="word"] .kr-answer .kr-glyph { max-width:220px; font-size:44px; line-height:1.4; }

.kr-card details {
  margin:16px 0 0;
  overflow:hidden;
  background:var(--kr-soft) !important;
  border:1px solid var(--kr-line);
  border-radius:16px;
}
.kr-card summary { padding:13px 16px; color:var(--kr-green); cursor:pointer; font-size:14px; font-weight:800; list-style-position:inside; }
.kr-detail-body { padding:0 16px 16px; }
.kr-card img { display:block; max-width:100%; height:auto; }
.kr-source img { background:#fff; border-radius:10px; }
.kr-card a { color:var(--kr-accent); text-decoration:underline; text-underline-offset:3px; overflow-wrap:anywhere; }
.kr-source-meta { margin:9px 0; color:var(--kr-muted); font-size:12px; word-break:keep-all; }
.kr-audit { padding-top:7px; color:var(--kr-muted); font-size:11px; line-height:1.8; }
.kr-card-id { margin:18px 2px 0; padding-top:12px; color:var(--kr-muted); border-top:1px solid var(--kr-line); font-size:11px; line-height:1.55; word-break:break-word; }

.kr-tools { display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin:13px 0; }
.kr-card button {
  appearance:none;
  padding:9px 13px;
  color:var(--kr-green);
  background:var(--kr-surface);
  border:1px solid var(--kr-line);
  border-radius:10px;
  cursor:pointer;
  touch-action:manipulation;
  font:700 13px/1.3 -apple-system,BlinkMacSystemFont,"Noto Sans CJK KR",sans-serif;
}
.kr-card button.primary { color:#fff; background:var(--kr-green); border-color:var(--kr-green); }
.kr-card button:focus-visible, .kr-card summary:focus-visible { outline:3px solid var(--kr-accent); outline-offset:3px; }
.kr-card button[aria-pressed="true"] { background:var(--kr-bad-bg); border-color:var(--kr-accent); }
.kr-card button:disabled { cursor:default; opacity:.58; }

.kr-pad { margin-top:14px; }
.kr-pad[hidden], .kr-ghost[hidden] { display:none !important; }
.kr-pad-board { position:relative; width:min(286px,100%); aspect-ratio:1; margin:0 auto; overflow:hidden; background:#fff; border:1px solid var(--kr-line); border-radius:14px; }
.kr-pad-board:before, .kr-pad-board:after { position:absolute; z-index:0; content:""; pointer-events:none; opacity:.75; }
.kr-pad-board:before { left:50%; height:100%; border-left:1px dashed var(--kr-line); }
.kr-pad-board:after { top:50%; width:100%; border-top:1px dashed var(--kr-line); }
.kr-pad canvas { position:absolute; z-index:2; inset:0; width:100%; height:100%; cursor:default; pointer-events:none; touch-action:auto; user-select:none; -webkit-user-select:none; }
.kr-pad.kr-active canvas { cursor:crosshair; pointer-events:auto; touch-action:none; }
.kr-pad.kr-active .kr-pad-board { border-color:var(--kr-green); box-shadow:0 0 0 2px var(--kr-pale); }
.kr-ghost { position:absolute; z-index:1; inset:0; display:flex; align-items:center; justify-content:center; color:var(--kr-accent); opacity:.18; font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif; font-size:200px; line-height:1; pointer-events:none; }
.kr-pad-status { min-height:20px; margin:6px 0; color:var(--kr-muted); font-size:12px; text-align:center; }
.kr-stroke img { width:260px; max-width:100%; margin:8px auto; background:#fff; border-radius:12px; }
.kr-license { color:var(--kr-muted); font-size:11px; line-height:1.6; }

.kr-stable-media { display:block; max-width:100%; height:auto; object-fit:contain; }
.kr-source-text { background:#fff; border-radius:3px; }
.kr-answer-main > .kr-stable-media, .kr-word-prompt > .kr-stable-media, .kr-write-hint > .kr-stable-media { margin:6px auto; }
.kr-glyph > .kr-stable-media { margin:0 auto; border-radius:8px; }
.kr-ghost > .kr-stable-media { width:78%; margin:auto; }
.kr-scan-word-row { padding:11px 0; border-bottom:1px solid var(--kr-line); }
.kr-scan-word-row:last-child { border:0; }
.kr-mnemonic figcaption .kr-source-text { width:auto; max-width:100%; }

.kr-quiz .kr-hero { text-align:left; }
.kr-quiz-expression { margin:8px 0 20px; font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif; font-size:48px; line-height:1.25; }
.kr-quiz-options { display:grid; gap:10px; margin:0; }
.kr-quiz .kr-choice {
  display:grid;
  grid-template-columns:36px minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  width:100%;
  min-height:58px;
  padding:12px 14px;
  color:var(--kr-text);
  background:var(--kr-soft);
  border:1px solid var(--kr-line);
  border-radius:14px;
  font-size:17px;
  font-weight:500;
  line-height:1.6;
  text-align:left;
  transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.kr-quiz .kr-choice:hover { border-color:#879b87; transform:translateY(-1px); }
.kr-quiz .kr-choice:disabled { opacity:1; transform:none; }
.kr-choice b { display:grid; place-items:center; width:30px; height:30px; padding:0; color:var(--kr-green); background:#fff; border:1px solid #aab4a7; border-radius:8px; font-size:13px; font-weight:800; }
.kr-choice-state { margin-left:auto; color:transparent; font-size:12px; font-weight:800; }
.kr-quiz .kr-correct { background:var(--kr-good-bg) !important; border:2px solid var(--kr-good) !important; }
.kr-quiz .kr-correct .kr-choice-state { color:var(--kr-good); }
.kr-quiz .kr-incorrect { background:var(--kr-bad-bg) !important; border:2px solid var(--kr-bad) !important; }
.kr-quiz .kr-incorrect .kr-choice-state { color:var(--kr-bad); }
.kr-quiz-status { margin:12px 0 0; color:var(--kr-muted); font-size:13px; line-height:1.6; }
.kr-quiz-feedback { display:none; margin-top:16px; padding:20px; background:var(--kr-surface-3) !important; border:1px solid var(--kr-line); border-radius:18px; }
.kr-quiz-feedback.is-visible { display:block; animation:krReveal .22s ease-out; }
.kr-quiz-result { margin:0 0 10px; color:var(--kr-good); font-size:14px; font-weight:900; }
.kr-quiz .kr-explanation { margin:0 0 14px; font-size:18px; }
.kr-quiz .kr-options-answer { color:#394139; font-size:14px; line-height:1.8; }
.kr-quiz .kr-options-answer h3 { margin:17px 0 7px; color:var(--kr-green); font-size:13px; }
.kr-quiz ul { margin:0; padding-left:21px; }
.kr-quiz li { margin:6px 0; }
.kr-rating-note { margin-top:15px; padding:15px 16px; color:#4d584d; background:var(--kr-pale); border-left:4px solid #a7b89f; border-radius:12px; font-size:13px; }
@keyframes krReveal { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

@media (max-width:560px) {
  .card { padding:18px 10px 56px; }
  .kr-card { border-radius:18px; }
  .kr-section { padding:17px 16px; }
  .kr-answer { grid-template-columns:108px minmax(0,1fr); gap:14px; align-items:start; }
  .kr-answer .kr-glyph { font-size:70px; }
  .kr-answer-main { font-size:21px; }
  .kr-mnemonic { grid-template-columns:108px minmax(0,1fr); gap:14px; align-items:start; }
  .kr-mnemonic > img { width:108px; }
  .kr-mnemonic figcaption p, .kr-memory p { font-size:16px; line-height:1.75; }
  .kr-quiz-expression { font-size:41px; }
  .kr-quiz .kr-choice { grid-template-columns:34px minmax(0,1fr); }
  .kr-choice-state { grid-column:2; margin-left:0; }
  .kr-card[data-kind="word"] .kr-answer .kr-glyph { max-width:130px; font-size:36px; }
}
@media (max-width:350px) {
  .kr-mnemonic { grid-template-columns:1fr; }
  .kr-mnemonic > img { width:128px; margin:0 auto; }
}
@media (prefers-reduced-motion:reduce) {
  * { scroll-behavior:auto !important; animation:none !important; transition:none !important; }
}

/* Kanji Revolution v1.2.0-RC1 - shared settings and local records UI. */

/* The release remains bright by default. "Device settings" removes the light
   lock and follows the host/WebView colour preference. */
:root.kr-force-light,
body.kr-force-light,
.nightMode.kr-force-light,
.night_mode.kr-force-light {
  color-scheme: light !important;
  --kr-bg:#f3f6f0;
  --kr-surface:#fffefa;
  --kr-soft:#f7f8f2;
  --kr-surface-3:#eef5eb;
  --kr-text:#242a24;
  --kr-muted:#687168;
  --kr-line:#d5d9cf;
  --kr-green:#41664b;
  --kr-accent:#8a672f;
  --kr-pale:#f8e8e5;
  --kr-good:#316b3d;
  --kr-good-bg:#e7f2e6;
  --kr-bad:#a64841;
  --kr-bad-bg:#f8e8e5;
  --kr-shadow:0 14px 36px rgba(48,57,47,.10);
}

:root.kr-force-dark,
body.kr-force-dark,
.nightMode:not(.kr-force-light),
.night_mode:not(.kr-force-light) {
  color-scheme: dark !important;
  --kr-bg:#171b18;
  --kr-surface:#232923;
  --kr-soft:#2a312a;
  --kr-surface-3:#29372c;
  --kr-text:#f2f5ee;
  --kr-muted:#b5beb3;
  --kr-line:#465047;
  --kr-green:#b7ddb9;
  --kr-accent:#f1c77f;
  --kr-pale:#3a302e;
  --kr-good:#a9e0ad;
  --kr-good-bg:#26422b;
  --kr-bad:#ffb5ac;
  --kr-bad-bg:#4a2d2b;
  --kr-shadow:none;
}

body.kr-force-light,
body.kr-force-dark,
.kr-force-light .card,
.kr-force-dark .card {
  background:var(--kr-bg) !important;
  color:var(--kr-text) !important;
}

body.kr-font-serif,
.kr-font-serif .card,
.kr-font-serif .kr-card {
  font-family:Georgia,"Times New Roman","Noto Serif KR","Noto Serif CJK KR",serif !important;
}

body.kr-size-large,
.kr-size-large .card { font-size:19px !important; }

body.kr-size-xlarge,
.kr-size-xlarge .card { font-size:21px !important; }

.kr-meta { overflow:visible; }

.kr-meta-actions {
  display:flex;
  align-items:center;
  gap:6px;
  margin-left:auto;
}

.kr-settings-host { position:relative; display:inline-flex; }

.kr-card .kr-top-button {
  min-height:32px;
  padding:6px 10px;
  border:1px solid var(--kr-line);
  border-radius:10px;
  background:var(--kr-surface);
  color:var(--kr-green);
  box-shadow:none;
  font:800 12px/1.25 -apple-system,BlinkMacSystemFont,"Noto Sans CJK KR","Malgun Gothic",sans-serif;
  white-space:nowrap;
}

.kr-card .kr-record-button { background:var(--kr-soft); }

.kr-card .kr-settings-button[aria-expanded="true"] {
  border-color:var(--kr-green);
  background:var(--kr-surface-3);
}

.kr-settings-panel {
  display:none;
  position:fixed;
  z-index:190;
  top:58px;
  right:12px;
  width:min(390px,calc(100vw - 24px));
  max-height:calc(100vh - 76px);
  max-height:calc(100dvh - 76px);
  padding:14px;
  overflow:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  color:var(--kr-text);
  background:var(--kr-surface);
  border:1px solid var(--kr-line);
  border-radius:15px;
  box-shadow:0 22px 60px rgba(0,0,0,.22);
}

.kr-settings-panel.open { display:block; }

.kr-setting-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 8px;
  color:var(--kr-text);
  font-size:14px;
  font-weight:900;
}

.kr-setting-kicker {
  color:var(--kr-muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:.06em;
}

.kr-setting-row {
  display:grid;
  grid-template-columns:94px minmax(0,1fr);
  align-items:center;
  gap:9px;
  padding:7px 0;
}

.kr-setting-label {
  color:var(--kr-text);
  font-size:12px;
  font-weight:850;
}

.kr-segments {
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  padding:3px;
  background:var(--kr-soft);
  border:1px solid var(--kr-line);
  border-radius:9px;
}

.kr-card .kr-segments button {
  min-height:29px;
  padding:5px 8px;
  color:var(--kr-muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  font-size:11px;
  font-weight:800;
}

.kr-card .kr-segments button.active {
  color:var(--kr-green);
  background:var(--kr-surface);
  border-color:var(--kr-green);
}

.kr-setting-note {
  margin:8px 1px 0;
  color:var(--kr-muted);
  font-size:10px;
  line-height:1.5;
}

.kr-record-modal[aria-hidden="true"] { display:none !important; }

.kr-record-modal {
  position:fixed;
  z-index:210;
  inset:0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  height:100vh;
  height:100dvh;
  min-height:0;
  padding:18px;
  overflow:hidden;
  overscroll-behavior:contain;
  background:rgba(13,20,15,.68);
  box-sizing:border-box;
}

.kr-record-sheet {
  position:relative;
  box-sizing:border-box;
  width:min(790px,100%);
  max-height:calc(100vh - 36px);
  max-height:calc(100dvh - 36px);
  margin:auto;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  color:var(--kr-text);
  background:var(--kr-bg);
  border:1px solid var(--kr-line);
  border-radius:22px;
  box-shadow:0 28px 90px rgba(0,0,0,.30);
}

.kr-record-head {
  position:sticky;
  z-index:3;
  top:0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  padding:23px 24px 18px;
  background:var(--kr-surface);
  border-bottom:1px solid var(--kr-line);
}

.kr-record-eyebrow {
  display:inline-flex;
  padding:4px 10px;
  color:var(--kr-green);
  background:var(--kr-surface-3);
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  letter-spacing:.06em;
}

.kr-record-head h2 {
  margin:8px 0 2px;
  color:var(--kr-text);
  font-size:28px;
  line-height:1.2;
  letter-spacing:-.03em;
}

.kr-record-head p { margin:0; color:var(--kr-muted); font-size:11px; }

.kr-card .kr-record-close,
.kr-record-close {
  flex:0 0 auto;
  width:42px;
  height:42px;
  padding:0;
  color:var(--kr-text);
  background:var(--kr-soft);
  border:1px solid var(--kr-line);
  border-radius:12px;
  font-size:21px;
  font-weight:500;
}

.kr-record-content { min-height:0; padding:20px 22px 34px; }

.kr-record-top {
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  gap:11px;
}

.kr-record-card,
.kr-record-control,
.kr-record-metric,
.kr-record-chart {
  color:var(--kr-text);
  background:var(--kr-surface);
  border:1px solid var(--kr-line);
  border-radius:16px;
}

.kr-record-card { min-height:126px; padding:15px; }

.kr-record-card.today {
  display:flex;
  align-items:center;
  gap:13px;
}

.kr-record-ring {
  --kr-pct:0%;
  display:grid;
  flex:0 0 auto;
  place-items:center;
  width:78px;
  height:78px;
  border-radius:50%;
  background:conic-gradient(var(--kr-green) var(--kr-pct),var(--kr-line) 0);
}

.kr-record-ring:before {
  grid-area:1/1;
  width:61px;
  height:61px;
  content:"";
  background:var(--kr-surface);
  border-radius:50%;
}

.kr-record-ring strong {
  z-index:1;
  grid-area:1/1;
  font-size:17px;
}

.kr-record-ring span { color:var(--kr-muted); font-size:10px; }

.kr-record-label { color:var(--kr-muted); font-size:11px; font-weight:800; }

.kr-record-value { margin-top:5px; font-size:28px; font-weight:900; line-height:1.1; }

.kr-record-value small { margin-left:2px; color:var(--kr-muted); font-size:12px; }

.kr-record-note { margin-top:7px; color:var(--kr-muted); font-size:10px; line-height:1.45; }

.kr-record-controls {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin-top:11px;
}

.kr-record-control {
  display:grid;
  grid-template-columns:1fr minmax(120px,42%);
  align-items:center;
  gap:10px;
  padding:12px 14px;
}

.kr-record-control label { font-size:12px; font-weight:850; }

.kr-record-control input {
  box-sizing:border-box;
  width:100%;
  min-height:38px;
  padding:7px 9px;
  color:var(--kr-text);
  background:var(--kr-soft);
  border:1px solid var(--kr-line);
  border-radius:9px;
  font:700 12px/1.3 inherit;
}

.kr-record-metrics {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:11px;
}

.kr-record-metric { padding:13px; }

.kr-record-metric strong { display:block; margin-top:4px; font-size:19px; line-height:1.25; }

.kr-record-metric span { color:var(--kr-muted); font-size:10px; }

.kr-record-metric em {
  display:block;
  margin-top:5px;
  color:var(--kr-green);
  font-size:10px;
  font-style:normal;
  font-weight:800;
}

.kr-record-progress {
  height:7px;
  margin-top:9px;
  overflow:hidden;
  background:var(--kr-line);
  border-radius:99px;
}

.kr-record-progress span { display:block; height:100%; background:var(--kr-green); border-radius:99px; }

.kr-record-chart { margin-top:11px; padding:16px; }

.kr-record-section-head {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
}

.kr-record-section-head h3 { margin:0; color:var(--kr-text); font-size:14px; }

.kr-record-section-head span { color:var(--kr-muted); font-size:10px; }

.kr-record-bars {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  align-items:end;
  gap:7px;
  height:146px;
  margin-top:14px;
  padding-top:9px;
  border-bottom:1px solid var(--kr-line);
}

.kr-record-day {
  display:grid;
  grid-template-rows:18px 1fr 20px;
  height:100%;
  text-align:center;
}

.kr-record-count { color:var(--kr-muted); font-size:9px; }

.kr-record-barbox { display:flex; align-items:flex-end; justify-content:center; }

.kr-record-bar {
  box-sizing:border-box;
  width:min(30px,70%);
  min-height:3px;
  background:var(--kr-soft);
  border:1px solid var(--kr-line);
  border-radius:7px 7px 2px 2px;
}

.kr-record-day.today .kr-record-bar { background:var(--kr-green); border-color:var(--kr-green); }

.kr-record-daylabel { align-self:end; color:var(--kr-muted); font-size:9px; }

.kr-record-day.today .kr-record-daylabel { color:var(--kr-green); font-weight:900; }

.kr-record-foot {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-top:11px;
  padding:13px 14px;
  background:var(--kr-soft);
  border:1px dashed var(--kr-line);
  border-radius:13px;
}

.kr-record-foot p { margin:0; color:var(--kr-muted); font-size:10px; line-height:1.5; }

.kr-card .kr-record-reset,
.kr-record-reset {
  flex:0 0 auto;
  padding:7px 10px;
  color:var(--kr-bad);
  background:transparent;
  border:1px solid var(--kr-bad);
  border-radius:9px;
  font-size:10px;
  font-weight:850;
}

body.kr-record-body-lock { overflow:hidden !important; }

.kr-force-dark .kr-prompt,
.nightMode:not(.kr-force-light) .kr-prompt,
.night_mode:not(.kr-force-light) .kr-prompt,
.kr-force-dark .kr-quiz .kr-options-answer,
.nightMode:not(.kr-force-light) .kr-quiz .kr-options-answer,
.night_mode:not(.kr-force-light) .kr-quiz .kr-options-answer,

}

.kr-force-dark .kr-pill,
.nightMode:not(.kr-force-light) .kr-pill,
.night_mode:not(.kr-force-light) .kr-pill,
.kr-force-dark .kr-facts span,
.nightMode:not(.kr-force-light) .kr-facts span,
.night_mode:not(.kr-force-light) .kr-facts span {
  background:var(--kr-soft) !important;
}

.kr-top-button:focus-visible,
.kr-settings-panel button:focus-visible,
.kr-record-modal button:focus-visible,
.kr-record-modal input:focus-visible {
  outline:3px solid var(--kr-accent) !important;

@media (max-width:650px) {
  .kr-meta { align-items:flex-start; }
  .kr-meta-actions { width:100%; justify-content:flex-end; margin-left:0; }
  .kr-settings-panel { top:52px; right:8px; width:calc(100vw - 16px); max-height:calc(100dvh - 62px); }
  .kr-setting-row { grid-template-columns:82px minmax(0,1fr); }
  .kr-record-modal { display:block; height:100vh; height:100dvh; padding:0; }
  .kr-record-sheet {

    height:100vh;
    height:100dvh;

    margin:0;
    overflow-x:hidden;
    overflow-y:scroll;
    border:0;
    border-radius:0;
  }
  .kr-record-head { padding:18px 15px 14px; }
  .kr-record-content { padding:14px 12px max(64px,calc(28px + env(safe-area-inset-bottom))); }

  .kr-record-card.today { grid-column:1/-1; }
  .kr-record-controls { grid-template-columns:1fr; }
  .kr-record-metrics { grid-template-columns:1fr 1fr; }
  .kr-record-bars { gap:4px; height:132px; }
  .kr-record-foot { align-items:flex-start; flex-direction:column; }

.preview-nav button{cursor:pointer;font-weight:700;font-size:14px}

.preview-pos{margin-left:auto;font-size:13px;color:var(--kr-muted);white-space:nowrap}
.preview-empty{background:var(--kr-surface);border:1px solid var(--kr-line);border-radius:10px;padding:18px}
main,#study{min-width:0}

window.krFiltersMarkup="<details class=\"af-helper\" data-af-helper>\n  <summary>오답·플래그로 복습할 카드 찾기</summary>\n  <div class=\"af-body\">\n    <p class=\"af-description\"><strong>1. 조건 선택 → 2. 검색식 복사 → 3. Anki의 ‘찾기’에 붙여넣기 → ‘모으기’</strong><br>이 도우미는 조건을 Anki 검색식으로 바꿉니다. 실제 카드 기록을 조회하고 모으는 일은 Anki가 합니다.</p>\n    <div class=\"af-fields\">\n      <label>급수 / 구분<select data-af-field=\"level\"></select></label>\n      <label>학습·문제 유형<select data-af-field=\"area\"></select></label>\n      <label>모을 기준<select data-af-field=\"reason\"><option value=\"again_or_flag\">오답 + 플래그</option><option value=\"again\">오답 : 다시 평가</option><option value=\"flag\">헷갈림 : 플래그</option><option value=\"hard\">어려움 평가</option><option value=\"lapses\">반복 실패 : 누적 3회 이상</option></select></label>\n      <label>평가 기록의 기간<select data-af-field=\"days\"><option value=\"1\">오늘</option><option value=\"7\" selected>최근 7일</option><option value=\"14\">최근 14일</option><option value=\"30\">최근 30일</option></select></label>\n      <label>한 번에 모을 카드<select data-af-field=\"limit\"><option value=\"20\">20장</option><option value=\"50\">50장</option><option value=\"100\">100장</option><option value=\"200\">200장</option></select></label>\n      <label>선택 기준<select data-af-field=\"order\"><option value=\"random\">랜덤</option><option value=\"lapses\">복습 실패 횟수 많은 순</option></select></label>\n    </div>\n    <p class=\"af-summary\" data-af-summary></p>\n    <p class=\"af-description\" data-af-explanation></p>\n    <p class=\"af-description\" data-af-order-explanation></p>\n    <label class=\"af-query-label\">Anki의 ‘찾기’에 넣을 검색식 — 아래 내용 전체<textarea data-af-query rows=\"3\" readonly spellcheck=\"false\" autocapitalize=\"off\" autocorrect=\"off\" aria-label=\"생성된 필터 검색식\"></textarea></label>\n    <div class=\"af-buttons\"><button type=\"button\" data-af-copy>검색식 복사</button><button type=\"button\" data-af-select>전체 선택 · 직접 복사</button></div>\n    <p class=\"af-message\" data-af-message role=\"status\" aria-live=\"polite\"></p>\n    <details class=\"af-guide\" data-af-copy-check><summary>복사·붙여넣기가 되는지 확인</summary>\n      <p>PC에서는 위 ‘전체 선택 · 직접 복사’를 누른 뒤 <strong>Ctrl+C</strong>를 누르세요. iPhone·iPad에서는 검색식 칸을 길게 눌러 전체 선택 후 ‘복사’를 누르세요.</p>\n      <label class=\"af-query-label\">이 확인 칸에 직접 붙여넣어 보세요<textarea data-af-paste rows=\"3\" spellcheck=\"false\" autocapitalize=\"off\" autocorrect=\"off\" placeholder=\"PC: 여기를 누르고 Ctrl+V / 모바일: 길게 눌러 붙여넣기\" aria-label=\"복사한 검색식 붙여넣기 확인\"></textarea></label>\n      <p data-af-paste-result class=\"af-message\" role=\"status\" aria-live=\"polite\">아직 확인하지 않았습니다.</p>\n      <p>이 칸은 붙여넣기 확인용입니다. 실제 필터 덱은 Anki에서 만듭니다. 여기에는 들어가는데 Anki에 들어가지 않으면 Anki 창의 ‘찾기’를 클릭한 뒤 Ctrl+A → Ctrl+V를 누르세요.</p>\n    </details>\n    <dl class=\"af-settings\">\n      <dt>Anki에 넣을 이름 예시</dt><dd data-af-name></dd>\n      <dt>개수 제한</dt><dd data-af-limit></dd>\n      <dt>선택 기준</dt><dd data-af-order></dd>\n      <dt>일정 조정</dt><dd>추가 연습에서 기존 간격을 유지하려면 체크 해제</dd>\n    </dl>\n    <details class=\"af-guide\" data-af-concept><summary>검색식이 카드 기록을 찾는 원리 · 예시로 보기</summary>\n      <p><strong>노트에는 한자·뜻·급수 같은 내용이 들어 있고, 그 노트에서 만든 각 카드에는 평가 이력과 깃발이 따로 연결됩니다.</strong> Anki의 카드 정보에서 그 기록을 확인할 수 있습니다. 같은 노트의 읽기·쓰기 카드도 평가와 깃발은 서로 다를 수 있습니다.</p>\n      <p>이 도우미는 선택한 급수·유형·수집 기준을 Anki가 원래 지원하는 검색 문법으로 조합합니다. 검색식 자체에 카드나 학습기록이 들어 있지는 않습니다.</p>\n      <dl class=\"af-settings\" data-af-tokens></dl>\n      <p>아래는 <strong>설명용 카드 5장</strong>입니다. 모두 선택한 급수·유형에 속한다고 가정합니다. 사용자의 실제 기록과 연결되어 있지 않습니다.</p>\n      <div class=\"af-table-wrap\"><table class=\"af-demo-table\"><thead><tr><th>카드</th><th>‘다시’ 기록</th><th>현재 주황 깃발</th><th>‘어려움’ 기록</th><th>복습 실패 누계</th><th>조건 일치</th></tr></thead><tbody data-af-demo-body></tbody></table></div>\n      <p class=\"af-description\">A는 오늘 ‘다시’를 누른 후 ‘알맞음’으로 맞혔습니다. 마지막 평가가 알맞음이어도 오늘의 다시 기록은 남습니다. 복습 실패 누계는 복습 단계에서 잊어 다시 학습으로 돌아간 횟수이며, 학습 중 누른 모든 ‘다시’의 합계와는 다릅니다.</p>\n      <button type=\"button\" data-af-demo-build>예시 카드로 ‘모으기’ 실행</button>\n      <p data-af-demo-result class=\"af-message\" role=\"status\" aria-live=\"polite\">조건을 고른 뒤 예시 버튼을 누르면, 모일 카드와 순서를 볼 수 있습니다.</p>\n    </details>\n    <details class=\"af-guide\"><summary>Anki에서 필터 덱 만들기 · 다음에 다시 모으기</summary>\n      <ol><li>위 검색식을 복사합니다. 자동 복사가 안 되면 ‘전체 선택 · 직접 복사’를 사용합니다.</li><li>PC Anki에서 <strong>도구 → 필터 덱 만들기</strong>를 엽니다.</li><li>‘이름’을 정하고, <strong>‘찾기’를 클릭 → Ctrl+A → Ctrl+V</strong>로 기존 검색식 전체를 교체합니다. 이름은 복습 공간의 이름이고, 어떤 카드를 모을지는 ‘찾기’가 정합니다.</li><li>개수 제한과 선택 기준을 위 안내대로 맞추고 ‘모으기(Build)’를 누릅니다. 검색식만 붙여넣은 단계에서는 아직 카드가 모이지 않습니다.</li><li>Anki 덱 목록에서 정한 이름을 열어 복습합니다. 다음에는 같은 덱의 ‘다시 만들기(Rebuild)’로 새 기록을 반영합니다.</li></ol>\n      <p>iPhone·iPad는 학습 화면의 Anki 도구 메뉴 → Filter/Cram에서 같은 검색식을 사용합니다. 앱·언어에 따라 버튼 이름이 다를 수 있습니다.</p>\n      <p>‘오답’은 Anki에서 직접 누른 ‘다시’ 평가 기록입니다. 카드 안에서 틀린 보기를 선택한 것만으로 이 기록이 생기지는 않습니다. ‘헷갈림’은 직접 붙인 주황 깃발입니다.</p>\n      <p>‘오답 + 플래그’는 <strong>둘 중 하나만 해당해도</strong> 모읍니다. 두 조건을 모두 충족해야 한다는 뜻이 아닙니다. 주황 깃발에는 기간 제한이 없습니다.</p>\n      <p>일시중지·묻힌 카드·다른 필터 덱에 들어간 카드는 모을 수 없습니다. 실제 수집 수는 Anki에서 확인하세요. 필터 덱의 학습 단계를 마친 카드는 원래 덱으로 돌아갑니다. 남은 카드는 ‘비우기(Empty)’로 돌려보낼 수 있습니다.</p>\n      <p>이미 저장한 Anki 필터 덱의 조건은 자동 변경되지 않습니다. 조건이나 노트 유형 이름을 바꿨다면 Anki의 찾기도 새 검색식으로 교체하세요.</p>\n      <p>선택 조건은 이 기기에 저장됩니다. 붙여넣기 확인 칸의 내용은 저장하지 않습니다.</p>\n    </details>\n  </div>\n</details>\n";
(function () {
  'use strict';
  var VERSION = '1.0.0';
  var PREF_KEY = 'anki-filter-helper:' + String((window.AnkiFilterHelperConfig || {}).product_id || 'unconfigured') + ':v1';
  var PROVIDED = window.AnkiFilterHelperConfig;

    Array.from(document.querySelectorAll('[data-af-helper]')).forEach(function(box){box.textContent = window.AnkiFilterHelperError;});
    return;
  }
  var MODELS = PROVIDED.models;
  var AREAS = PROVIDED.areas;
  var LEVELS = PROVIDED.levels;
  var LEVEL_FIELD = PROVIDED.level_field || 'Level';
  var ALL_LABEL = PROVIDED.all_levels_label || '전체';
  var REASONS = [
    {id:'again_or_flag',label:'오답 + 플래그',short:'오답·플래그'},
    {id:'again',label:'오답 : 다시 평가',short:'최근오답'},
    {id:'flag',label:'헷갈림 : 플래그',short:'플래그'},
    {id:'hard',label:'어려움 평가',short:'어려움'},
    {id:'lapses',label:'반복 실패 : 누적 3회 이상',short:'반복실패'}
  ];
  var DEFAULTS = Object.assign({level:'all',area:AREAS[0].id,reason:'again_or_flag',days:7,limit:20,order:'random'},PROVIDED.defaults || {});

  function member(value, choices, fallback) {
    return choices.indexOf(value) >= 0 ? value : fallback;
  }
  function normalize(value) {
    value = value && typeof value === 'object' ? value : {};
    return {
      level: member(value.level,['all'].concat(LEVELS.map(function(x){return x.id;})),DEFAULTS.level),
      area: member(value.area,AREAS.map(function(a){return a.id;}),DEFAULTS.area),
      reason: member(value.reason,REASONS.map(function(a){return a.id;}),DEFAULTS.reason),
      days: member(Number(value.days),[1,7,14,30],DEFAULTS.days),
      limit: member(Number(value.limit),[20,50,100,200],DEFAULTS.limit),
      order: member(value.order,['random','lapses'],DEFAULTS.order)
    };
  }
  function term(field, value) {
    return '"' + field + ':' + String(value).replace(/\\/g,'\\\\').replace(/"/g,'\\"') + '"';
  }
  function spec(config) {
    var c = normalize(config);
    var area = AREAS.filter(function(a){return a.id === c.area;})[0];
    var reason = REASONS.filter(function(a){return a.id === c.reason;})[0];
    var parts = [];
    if (area.model === 'all') {
      parts.push('(' + Object.keys(MODELS).map(function(k){return term('note',MODELS[k]);}).join(' or ') + ')');
    } else parts.push(term('note',MODELS[area.model]));
    if (area.card) parts.push('card:' + area.card);
    if (area.legacy && c.level === 'all') {
      var shared=parts[0]+' '+term(area.field,area.value);
      var older=term('note',MODELS[area.legacy.model])+(area.legacy.field?' '+term(area.legacy.field,area.legacy.value):'');

    var recent = 'rated:' + c.days + ':';
    var explanation;
    if (c.reason === 'again_or_flag') {
      parts.push('(' + recent + '1 or flag:2)');
      explanation = '최근 ' + c.days + '일의 ‘다시’ 평가 또는 현재 주황 깃발, 둘 중 하나만 해당해도 모읍니다. 깃발에는 기간 제한이 없습니다.';
    } else if (c.reason === 'again') {

        } catch (_) {}
      });
      var existing={};
      Object.keys(data.items).forEach(function(key){var item=data.items[key];if(item && item.noteId) existing[item.noteId]=true;});
      Object.keys(imported).forEach(function(note) {

  var causeLabels = {reading:'읽기',meaning:'뜻',shape:'한자 모양',form:'활용 규칙',context:'문맥'};

  function paintQuiz(selected) {

    });

  function saveRecords() {
    try { localStorage.setItem(RECORD_KEY, JSON.stringify(records)); } catch (_) { storageOK = false; }

  function pad(value) { return String(value).length < 2 ? '0' + value : String(value); }
  function dateKey(date) { return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()); }
  function shifted(date, days) { return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days, 12, 0, 0, 0); }
  function localDate(key) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key || '')) return null;
    var parts = key.split('-');
    var value = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12, 0, 0, 0);
    return isNaN(value.getTime()) ? null : value;
  }

  function dayData(key) {
    var value = records.days[key] || {};
    return {
      study:Math.max(0, Number(value.study) || 0),
      quiz:Math.max(0, Number(value.quiz) || 0),
      attempts:Math.max(0, Number(value.attempts) || 0),
      correct:Math.max(0, Number(value.correct) || 0)
    };
  }

  function currentCount(data) { return deck === 'quiz' ? data.quiz : data.study; }

  function weekStart(date) {
    var delta = (date.getDay() + 6) % 7;
    return shifted(date, -delta);
  }

  function sumDeck(start, count) {
    var sum = 0;
    for (var i = 0; i < count; i++) sum += currentCount(dayData(dateKey(shifted(start, i))));
    return sum;
  }

  function currentStreak(today) {
    var cursor = today;
    if (!currentCount(dayData(dateKey(cursor)))) cursor = shifted(cursor, -1);
    var streak = 0;
    while (streak < 3660 && currentCount(dayData(dateKey(cursor))) > 0) {
      streak += 1;
      cursor = shifted(cursor, -1);
    }
    return streak;
  }

  function practiceTotals() {
    var attempts = 0, correct = 0;
    Object.keys(records.days).forEach(function (key) {
      var day = dayData(key);
      attempts += day.attempts;
      correct += day.correct;
    });
    return { attempts:attempts, correct:correct, rate:attempts ? Math.round(correct * 100 / attempts) : 0 };
  }

  function dday(today) {
    var target = localDate(records.examDate);
    if (!target) return { value:'미설정', note:'시험일을 입력하세요' };
    var diff = Math.round((target.getTime() - new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12).getTime()) / 86400000);
    if (diff === 0) return { value:'D-DAY', note:records.examDate };
    return { value:diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff), note:records.examDate };
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char];
    });
  }

  function metric(label, value, note, detail, progress) {
    return '<section class="kr-record-metric"><span>' + label + '</span><strong>' + value + '</strong>' +
      (typeof progress === 'number' ? '<div class="kr-record-progress"><span style="width:' + progress + '%"></span></div>' : '') +
      '<em>' + note + '</em><span>' + detail + '</span></section>';
  }

  function chart(today) {
    var labels = ['일','월','화','수','목','금','토'];
    var values = [], max = 1;
    for (var i = 6; i >= 0; i--) {
      var date = shifted(today, -i);
      var count = currentCount(dayData(dateKey(date)));
      values.push({ date:date, count:count, today:i === 0 });
      if (count > max) max = count;
    }
    return values.map(function (item) {
      var height = item.count ? Math.max(8, Math.round(item.count * 100 / max)) : 3;
      return '<div class="kr-record-day' + (item.today ? ' today' : '') + '"><div class="kr-record-count">' + item.count + '</div><div class="kr-record-barbox"><div class="kr-record-bar" style="height:' + height + '%"></div></div><div class="kr-record-daylabel">' + labels[item.date.getDay()] + '</div></div>';
    }).join('');
  }

  function renderRecords() {

    var exam = dday(today);

    })).size);
    var progress = Math.round(seen * 100 / total);

      '<section class="kr-record-card"><div class="kr-record-label">시험일까지</div><div class="kr-record-value">' + exam.value + '</div><div class="kr-record-note">' + exam.note + '</div></section>',
      '</div>',
      '<div class="kr-record-controls"><div class="kr-record-control"><label for="kr-record-goal">하루 목표</label><input id="kr-record-goal" data-record-goal type="number" min="1" max="500" inputmode="numeric" value="' + goal + '"></div><div class="kr-record-control"><label for="kr-record-exam">시험일</label><input id="kr-record-exam" data-record-exam type="date" value="' + escapeHtml(records.examDate) + '"></div></div>',

      metric('이번 주', thisWeek + '회', '월요일부터', deltaText),
      metric('지난 주', lastWeek + '회', '이전 7일', '주간 비교'),
      metric('문제 정답률', practice.attempts ? practice.rate + '%' : '—', practice.correct + ' / ' + practice.attempts + '문제', practice.attempts ? '선택 기록 기준' : '퀴즈 선택 기록 없음'),
      '</div>',
      '<section class="kr-record-chart"><div class="kr-record-section-head"><h3>최근 7일 학습 활동</h3><span>최대 ' + Math.max(1, todayCount) + '회</span></div><div class="kr-record-bars">' + chart(today) + '</div></section>',

      '<div class="kr-storage-state">' + (storageOK ? '저장 범위: 이 기기' : '저장이 제한되어 현재 화면에서만 임시 적용됩니다.') + '</div>',

    ].join('');

    bindWeak();
    var goalInput = q('[data-record-goal]', content);
    var examInput = q('[data-record-exam]', content);
    var resetButton = q('[data-record-reset]', content);
    goalInput.onchange = function () { records.goal = Math.max(1, Math.min(500, Number(goalInput.value) || 20)); saveRecords(); renderRecords(); };
    examInput.onchange = function () { records.examDate = /^\d{4}-\d{2}-\d{2}$/.test(examInput.value || '') ? examInput.value : ''; saveRecords(); renderRecords(); };
    resetButton.onclick = function () {
      if (window.confirm('현재 기기에 저장된 한자혁명 학습 기록을 모두 초기화할까요?')) {

  function closeRecords() {
    if (!modal) return;
    modal.setAttribute('aria-hidden', 'true');
    if (document.body) document.body.classList.remove('kr-record-body-lock');
    if (previousFocus && previousFocus.focus) try { previousFocus.focus(); } catch (_) {}
  }

  function setupRecords() {
    var stale = document.querySelector('[data-kr-record-modal="1"]');
    if (stale && stale.parentNode) stale.parentNode.removeChild(stale);
    modal = document.createElement('div');
    modal.className = 'kr-record-modal';
    modal.setAttribute('data-kr-record-modal', '1');
    modal.setAttribute('aria-hidden', 'true');
    modal.innerHTML = '<section class="kr-record-sheet" role="region" aria-labelledby="kr-record-title"><header class="kr-record-head"><div><span class="kr-record-eyebrow">이 기기</span><h2 id="kr-record-title">내 기록</h2><p>한자혁명 ' + (deck === 'quiz' ? '퀴즈' : '학습') + ' 덱의 기기 로컬 학습 현황</p></div><button type="button" class="kr-record-close" aria-label="내 기록 닫기">×</button></header><div class="kr-record-content"></div></section>';
    root.insertBefore(modal, settingsPanel.nextSibling);
    addEvent(recordButton, 'click', function (event) { event.stopPropagation(); openRecords(); });
    addEvent(q('.kr-record-close', modal), 'click', function(event){event.stopPropagation();closeRecords();});
    addEvent(modal, 'click', function(event){event.stopPropagation();});
    addEvent(modal, 'click', function (event) { if (event.target === modal) closeRecords(); });
  }

  applyPrefs();
  renderSettings();
  setupRecords();

  addEvent(settingsButton, 'click', function (event) {
    event.stopPropagation();
    panelOpen = !panelOpen;
    persistPanelState();
    renderSettings();
  });

  addEvent(document, 'click', function (event) {
    if (!panelOpen || !settingsPanel || !settingsButton || prefs.panel==='keep') return;
    if (settingsPanel.contains(event.target) || settingsButton.contains(event.target)) return;
    closeSettings();
  });

  addEvent(document, 'keydown', function (event) {
    if (event.key !== 'Escape') return;
    if (modal && modal.getAttribute('aria-hidden') === 'false') closeRecords();
    else if (panelOpen) closeSettings();
  });

  if (window.matchMedia) {
    try {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      var onThemeChange = function () { if (prefs.theme === 'auto') applyPrefs(); };
      if (media.addEventListener) addEvent(media, 'change', onThemeChange);
      else if (media.addListener) { media.addListener(onThemeChange); cleanup.push(function () { try { media.removeListener(onThemeChange); } catch (_) {} }); }
    } catch (_) {}
  }

  addEvent(settingsPanel,'click',function(event){event.stopPropagation();});
  addEvent(root,'kr-theme-preview',applyPrefs);
  setupLearning();
};

(function () {
  const get = id => document.getElementById(id);
  const data = JSON.parse(get("card-bank").textContent);
  const info = data.info;
  let pool = [], position = 0, face = 0;
  const number = new Intl.NumberFormat("ko-KR"), fmt = value => number.format(value);
  get("reference-name").textContent = info.name + " · " + info.release + " · 카드 UI " + info.ui;
  get("scope").textContent = info.sample
    ? "이 화면은 " + fmt(data.cards.length) + "장 표본입니다. 표의 수량은 실제 배포본 기준입니다."
    : "전체 미리보기 " + fmt(data.cards.length) + "장";
  if (info.reference_link && info.reference_link.startsWith("https://github.com/dlquffhqnxj/anki-deck-project/releases/tag/")) {
    const link = get("reference-link");
    link.href = info.reference_link;
    link.textContent = info.name + " " + info.release + " 릴리스 · 권한 필요";
    link.hidden = false;
  }
  function appendCount(target, label, add, all) {
    const tr = document.createElement("tr");
    [label, "+" + fmt(add), fmt(all)].forEach((value, idx) => {
      const cell = document.createElement(idx === 0 ? "th" : "td");
      if (!idx) cell.scope = "row";
      cell.textContent = value;
      tr.append(cell);
    });
    get(target).append(tr);
  }
  for (const row of info.report.rows) appendCount("counts", row.label, row.added, row.cumulative);
  appendCount("totals", "합계", info.report.total.added, info.report.total.cumulative);
  for (const [key, name] of Object.entries(data.parts)) get("part").append(new Option(name, key));
  const levels = [...new Set(data.cards.map(c => c[3]).filter(Boolean))].sort();
  for (const item of levels) get("level").append(new Option(item, item));
  get("level-label").hidden = !levels.length;
  get("group-label").hidden = !info.subgroups.length;
  get("group-text").textContent = info.subgroup_label;
  for (const item of info.subgroups) get("group").append(new Option(item, item));

  function renderTemplate(tmpl, values) {
    const token = /\{\{([#^/]?)([A-Za-z0-9_]+)\}\}/g, stack = [true];
    let offset = 0, result = "", match;
    while ((match = token.exec(tmpl))) {
      const value = values[match[2]] || "";
      if (stack.at(-1)) result += tmpl.slice(offset, match.index);
      if (match[1] === "#") stack.push(stack.at(-1) && !!value);
      else if (match[1] === "^") stack.push(stack.at(-1) && !value);
      else if (match[1] === "/") stack.pop();
      else if (stack.at(-1)) result += value;
      offset = token.lastIndex;
    }
    return result + tmpl.slice(offset);
  }
  function draw() {
    const card = pool[position], host = get("study");
    get("previous").disabled = !card || position === 0;
    get("next").disabled = !card || position >= pool.length - 1;
    get("show-answer").disabled = !card;
    get("show-answer").textContent = face ? "앞면 보기" : "답 보기";
    get("show-answer").setAttribute("aria-pressed", String(!!face));
    get("position").textContent = card ? fmt(position + 1) + " / " + fmt(pool.length) : "0문항";
    get("index").max = pool.length;
    get("index").value = card ? position + 1 : "";
    if (!card) {
      if (typeof window[info.cleanup] === "function") window[info.cleanup]();
      host.innerHTML = '<p class="preview-empty">조건에 맞는 문항이 없습니다.</p>';
      return;
    }
    const values = Object.fromEntries(data.fields[card[7]].map((field, idx) => [field, card[8][idx]]));
    host.innerHTML = renderTemplate(data.templates[card[7]][face], values);
    window[info.init](host.querySelector(info.root));
  }
  function categories() {
    const part = get("part").value, old = get("subtype").value;
    const types = Array.from(new Set(data.cards.filter(c => !part || c[1] === part).map(c => c[2]).filter(Boolean)));
    get("subtype").replaceChildren(new Option("전체", ""), ...types.map(v => new Option(v,v)));
    if (types.includes(old)) get("subtype").value = old;
  }
  function filter() {
    const stage = get("stage").value, part = get("part").value, type = get("subtype").value;
    const level = get("level").value, group = get("group").value;
    const query = get("query").value.trim().normalize("NFKC").toLowerCase();
    pool = data.cards.filter(c => (
      (stage === "all" || (stage === "more" ? c[4] : !c[4]))
      && (!part || c[1] === part) && (!type || c[2] === type) && (!level || c[3] === level)
      && (!group || c[6] === group)
      && (!query || [c[0],c[5],c[2]].join(" ").normalize("NFKC").toLowerCase().includes(query))
    ));
    position = 0;
    face = 0;
    draw();
  }
  const move = i => {position = Math.max(0, Math.min(pool.length - 1, i)); face = 0; draw();};
  get("part").addEventListener("change", () => {categories(); filter();});
  for (const id of ["stage","subtype","level","group"]) get(id).addEventListener("change", filter);
  get("query").addEventListener("input", filter);
  get("index").addEventListener("change", e => {if (e.target.valueAsNumber) move(e.target.valueAsNumber - 1);});
  get("previous").addEventListener("click", () => move(position - 1));
  get("next").addEventListener("click", () => move(position + 1));
  get("show-answer").addEventListener("click", () => {face = 1 - face; draw();});
  get("preview-theme").addEventListener("click", e => {
    const dark = document.body.classList.toggle("nightMode");
    e.target.textContent = dark ? "어두운 화면 미리보기 해제" : "어두운 화면 미리보기";
    e.target.setAttribute("aria-pressed", String(dark));
    const root = get("study").querySelector(info.root);
    if (root) root.dispatchEvent(new Event("kr-theme-preview"));
  });
  categories();
  filter();
})();
</script>
