function renderRail(){const label=n=>strip(n.PairA||d(n,'ProposedText')||n.Answer||'');$('#rail').innerHTML=list.map((n,i)=>`<button data-i="${i}" class="${i===idx?'active':''}">${esc(n.NoteID)}<br>${esc(label(n).slice(0,42))}</button>`).join('');document.querySelectorAll('#rail button').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;back=false;renderRail();render()})}
function jBadges(n,context){return `<span class="badge">${esc(n.JLPT)}</span><span class="badge green">${context?'문맥 적용':'혼동 비교'}</span><span class="badge purple">AI 검토</span>`}
function bBadges(n){return `<span class="badge purple">${d(n,'CardType')}</span><span class="badge neutral">${d(n,'BusinessContext')}</span><span class="badge">AI 검토</span>`}
function frame(mode,n,badges,body){return `<div class="modebar">${mode}</div><div class="content"><div class="top"><div class="badges">${badges}</div><div class="id">${esc(n.NoteID)}</div></div><div class="divider"></div>${body}<div class="audit">GUID: ${esc(n.GUID)}<br>Concept: ${esc(n.ConceptID)}<br>Linked: ${esc(n.LinkedConceptID)}<br>Deck: ${esc(n.DeckPath)}<br>Origin: ${esc(n.ContentOrigin)} · ${esc(n.VerificationStatus)}<br>Version: ${esc(n.Version)}</div></div>`}
