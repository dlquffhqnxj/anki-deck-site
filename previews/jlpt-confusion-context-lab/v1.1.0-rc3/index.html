function backJ(n){const context=!!n.FullSentence;const body=context?`${selectionFeedback(n)}<div class="answer-hero"><div class="eyebrow">정답</div><div class="answer-main" lang="ja">${d(n,'Answer')}</div><div class="answer-reason">${d(n,'CoreExplanation')}</div><div class="completed"><div class="jp" lang="ja">${d(n,'FullSentence')}</div><div class="ko">${d(n,'TranslationKO')}</div></div></div><div class="section-card"><div class="section-title">선택지별 이유</div>${d(n,'ChoiceAnalysis')}</div><div class="trap"><strong>혼동 방지</strong><br>${d(n,'CommonTrap')}</div>`:`<div class="answer-hero"><div class="eyebrow">핵심 선택 규칙</div><div class="answer-main" lang="ja">${d(n,'PairA')} <span class="swap">⇄</span> ${d(n,'PairB')}</div><div class="answer-reason">${d(n,'Answer')}</div></div><div class="section-card"><div class="section-title">혼동 비교</div>${d(n,'CoreExplanation')}</div><div class="section-card"><div class="section-title">대조 예문</div><div class="example-grid"><div class="example-item"><div class="example-label">${d(n,'PairA')}</div><div class="jp" lang="ja">${d(n,'ExampleAJP')}</div><div class="ko">${d(n,'ExampleAKO')}</div></div><div class="example-item"><div class="example-label">${d(n,'PairB')}</div><div class="jp" lang="ja">${d(n,'ExampleBJP')}</div><div class="ko">${d(n,'ExampleBKO')}</div></div></div></div><div class="trap"><strong>혼동 방지</strong><br>${d(n,'CommonTrap')}</div>`;return frame('BACK · 정답과 근거',n,jBadges(n,context),body+`<div class="source-strip">기존 학습 연결 · ${esc(n.LinkedConceptID)} · ${d(n,'LevelBasis')}</div>`)}
function frontB(n){const original=d(n,'OriginalText');const body=`<div class="instruction">뜻뿐 아니라 어느 업무 문맥에서 선택하는지 말해 보세요.</div><div class="focus-box"><div class="focus-expression" lang="ja">${d(n,'ProposedText')}</div></div>${original?`<div class="trap"><strong>검토 대상</strong><br><span class="jp" lang="ja">${original}</span></div>`:''}<div class="question">${d(n,'Prompt')}</div><div class="context-grid"><div class="context-item"><div class="context-label">업무 장면</div><div class="context-value">${d(n,'BusinessContext')}</div></div><div class="context-item"><div class="context-label">사용 범위</div><div class="context-value">${d(n,'Register')}</div></div></div><div class="tip">정답을 보기 전에 권장 표현과 선택 이유를 한 문장으로 설명해 보세요.</div>`;return frame('FRONT · 능동 회상',n,bBadges(n),body)}
function backB(n){const reading=n.Reading?`<div class="reading">읽기 · ${d(n,'Reading')}</div>`:'';const example=n.ExampleJP?`<div class="section-card"><div class="section-title">업무 예문</div><div class="example-grid"><div class="example-item"><div class="example-label">日本語</div><div class="jp" lang="ja">${d(n,'ExampleJP')}</div></div><div class="example-item"><div class="example-label">한국어</div><div class="ko">${d(n,'ExampleKO')}</div></div></div></div>`:'';const body=`<div class="answer-hero"><div class="eyebrow">핵심 답</div><div class="answer-main">${d(n,'Answer')}</div><div class="answer-reason">${d(n,'CoreExplanation')}</div></div><div class="section-card"><div class="section-title">권장 표현</div><div class="recommended"><div class="jp" lang="ja">${d(n,'ProposedText')}</div>${reading}</div></div>${example}<div class="section-card"><div class="section-title">선택 기준과 혼동 방지</div><div class="criterion-row"><div class="criterion-label">기억 고리</div>${d(n,'MemoryHook')}</div><div class="criterion-row"><div class="criterion-label">주의</div>${d(n,'CommonTrap')}</div></div><div class="source-strip">원본 연결 · ${esc(n.SourceSheet||'생성형')} · row ${esc(n.SourceRow||'-')} · ${esc(n.LinkedConceptID||'')}</div>`;return frame('BACK · 정답과 근거',n,bBadges(n),body)}
function bindChoices(){document.querySelectorAll('.choice-button').forEach(button=>{button.onclick=()=>{selectedChoice=button.dataset.choice;render()}})}
function markSelectedReason(){if(!selectedChoice)return;const chosen=document.querySelector(`.reason-item[data-choice="${selectedChoice}"]`);if(chosen)chosen.classList.add('user-selected')}
function render(){if(!list.length){$('#study').innerHTML='<div class="empty">검색 결과가 없습니다.</div>';$('#count').textContent='0 / 0';return}const n=list[idx];const side=new URLSearchParams(location.search).get('side');if(side==='back')back=true;const body=back?(PRODUCT==='jcc'?backJ(n):backB(n)):(PRODUCT==='jcc'?frontJ(n):frontB(n));$('#study').innerHTML=body;if(PRODUCT==='jcc'){if(back)markSelectedReason();else bindChoices()}$('#flip').textContent=back?'문제로 돌아가기':'정답 보기';$('#count').textContent=`${idx+1} / ${list.length}`;renderRail()}
$('#search').oninput=apply;$('#filter').onchange=apply;$('#flip').onclick=()=>{back=!back;history.replaceState(null,'',location.pathname);render()};$('#front').onclick=()=>{back=false;render()};$('#back').onclick=()=>{back=true;render()};$('#prev').onclick=()=>{if(list.length)idx=(idx-1+list.length)%list.length;back=false;selectedChoice=null;render()};$('#next').onclick=()=>{if(list.length)idx=(idx+1)%list.length;back=false;selectedChoice=null;render()};$('#dark').onclick=()=>document.body.classList.toggle('dark');$('#phone').onclick=()=>$('#workspace').classList.toggle('phone');$('#audit').onclick=()=>$('#workspace').classList.toggle('audit-on');apply();
</script></body></html>
