in(1, (clientY - size.rect.top) / size.height))\n    };\n  }\n\n  function begin(clientX, clientY) {\n    drawing = true;\n    activeStroke = [normalizedPoint(clientX, clientY)];\n    strokes.push(activeStroke);\n    render();\n  }\n\n  function move(clientX, clientY) {\n    if (!drawing || !activeStroke) return;\n    activeStroke.push(normalizedPoint(clientX, clientY));\n    render();\n  }\n\n  function end() {\n    if (!drawing) return;\n    drawing = false;\n    activeStroke = null;\n    save();\n  }\n\n  /*\n   * AnkiMobile maps taps on the review webview to Show Answer / Answer Good.\n   * iOS exposes PointerEvent and TouchEvent together, so blocking only pointer\n   * events can still leave the native touch/click path active.  Shield the\n   * whole writing zone on both paths while keeping pointer events for drawing.\n   */\n  zone.onclick = stopEvent;\n  zone.ondblclick = stopEvent;\n  canvas.onclick = stopEvent;\n  canvas.ondblclick = stopEvent;\n  [\"click\", \"dblclick\", \"contextmenu\"].forEach(function (type) {\n    zone.addEventListener(type, stopEvent, false);\n    canvas.addEventListener(type, stopEvent, false);\n  });\n  [\"touchstart\", \"touchmove\", \"touchend\", \"touchcancel\",\n   \"gesturestart\", \"gesturechange\", \"gestureend\"].forEach(function (type) {\n    zone.addEventListener(type, stopEvent, { passive: false });\n  });\n\n  if (\"PointerEvent\" in window) {\n    canvas.addEventListener(\"pointerdown\", function (event) {\n      if (event.button !== undefined && event.button !== 0) return;\n      stopEvent(event);\n      try { canvas.setPointerCapture(event.pointerId); } catch (error) {}\n      begin(event.clientX, event.clientY);\n    }, { passive: false });\n    canvas.addEventListener(\"pointermove\", function (event) {\n      if (!drawing) return;\n      stopEvent(event);\n      move(event.clientX, event.clientY);\n    }, { passive: false });\n    canvas.addEventListener(\"pointerup\", function (event) { stopEvent(event); end(); } s=\"kf-info-grid\">\n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">한국식\u003c/div>\u003cdiv class=\"kf-value\">날 일\u003c/div>\u003c/div>\n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">음독\u003c/div>\u003cdiv class=\"kf-value jp\" lang=\"ja\">ニチ、ジツ\u003c/div>\u003c/div>\n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">훈독\u003c/div>\u003cdiv class=\"kf-value jp\" lang=\"ja\">ひ、か\u003c/div>\u003c/div>\n    \n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">부수\u003c/div>\u003cdiv class=\"kf-value\">日 (날 일)\u003c/div>\u003c/div>\n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">획수\u003c/div>\u003cdiv class=\"kf-value\">4획\u003c/div>\u003c/div>\n    \n  \u003c/div>\n\u003c/section>\n\n  \u003cdetails class=\"kf-details\">\n    \u003csummary>이 한자의 전체 설명\u003c/summary>\n    \u003cdiv class=\"details-body\">\n\n    \u003cdiv>바깥 네모 안을 가로획 하나가 둘로 나눈 형태입니다. 目는 안쪽 가로획이 두 개이므로 日와 구별합니다. 글꼴의 가로·세로 비율보다 안쪽 가로획 수를 먼저 확인하세요.\u003c/div>\n    \u003cdiv class=\"kf-components\">日\u003c/div>\n    \u003c/div>\n  \u003c/details>\n\n\u003cdetails class=\"kf-details\">\u003csummary>음독 상세\u003c/summary>\u003cdiv class=\"details-body kf-reading-groups\">\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">음독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">ニチ\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">날짜·일상과 관련된 합성어에서 확인합니다. 한자만 보고 ニチ와 ジツ 중 하나를 고르는 보편 규칙은 없으므로 단어로 익힙니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">日時\u003c/b> \u003cspan lang=\"ja\">にちじ\u003c/span> · 날짜와 시각\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">毎日\u003c/b> \u003cspan lang=\"ja\">まいにち\u003c/span> · 매일\u003c/div>\u003c/div>\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">음독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">ジツ\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">連日・平日처럼 ジツ로 굳어진 합성어입니다. ‘뒤에 오면 무조건 ジツ’ 같은 규칙으로 바꾸지 마세요.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">連日\u003c/b> \u003cspan lang=\"ja\">れんじつ\u003c/span> · 연일\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">平日\u003c/b> \u003cspan lang=\"ja\">へいじつ\u003c/span> · 평일\u003c/div>\u003c/div>\u003c/div>\u003c/details>\n\u003cdetails class=\"kf-details\">\u003csummary>훈독 상세\u003c/summary>\u003cdiv class=\"details-body kf-reading-groups\">\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">훈독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">ひ\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">‘해·날’의 일본 고유어 읽기입니다. 합성어에서는 ひ가 び로 유성음화되기도 합니다. 月曜日의 마지막 日는 び입니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">日\u003c/b> \u003cspan lang=\"ja\">ひ\u003c/span> · 해; 날\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">日帰り\u003c/b> \u003cspan lang=\"ja\">ひがえり\u003c/span> · 당일치기\u003c/div>\u003c/div>\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">훈독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">か\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">날짜·날수를 나타내는 읽기입니다. 三日는 みっか이며, 숫자 부분까지 포함해 통째로 읽습니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">三日\u003c/b> \u003cspan lang=\"ja\">みっか\u003c/span> · 3일; 사흘\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">十日\u003c/b> \u003cspan lang=\"ja\">とおか\u003c/span> · 10일; 열흘\u003c/div>\u003c/div>\u003c/div>\u003c/details>\n  \u003cdetails class=\"kf-details\">\n    \u003csummary>사전·출처 링크\u003c/summary>\n    \u003cdiv class=\"details-body\">\n      \u003cdiv class=\"reference-links\">\u003ca href=\"https://nihongokanji.com/8/\">한자 목록 참고\u003c/a> \u003ca href=\"https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/kanji/joyokanjisakuin/index.html\">문화청 상용한자표\u003c/a> \u003ca href=\"https://kanjivg.tagaini.net/\">CC BY-SA 3.0 / Ulrich Apel and KanjiVG contributors\u003c/a>\u003c/div>\n      \u003cdiv class=\"data-note\">모양 풀이·연상·한국어 설명·예문은 이 자료를 위해 독립 작성했습니다. 음훈은 상용한자표 본표 기준입니다. 이름 읽기·표외 읽기·미확인 빈도는 표본에서 제외했습니다. N5는 사이트와 기존 덱의 학습용 분류입니다.\u003cdiv class=\"kf-common-trap\">\u003cstrong>혼동 주의\u003c/strong>一日는 기간 ‘하루’이면 いちにち, 날짜 ‘1일’이면 ついたち입니다. 二日・三日 같은 날짜·날수는 단어 전체로 익히세요.\u003cbr>日는 안쪽 가로획 1개, 目는 2개.\u003c/div>\u003cp>https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/kanji/joyokanjisakuin/index.html ; JMdict 표제어·읽기 94쌍 대조 ; KanjiVG SVG 경로 10자 일치 ; 2026-11-06 Codex AI 검토; 원어민 NOT_TESTED\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/details>\n\u003c/main>\n\n\n\u003cscript>\n(function () {\n  var root = document.getElementById(\"stroke-0001\");\n  if (!root || root.dataset.bound === \"1\") return;\n  root.dataset.bound = \"1\";\n  var strokes = Array.prototype.slice.call(root.querySelectorAll(\".stroke-live path\"));\n  var current = strokes.length;\n  var timer = null;\n  var now = root.querySelector(\".stroke-now\");\n  var total = root.querySelector(\".stroke-total\");\n  if (total) total.textContent = strokes.length;\n\n  function draw() {\n    strokes.forEach(function (stroke, index) {\n      stroke.classList.toggle(\"is-hidden\", index >= current);\n      stroke.classList.toggle(\"is-current\", current > 0 && index === current - 1);\n    });\n    if (now) now.textContent = current;\n  }\n\n  function stop() {\n    if (timer !== null) window.clearInterval(timer);\n    timer = null;\n    var play = root.querySelector('[data-action=\"play\"]');\n    if (play) play.textContent = \"재생\";\n  }\n\n  root.addEventListener(\"click\", function (event) {\n    var button = event.target.closest(\"button[data-action]\");\n    if (!button) return;\n    var action = button.dataset.action;\n    if (action !== \"play\") stop();\n    if (action === \"reset\") current = 0;\n    if (action === \"prev\") current = Math.max(0, current - 1);\n    if (action === \"next\") current = Math.min(strokes.length, current + 1);\n    if (action === \"all\") current = strokes.length;\n    if (action === \"play\") {\n      if (timer !== null) { stop(); return; }\n      current = 0;\n      draw();\n      button.textContent = \"정지\";\n      timer = window.setInterval(function () {\n        current += 1;\n        draw();\n        if (current >= strokes.length) stop();\n      }, 520);\n      return;\n    }\n    draw();\n  });\n  draw();\n})();\n\nfunction kfSpeak(text) {\n  if (!text || !(\"speechSynthesis\" in window)) return;\n  window.speechSynthesis.cancel();\n  var utterance = new SpeechSynthesisUtterance(text);\n  utterance.lang = \"ja-JP\";\n  utterance.rate = 0.88;\n  window.speechSynthesis.speak(utterance);\n}\n\u003c/script>\n"},{"card_id":1788160437941,"note_id":"JLPT-N-KANJI-U4E00","character":"一","type":"01 한자 인식","front":"\u003cmain class=\"kf-shell\" data-level=\"N5\">\n\u003cdiv class=\"kf-topbar\">\n  \u003cdiv class=\"kf-badges\">\n    \u003cspan class=\"kf-badge\">N5 · 학습용\u003c/span>\n    \u003cspan class=\"kf-mode\">한자 인식\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"kf-index\">0002 / 2136 · 초등 1학년\u003c/div>\n\u003c/div>\n\n  \u003csection class=\"kf-front\">\n    \u003cdiv class=\"kf-kanji\" lang=\"ja\">一\u003c/div>\n    \u003cdiv class=\"kf-prompt\">이 한자의 핵심 뜻을 떠올려 보세요\u003c/div>\n  \u003c/section>\n\u003c/main>\n","back":"\u003cmain class=\"kf-shell\" data-level=\"N5\">\n\u003cdiv class=\"kf-topbar\">\n  \u003cdiv class=\"kf-badges\">\n    \u003cspan class=\"kf-badge\">N5 · 학습용\u003c/span>\n    \u003cspan class=\"kf-mode\">한자 인식 · 정답\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"kf-index\">0002 / 2136 · 초등 1학년\u003c/div>\n\u003c/div>\n\n  \u003csection class=\"kf-answer-hero\">\n    \u003cdiv class=\"kf-kanji\" lang=\"ja\">一\u003c/div>\n    \u003cdiv class=\"kf-keyword\">한 일\u003c/div>\n    \u003cdiv class=\"kf-submeaning\">one\u003c/div>\n  \u003c/section>\n\n\u003csection class=\"kf-panel\">\n  \u003ch2 class=\"kf-panel-title\">기본 정보\u003c/h2>\n  \u003cdiv class=\"kf-info-grid\">\n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">한국식\u003c/div>\u003cdiv class=\"kf-value\">한 일\u003c/div>\u003c/div>\n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">음독\u003c/div>\u003cdiv class=\"kf-value jp\" lang=\"ja\">イチ、イツ\u003c/div>\u003c/div>\n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">훈독\u003c/div>\u003cdiv class=\"kf-value jp\" lang=\"ja\">ひと、ひとつ\u003c/div>\u003c/div>\n    \n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">부수\u003c/div>\u003cdiv class=\"kf-value\">一 (한 일)\u003c/div>\u003c/div>\n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">획수\u003c/div>\u003cdiv class=\"kf-value\">1획\u003c/div>\u003c/div>\n    \n  \u003c/div>\n\u003c/section>\n\n\u003cdetails class=\"kf-details\">\n  \u003csummary>모양 풀이·구성·획순\u003c/summary>\n  \u003cdiv class=\"details-body\">\n\n    \u003cdiv>가로획 하나로 이루어진 글자입니다. 二·三과는 가로획 수로 구별합니다. 획이 살짝 기울거나 굽어 보이는 것은 글꼴·필체의 차이일 수 있으므로 기준 글자와 획수를 함께 봅니다.\u003c/div>\n    \u003cdiv class=\"kf-components\">一\u003c/div>\n    \u003cdiv class=\"kf-stroke-wrap\" id=\"stroke-0002\">\n      \u003cdiv class=\"stroke-stage\">\u003csvg class=\"stroke-svg\" viewBox=\"0 0 109 109\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"한자 획순\">\u003cg class=\"stroke-guide\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M11,54.25c3.19,0.62,6.25,0.75,9.73,0.5c20.64-1.5,50.39-5.12,68.58-5.24c3.6-0.02,5.77,0.24,7.57,0.49\"/>\u003c/g>\u003cg class=\"stroke-live\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath data-stroke=\"1\" d=\"M11,54.25c3.19,0.62,6.25,0.75,9.73,0.5c20.64-1.5,50.39-5.12,68.58-5.24c3.6-0.02,5.77,0.24,7.57,0.49\"/>\u003c/g>\u003c/svg>\u003c/div>\n      \u003cdiv class=\"stroke-meta\">\n        \u003cspan>획순 \u003cstrong class=\"stroke-now\">1\u003c/strong> / \u003cspan class=\"stroke-total\">1\u003c/span>획\u003c/span>\n        \u003cspan>학습용 획순 도해\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"stroke-controls\">\n        \u003cbutton type=\"button\" data-action=\"reset\" title=\"처음\">처음\u003c/button>\n        \u003cbutton type=\"button\" data-action=\"prev\" title=\"이전 획\">이전\u003c/button>\n        \u003cbutton type=\"button\" class=\"primary\" data-action=\"play\" title=\"재생\">재생\u003c/button>\n        \u003cbutton type=\"button\" data-action=\"next\" title=\"다음 획\">다음\u003c/button>\n        \u003cbutton type=\"button\" data-action=\"all\" title=\"전체\">전체\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"kf-details\">\n  \u003csummary>음독 상세\u003c/summary>\n  \u003cdiv class=\"details-body kf-reading-groups\">\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">음독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">イチ\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">一度・第一의 읽기입니다. 한자가 단어 앞인지 뒤인지 만으로 イチ/イツ를 확정할 수는 없습니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一度\u003c/b> \u003cspan lang=\"ja\">いちど\u003c/span> · 한 번\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">第一\u003c/b> \u003cspan lang=\"ja\">だいいち\u003c/span> · 제일; 첫째\u003c/div>\u003c/div>\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">음독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">イツ\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">‘같음·하나로 합침’과 관련된 다음 단어에서 확인합니다. 이 의미가 イツ를 결정하는 일반 법칙이라는 뜻은 아닙니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">同一\u003c/b> \u003cspan lang=\"ja\">どういつ\u003c/span> · 동일함\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">統一\u003c/b> \u003cspan lang=\"ja\">とういつ\u003c/span> · 통일\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"kf-details\">\n  \u003csummary>훈독 상세\u003c/summary>\n  \u003cdiv class=\"details-body kf-reading-groups\">\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">훈독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">ひと\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">합성어 앞에서 수량 ‘하나’를 나타냅니다. 뒤의 말과 합친 완성된 읽기를 익힙니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一息\u003c/b> \u003cspan lang=\"ja\">ひといき\u003c/span> · 한숨; 잠깐의 휴식\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一筋\u003c/b> \u003cspan lang=\"ja\">ひとすじ\u003c/span> · 한 줄기; 한길\u003c/div>\u003c/div>\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">훈독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">ひとつ\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">물건 등을 세는 고유어 수사입니다. 한자가 ひと, 뒤의 つ가 오쿠리가나인 一つ로 씁니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一つ\u003c/b> \u003cspan lang=\"ja\">ひとつ\u003c/span> · 하나; 한 개\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"kf-details\">\n  \u003csummary>대표 어휘 더 보기\u003c/summary>\n  \u003cdiv class=\"details-body kf-reading-groups\">\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一度\u003c/b> \u003cspan lang=\"ja\">いちど\u003c/span> · 한 번\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">第一\u003c/b> \u003cspan lang=\"ja\">だいいち\u003c/span> · 제일; 첫째\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">同一\u003c/b> \u003cspan lang=\"ja\">どういつ\u003c/span> · 동일함\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">統一\u003c/b> \u003cspan lang=\"ja\">とういつ\u003c/span> · 통일\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一息\u003c/b> \u003cspan lang=\"ja\">ひといき\u003c/span> · 한숨; 잠깐의 휴식\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一筋\u003c/b> \u003cspan lang=\"ja\">ひとすじ\u003c/span> · 한 줄기; 한길\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一つ\u003c/b> \u003cspan lang=\"ja\">ひとつ\u003c/span> · 하나; 한 개\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\n\n\n\n\u003cdetails class=\"kf-details\">\n  \u003csummary>사전·출처 링크\u003c/summary>\n  \u003cdiv class=\"details-body\">\n    \u003cdiv class=\"reference-links\">\u003ca href=\"https://nihongokanji.com/9/\">한자 목록 참고\u003c/a> \u003ca href=\"https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/kanji/joyokanjisakuin/index.html\">문화청 상용한자표\u003c/a> \u003ca href=\"https://kanjivg.tagaini.net/\">CC BY-SA 3.0 / Ulrich Apel and KanjiVG contributors\u003c/a>\u003c/div>\n    \u003cdiv class=\"data-note\">모양 풀이·연상·한국어 설명·예문은 이 자료를 위해 독립 작성했습니다. 음훈은 상용한자표 본표 기준입니다. 이름 읽기·표외 읽기·미확인 빈도는 표본에서 제외했습니다. N5는 사이트와 기존 덱의 학습용 분류입니다.\u003cdiv class=\"kf-common-trap\">\u003cstrong>혼동 주의\u003c/strong>一同는 いちどう로 읽으므로 イツ의 예시로 분류하지 않습니다. 一人의 ひとり와 一日の ついたちは 두 글자를 합친 특별한 읽기입니다.\u003cbr>가로획 하나를 쓰고 멈추면 一.\u003c/div>\u003cp>https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/kanji/joyokanjisakuin/index.html ; JMdict 표제어·읽기 94쌍 대조 ; KanjiVG SVG 경로 10자 일치 ; 2026-11-06 Codex AI 검토; 원어민 NOT_TESTED\u003c/p>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\u003c/main>\n\u003cscript>\n(function () {\n  var root = document.getElementById(\"stroke-0002\");\n  if (!root || root.dataset.bound === \"1\") return;\n  root.dataset.bound = \"1\";\n  var strokes = Array.prototype.slice.call(root.querySelectorAll(\".stroke-live path\"));\n  var current = strokes.length;\n  var timer = null;\n  var now = root.querySelector(\".stroke-now\");\n  var total = root.querySelector(\".stroke-total\");\n  if (total) total.textContent = strokes.length;\n\n  function draw() {\n    strokes.forEach(function (stroke, index) {\n      stroke.classList.toggle(\"is-hidden\", index >= current);\n      stroke.classList.toggle(\"is-current\", current > 0 && index === current - 1);\n    });\n    if (now) now.textContent = current;\n  }\n\n  function stop() {\n    if (timer !== null) window.clearInterval(timer);\n    timer = null;\n    var play = root.querySelector('[data-action=\"play\"]');\n    if (play) play.textContent = \"재생\";\n  }\n\n  root.addEventListener(\"click\", function (event) {\n    var button = event.target.closest(\"button[data-action]\");\n    if (!button) return;\n    var action = button.dataset.action;\n    if (action !== \"play\") stop();\n    if (action === \"reset\") current = 0;\n    if (action === \"prev\") current = Math.max(0, current - 1);\n    if (action === \"next\") current = Math.min(strokes.length, current + 1);\n    if (action === \"all\") current = strokes.length;\n    if (action === \"play\") {\n      if (timer !== null) { stop(); return; }\n      current = 0;\n      draw();\n      button.textContent = \"정지\";\n      timer = window.setInterval(function () {\n        current += 1;\n        draw();\n        if (current >= strokes.length) stop();\n      }, 520);\n      return;\n    }\n    draw();\n  });\n  draw();\n})();\n\nfunction kfSpeak(text) {\n  if (!text || !(\"speechSynthesis\" in window)) return;\n  window.speechSynthesis.cancel();\n  var utterance = new SpeechSynthesisUtterance(text);\n  utterance.lang = \"ja-JP\";\n  utterance.rate = 0.88;\n  window.speechSynthesis.speak(utterance);\n}\n\u003c/script>\n"},{"card_id":1788160437942,"note_id":"JLPT-N-KANJI-U4E00","character":"一","type":"02 한자 쓰기","front":"\u003cmain class=\"kf-shell\" data-level=\"N5\">\n\u003cdiv class=\"kf-topbar\">\n  \u003cdiv class=\"kf-badges\">\n    \u003cspan class=\"kf-badge\">N5 · 학습용\u003c/span>\n    \u003cspan class=\"kf-mode\">한자 쓰기\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"kf-index\">0002 / 2136 · 초등 1학년\u003c/div>\n\u003c/div>\n\n  \u003csection class=\"kf-front\">\n    \u003cdiv class=\"kf-keyword\">한 일\u003c/div>\n    \u003cdiv class=\"kf-submeaning\">one\u003c/div>\n    \u003cdiv id=\"write-zone-0002\" class=\"kf-writing-grid\" role=\"application\" aria-label=\"한자 쓰기 터치 연습 칸\">\n      \u003ccanvas id=\"write-canvas-0002\" class=\"kf-writing-canvas\" aria-label=\"손가락이나 Apple Pencil로 한자를 쓰는 영역\">\u003c/canvas>\n    \u003c/div>\n    \u003cdiv id=\"write-controls-0002\" class=\"kf-writing-controls\">\n      \u003cbutton type=\"button\" data-write-action=\"undo\">한 획 취소\u003c/button>\n      \u003cbutton type=\"button\" data-write-action=\"clear\">전체 지우기\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"kf-writing-help\">네모 안에 손가락 또는 Apple Pencil로 써 보세요\u003c/div>\n    \u003cdiv class=\"kf-prompt\">작성한 뒤 정답 보기를 눌러 비교하세요\u003c/div>\n  \u003c/section>\n\u003c/main>\n\n\u003cscript>\n(function () {\n  var canvas = document.getElementById(\"write-canvas-0002\");\n  var zone = document.getElementById(\"write-zone-0002\");\n  var controls = document.getElementById(\"write-controls-0002\");\n  if (!canvas || !zone || canvas.dataset.bound === \"1\") return;\n  canvas.dataset.bound = \"1\";\n\n  var storageKey = \"kf-writing-v1-0002\";\n  var strokes = [];\n  var activeStroke = null;\n  var drawing = false;\n\n  try { window.sessionStorage.removeItem(storageKey); } catch (error) {}\n\n  function stopEvent(event) {\n    event = event || window.event;\n    if (!event) return false;\n    if (event.cancelable) event.preventDefault();\n    event.cancelBubble = true;\n    event.returnValue = false;\n    if (event.stopPropagation) event.stopPropagation();\n    return false;\n  }\n\n  function stopPropagationOnly(event) {\n    event = event || window.event;\n    if (!event) return;\n    event.cancelBubble = true;\n    if (event.stopPropagation) event.stopPropagation();\n  }\n\n  function save() {\n    try { window.sessionStorage.setItem(storageKey, JSON.stringify(strokes)); } catch (error) {}\n  }\n\n  function dimensions(target) {\n    var rect = target.getBoundingClientRect();\n    return { rect: rect, width: Math.max(1, rect.width), height: Math.max(1, rect.height) };\n  }\n\n  function inkColor(target) {\n    var shell = target.closest(\".kf-shell\") || document.documentElement;\n    var styles = window.getComputedStyle(shell);\n    return styles.getPropertyValue(\"--level\").trim() || styles.getPropertyValue(\"--ink\").trim() || \"#20251f\";\n  }\n\n  function paint(target, sourceStrokes) {\n    var size = dimensions(target);\n    var ratio = Math.max(1, Math.min(3, window.devicePixelRatio || 1));\n    var pixelWidth = Math.round(size.width * ratio);\n    var pixelHeight = Math.round(size.height * ratio);\n    if (target.width !== pixelWidth || target.height !== pixelHeight) {\n      target.width = pixelWidth;\n      target.height = pixelHeight;\n    }\n    var context = target.getContext(\"2d\");\n    context.setTransform(ratio, 0, 0, ratio, 0, 0);\n    context.clearRect(0, 0, size.width, size.height);\n    context.strokeStyle = inkColor(target);\n    context.fillStyle = context.strokeStyle;\n    context.lineWidth = Math.max(4, Math.min(8, size.width * 0.018));\n    context.lineCap = \"round\";\n    context.lineJoin = \"round\";\n\n    sourceStrokes.forEach(function (stroke) {\n      if (!stroke || !stroke.length) return;\n      if (stroke.length === 1) {\n        context.beginPath();\n        context.arc(stroke[0].x * size.width, stroke[0].y * size.height, context.lineWidth / 2, 0, Math.PI * 2);\n        context.fill();\n        return;\n      }\n      context.beginPath();\n      context.moveTo(stroke[0].x * size.width, stroke[0].y * size.height);\n      for (var index = 1; index \u003c stroke.length; index += 1) {\n        context.lineTo(stroke[index].x * size.width, stroke[index].y * size.height);\n      }\n      context.stroke();\n    });\n  }\n\n  function render() { paint(canvas, strokes); }\n\n  function normalizedPoint(clientX, clientY) {\n    var size = dimensions(canvas);\n    return {\n      x: Math.max(0, Math.min(1, (clientX - size.rect.left) / size.width)),\n      y: Math.max(0, Math.min(1, (clientY - size.rect.top) / size.height))\n    };\n  }\n\n  function begin(clientX, clientY) {\n    drawing = true;\n    activeStroke = [normalizedPoint(clientX, clientY)];\n    strokes.push(activeStroke);\n    render();\n  }\n\n  function move(clientX, clientY) {\n    if (!drawing || !activeStroke) return;\n    activeStroke.push(normalizedPoint(clientX, clientY));\n    render();\n  }\n\n  function end() {\n    if (!drawing) return;\n    drawing = false;\n    activeStroke = null;\n    save();\n  }\n\n  /*\n   * AnkiMobile maps taps on the review webview to Show Answer / Answer Good.\n   * iOS exposes PointerEvent and TouchEvent together, so blocking only pointer\n   * events can still leave the native touch/click path active.  Shield the\n   * whole writing zone on both paths while keeping pointer events for drawing.\n   */\n  zone.onclick = stopEvent;\n  zone.ondblclick = stopEvent;\n  canvas.onclick = stopEvent;\n  canvas.ondblclick = stopEvent;\n  [\"click\", \"dblclick\", \"contextmenu\"].forEach(function (type) {\n    zone.addEventListener(type, stopEvent, false);\n    canvas.addEventListener(type, stopEvent, false);\n  });\n  [\"touchstart\", \"touchmove\", \"touchend\", \"touchcancel\",\n   \"gesturestart\", \"gesturechange\", \"gestureend\"].forEach(function (type) {\n    zone.addEventListener(type, stopEvent, { passive: false });\n  });\n\n  if (\"PointerEvent\" in window) {\n    canvas.addEventListener(\"pointerdown\", function (event) {\n      if (event.button !== undefined && event.button !== 0) return;\n      stopEvent(event);\n      try { canvas.setPointerCapture(event.pointerId); } catch (error) {}\n      begin(event.clientX, event.clientY);\n    }, { passive: false });\n    canvas.addEventListener(\"pointermove\", function (event) {\n      if (!drawing) return;\n      stopEvent(event);\n      move(event.clientX, event.clientY);\n    }, { passive: false });\n    canvas.addEventListener(\"pointerup\", function (event) { stopEvent(event); end(); }, { passive: false });\n    canvas.addEventListener(\"pointercancel\", function (event) { stopEvent(event); end(); }, { passive: false });\n  } else {\n    canvas.addEventListener(\"touchstart\", function (event) {\n      if (!event.touches.length) return;\n      stopEvent(event);\n      begin(event.touches[0].clientX, event.touches[0].clientY);\n    }, { passive: false });\n    canvas.addEventListener(\"touchmove\", function (event) {\n      if (!drawing || !event.touches.length) return;\n      stopEvent(event);\n      move(event.touches[0].clientX, event.touches[0].clientY);\n    }, { passive: false });\n    canvas.addEventListener(\"touchend\", function (event) { stopEvent(event); end(); }, { passive: false });\n    canvas.addEventListener(\"touchcancel\", function (event) { stopEvent(event); end(); }, { passive: false });\n    canvas.addEventListener(\"mousedown\", function (event) {\n      if (event.button !== 0) return;\n      stopEvent(event);\n      begin(event.clientX, event.clientY);\n    }, false);\n    document.addEventListener(\"mousemove\", function (event) {\n      if (!drawing) return;\n      stopEvent(event);\n      move(event.clientX, event.clientY);\n    }, false);\n    document.addEventListener(\"mouseup\", function (event) {\n      if (!drawing) return;\n      stopEvent(event);\n      end();\n    }, false);\n  }\n\n  if (controls) {\n    controls.addEventListener(\"pointerdown\", stopPropagationOnly, false);\n    controls.addEventListener(\"touchstart\", stopPropagationOnly, { passive: true });\n    controls.addEventListener(\"touchmove\", stopPropagationOnly, { passive: true });\n    controls.addEventListener(\"touchend\", stopPropagationOnly, { passive: true });\n    controls.addEventListener(\"touchcancel\", stopPropagationOnly, { passive: true });\n    controls.addEventListener(\"click\", function (event) {\n      stopEvent(event);\n      var button = event.target.closest(\"button[data-write-action]\");\n      if (!button) return;\n      if (button.dataset.writeAction === \"undo\") strokes.pop();\n      if (button.dataset.writeAction === \"clear\") strokes = [];\n      activeStroke = null;\n      drawing = false;\n      save();\n      render();\n    }, false);\n  }\n\n  window.addEventListener(\"resize\", render, false);\n  if (\"ResizeObserver\" in window) new ResizeObserver(render).observe(canvas.parentElement);\n  window.setTimeout(render, 0);\n})();\n\u003c/script>\n","back":"\u003cmain class=\"kf-shell\" data-level=\"N5\">\n\u003cdiv class=\"kf-topbar\">\n  \u003cdiv class=\"kf-badges\">\n    \u003cspan class=\"kf-badge\">N5 · 학습용\u003c/span>\n    \u003cspan class=\"kf-mode\">한자 쓰기 · 정답\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"kf-index\">0002 / 2136 · 초등 1학년\u003c/div>\n\u003c/div>\n\n  \u003csection class=\"kf-panel\">\n    \u003ch2 class=\"kf-panel-title\">정답 확인\u003c/h2>\n    \u003cdiv class=\"kf-writing-answer-keyword\">한 일\u003c/div>\n    \u003cdiv class=\"kf-reveal-grid\">\n      \u003cdiv class=\"reveal-box\">\n        \u003cdiv class=\"reveal-label\">내가 쓴 글자\u003c/div>\n        \u003cdiv id=\"write-preview-wrap-0002\" class=\"kf-writing-preview\">\n          \u003ccanvas id=\"write-preview-0002\" class=\"kf-writing-canvas\" aria-label=\"내가 쓴 글자 미리보기\">\u003c/canvas>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"reveal-box\">\n        \u003cdiv class=\"reveal-label\">정답 자형\u003c/div>\n        \u003cdiv class=\"reveal-kanji\" lang=\"ja\">一\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n\u003csection class=\"kf-panel\">\n  \u003ch2 class=\"kf-panel-title\">기본 정보\u003c/h2>\n  \u003cdiv class=\"kf-info-grid\">\n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">한국식\u003c/div>\u003cdiv class=\"kf-value\">한 일\u003c/div>\u003c/div>\n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">음독\u003c/div>\u003cdiv class=\"kf-value jp\" lang=\"ja\">イチ、イツ\u003c/div>\u003c/div>\n    \u003cdiv class=\"kf-info-row\">\u003cdiv class=\"kf-label\">훈독\u003c/div>\u003cdiv class=\"kf-value jp\" lang=\"ja\">ひと、ひとつ\u003c/di button type=\"button\" data-action=\"next\" title=\"다음 획\">다음\u003c/button>\n        \u003cbutton type=\"button\" data-action=\"all\" title=\"전체\">전체\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"kf-details\">\n  \u003csummary>음독 상세\u003c/summary>\n  \u003cdiv class=\"details-body kf-reading-groups\">\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">음독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">イチ\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">一度・第一의 읽기입니다. 한자가 단어 앞인지 뒤인지 만으로 イチ/イツ를 확정할 수는 없습니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一度\u003c/b> \u003cspan lang=\"ja\">いちど\u003c/span> · 한 번\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">第一\u003c/b> \u003cspan lang=\"ja\">だいいち\u003c/span> · 제일; 첫째\u003c/div>\u003c/div>\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">음독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">イツ\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">‘같음·하나로 합침’과 관련된 다음 단어에서 확인합니다. 이 의미가 イツ를 결정하는 일반 법칙이라는 뜻은 아닙니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">同一\u003c/b> \u003cspan lang=\"ja\">どういつ\u003c/span> · 동일함\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">統一\u003c/b> \u003cspan lang=\"ja\">とういつ\u003c/span> · 통일\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"kf-details\">\n  \u003csummary>훈독 상세\u003c/summary>\n  \u003cdiv class=\"details-body kf-reading-groups\">\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">훈독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">ひと\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">합성어 앞에서 수량 ‘하나’를 나타냅니다. 뒤의 말과 합친 완성된 읽기를 익힙니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一息\u003c/b> \u003cspan lang=\"ja\">ひといき\u003c/span> · 한숨; 잠깐의 휴식\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一筋\u003c/b> \u003cspan lang=\"ja\">ひとすじ\u003c/span> · 한 줄기; 한길\u003c/div>\u003c/div>\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">훈독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">ひとつ\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">물건 등을 세는 고유어 수사입니다. 한자가 ひと, 뒤의 つ가 오쿠리가나인 一つ로 씁니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一つ\u003c/b> \u003cspan lang=\"ja\">ひとつ\u003c/span> · 하나; 한 개\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\n\n\u003cdetails class=\"kf-details\">\n  \u003csummary>대표 어휘 더 보기\u003c/summary>\n  \u003cdiv class=\"details-body kf-reading-groups\">\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一度\u003c/b> \u003cspan lang=\"ja\">いちど\u003c/span> · 한 번\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">第一\u003c/b> \u003cspan lang=\"ja\">だいいち\u003c/span> · 제일; 첫째\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">同一\u003c/b> \u003cspan lang=\"ja\">どういつ\u003c/span> · 동일함\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">統一\u003c/b> \u003cspan lang=\"ja\">とういつ\u003c/span> · 통일\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一息\u003c/b> \u003cspan lang=\"ja\">ひといき\u003c/span> · 한숨; 잠깐의 휴식\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一筋\u003c/b> \u003cspan lang=\"ja\">ひとすじ\u003c/span> · 한 줄기; 한길\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一つ\u003c/b> \u003cspan lang=\"ja\">ひとつ\u003c/span> · 하나; 한 개\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\n\n\n\n\u003cdetails class=\"kf-details\">\n  \u003csummary>사전·출처 링크\u003c/summary>\n  \u003cdiv class=\"details-body\">\n    \u003cdiv class=\"reference-links\">\u003ca href=\"https://nihongokanji.com/9/\">한자 목록 참고\u003c/a> \u003ca href=\"https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/kanji/joyokanjisakuin/index.html\">문화청 상용한자표\u003c/a> \u003ca href=\"https://kanjivg.tagaini.net/\">CC BY-SA 3.0 / Ulrich Apel and KanjiVG contributors\u003c/a>\u003c/div>\n    \u003cdiv class=\"data-note\">모양 풀이·연상·한국어 설명·예문은 이 자료를 위해 독립 작성했습니다. 음훈은 상용한자표 본표 기준입니다. 이름 읽기·표외 읽기·미확인 빈도는 표본에서 제외했습니다. N5는 사이트와 기존 덱의 학습용 분류입니다.\u003cdiv class=\"kf-common-trap\">\u003cstrong>혼동 주의\u003c/strong>一同는 いちどう로 읽으므로 イツ의 예시로 분류하지 않습니다. 一人의 ひとり와 一日の ついたちは 두 글자를 합친 특별한 읽기입니다.\u003cbr>가로획 하나를 쓰고 멈추면 一.\u003c/div>\u003cp>https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/kanji/joyokanjisakuin/index.html ; JMdict 표제어·읽기 94쌍 대조 ; KanjiVG SVG 경로 10자 일치 ; 2026-11-06 Codex AI 검토; 원어민 NOT_TESTED\u003c/p>\u003c/div>\n  \u003c/div>\n\u003c/details>\n\u003c/main>\n\u003cscript>\n(function () {\n  var root = document.getElementById(\"write-preview-wrap-0002\");\n  var canvas = document.getElementById(\"write-preview-0002\");\n  if (!root || !canvas) return;\n  var strokes = [];\n  try { strokes = JSON.parse(window.sessionStorage.getItem(\"kf-writing-v1-0002\") || \"[]\"); } catch (error) {}\n  if (!Array.isArray(strokes)) strokes = [];\n  root.classList.toggle(\"is-empty\", strokes.length === 0);\n\n  function render() {\n    var rect = canvas.getBoundingClientRect();\n    var width = Math.max(1, rect.width);\n    var height = Math.max(1, rect.height);\n    var ratio = Math.max(1, Math.min(3, window.devicePixelRatio || 1));\n    canvas.width = Math.round(width * ratio);\n    canvas.height = Math.round(height * ratio);\n    var context = canvas.getContext(\"2d\");\n    context.setTransform(ratio, 0, 0, ratio, 0, 0);\n    context.clearRect(0, 0, width, height);\n    var shell = canvas.closest(\".kf-shell\") || document.documentElement;\n    var styles = window.getComputedStyle(shell);\n    context.strokeStyle = styles.getPropertyValue(\"--level\").trim() || styles.getPropertyValue(\"--ink\").trim() || \"#20251f\";\n    context.fillStyle = context.strokeStyle;\n \n    \u003cdiv>가로획 하나로 이루어진 글자입니다. 二·三과는 가로획 수로 구별합니다. 획이 살짝 기울거나 굽어 보이는 것은 글꼴·필체의 차이일 수 있으므로 기준 글자와 획수를 함께 봅니다.\u003c/div>\n    \u003cdiv class=\"kf-components\">一\u003c/div>\n    \u003c/div>\n  \u003c/details>\n\n\u003cdetails class=\"kf-details\">\u003csummary>음독 상세\u003c/summary>\u003cdiv class=\"details-body kf-reading-groups\">\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">음독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">イチ\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">一度・第一의 읽기입니다. 한자가 단어 앞인지 뒤인지 만으로 イチ/イツ를 확정할 수는 없습니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一度\u003c/b> \u003cspan lang=\"ja\">いちど\u003c/span> · 한 번\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">第一\u003c/b> \u003cspan lang=\"ja\">だいいち\u003c/span> · 제일; 첫째\u003c/div>\u003c/div>\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">음독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">イツ\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">‘같음·하나로 합침’과 관련된 다음 단어에서 확인합니다. 이 의미가 イツ를 결정하는 일반 법칙이라는 뜻은 아닙니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">同一\u003c/b> \u003cspan lang=\"ja\">どういつ\u003c/span> · 동일함\u003c/div>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">統一\u003c/b> \u003cspan lang=\"ja\">とういつ\u003c/span> · 통일\u003c/div>\u003c/div>\u003c/div>\u003c/details>\n\u003cdetails class=\"kf-details\">\u003csummary>훈독 상세\u003c/summary>\u003cdiv class=\"details-body kf-reading-groups\">\u003cdiv class=\"reading-group\">\u003cdiv class=\"reading-head\">\u003cspan class=\"reading-type\">훈독\u003c/span>\u003cspan class=\"reading-value\" lang=\"ja\">ひと\u003c/span>\u003c/div>\u003cp class=\"kf-reading-note\">합성어 앞에서 수량 ‘하나’를 나타냅니다. 뒤의 말과 합친 완성된 읽기를 익힙니다.\u003c/p>\u003cdiv class=\"reading-example\">\u003cb lang=\"ja\">一息\u003c/b> \u003cspan lang=\"ja\">ひといき\u003c/span> · 한숨; 잠깐의 휴식\u003c/div>\u003cdiv clas   <script>
    const payload = JSON.parse(document.getElementById('preview-data').textContent);
    const selection = document.getElementById('cards');
    const side = document.getElementById('side');
    const theme = document.getElementById('theme');
    const face = document.getElementById('face');
    let answer = false;
    let dark = false;
    for (const [index, card] of payload.cards.entries()) {
      selection.add(new Option(`${index + 1}. ${card.character} · ${card.type}`, index));
    }
    function show() {
      const card = payload.cards[Number(selection.value)];
      const content = answer ? card.back : card.front;
      const classes = dark ? 'card nightMode' : 'card';
      side.textContent = answer ? '앞면 보기' : '정답 보기';
      side.setAttribute('aria-pressed', answer);
      theme.setAttribute('aria-pressed', dark);
      face.title = `${card.character} · ${card.type} · ${answer ? '뒷면' : '앞면'}`;
      face.srcdoc = `<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${payload.css}</style><body class="${classes}">${content}</body></html>`;
    }
    selection.addEventListener('change', () => { answer = false; show(); });
    side.addEventListener('click', () => { answer = !answer; show(); });
    theme.addEventListener('click', () => { dark = !dark; show(); });
    show();
  </script>
