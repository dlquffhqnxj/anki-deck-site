\"과거형\",\"quick\":false},{\"id\":\"D28\",\"track\":\"context\",\"prompt\":\"이 문장에서 「つい」의 뜻을 고르세요.\",\"stimulus\":\"おいしそうで、つい食べ過ぎました。\",\"options\":[\"일부러\",\"나도 모르게\",\"정확히\"],\"answer\":\"나도 모르게\",\"feedback\":\"맛있어 보여서 그만 많이 먹었다는 뜻입니다.\",\"skill\":\"의도와 행동\",\"quick\":false},{\"id\":\"D29\",\"track\":\"context\",\"prompt\":\"이 문장에서 「届く」의 뜻을 고르세요.\",\"stimulus\":\"明日、荷物が届く予定です。\",\"options\":[\"보내다\",\"포장하다\",\"도착하다\"],\"answer\":\"도착하다\",\"feedback\":\"荷物が届く는 짐이나 택배가 도착한다는 뜻입니다.\",\"skill\":\"자동사 의미\",\"quick\":false},{\"id\":\"D30\",\"track\":\"context\",\"prompt\":\"이 문장에서 「たいてい」의 뜻을 고르세요.\",\"stimulus\":\"平日はたいてい家で夕食を食べます。\",\"options\":[\"대개\",\"가끔\",\"꼭\"],\"answer\":\"대개\",\"feedback\":\"평일에는 ‘대체로’ 집에서 저녁을 먹는다는 말입니다.\",\"skill\":\"빈도를 나타내는 말\",\"quick\":false}],\"tracks\":{\"read\":{\"name\":\"한자 읽기\",\"priority\":2,\"plan\":\"급수에 맞는 읽기부터 하루 6분\",\"query\":\"deck:\\\"일본어::01_학습::한자혁명\\\" card:\\\"한자 읽기\\\"\"},\"write\":{\"name\":\"한자 쓰기\",\"priority\":1,\"plan\":\"뜻을 보고 손으로 쓰기 하루 6분\",\"query\":\"deck:\\\"일본어::01_학습::한자혁명\\\" card:\\\"한자 쓰기\\\"\"},\"similar\":{\"name\":\"유사 한자\",\"priority\":0,\"plan\":\"두 글자의 다른 획을 짚으며 하루 6분\",\"query\":\"deck:\\\"일본어::02_실전문제::한자혁명::유사 한자\\\"\"},\"verb\":{\"name\":\"동사 활용\",\"priority\":3,\"plan\":\"기본형을 지정된 활용형으로 바꾸기 하루 6분\",\"query\":\"deck:\\\"일본어::02_실전문제::한자혁명::동사 활용\\\"\"},\"context\":{\"name\":\"어휘·문맥\",\"priority\":4,\"plan\":\"예문에서 단어 뜻을 골라보는 연습을 하루 6분\",\"query\":\"deck:\\\"일본어::02_실전문제::한자혁명::어휘·문맥\\\"\"}},\"audio\":{},\"correction\":{\"id\":\"KR-N-X-CTX-1006\",\"text\":\"v1.8.0-RC1 · ‘그렇다’ → ‘그렇게까지 / 그 정도로’. ‘그렇게 많이’도 문맥상 가능합니다.\",\"url\":\"https://dictionary.cambridge.org/ja/dictionary/japanese-english/%E3%81%9D%E3%82%93%E3%81%AA%E3%81%AB\"},\"practice\":[{\"id\":\"P01\",\"track\":\"read\",\"prompt\":\"「手紙」의 읽기를 고르세요.\",\"stimulus\":\"友達に手紙を書きました。\",\"options\":[\"てかみ\",\"てがみ\",\"しゅがみ\"],\"answer\":\"てがみ\",\"feedback\":\"手紙（てがみ）는 ‘편지’입니다.\",\"skill\":\"훈독 결합\",\"quick\":false},{\"id\":\"P02\",\"track\":\"read\",\"prompt\":\"「申請」의 읽기를 고르세요.\",\"stimulus\":\"オンラインで申請できます。\",\"options\":[\"しんせい\",\"しんしょう\",\"しんぜい\"],\"answer\":\"しんせい\",\"feedback\":\"申請（しんせい）는 ‘신청’입니다.\",\"skill\":\"한자어 읽기\",\"quick\":false},{\"id\":\"P03\",\"track\":\"read\",\"prompt\":\"「日曜日」의 읽기를 고르세요.\",\"stimulus\":\"日曜日は家で休みます。\",\"options\":[\"ひようび\",\"にようび\",\"にちようび\"],\"answer\":\"にちようび\",\"feedback\":\"日曜日（にちようび）는 ‘일요일’입니다.\",\"skill\":\"음독 결합\",\"quick\":false},{\"id\":\"P04\",\"track\":\"write\",\"prompt\":\"‘오른 우’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"右\",\"feedback\":\"右에는 아래쪽에 口가 있습니다.\",\"skill\":\"아래쪽 형태\",\"quick\":false},{\"id\":\"P05\",\"track\":\"write\",\"prompt\":\"‘일천 천’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"千\",\"feedback\":\"千의 첫 획은 왼쪽으로 내려오는 짧은 삐침입니다.\",\"skill\":\"첫 획\",\"quick\":false},{\"id\":\"P06\",\"track\":\"write\",\"prompt\":\"‘임금 왕’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"王\",\"feedback\":\"王은 가로획 셋과 세로획 하나로 이루어집니다.\",\"skill\":\"획수와 모양\",\"quick\":false},{\"id\":\"P07\",\"track\":\"similar\",\"prompt\":\"‘태양’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕陽（たいよう）\",\"options\":[\"犬\",\"大\",\"太\"],\"answer\":\"太\",\"feedback\":\"太는 점획이 아래쪽에 있습니다.\",\"skill\":\"점획 비교\",\"quick\":false},{\"id\":\"P08\",\"track\":\"similar\",\"prompt\":\"‘본점’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕店（ほんてん）\",\"options\":[\"本\",\"木\",\"末\"],\"answer\":\"本\",\"feedback\":\"本에는 木 아래에 짧은 가로획이 하나 더 있습니다.\",\"skill\":\"아래쪽 획 비교\",\"quick\":false},{\"id\":\"P09\",\"track\":\"similar\",\"prompt\":\"‘견학’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕学（けんがく）\",\"options\":[\"貝\",\"見\",\"目\"],\"answer\":\"見\",\"feedback\":\"見의 오른쪽 아래 획은 굽어서 위로 올라갑니다.\",\"skill\":\"마지막 획 비교\",\"quick\":false},{\"id\":\"P10\",\"track\":\"verb\",\"prompt\":\"「泳ぐ」의 て형을 고르세요.\",\"stimulus\":\"泳ぐ\",\"options\":[\"泳いで\",\"泳いて\",\"泳んで\"],\"answer\":\"泳いで\",\"feedback\":\"泳ぐ의 ぐ는 て형에서 いで로 바뀝니다.\",\"skill\":\"연결형\",\"quick\":false},{\"id\":\"P11\",\"track\":\"verb\",\"prompt\":\"「待つ」의 た형을 고르세요.\",\"stimulus\":\"待つ\",\"options\":[\"待いた\",\"待った\",\"待つた\"],\"answer\":\"待った\",\"feedback\":\"待つ의 つ는 た형에서 った로 바뀝니다.\",\"skill\":\"과거형\",\"quick\":false},{\"id\":\"P12\",\"track\":\"verb\",\"prompt\":\"「起きる」의 ない형을 고르세요.\",\"stimulus\":\"起きる\",\"options\":[\"起きらない\",\"起きりない\",\"起きない\"],\"answer\":\"起きない\",\"feedback\":\"起きる는 1단 동사입니다. る를 떼고 ない를 붙입니다.\",\"skill\":\"부정형\",\"quick\":false},{\"id\":\"P13\",\"track\":\"context\",\"prompt\":\"이 문장에서 「ほとんど」의 뜻을 고르세요.\",\"stimulus\":\"宿題はほとんど終わりました。\",\"options\":[\"아직\",\"거의\",\"한꺼번에\"],\"answer\":\"거의\",\"feedback\":\"숙제가 ‘거의’ 끝났다는 뜻입니다.\",\"skill\":\"정도를 나타내는 말\",\"quick\":false},{\"id\":\"P14\",\"track\":\"context\",\"prompt\":\"이 문장에서 「間もなく」의 뜻을 고르세요.\",\"stimulus\":\"間もなく電車が来ます。\",\"options\":[\"곧\",\"이미\",\"일부러\"],\"answer\":\"곧\",\"feedback\":\"잠시 후에 전철이 온다는 뜻입니다.\",\"skill\":\"시간을 나타내는 말\",\"quick\":false},{\"id\":\"P15\",\"track\":\"context\",\"prompt\":\"이 문장에서 「見直しました」의 뜻을 고르세요.\",\"stimulus\":\"提出前に書類を見直しました。\",\"options\":[\"새로 발급했습니다\",\"제출을 미뤘습니다\",\"다시 살폈습니다\"],\"answer\":\"다시 살폈습니다\",\"feedback\":\"제출 전에 서류를 다시 읽고 확인했다는 뜻입니다.\",\"skill\":\"상황에서 의미 구별\",\"quick\":false}],\"followup\":{\"concepts\":{\"earth-warrior\":{\"diag\":\"D03\",\"title\":\"土와 士의 가로획\",\"rule\":\"土는 아래 가로획이 길고, 士는 위 가로획이 길어요.\",\"practice\":{\"prompt\":\"‘흙’에 맞는 한자를 고르세요.\",\"fragment\":\"畑の〔　〕が乾いています。\",\"reading\":\"はたけの つちが かわいています。\",\"translation\":\"밭의 흙이 말라 있어요.\",\"answer\":\"土\",\"why\":\"土는 흙을 뜻하며 아래 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"士\",\"why\":\"士는 武士처럼 사람의 신분이나 직함에 쓰여요.\"}]},\"retest\":{\"prompt\":\"‘무사’를 완성하세요.\",\"fragment\":\"武〔　〕は刀を持っていました。\",\"reading\":\"ぶしは かたなを もっていました。\",\"translation\":\"무사는 칼을 가지고 있었어요.\",\"answer\":\"士\",\"why\":\"武士는 무사예요. 士의 위 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"土\",\"why\":\"土는 흙이나 땅을 뜻하며 武士의 표기에 쓰이지 않아요.\"}]}},\"not-yet-end\":{\"diag\":\"D07\",\"title\":\"未와 末의 가로획\",\"rule\":\"未는 아랫줄이 길고 아직이라는 뜻이에요. 末은 윗줄이 길고 끝이라는 뜻이에요.\",\"practice\":{\"prompt\":\"‘미정’을 완성하세요.\",\"fragment\":\"予定は〔　〕定です。\",\"reading\":\"よていは みていです。\",\"translation\":\"일정은 아직 정해지지 않았어요.\",\"answer\":\"未\",\"why\":\"未定의 未는 ‘아직’을 뜻해요.\",\"distractors\":[{\"answer\":\"末\",\"why\":\"末은 마지막을 뜻하며 ‘아직 정해지지 않음’과 맞지 않아요.\"}]},\"retest\":{\"prompt\":\"‘월말’을 완성하세요.\",\"fragment\":\"月〔　〕に報告します。\",\"reading\":\"げつまつに ほうこくします。\",\"translation\":\"월말에 보고할게요.\",\"answer\":\"末\",\"why\":\"月末은 달의 끝이에요. 末의 위 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"未\",\"why\":\"未는 未定의 ‘아직’이라는 뜻이에요. 달의 끝을 뜻하는 글자는 末이에요.\"}]}},\"person-enter\":{\"diag\":\"D11\",\"title\":\"人과 入의 획 방향\",\"rule\":\"人은 왼쪽으로 내리는 획이 위에서 시작해요. 入은 오른쪽으로 내리는 획이 더 위에서 시작해요.\",\"practice\":{\"prompt\":\"‘세 사람’을 완성하세요.\",\"fragment\":\"この部屋に三〔　〕います。\",\"reading\":\"この へやに さんにん います。\",\"translation\":\"이 방에 세 사람이 있어요.\",\"answer\":\"人\",\"why\":\"三人은 사람 셋을 세는 말이에요.\",\"distractors\":[{\"answer\":\"入\",\"why\":\"入은 들어가다라는 뜻이에요. 사람 수에는 人을 써요.\"}]},\"retest\":{\"prompt\":\"‘들어왔어요’를 완성하세요.\",\"fragment\":\"先生が教室に〔　〕りました。\",\"reading\":\"せんせいが きょうしつに はいりました。\",\"translation\":\"선생님이 교실에 들어오셨어요.\",\"answer\":\"入\",\"why\":\"入りました는 入る의 과거형이에요.\",\"distractors\":[{\"answer\":\"人\",\"why\":\"人은 사람을 뜻하는 한자이고 入る의 동사 표기에 들어가지 않아요.\"}]}},\"day-eye\":{\"diag\":\"D15\",\"title\":\"日과 目의 안쪽 획\",\"rule\":\"日은 안쪽 가로획이 하나, 目는 둘이에요.\",\"practice\":{\"prompt\":\"기간 ‘3일’을 완성하세요.\",\"fragment\":\"三〔　〕間旅行しました。\",\"reading\":\"みっかかん りょこうしました。\",\"translation\":\"3일 동안 여행했어요.\",\"answer\":\"日\",\"why\":\"三日間의 日은 날짜 단위예요.\",\"distractors\":[{\"answer\":\"目\",\"why\":\"目는 二日目처럼 순서를 나타낼 때 붙어요.\"}]},\"retest\":{\"prompt\":\"순서 ‘둘째 날’을 완성하세요.\",\"fragment\":\"二日〔　〕に京都へ行きました。\",\"reading\":\"ふつかめに きょうとへ いきました。\",\"translation\":\"둘째 날에 교토에 갔어요.\",\"answer\":\"目\",\"why\":\"二日目는 이틀째라는 순서예요.\",\"distractors\":[{\"answer\":\"日\",\"why\":\"날짜 단위 日은 二日에 이미 들어 있어요. 순서를 붙이는 글자는 目예요.\"}]}},\"king-ball\":{\"diag\":\"D20\",\"title\":\"王과 玉의 점획\",\"rule\":\"王에는 오른쪽 아래 점이 없고, 玉에는 있어요.\",\"practice\":{\"prompt\":\"‘공’에 맞는 표기를 고르세요.\",\"fragment\":\"白い〔　〕が転がった。\",\"reading\":\"しろい たまが ころがった。\",\"translation\":\"하얀 공이 굴러갔어요.\",\"answer\":\"玉\",\"why\":\"玉는 たま라고 읽으며 둥근 공이나 구슬을 뜻해요.\",\"distractors\":[{\"answer\":\"王\",\"why\":\"王은 왕을 뜻해요. 굴러가는 물체의 표기에 맞지 않아요.\"}]},\"retest\":{\"prompt\":\"‘임금’을 나타내는 한자를 고르세요.\",\"fragment\":\"その国の〔　〕は若いです。\",\"reading\":\"その くにの おうは わかいです。\",\"translation\":\"그 나라의 왕은 젊어요.\",\"answer\":\"王\",\"why\":\"나라의 통치자는 王이라고 써요.\",\"distractors\":[{\"answer\":\"玉\",\"why\":\"점이 있는 玉는 공이나 구슬을 뜻해요.\"}]}},\"shell-see\":{\"diag\":\"D25\",\"title\":\"貝와 見의 끝 획\",\"rule\":\"貝의 아래 두 획은 八처럼 벌어져요. 見의 마지막 획은 오른쪽으로 굽어요.\",\"practice\":{\"prompt\":\"‘조개’를 뜻하는 글자를 고르세요.\",\"fragment\":\"海で小さな〔　〕を拾いました。\",\"reading\":\"うみで ちいさな かいを ひろいました。\",\"translation\":\"바다에서 작은 조개를 주웠어요.\",\"answer\":\"貝\",\"why\":\"貝는 かい, 조개를 뜻해요.\",\"distractors\":[{\"answer\":\"見\",\"why\":\"見은 보다와 관련돼요. 조개를 뜻하는 표기는 貝예요.\"}]},\"retest\":{\"prompt\":\"‘견학’을 완성하세요.\",\"fragment\":\"博物館を〔　〕学しました。\",\"reading\":\"はくぶつかんを けんがくしました。\",\"translation\":\"박물관을 견학했어요.\",\"answer\":\"見\",\"why\":\"見学은 실제로 보고 배운다는 뜻이에요.\",\"distractors\":[{\"answer\":\"貝\",\"why\":\"貝는 조개예요. 보는 행위와 관련된 글자는 見이에요.\"}]}},\"k-te\":{\"diag\":\"D04\",\"title\":\"5단 く 동사의 て형\",\"rule\":\"일반적인 5단 く 동사는 く를 いて로 바꿔요.\",\"practice\":{\"prompt\":\"「歩く」의 て형을 고르세요.\",\"fragment\":\"駅まで〔　〕行きます。\",\"reading\":\"えきまで あるいて いきます。\",\"translation\":\"역까지 걸어가요.\",\"answer\":\"歩いて\",\"why\":\"歩く의 く는 て형에서 いて가 돼요.\",\"distractors\":[{\"answer\":\"歩って\",\"why\":\"って는 う·つ·る 동사 또는 예외 行く에 쓰여요.\"},{\"answer\":\"歩んで\",\"why\":\"んで는 む·ぶ·ぬ 동사의 て형에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「書く」의 て형을 골라 문장을 완성하세요.\",\"fragment\":\"ここに名前を〔　〕ください。\",\"reading\":\"ここに なまえを かいて ください。\",\"translation\":\"여기에 이름을 써 주세요.\",\"answer\":\"書いて\",\"why\":\"書く는 書いて가 돼요. 書いてください는 ‘써 주세요’예요.\",\"distractors\":[{\"answer\":\"書って\",\"why\":\"書く는 行く처럼 って를 쓰는 예외가 아니에요.\"},{\"answer\":\"書んで\",\"why\":\"書く의 어말 く에는 んで가 붙지 않아요.\"}]}},\"m-past\":{\"diag\":\"D08\",\"title\":\"5단 む 동사의 た형\",\"rule\":\"5단 む 동사의 과거형은 む를 んだ로 바꿔요.\",\"practice\":{\"prompt\":\"「休む」의 보통체 과거형을 고르세요.\",\"fragment\":\"昨日は家で〔　〕。\",\"reading\":\"きのうは いえで やすんだ。\",\"translation\":\"어제는 집에서 쉬었어요.\",\"answer\":\"休んだ\",\"why\":\"休む는 む를 んだ로 바꿔 休んだ가 돼요.\",\"distractors\":[{\"answer\":\"休いた\",\"why\":\"いた는 書く → 書いた처럼 일반적인 く 동사에 쓰여요.\"},{\"answer\":\"休った\",\"why\":\"った는 待つ → 待った 같은 동사의 과거형에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「読む」의 보통체 과거형을 고르세요.\",\"fragment\":\"電車の中で本を〔　〕。\",\"reading\":\"でんしゃの なかで ほんを よんだ。\",\"translation\":\"전철 안에서 책을 읽었어요.\",\"answer\":\"読んだ\",\"why\":\"読む는 んだ가 붙는 む 동사예요.\",\"distractors\":[{\"answer\":\"読いた\",\"why\":\"読む의 어말은 く가 아니어서 いた를 쓰지 않아요.\"},{\"answer\":\"読った\",\"why\":\"読む의 む는 った로 바뀌지 않아요.\"}]}},\"iku-te\":{\"diag\":\"D12\",\"title\":\"行く의 예외 て형\",\"rule\":\"行く의 て형은 예외적으로 行って예요.\",\"practice\":{\"prompt\":\"「行く」의 て형을 고르세요.\",\"fragment\":\"先に駅へ〔　〕ください。\",\"reading\":\"さきに えきへ いって ください。\",\"translation\":\"먼저 역으로 가 주세요.\",\"answer\":\"行って\",\"why\":\"行く는 예외라서 行って가 돼요.\",\"distractors\":[{\"answer\":\"行いて\",\"why\":\"일반 く 동사 규칙을 적용한 형태예요. 行く는 예외예요.\"},{\"answer\":\"行んで\",\"why\":\"んで는 む·ぶ·ぬ 동사에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「行く」를 て형으로 바꿔 행동을 연결하세요.\",\"fragment\":\"スーパーへ〔　〕、牛乳を買った。\",\"reading\":\"スーパーへ いって、ぎゅうにゅうを かった。\",\"translation\":\"슈퍼에 가서 우유를 샀어요.\",\"answer\":\"行って\",\"why\":\"行って가 가는 행동을 뒤 행동과 이어 줘요.\",\"distractors\":[{\"answer\":\"行いて\",\"why\":\"예외 동사 行く에는 いて 대신 って가 들어가요.\"},{\"answer\":\"行った\",\"why\":\"行った는 과거를 나타내요. 이 문항은 연결하는 て형을 묻고 있어요.\"}]}},\"r-nai\":{\"diag\":\"D17\",\"title\":\"5단 る 동사의 ない형\",\"rule\":\"5단 る 동사는 る를 ら로 바꾸고 ない를 붙여요.\",\"practice\":{\"prompt\":\"「入る」의 ない형을 고르세요.\",\"fragment\":\"ここには〔　〕でください。\",\"reading\":\"ここには はいらないで ください。\",\"translation\":\"여기에는 들어가지 마세요.\",\"answer\":\"入らない\",\"why\":\"入る는 5단 동사라서 入らない가 돼요.\",\"distractors\":[{\"answer\":\"入ない\",\"why\":\"る를 그대로 떼면 안 돼요. 여기서는 ら로 바꿔요.\"},{\"answer\":\"入りない\",\"why\":\"入り는 入ります의 어간이에요. ない형 앞에는 入ら를 써요.\"}]},\"retest\":{\"prompt\":\"「帰る」를 ない형으로 바꿔 ‘일찍 귀가해야 한다’를 완성하세요.\",\"fragment\":\"今日は早く〔　〕といけません。\",\"reading\":\"きょうは はやく かえらないと いけません。\",\"translation\":\"오늘은 일찍 귀가해야 해요.\",\"answer\":\"帰らない\",\"why\":\"帰る는 5단 동사예요. 帰らないといけません으로 필요성을 표현해요.\",\"distractors\":[{\"answer\":\"帰ない\",\"why\":\"1단 동사처럼 る를 뺀 형태예요. 帰る에는 ら가 필요해요.\"},{\"answer\":\"帰りない\",\"why\":\"帰り는 帰ります에 쓰여요. ない형은 帰らない예요.\"}]}},\"s-masu\":{\"diag\":\"D22\",\"title\":\"5단 す 동사의 ます형\",\"rule\":\"5단 す 동사는 す를 し로 바꾸고 ます를 붙여요.\",\"practice\":{\"prompt\":\"「出す」의 ます형을 골라 ‘제출하겠습니다’를 완성하세요.\",\"fragment\":\"明日、書類を〔　〕。\",\"reading\":\"あした、しょるいを だします。\",\"translation\":\"내일 서류를 제출하겠습니다.\",\"answer\":\"出します\",\"why\":\"出す의 す를 し로 바꾸면 出します가 돼요.\",\"distractors\":[{\"answer\":\"出せます\",\"why\":\"가능형이라 ‘제출할 수 있습니다’라는 뜻이에요.\"},{\"answer\":\"出すます\",\"why\":\"사전형 그대로 ます를 붙이지 않아요.\"}]},\"retest\":{\"prompt\":\"「話す」의 ます형을 골라 ‘말합니다’를 완성하세요.\",\"fragment\":\"日本語で〔　〕。\",\"reading\":\"にほんごで はなします。\",\"translation\":\"일본어로 말합니다.\",\"answer\":\"話します\",\"why\":\"話す의 す → し로 바꿔 話します라고 해요.\",\"distractors\":[{\"answer\":\"話せます\",\"why\":\"가능형이라 ‘말할 수 있습니다’라는 뜻이에요.\"},{\"answer\":\"話すます\",\"why\":\"ます 앞에서는 す를 し로 바꿔요.\"}]}},\"one-past\":{\"diag\":\"D27\",\"title\":\"1단 동사의 た형\",\"rule\":\"1단 동사는 마지막 る를 떼고 た를 붙여요.\",\"practice\":{\"prompt\":\"「見る」의 보통체 과거형을 고르세요.\",\"fragment\":\"昨日、その映画を〔　〕。\",\"reading\":\"きのう、その えいがを みた。\",\"translation\":\"어제 그 영화를 봤어요.\",\"answer\":\"見た\",\"why\":\"見る는 1단 동사여서 見た가 돼요.\",\"distractors\":[{\"answer\":\"見った\",\"why\":\"5단 る 동사처럼 촉음 っ을 넣은 형태예요.\"},{\"answer\":\"見て\",\"why\":\"見て는 연결이나 부탁에 사용하는 て형이에요.\"}]},\"retest\":{\"prompt\":\"「食べる」의 보통체 과거형을 고르세요.\",\"fragment\":\"昼にパンを〔　〕。\",\"reading\":\"ひるに パンを たべた。\",\"translation\":\"점심에 빵을 먹었어요.\",\"answer\":\"食べた\",\"why\":\"食べる는 る를 떼고 た를 붙여요.\",\"distractors\":[{\"answer\":\"食べった\",\"why\":\"1단 동사에는 っ이 들어가지 않아요.\"},{\"answer\":\"食べて\",\"why\":\"食べて는 て형이고 이 문항은 과거형을 묻고 있어요.\"}]}},\"sonnani\":{\"diag\":\"D16\",\"title\":\"そんなに와 정도\",\"rule\":\"そんなに는 ‘그렇게까지, 그 정도로’라는 정도를 나타내요.\",\"practice\":{\"prompt\":\"문장에서 「そんなに」의 뜻을 고르세요.\",\"fragment\":\"そんなに急がなくても大丈夫です。\",\"reading\":\"そんなに いそがなくても だいじょうぶです。\",\"translation\":\"그렇게까지 서두르지 않아도 괜찮아요.\",\"answer\":\"그렇게까지\",\"why\":\"여기서는 서두르는 정도를 낮추는 말이에요.\",\"distractors\":[{\"answer\":\"반드시\",\"why\":\"의무를 나타내는 말이 아니에요.\"},{\"answer\":\"벌써\",\"why\":\"시간보다 동작의 정도를 나타내요.\"}]},\"retest\":{\"prompt\":\"문장에서 「そんなに」의 뜻을 고르세요.\",\"fragment\":\"そんなに高いとは思わなかった。\",\"reading\":\"そんなに たかいとは おもわなかった。\",\"translation\":\"그렇게 비쌀 줄은 몰랐어요.\",\"answer\":\"그렇게\",\"why\":\"비싸다고 느끼는 정도를 나타내요.\",\"distractors\":[{\"answer\":\"항상\",\"why\":\"빈도를 나타내는 말이 아니에요.\"},{\"answer\":\"드디어\",\"why\":\"기다린 일이 일어났다는 시간의 뜻은 아니에요.\"}]}},\"mada\":{\"diag\":\"D21\",\"title\":\"まだ와 남아 있는 상태\",\"rule\":\"まだ는 아직 어떤 상태가 이어지거나 일이 완료되지 않았다는 뜻이에요.\",\"practice\":{\"prompt\":\"문장에서 「まだ」의 뜻을 고르세요.\",\"fragment\":\"仕事はまだ終わっていません。\",\"reading\":\"しごとは まだ おわっていません。\",\"translation\":\"일은 아직 끝나지 않았어요.\",\"answer\":\"아직\",\"why\":\"완료되지 않은 상태예요.\",\"distractors\":[{\"answer\":\"이미\",\"why\":\"이미는 완료 또는 선행을 뜻해서 이 まだ와 맞지 않아요.\"},{\"answer\":\"곧\",\"why\":\"곧은 미래 가까운 시점을 뜻해요.\"}]},\"retest\":{\"prompt\":\"문장에서 「まだ」의 뜻을 고르세요.\",\"fragment\":\"会議までまだ時間があります。\",\"reading\":\"かいぎまで まだ じかんが あります。\",\"translation\":\"회의까지 아직 시간이 있어요.\",\"answer\":\"아직\",\"why\":\"아직 시간이 남아 있다는 뜻이에요.\",\"distractors\":[{\"answer\":\"벌써\",\"why\":\"벌써는 예상보다 빠른 시점을 말해요.\"},{\"answer\":\"가끔\",\"why\":\"빈도를 나타내는 말이에요.\"}]}},\"maniau\":{\"diag\":\"D26\",\"title\":\"間に合う와 시간 맞추기\",\"rule\":\"間に合う는 정해진 시각이나 마감에 늦지 않는다는 뜻이에요.\",\"practice\":{\"prompt\":\"문장에서 「間に合います」의 뜻을 고르세요.\",\"fragment\":\"今から出れば、会議に間に合います。\",\"reading\":\"いまから でれば、かいぎに まにあいます。\",\"translation\":\"지금 출발하면 회의 시간에 맞아요.\",\"answer\":\"시간에 맞습니다\",\"why\":\"출발 시각과 회의 시각을 맞출 수 있다는 뜻이에요.\",\"distractors\":[{\"answer\":\"회의가 연기됩니다\",\"why\":\"회의 시간을 미룬다는 말이 없어요.\"},{\"answer\":\"회의를 끝냅니다\",\"why\":\"회의 종료가 아니라 시작 시각에 맞추는 장면이에요.\"}]},\"retest\":{\"prompt\":\"문장에서 「間に合う」의 뜻을 고르세요.\",\"fragment\":\"急げば、締め切りに間に合う。\",\"reading\":\"いそげば、しめきりに まにあう。\",\"translation\":\"서두르면 마감에 맞출 수 있어요.\",\"answer\":\"마감에 맞춥니다\",\"why\":\"締め切りに間に合う는 마감에 늦지 않는다는 뜻이에요.\",\"distractors\":[{\"answer\":\"마감을 바꿉니다\",\"why\":\"마감일을 변경하는 행동이 아니에요.\"},{\"answer\":\"마감을 놓칩니다\",\"why\":\"서두르면 맞출 수 있다는 조건문이에요.\"}]}},\"tsui\":{\"diag\":\"D28\",\"title\":\"つい와 무심코 한 행동\",\"rule\":\"つい는 의도치 않게 그만 어떤 행동을 했다는 뜻이에요.\",\"practice\":{\"prompt\":\"문장에서 「つい」의 뜻을 고르세요.\",\"fragment\":\"面白くて、つい笑ってしまった。\",\"reading\":\"おもしろくて、つい わらってしまった。\",\"translation\":\"재미있어서 나도 모르게 웃어 버렸어요.\",\"answer\":\"나도 모르게\",\"why\":\"웃으려던 의도보다 자연스럽게 튀어나온 행동이에요.\",\"distractors\":[{\"answer\":\"일부러\",\"why\":\"의도를 갖고 한 행동이라는 뜻은 아니에요.\"},{\"answer\":\"반드시\",\"why\":\"의무나 필연을 나타내지 않아요.\"}]},\"retest\":{\"prompt\":\"문장에서 「つい」의 뜻을 고르세요.\",\"fragment\":\"疲れていて、つい電車で寝てしまった。\",\"reading\":\"つかれていて、つい でんしゃで ねてしまった。\",\"translation\":\"피곤해서 전철에서 그만 잠들어 버렸어요.\",\"answer\":\"그만\",\"why\":\"의도치 않게 잠들었다는 뜻이에요.\",\"distractors\":[{\"answer\":\"언제나\",\"why\":\"되풀이되는 빈도가 아니라 의도치 않은 한 행동을 말해요.\"},{\"answer\":\"정확히\",\"why\":\"정확성에 관한 말이 아니에요.\"}]}},\"todoku\":{\"diag\":\"D29\",\"title\":\"届く와 도착하는 대상\",\"rule\":\"届く는 물건이나 소식이 도착한다는 자동사예요.\",\"practice\":{\"prompt\":\"문장에서 「届いた」의 뜻을 고르세요.\",\"fragment\":\"昨日、注文した本が届いた。\",\"reading\":\"きのう、ちゅうもんした ほんが とどいた。\",\"translation\":\"어제 주문한 책이 도착했어요.\",\"answer\":\"도착했어요\",\"why\":\"本が届いた에서 주어는 도착한 책이에요.\",\"distractors\":[{\"answer\":\"책을 보냈어요\",\"why\":\"보내거나 가져다주는 쪽의 행동에는 届ける를 쓸 수 있어요.\"},{\"answer\":\"책을 주문했어요\",\"why\":\"주문한 것은 注文した에 이미 나와요.\"}]},\"retest\":{\"prompt\":\"문장에서 「届きます」의 뜻을 고르세요.\",\"fragment\":\"新しい書類は明日届きます。\",\"reading\":\"あたらしい しょるいは あした とどきます。\",\"translation\":\"새 서류는 내일 도착해요.\",\"answer\":\"도착해요\",\"why\":\"書類は届きます에서 서류가 받는 곳에 도착해요.\",\"distractors\":[{\"answer\":\"가져다줘요\",\"why\":\"누군가가 가져다주는 동작은 届ける와 구별해요.\"},{\"answer\":\"작성해요\",\"why\":\"서류 작성이 아니라 배송이나 전달의 결과예요.\"}]}},\"taitei\":{\"diag\":\"D30\",\"title\":\"たいてい와 빈도\",\"rule\":\"たいてい는 대개, 보통이라는 빈도의 말이에요.\",\"practice\":{\"prompt\":\"문장에서 「たいてい」의 뜻을 고르세요.\",\"fragment\":\"休みの日はたいてい八時に起きます。\",\"reading\":\"やすみの ひは たいてい はちじに おきます。\",\"translation\":\"쉬는 날에는 보통 8시에 일어나요.\",\"answer\":\"보통\",\"why\":\"대부분의 쉬는 날이 그렇다는 말이에요.\",\"distractors\":[{\"answer\":\"가끔\",\"why\":\"가끔은 더 낮은 빈도예요.\"},{\"answer\":\"반드시\",\"why\":\"예외 없이 지켜야 할 조건이라는 뜻이 아니에요.\"}]},\"retest\":{\"prompt\":\"문장에서 「たいてい」의 뜻을 고르세요.\",\"fragment\":\"彼はたいてい歩いて学校へ行きます。\",\"reading\":\"かれは たいてい あるいて がっこうへ いきます。\",\"translation\":\"그는 대개 걸어서 학교에 가요.\",\"answer\":\"대개\",\"why\":\"일반적으로 하는 행동이라는 뜻이에요.\",\"distractors\":[{\"answer\":\"드물게\",\"why\":\"빈도가 낮다는 말은 반대 방향이에요.\"},{\"answer\":\"이미\",\"why\":\"시간이 앞섰다는 뜻이 아니라 행동의 빈도예요.\"}]}},\"koujou\":{\"diag\":\"D13\",\"title\":\"工場의 탁음과 장음\",\"rule\":\"工場를 こうじょう로 읽을 때 뒤의 じょう에 탁음과 장음이 있어요.\",\"practice\":{\"prompt\":\"「工場」의 읽기를 고르세요.\",\"fragment\":\"工場では車を作っています。\",\"reading\":\"こうじょうでは くるまを つくっています。\",\"translation\":\"공장에서는 자동차를 만들고 있어요.\",\"answer\":\"こうじょう\",\"why\":\"이 문맥의 工場는 공장이라는 뜻의 こうじょう예요.\",\"distractors\":[{\"answer\":\"こうしょう\",\"why\":\"뒤 음절은 탁음 じ로 시작해요.\"},{\"answer\":\"こうじょ\",\"why\":\"뒤 じょう에는 장음 う가 있어요.\"}]},\"retest\":{\"prompt\":\"새 문장에서 「工場」의 읽기를 고르세요.\",\"fragment\":\"新しい工場ができました。\",\"reading\":\"あたらしい こうじょうが できました。\",\"translation\":\"새 공장이 생겼어요.\",\"answer\":\"こうじょう\",\"why\":\"이 카드의 工場는 こうじょう예요. じょう의 장음까지 읽어요.\",\"distractors\":[{\"answer\":\"こうしょう\",\"why\":\"場를 이 단어에서 しょう로 읽지 않아요.\"},{\"answer\":\"こうじょ\",\"why\":\"공장 독음에는 마지막 장음이 필요해요.\"}]}},\"sousa\":{\"diag\":\"D23\",\"title\":\"操作의 읽기\",\"rule\":\"操作는 そうさ라고 읽고 기기 등을 조작한다는 뜻이에요.\",\"practice\":{\"prompt\":\"「操作」의 읽기를 고르세요.\",\"fragment\":\"この機械の操作を覚えます。\",\"reading\":\"この きかいの そうさを おぼえます。\",\"translation\":\"이 기계의 조작법을 익혀요.\",\"answer\":\"そうさ\",\"why\":\"操는 そう로, 作은 이 단어에서 さ로 읽어요.\",\"distractors\":[{\"answer\":\"しょうさ\",\"why\":\"첫소리는 しょ가 아니라 そ예요.\"},{\"answer\":\"そうしゃ\",\"why\":\"뒤는 しゃ가 아니라 さ예요.\"}]},\"retest\":{\"prompt\":\"새 문장에서 「操作」의 읽기를 고르세요.\",\"fragment\":\"操作の方法を説明します。\",\"reading\":\"そうさの ほうほうを せつめいします。\",\"translation\":\"조작 방법을 설명할게요.\",\"answer\":\"そうさ\",\"why\":\"조작이라는 操作의 읽기는 そうさ예요.\",\"distrac \"verb\",\"prompt\":\"「待つ」의 た형을 고르세요.\",\"stimulus\":\"待つ\",\"options\":[\"待いた\",\"待った\",\"待つた\"],\"answer\":\"待った\",\"feedback\":\"待つ의 つ는 た형에서 った로 바뀝니다.\",\"skill\":\"과거형\",\"quick\":false},{\"id\":\"P12\",\"track\":\"verb\",\"prompt\":\"「起きる」의 ない형을 고르세요.\",\"stimulus\":\"起きる\",\"options\":[\"起きらない\",\"起きりない\",\"起きない\"],\"answer\":\"起きない\",\"feedback\":\"起きる는 1단 동사입니다. る를 떼고 ない를 붙입니다.\",\"skill\":\"부정형\",\"quick\":false},{\"id\":\"P13\",\"track\":\"context\",\"prompt\":\"이 문장에서 「ほとんど」의 뜻을 고르세요.\",\"stimulus\":\"宿題はほとんど終わりました。\",\"options\":[\"아직\",\"거의\",\"한꺼번에\"],\"answer\":\"거의\",\"feedback\":\"숙제가 ‘거의’ 끝났다는 뜻입니다.\",\"skill\":\"정도를 나타내는 말\",\"quick\":false},{\"id\":\"P14\",\"track\":\"context\",\"prompt\":\"이 문장에서 「間もなく」의 뜻을 고르세요.\",\"stimulus\":\"間もなく電車が来ます。\",\"options\":[\"곧\",\"이미\",\"일부러\"],\"answer\":\"곧\",\"feedback\":\"잠시 후에 전철이 온다는 뜻입니다.\",\"skill\":\"시간을 나타내는 말\",\"quick\":false},{\"id\":\"P15\",\"track\":\"context\",\"prompt\":\"이 문장에서 「見直しました」의 뜻을 고르세요.\",\"stimulus\":\"提出前に書類を見直しました。\",\"options\":[\"새로 발급했습니다\",\"제출을 미뤘습니다\",\"다시 살폈습니다\"],\"answer\":\"다시 살폈습니다\",\"feedback\":\"제출 전에 서류를 다시 읽고 확인했다는 뜻입니다.\",\"skill\":\"상황에서 의미 구별\",\"quick\":false}],\"followup\":{\"concepts\":{\"earth-warrior\":{\"diag\":\"D03\",\"title\":\"土와 士의 가로획\",\"rule\":\"土는 아래 가로획이 길고, 士는 위 가로획이 길어요.\",\"practice\":{\"prompt\":\"‘흙’에 맞는 한자를 고르세요.\",\"fragment\":\"畑の〔　〕が乾いています。\",\"reading\":\"はたけの つちが かわいています。\",\"translation\":\"밭의 흙이 말라 있어요.\",\"answer\":\"土\",\"why\":\"土는 흙을 뜻하며 아래 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"士\",\"why\":\"士는 武士처럼 사람의 신분이나 직함에 쓰여요.\"}]},\"retest\":{\"prompt\":\"‘무사’를 완성하세요.\",\"fragment\":\"武〔　〕は刀を持っていました。\",\"reading\":\"ぶしは かたなを もっていました。\",\"translation\":\"무사는 칼을 가지고 있었어요.\",\"answer\":\"士\",\"why\":\"武士는 무사예요. 士의 위 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"土\",\"why\":\"土는 흙이나 땅을 뜻하며 武士의 표기에 쓰이지 않아요.\"}]}},\"not-yet-end\":{\"diag\":\"D07\",\"title\":\"未와 末의 가로획\",\"rule\":\"未는 아랫줄이 길고 아직이라는 뜻이에요. 末은 윗줄이 길고 끝이라는 뜻이에요.\",\"practice\":{\"prompt\":\"‘미정’을 완성하세요.\",\"fragment\":\"予定は〔　〕定です。\",\"reading\":\"よていは みていです。\",\"translation\":\"일정은 아직 정해지지 않았어요.\",\"answer\":\"未\",\"why\":\"未定의 未는 ‘아직’을 뜻해요.\",\"distractors\":[{\"answer\":\"末\",\"why\":\"末은 마지막을 뜻하며 ‘아직 정해지지 않음’과 맞지 않아요.\"}]},\"retest\":{\"prompt\":\"‘월말’을 완성하세요.\",\"fragment\":\"月〔　〕に報告します。\",\"reading\":\"げつまつに ほうこくします。\",\"translation\":\"월말에 보고할게요.\",\"answer\":\"末\",\"why\":\"月末은 달의 끝이에요. 末의 위 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"未\",\"why\":\"未는 未定의 ‘아직’이라는 뜻이에요. 달의 끝을 뜻하는 글자는 末이에요.\"}]}},\"person-enter\":{\"diag\":\"D11\",\"title\":\"人과 入의 획 방향\",\"rule\":\"人은 왼쪽으로 내리는 획이 위에서 시작해요. 入은 오른쪽으로 내리는 획이 더 위에서 시작해요.\",\"practice\":{\"prompt\":\"‘세 사람’을 완성하세요.\",\"fragment\":\"この部屋に三〔　〕います。\",\"reading\":\"この へやに さんにん います。\",\"translation\":\"이 방에 세 사람이 있어요.\",\"answer\":\"人\",\"why\":\"三人은 사람 셋을 세는 말이에요.\",\"distractors\":[{\"answer\":\"入\",\"why\":\"入은 들어가다라는 뜻이에요. 사람 수에는 人을 써요.\"}]},\"retest\":{\"prompt\":\"‘들어왔어요’를 완성하세요.\",\"fragment\":\"先生が教室に〔　〕りました。\",\"reading\":\"せんせいが きょうしつに はいりました。\",\"translation\":\"선생님이 교실에 들어오셨어요.\",\"answer\":\"入\",\"why\":\"入りました는 入る의 과거형이에요.\",\"distractors\":[{\"answer\":\"人\",\"why\":\"人은 사람을 뜻하는 한자이고 入る의 동사 표기에 들어가지 않아요.\"}]}},\"day-eye\":{\"diag\":\"D15\",\"title\":\"日과 目의 안쪽 획\",\"rule\":\"日은 안쪽 가로획이 하나, 目는 둘이에요.\",\"practice\":{\"prompt\":\"기간 ‘3일’을 완성하세요.\",\"fragment\":\"三〔　〕間旅行しました。\",\"reading\":\"みっかかん りょこうしました。\",\"translation\":\"3일 동안 여행했어요.\",\"answer\":\"日\",\"why\":\"三日間의 日은 날짜 단위예요.\",\"distractors\":[{\"answer\":\"目\",\"why\":\"目는 二日目처럼 순서를 나타낼 때 붙어요.\"}]},\"retest\":{\"prompt\":\"순서 ‘둘째 날’을 완성하세요.\",\"fragment\":\"二日〔　〕に京都へ行きました。\",\"reading\":\"ふつかめに きょうとへ いきました。\",\"translation\":\"둘째 날에 교토에 갔어요.\",\"answer\":\"目\",\"why\":\"二日目는 이틀째라는 순서예요.\",\"distractors\":[{\"answer\":\"日\",\"why\":\"날짜 단위 日은 二日에 이미 들어 있어요. 순서를 붙이는 글자는 目예요.\"}]}},\"king-ball\":{\"diag\":\"D20\",\"title\":\"王과 玉의 점획\",\"rule\":\"王에는 오른쪽 아래 점이 없고, 玉에는 있어요.\",\"practice\":{\"prompt\":\"‘공’에 맞는 표기를 고르세요.\",\"fragment\":\"白い〔　〕が転がった。\",\"reading\":\"しろい たまが ころがった。\",\"translation\":\"하얀 공이 굴러갔어요.\",\"answer\":\"玉\",\"why\":\"玉는 たま라고 읽으며 둥근 공이나 구슬을 뜻해요.\",\"distractors\":[{\"answer\":\"王\",\"why\":\"王은 왕을 뜻해요. 굴러가는 물체의 표기에 맞지 않아요.\"}]},\"retest\":{\"prompt\":\"‘임금’을 나타내는 한자를 고르세요.\",\"fragment\":\"その国の〔　〕は若いです。\",\"reading\":\"その くにの おうは わかいです。\",\"translation\":\"그 나라의 왕은 젊어요.\",\"answer\":\"王\",\"why\":\"나라의 통치자는 王이라고 써요.\",\"distractors\":[{\"answer\":\"玉\",\"why\":\"점이 있는 玉는 공이나 구슬을 뜻해요.\"}]}},\"shell-see\":{\"diag\":\"D25\",\"title\":\"貝와 見의 끝 획\",\"rule\":\"貝의 아래 두 획은 八처럼 벌어져요. 見의 마지막 획은 오른쪽으로 굽어요.\",\"practice\":{\"prompt\":\"‘조개’를 뜻하는 글자를 고르세요.\",\"fragment\":\"海で小さな〔　〕を拾いました。\",\"reading\":\"うみで ちいさな かいを ひろいました。\",\"translation\":\"바다에서 작은 조개를 주웠어요.\",\"answer\":\"貝\",\"why\":\"貝는 かい, 조개를 뜻해요.\",\"distractors\":[{\"answer\":\"見\",\"why\":\"見은 보다와 관련돼요. 조개를 뜻하는 표기는 貝예요.\"}]},\"retest\":{\"prompt\":\"‘견학’을 완성하세요.\",\"fragment\":\"博物館を〔　〕学しました。\",\"reading\":\"はくぶつかんを けんがくしました。\",\"translation\":\"박물관을 견학했어요.\",\"answer\":\"見\",\"why\":\"見学은 실제로 보고 배운다는 뜻이에요.\",\"distractors\":[{\"answer\":\"貝\",\"why\":\"貝는 조개예요. 보는 행위와 관련된 글자는 見이에요.\"}]}},\"k-te\":{\"diag\":\"D04\",\"title\":\"5단 く 동사의 て형\",\"rule\":\"일반적인 5단 く 동사는 く를 いて로 바꿔요.\",\"practice\":{\"prompt\":\"「歩く」의 て형을 고르세요.\",\"fragment\":\"駅まで〔　〕行きます。\",\"reading\":\"えきまで あるいて いきます。\",\"translation\":\"역까지 걸어가요.\",\"answer\":\"歩いて\",\"why\":\"歩く의 く는 て형에서 いて가 돼요.\",\"distractors\":[{\"answer\":\"歩って\",\"why\":\"って는 う·つ·る 동사 또는 예외 行く에 쓰여요.\"},{\"answer\":\"歩んで\",\"why\":\"んで는 む·ぶ·ぬ 동사의 て형에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「書く」의 て형을 골라 문장을 완성하세요.\",\"fragment\":\"ここに名前を〔　〕ください。\",\"reading\":\"ここに なまえを かいて ください。\",\"translation\":\"여기에 이름을 써 주세요.\",\"answer\":\"書いて\",\"why\":\"書く는 書いて가 돼요. 書いてください는 ‘써 주세요’예요.\",\"distractors\":[{\"answer\":\"書って\",\"why\":\"書く는 行く처럼 って를 쓰는 예외가 아니에요.\"},{\"answer\":\"書んで\",\"why\":\"書く의 어말 く에는 んで가 붙지 않아요.\"}]}},\"m-past\":{\"diag\":\"D08\",\"title\":\"5단 む 동사의 た형\",\"rule\":\"5단 む 동사의 과거형은 む를 んだ로 바꿔요.\",\"practice\":{\"prompt\":\"「休む」의 보통체 과거형을 고르세요.\",\"fragment\":\"昨日は家で〔　〕。\",\"reading\":\"きのうは いえで やすんだ。\",\"translation\":\"어제는 집에서 쉬었어요.\",\"answer\":\"休んだ\",\"why\":\"休む는 む를 んだ로 바꿔 休んだ가 돼요.\",\"distractors\":[{\"answer\":\"休いた\",\"why\":\"いた는 書く → 書いた처럼 일반적인 く 동사에 쓰여요.\"},{\"answer\":\"休った\",\"why\":\"った는 待つ → 待った 같은 동사의 과거형에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「読む」의 보통체 과거형을 고르세요.\",\"fragment\":\"電車の中で本を〔　〕。\",\"reading\":\"でんしゃの なかで ほんを よんだ。\",\"translation\":\"전철 안에서 책을 읽었어요.\",\"answer\":\"読んだ\",\"why\":\"読む는 んだ가 붙는 む 동사예요.\",\"distractors\":[{\"answer\":\"読いた\",\"why\":\"読む의 어말은 く가 아니어서 いた를 쓰지 않아요.\"},{\"answer\":\"読った\",\"why\":\"読む의 む는 った로 바뀌지 않아요.\"}]}},\"iku-te\":{\"diag\":\"D12\",\"title\":\"行く의 예외 て형\",\"rule\":\"行く의 て형은 예외적으로 行って예요.\",\"practice\":{\"prompt\":\"「行く」의 て형을 고르세요.\",\"fragment\":\"先に駅へ〔　〕ください。\",\"reading\":\"さきに えきへ いって ください。\",\"translation\":\"먼저 역으로 가 주세요.\",\"answer\":\"行って\",\"why\":\"行く는 예외라서 行って가 돼요.\",\"distractors\":[{\"answer\":\"行いて\",\"why\":\"일반 く 동사 규칙을 적용한 형태예요. 行く는 예외예요.\"},{\"answer\":\"行んで\",\"why\":\"んで는 む·ぶ·ぬ 동사에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「行く」를 て형으로 바꿔 행동을 연결하세요.\",\"fragment\":\"スーパーへ〔　〕、牛乳を買った。\",\"reading\":\"スーパーへ いって、ぎゅうにゅうを かった。\",\"translation\":\"슈퍼에 가서 우유를 샀어요.\",\"answer\":\"行って\",\"why\":\"行って가 가는 행동을 뒤 행동과 이어 줘요.\",\"distractors\":[{\"answer\":\"行いて\",\"why\":\"예외 동사 行く에는 いて 대신 って가 들어가요.\"},{\"answer\":\"行った\",\"why\":\"行った는 과거를 나타내요. 이 문항은 연결하는 て형을 묻고 있어요.\"}]}},\"r-nai\":{\"diag\":\"D17\",\"title\":\"5단 る 동사의 ない형\",\"rule\":\"5단 る 동사는 る를 ら로 바꾸고 ない를 붙여요.\",\"practice\":{\"prompt\":\"「入る」의 ない형을 고르세요.\",\"fragment\":\"ここには〔　〕でください。\",\"reading\":\"ここには はいらないで ください。\",\"translation\":\"여기에는 들어가지 마세요.\",\"answer\":\"入らない\",\"why\":\"入る는 5단 동사라서 入らない가 돼요.\",\"distractors\":[{\"answer\":\"入ない\",\"why\":\"る를 그대로 떼면 안 돼요. 여기서는 ら로 바꿔요.\"},{\"answer\":\"入りない\",\"why\":\"入り는 入ります의 어간이에요. ない형 앞에는 入ら를 써요.\"}]},\"retest\":{\"prompt\":\"「帰る」를 ない형으로 바꿔 ‘일찍 귀가해야 한다’를 완성하세요.\",\"fragment\":\ ",\"skill\":\"한자어 읽기\",\"quick\":false},{\"id\":\"D14\",\"track\":\"write\",\"prompt\":\"‘흰 백’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"白\",\"feedback\":\"白은 위에 짧은 삐침이 있는 5획 글자입니다.\",\"skill\":\"모양 회상\",\"quick\":false},{\"id\":\"D15\",\"track\":\"similar\",\"prompt\":\"‘목표’를 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕標（もくひょう）\",\"options\":[\"日\",\"貝\",\"目\"],\"answer\":\"目\",\"feedback\":\"目標의 目는 테두리 안 가로획이 둘입니다.\",\"skill\":\"안쪽 획 비교\",\"quick\":false},{\"id\":\"D16\",\"track\":\"context\",\"prompt\":\"이 문장에서 「そんなに」의 뜻을 고르세요.\",\"stimulus\":\"そんなに心配しなくても大丈夫です。\",\"options\":[\"반드시\",\"그 정도로\",\"벌써\"],\"answer\":\"그 정도로\",\"feedback\":\"そんなに는 걱정의 정도를 나타냅니다. ‘그렇게까지 걱정하지 않아도 괜찮습니다’로 옮길 수 있습니다.\",\"skill\":\"정도를 나타내는 말\",\"quick\":false},{\"id\":\"D17\",\"track\":\"verb\",\"prompt\":\"「帰る」의 ない형을 고르세요.\",\"stimulus\":\"帰る\",\"options\":[\"帰らない\",\"帰ない\",\"帰りない\"],\"answer\":\"帰らない\",\"feedback\":\"帰る는 5단 동사입니다. る를 ら로 바꾸고 ない를 붙입니다.\",\"skill\":\"부정형\",\"quick\":false},{\"id\":\"D18\",\"track\":\"read\",\"prompt\":\"「夕方」의 읽기를 고르세요.\",\"stimulus\":\"夕方に連絡します。\",\"options\":[\"ゆうかた\",\"ゆがた\",\"ゆうがた\"],\"answer\":\"ゆうがた\",\"feedback\":\"夕方（ゆうがた）는 ‘저녁 무렵’입니다. 方는 이 단어에서 がた로 읽습니다.\",\"skill\":\"훈독 결합\",\"quick\":false},{\"id\":\"D19\",\"track\":\"write\",\"prompt\":\"‘털 모’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"毛\",\"feedback\":\"毛의 마지막 획은 아래쪽에서 오른쪽으로 굽습니다.\",\"skill\":\"마지막 획\",\"quick\":false},{\"id\":\"D20\",\"track\":\"similar\",\"prompt\":\"‘임금님’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕様（おうさま）\",\"options\":[\"玉\",\"王\",\"主\"],\"answer\":\"王\",\"feedback\":\"王様에는 오른쪽 아래에 점이 없는 王이 들어갑니다.\",\"skill\":\"점획 비교\",\"quick\":false},{\"id\":\"D21\",\"track\":\"context\",\"prompt\":\"이 문장에서 「まだ」의 뜻을 고르세요.\",\"stimulus\":\"まだ雨が降っています。\",\"options\":[\"이미\",\"곧\",\"아직\"],\"answer\":\"아직\",\"feedback\":\"내리고 있는 비가 지금도 이어집니다. 여기서 まだ는 ‘아직’입니다.\",\"skill\":\"상태의 지속\",\"quick\":false},{\"id\":\"D22\",\"track\":\"verb\",\"prompt\":\"「話す」의 ます형을 고르세요.\",\"stimulus\":\"話す\",\"options\":[\"話せます\",\"話します\",\"話すます\"],\"answer\":\"話します\",\"feedback\":\"話す의 す를 し로 바꾸고 ます를 붙입니다. 話せます는 ‘말할 수 있습니다’입니다.\",\"skill\":\"정중형\",\"quick\":false},{\"id\":\"D23\",\"track\":\"read\",\"prompt\":\"「操作」의 읽기를 고르세요.\",\"stimulus\":\"この機械の操作は簡単です。\",\"options\":[\"そうさ\",\"そうしゃ\",\"しょうさ\"],\"answer\":\"そうさ\",\"feedback\":\"操作（そうさ）는 기기 등을 ‘조작함’을 뜻합니다.\",\"skill\":\"음독 결합\",\"quick\":false},{\"id\":\"D24\",\"track\":\"write\",\"prompt\":\"‘소 우’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"牛\",\"feedback\":\"牛의 가운데 세로획은 위 가로획 위로 올라갑니다.\",\"skill\":\"세로획 위치\",\"quick\":false},{\"id\":\"D25\",\"track\":\"similar\",\"prompt\":\"‘조개껍데기’를 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕殻（かいがら）\",\"options\":[\"貝\",\"見\",\"目\"],\"answer\":\"貝\",\"feedback\":\"貝殻의 貝는 아래쪽 두 짧은 획이 양옆으로 벌어집니다.\",\"skill\":\"아래쪽 획 비교\",\"quick\":false},{\"id\":\"D26\",\"track\":\"context\",\"prompt\":\"이 문장에서 「間に合います」의 뜻을 고르세요.\",\"stimulus\":\"急げば電車に間に合います。\",\"options\":[\"전철이 연착됩니다\",\"약속 시간이 바뀝니다\",\"전철 시간에 늦지 않습니다\"],\"answer\":\"전철 시간에 늦지 않습니다\",\"feedback\":\"전철이 떠나기 전에 도착할 수 있다는 뜻입니다.\",\"skill\":\"상황에서 의미 구별\",\"quick\":false},{\"id\":\"D27\",\"track\":\"verb\",\"prompt\":\"「食べる」의 た형을 고르세요.\",\"stimulus\":\"食べる\",\"options\":[\"食べて\",\"食べった\",\"食べた\"],\"answer\":\"食べた\",\"feedback\":\"食べる는 1단 동사입니다. る를 떼고 た를 붙입니다.\",\"skill\":\"과거형\",\"quick\":false},{\"id\":\"D28\",\"track\":\"context\",\"prompt\":\"이 문장에서 「つい」의 뜻을 고르세요.\",\"stimulus\":\"おいしそうで、つい食べ過ぎました。\",\"options\":[\"일부러\",\"나도 모르게\",\"정확히\"],\"answer\":\"나도 모르게\",\"feedback\":\"맛있어 보여서 그만 많이 먹었다는 뜻입니다.\",\"skill\":\"의도와 행동\",\"quick\":false},{\"id\":\"D29\",\"track\":\"context\",\"prompt\":\"이 문장에서 「届く」의 뜻을 고르세요.\",\"stimulus\":\"明日、荷物が届く予定です。\",\"options\":[\"보내다\",\"포장하다\",\"도착하다\"],\"answer\":\"도착하다\",\"feedback\":\"荷物が届く는 짐이나 택배가 도착한다는 뜻입니다.\",\"skill\":\"자동사 의미\",\"quick\":false},{\"id\":\"D30\",\"track\":\"context\",\"prompt\":\"이 문장에서 「たいてい」의 뜻을 고르세요.\",\"stimulus\":\"平日はたいてい家で夕食を食べます。\",\"options\":[\"대개\",\"가끔\",\"꼭\"],\"answer\":\"대개\",\"feedback\":\"평일에는 ‘대체로’ 집에서 저녁을 먹는다는 말입니다.\",\"skill\":\"빈도를 나타내는 말\",\"quick\":false}],\"tracks\":{\"read\":{\"name\":\"한자 읽기\",\"priority\":2,\"plan\":\"급수에 맞는 읽기부터 하루 6분\",\"query\":\"deck:\\\"일본어::01_학습::한자혁명\\\" card:\\\"한자 읽기\\\"\"},\"write\":{\"name\":\"한자 쓰기\",\"priority\":1,\"plan\":\"뜻을 보고 손으로 쓰기 하루 6분\",\"query\":\"deck:\\\"일본어::01_학습::한자혁명\\\" card:\\\"한자 쓰기\\\"\"},\"similar\":{\"name\":\"유사 한자\",\"priority\":0,\"plan\":\"두 글자의 다른 획을 짚으며 하루 6분\",\"query\":\"deck:\\\"일본어::02_실전문제::한자혁명::유사 한자\\\"\"},\"verb\":{\"name\":\"동사 활용\",\"priority\":3,\"plan\":\"기본형을 지정된 활용형으로 바꾸기 하루 6분\",\"query\":\"deck:\\\"일본어::02_실전문제::한자혁명::동사 활용\\\"\"},\"context\":{\"name\":\"어휘·문맥\",\"priority\":4,\"plan\":\"예문에서 단어 뜻을 골라보는 연습을 하루 6분\",\"query\":\"deck:\\\"일본어::02_실전문제::한자혁명::어휘·문맥\\\"\"}},\"audio\":{},\"correction\":{\"id\":\"KR-N-X-CTX-1006\",\"text\":\"v1.8.0-RC1 · ‘그렇다’ → ‘그렇게까지 / 그 정도로’. ‘그렇게 많이’도 문맥상 가능합니다.\",\"url\":\"https://dictionary.cambridge.org/ja/dictionary/japanese-english/%E3%81%9D%E3%82%93%E3%81%AA%E3%81%AB\"},\"practice\":[{\"id\":\"P01\",\"track\":\"read\",\"prompt\":\"「手紙」의 읽기를 고르세요.\",\"stimulus\":\"友達に手紙を書きました。\",\"options\":[\"てかみ\",\"てがみ\",\"しゅがみ\"],\"answer\":\"てがみ\",\"feedback\":\"手紙（てがみ）는 ‘편지’입니다.\",\"skill\":\"훈독 결합\",\"quick\":false},{\"id\":\"P02\",\"track\":\"read\",\"prompt\":\"「申請」의 읽기를 고르세요.\",\"stimulus\":\"オンラインで申請できます。\",\"options\":[\"しんせい\",\"しんしょう\",\"しんぜい\"],\"answer\":\"しんせい\",\"feedback\":\"申請（しんせい）는 ‘신청’입니다.\",\"skill\":\"한자어 읽기\",\"quick\":false},{\"id\":\"P03\",\"track\":\"read\",\"prompt\":\"「日曜日」의 읽기를 고르세요.\",\"stimulus\":\"日曜日は家で休みます。\",\"options\":[\"ひようび\",\"にようび\",\"にちようび\"],\"answer\":\"にちようび\",\"feedback\":\"日曜日（にちようび）는 ‘일요일’입니다.\",\"skill\":\"음독 결합\",\"quick\":false},{\"id\":\"P04\",\"track\":\"write\",\"prompt\":\"‘오른 우’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"右\",\"feedback\":\"右에는 아래쪽에 口가 있습니다.\",\"skill\":\"아래쪽 형태\",\"quick\":false},{\"id\":\"P05\",\"track\":\"write\",\"prompt\":\"‘일천 천’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"千\",\"feedback\":\"千의 첫 획은 왼쪽으로 내려오는 짧은 삐침입니다.\",\"skill\":\"첫 획\",\"quick\":false},{\"id\":\"P06\",\"track\":\"write\",\"prompt\":\"‘임금 왕’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"王\",\"feedback\":\"王은 가로획 셋과 세로획 하나로 이루어집니다.\",\"skill\":\"획수와 모양\",\"quick\":false},{\"id\":\"P07\",\"track\":\"similar\",\"prompt\":\"‘태양’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕陽（たいよう）\",\"options\":[\"犬\",\"大\",\"太\"],\"answer\":\"太\",\"feedback\":\"太는 점획이 아래쪽에 있습니다.\",\"skill\":\"점획 비교\",\"quick\":false},{\"id\":\"P08\",\"track\":\"similar\",\"prompt\":\"‘본점’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕店（ほんてん）\",\"options\":[\"本\",\"木\",\"末\"],\"answer\":\"本\",\"feedback\":\"本에는 木 아래에 짧은 가로획이 하나 더 있습니다.\",\"skill\":\"아래쪽 획 비교\",\"quick\":false},{\"id\":\"P09\",\"track\":\"similar\",\"prompt\":\"‘견학’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕学（けんがく）\",\"options\":[\"貝\",\"見\",\"目\"],\"answer\":\"見\",\"feedback\":\"見의 오른쪽 아래 획은 굽어서 위로 올라갑니다.\",\"skill\":\"마지막 획 비교\",\"quick\":false},{\"id\":\"P10\",\"track\":\"verb\",\"prompt\":\"「泳ぐ」의 て형을 고르세요.\",\"stimulus\":\"泳ぐ\",\"options\":[\"泳いで\",\"泳いて\",\"泳んで\"],\"answer\":\"泳いで\",\"feedback\":\"泳ぐ의 ぐ는 て형에서 いで로 바뀝니다.\",\"skill\":\"연결형\",\"quick\":false},{\"id\":\"P11\",\"track\":\"verb\",\"prompt\":\"「待つ」의 た형을 고르세요.\",\"stimulus\":\"待つ\",\"options\":[\"待いた\",\"待った\",\"待つた\"],\"answer\":\"待った\",\"feedback\":\"待つ의 つ는 た형에서 った로 바뀝니다.\",\"skill\":\"과거형\",\"quick\":false},{\"id\":\"P12\",\"track\":\"verb\",\"prompt\":\"「起きる」의 ない형을 고르세요.\",\"stimulus\":\"起きる\",\"options\":[\"起きらない\",\"起きりない\",\"起きない\"],\"answer\":\"起きない\",\"feedback\":\"起きる는 1단 동사입니다. る를 떼고 ない를 붙입니다.\",\"skill\":\"부정형\",\"quick\":false},{\"id\":\"P13\",\"track\":\"context\",\"prompt\":\"이 문장에서 「ほとんど」의 뜻을 고르세요.\",\"stimulus\":\"宿題はほとんど終わりました。\",\"options\":[\"아직\",\"거의\",\"한꺼번에\"],\"answer\":\"거의\",\"feedback\":\"숙제가 ‘거의’ 끝났다는 뜻입니다.\",\"skill\":\"정도를 나타내는 말\",\"quick\":false},{\"id\":\"P14\",\"track\":\"context\",\"prompt\":\"이 문장에서 「間もなく」의 뜻을 고르세요.\",\"stimulus\":\"間もなく電車が来ます。\",\"options\":[\"곧\",\"이미\",\"일부러\"],\"answer\":\"곧\",\"feedback\":\"잠시 후에 전철이 온다는 뜻입니다.\",\"skill\":\"시간을 나타내는 말\",\"quick\":false},{\"id\":\"P15\",\"track\":\"context\",\"prompt\":\"이 문장에서 「見直しました」의 뜻을 고르세요.\",\"stimulus\":\"提出前に書類を見直しました。\",\"options\":[\"새로 발급했습니다\",\"제출을 미뤘습니다\",\"다시 살폈습니다\"],\"answer\":\"다시 살폈습니다\",\"feedback\":\"제출 전에 서류를 다시 읽고 확인했다는 뜻입니다.\",\"skill\":\"상황에서 의미 구별\",\"quick\":false}],\"followup\":{\"concepts\":{\"earth-warrior\":{\"diag\":\"D03\",\"title\":\"土와 士의 가로획\",\"rule\":\"土는 아래 가로획이 길고, 士는 위 가로획이 길어요.\",\"practice\":{\"prompt\":\"‘흙’에 맞는 한자를 고르세요.\",\"fragment\":\"畑の〔　〕が乾いています。\",\"reading\":\"はたけの つちが かわいています。\",\"translation\":\"밭의 흙이 말라 있어요.\",\"answer\":\"土\",\"why\":\"土는 흙을 뜻하며 아래 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"士\",\"why\":\"士는 武士처럼 사람의 신분이나 직함에 쓰여요.\"}]},\"retest\":{\"prompt\":\"‘무사’를 완성하세요.\",\"fragment\":\"武〔　〕は刀を持っていました。\",\"reading\":\"ぶしは かたなを もっていました。\",\"translation\":\"무사는 칼을 가지고 있었어요.\",\"answer\":\"士\",\"why\":\"武士는 무사예요. 士의 위 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"土\",\"why\":\"土는 흙이나 땅을 뜻하며 武士의 표기에 쓰이지 않아요.\"}]}},\"not-yet-end\":{\"diag\":\"D07\",\"title\":\"未와 末의 가로획\",\"rule\":\"未는 아랫줄이 길고 아직이라는 뜻이에요. 末은 윗줄이 길고 끝이라는 뜻이에요.\",\"practice\":{\"prompt\":\"‘미정’을 완성하세요.\",\"fragment\":\"予定は〔　〕定です。\",\"reading\":\"よていは みていです。\",\"translation\":\"일정은 아직 정해지지 않았어요.\",\"answer\":\"未\",\"why\":\"未定의 未는 ‘아직’을 뜻해요.\",\"distractors\":[{\"answer\":\"末\",\"why\":\"末은 마지막을 뜻하며 ‘아직 정해지지 않음’과 맞지 않아요.\"}]},\"retest\":{\"prompt\":\"‘월말’을 완성하세요.\",\"fragment\":\"月〔　〕に報告します。\",\"reading\":\"げつまつに ほうこくします。\",\"translation\":\"월말에 보고할게요.\",\"answer\":\"末\",\"why\":\"月末은 달의 끝이에요. 末의 위 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"未\",\"why\":\"未는 未定의 ‘아직’이라는 뜻이에요. 달의 끝을 뜻하는 글자는 末이에요.\"}]}},\"person-enter\":{\"diag\":\"D11\",\"title\":\"人과 入의 획 방향\",\"rule\":\"人은 왼쪽으로 내리는 획이 위에서 시작해요. 入은 오른쪽으로 내리는 획이 더 위에서 시작해요.\",\"practice\":{\"prompt\":\"‘세 사람’을 완성하세요.\",\"fragment\":\"この部屋に三〔　〕います。\",\"reading\":\"この へやに さんにん います。\",\"translation\":\"이 방에 세 사람이 있어요.\",\"answer\":\"人\",\"why\":\"三人은 사람 셋을 세는 말이에요.\",\"distractors\":[{\"answer\":\"入\",\"why\":\"入은 들어가다라는 뜻이에요. 사람 수에는 人을 써요.\"}]},\"retest\":{\"prompt\":\"‘들어왔어요’를 완성하세요.\",\"fragment\":\"先生が教室に〔　〕りました。\",\"reading\":\"せんせいが きょうしつに はいりました。\",\"translation\":\"선생님이 교실에 들어오셨어요.\",\"answer\":\"入\",\"why\":\"入りました는 入る의 과거형이에요.\",\"distractors\":[{\"answer\":\"人\",\"why\":\"人은 사람을 뜻하는 한자이고 入る의 동사 표기에 들어가지 않아요.\"}]}},\"day-eye\":{\"diag\":\"D15\",\"title\":\"日과 目의 안쪽 획\",\"rule\":\"日은 안쪽 가로획이 하나, 目는 둘이에요.\",\"practice\":{\"prompt\":\"기간 ‘3일’을 완성하세요.\",\"fragment\":\"三〔　〕間旅行しました。\",\"reading\":\"みっかかん りょこうしました。\",\"translation\":\"3일 동안 여행했어요.\",\"answer\":\"日\",\"why\":\"三日間의 日은 날짜 단위예요.\",\"distractors\":[{\"answer\":\"目\",\"why\":\"目는 二日目처럼 순서를 나타낼 때 붙어요.\"}]},\"retest\":{\"prompt\":\"순서 ‘둘째 날’을 완성하세요.\",\"fragment\":\"二日〔　〕に京都へ行きました。\",\"reading\":\"ふつかめに きょうとへ いきました。\",\"translation\":\"둘째 날에 교토에 갔어요.\",\"answer\":\"目\",\"why\":\"二日目는 이틀째라는 순서예요.\",\"distractors\":[{\"answer\":\"日\",\"why\":\"날짜 단위 日은 二日에 이미 들어 있어요. 순서를 붙이는 글자는 目예요.\"}]}},\"king-ball\":{\"diag\":\"D20\",\"title\":\"王과 玉의 점획\",\"rule\":\"王에는 오른쪽 아래 점이 없고, 玉에는 있어요.\",\"practice\":{\"prompt\":\"‘공’에 맞는 표기를 고르세요.\",\"fragment\":\"白い〔　〕が転がった。\",\"reading\":\"しろい たまが ころがった。\",\"translation\":\"하얀 공이 굴러갔어요.\",\"answer\":\"玉\",\"why\":\"玉는 たま라고 읽으며 둥근 공이나 구슬을 뜻해요.\",\"distractors\":[{\"answer\":\"王\",\"why\":\"王은 왕을 뜻해요. 굴러가는 물체의 표기에 맞지 않아요.\"}]},\"retest\":{\"prompt\":\"‘임금’을 나타내는 한자를 고르세요.\",\"fragment\":\"その国の〔　〕は若いです。\",\"reading\":\"その くにの おうは わかいです。\",\"translation\":\"그 나라의 왕은 젊어요.\",\"answer\":\"王\",\"why\":\"나라의 통치자는 王이라고 써요.\",\"distractors\":[{\"answer\":\"玉\",\"why\":\"점이 있는 玉는 공이나 구슬을 뜻해요.\"}]}},\"shell-see\":{\"diag\":\"D25\",\"title\":\"貝와 見의 끝 획\",\"rule\":\"貝의 아래 두 획은 八처럼 벌어져요. 見의 마지막 획은 오른쪽으로 굽어요.\",\"practice\":{\"prompt\":\"‘조개’를 뜻하는 글자를 고르세요.\",\"fragment\":\"海で小さな〔　〕を拾いました。\",\"reading\":\"うみで ちいさな かいを ひろいました。\",\"translation\":\"바다에서 작은 조개를 주웠어요.\",\"answer\":\"貝\",\"why\":\"貝는 かい, 조개를 뜻해요.\",\"distractors\":[{\"answer\":\"見\",\"why\":\"見은 보다와 관련돼요. 조개를 뜻하는 표기는 貝예요.\"}]},\"retest\":{\"prompt\":\"‘견학’을 완성하세요.\",\"fragment\":\"博物館を〔　〕学しました。\",\"reading\":\"はくぶつかんを けんがくしました。\",\"translation\":\"박물관을 견학했어요.\",\"answer\":\"見\",\"why\":\"見学은 실제로 보고 배운다는 뜻이에요.\",\"distractors\":[{\"answer\":\"貝\",\"why\":\"貝는 조개예요. 보는 행위와 관련된 글자는 見이에요.\"}]}},\"k-te\":{\"diag\":\"D04\",\"title\":\"5단 く 동사의 て형\",\"rule\":\"일반적인 5단 く 동사는 く를 いて로 바꿔요.\",\"practice\":{\"prompt\":\"「歩く」의 て형을 고르세요.\",\"fragment\":\"駅まで〔　〕行きます。\",\"reading\":\"えきまで あるいて いきます。\",\"translation\":\"역까지 걸어가요.\",\"answer\":\"歩いて\",\"why\":\"歩く의 く는 て형에서 いて가 돼요.\",\"distractors\":[{\"answer\":\"歩って\",\"why\":\"って는 う·つ·る 동사 또는 예외 行く에 쓰여요.\"},{\"answer\":\"歩んで\",\"why\":\"んで는 む·ぶ·ぬ 동사의 て형에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「書く」의 て형을 골라 문장을 완성하세요.\",\"fragment\":\"ここに名前を〔　〕ください。\",\"reading\":\"ここに なまえを かいて ください。\",\"translation\":\"여기에 이름을 써 주세요.\",\"answer\":\"書いて\",\"why\":\"書く는 書いて가 돼요. 書いてください는 ‘써 주세요’예요.\",\"distractors\":[{\"answer\":\"書って\",\"why\":\"書く는 行く처럼 って를 쓰는 예외가 아니에요.\"},{\"answer\":\"書んで\",\"why\":\"書く의 어말 く에는 んで가 붙지 않아요.\"}]}},\"m-past\":{\"diag\":\"D08\",\"title\":\"5단 む 동사의 た형\",\"rule\":\"5단 む 동사의 과거형은 む를 んだ로 바꿔요.\",\"practice\":{\"prompt\":\"「休む」의 보통체 과거형을 고르세요.\",\"fragment\":\"昨日は家で〔　〕。\",\"reading\":\"きのうは いえで やすんだ。\",\"translation\":\"어제는 집에서 쉬었어요.\",\"answer\":\"休んだ\",\"why\":\"休む는 む를 んだ로 바꿔 休んだ가 돼요.\",\"distractors\":[{\"answer\":\"休いた\",\"why\":\"いた는 書く → 書いた처럼 일반적인 く 동사에 쓰여요.\"},{\"answer\":\"休った\",\"why\":\"った는 待つ → 待った 같은 동사의 과거형에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「読む」의 보통체 과거형을 고르세요.\",\"fragment\":\"電車の中で本を〔　〕。\",\"reading\":\"でんしゃの なかで ほんを よんだ。\",\"translation\":\"전철 안에서 책을 읽었어요.\",\"answer\":\"読んだ\",\"why\":\"読む는 んだ가 붙는 む 동사예요.\",\"distractors\":[{\"answer\":\"読いた\",\"why\":\"読む의 어말은 く가 아니어서 いた를 쓰지 않아요.\"}, title\":\"まだ와 남아 있는 상태\",\"rule\":\"まだ는 아직 어떤 상태가 이어지거나 일이 완료되지 않았다는 뜻이에요.\",\"practice\":{\"prompt\":\"문장에서 「まだ」의 뜻을 고르세요.\",\"fragment\":\"仕事はまだ終わっていません。\",\"reading\":\"しごとは まだ おわっていません。\",\"translation\":\"일은 아직 끝나지 않았어요.\",\"answer\":\"아직\",\"why\":\"완료되지 않은 상태예요.\",\"distractors\":[{\"answer\":\"이미\",\"why\":\"이미는 완료 또는 선행을 뜻해서 이 まだ와 맞지 않아요.\"},{\"answer\":\"곧\",\"why\":\"곧은 미래 가까운 시점을 뜻해요.\"}]},\"retest\":{\"prompt\":\"문장에서 「まだ」의 뜻을 고르세요.\",\"fragment\":\"会議までまだ時間があります。\",\"reading\":\"かいぎまで まだ じかんが あります。\",\"translation\":\"회의까지 아직 시간이 있어요.\",\"answer\":\"아직\",\"why\":\"아직 시간이 남아 있다는 뜻이에요.\",\"distractors\":[{\"answer\":\"벌써\",\"why\":\"벌써는 예상보다 빠른 시점을 말해요.\"},{\"answer\":\"가끔\",\"why\":\"빈도를 나타내는 말이에요.\"}]}},\"maniau\":{\"diag\":\"D26\",\"title\":\"間に合う와 시간 맞추기\",\"rule\":\"間に合う는 정해진 시각이나 마감에 늦지 않는다는 뜻이에요.\",\"practice\":{\"prompt\":\"문장에서 「間に合います」의 뜻을 고르세요.\",\"fragment\":\"今から出れば、会議に間に合います。\",\"reading\":\"いまから でれば、かいぎに まにあいます。\",\"translation\":\"지금 출발하면 회의 시간에 맞아요.\",\"answer\":\"시간에 맞습니다\",\"why\":\"출발 시각과 회의 시각을 맞출 수 있다는 뜻이에요.\",\"distractors\":[{\"answer\":\"회의가 연기됩니다\",\"why\":\"회의 시간을 미룬다는 말이 없어요.\"},{\"answer\":\"회의를 끝냅니다\",\"why\":\"회의 종료가 아니라 시작 시각에 맞추는 장면이에요.\"}]},\"retest\":{\"prompt\":\"문장에서 「間に合う」의 뜻을 고르세요.\",\"fragment\":\"急げば、締め切りに間に合う。\",\"reading\":\"いそげば、しめきりに まにあう。\",\"translation\":\"서두르면 마감에 맞출 수 있어요.\",\"answer\":\"마감에 맞춥니다\",\"why\":\"締め切りに間に合う는 마감에 늦지 않는다는 뜻이에요.\",\"distractors\":[{\"answer\":\"마감을 바꿉니다\",\"why\":\"마감일을 변경하는 행동이 아니에요.\"},{\"answer\":\"마감을 놓칩니다\",\"why\":\"서두르면 맞출 수 있다는 조건문이에요.\"}]}},\"tsui\":{\"diag\":\"D28\",\"title\":\"つい와 무심코 한 행동\",\"rule\":\"つい는 의도치 않게 그만 어떤 행동을 했다는 뜻이에요.\",\"practice\":{\"prompt\":\"문장에서 「つい」의 뜻을 고르세요.\",\"fragment\":\"面白くて、つい笑ってしまった。\",\"reading\":\"おもしろくて、つい わらってしまった。\",\"translation\":\"재미있어서 나도 모르게 웃어 버렸어요.\",\"answer\":\"나도 모르게\",\"why\":\"웃으려던 의도보다 자연스럽게 튀어나온 행동이에요.\",\"distractors\":[{\"answer\":\"일부러\",\"why\":\"의도를 갖고 한 행동이라는 뜻은 아니에요.\"},{\"answer\":\"반드시\",\"why\":\"의무나 필연을 나타내지 않아 .\",\"answer\":\"出します\",\"why\":\"出す의 す를 し로 바꾸면 出します가 돼요.\",\"distractors\":[{\"answer\":\"出せます\",\"why\":\"가능형이라 ‘제출할 수 있습니다’라는 뜻이에요.\"},{\"answer\":\"出すます\",\"why\":\"사전형 그대로 ます를 붙이지 않아요.\"}]},\"retest\":{\"prompt\":\"「話す」의 ます형을 골라 ‘말합니다’를 완성하세요.\",\"fragment\":\"日本語で〔　〕。\",\"reading\":\"にほんごで はなします。\",\"translation\":\"일본어로 말합니다.\",\"answer\":\"話します\",\"why\":\"話す의 す → し로 바꿔 話します라고 해요.\",\"distractors\":[{\"answer\":\"話せます\",\"why\":\"가능형이라 ‘말할 수 있습니다’라는 뜻이에요.\"},{\"answer\":\"話すます\",\"why\":\"ます 앞에서는 す를 し로 바꿔요.\"}]}},\"one-past\":{\"diag\":\"D27\",\"title\":\"1단 동사의 た형\",\"rule\":\"1단 동사는 마지막 る를 떼고 た를 붙여요.\",\"practice\":{\"prompt\":\"「見る」의 보통체 과거형을 고르세요.\",\"fragment\":\"昨日、その映画を〔　〕。\",\"reading\":\"きのう、その えいがを みた。\",\"translation\":\"어제 그 영화를 봤어요.\",\"answer\":\"見た\",\"why\":\"見る는 1단 동사여서 見た가 돼요.\",\"distractors\":[{\"answer\":\"見った\",\"why\":\"5단 る 동사처럼 촉음 っ을 넣은 형태예요.\"},{\"answer\":\"見て\",\"why\":\"見て는 연결이나 부탁에 사용하는 て형이에요.\"}]},\"retest\":{\"prompt\":\"「食べる」의 보통체 과거형을 고르세요.\",\"fragment\":\"昼にパンを〔　〕。\",\"reading\":\"ひるに パンを たべた。\",\"translation\":\"점심에 빵을 먹었어요.\",\"answer\":\"食べた\",\"why\":\"食べる는 る를 떼고 た를 붙여요.\",\"distractors\":[{\"answer\":\"食べった\",\"why\":\"1단 동사에는 っ이 들어가지 않아요.\"},{\"answer\":\"食べて\",\"why\":\"食べて는 て형이고 이 문항은 과거형을 묻고 있어요.\"}]}},\"sonnani\":{\"diag\":\"D16\",\"title\":\"そんなに와 정도\",\"rule\":\"そんなに는 ‘그렇게까지, 그 정도로’라는 정도를 나타내요.\",\"practice\":{\"prompt\":\"문장에서 「そんなに」의 뜻을 고르세요.\",\"fragment\":\"そんなに急がなくても大丈夫です。\",\"reading\":\"そんなに いそがなくても だいじょうぶです。\",\"translation\":\"그렇게까지 서두르지 않아도 괜찮아요.\",\"answer\":\"그렇게까지\",\"why\":\"여기서는 서두르는 정도를 낮추는 말이에요.\",\"distractors\":[{\"answer\":\"반드시\",\"why\":\"의무를 나타내는 말이 아니에요.\"},{\"answer\":\"벌써\",\"why\":\"시간보다 동작의 정도를 나타내요.\"}]},\"retest\":{\"prompt\":\"문장에서 「そんなに」의 뜻을 고르세요.\",\"fragment\":\"そんなに高いとは思わなかった。\",\"reading\":\"そんなに たかいとは おもわなかった。\",\"translation\":\"그렇게 비쌀 줄은 몰랐어요.\",\"answer\":\"그렇게\",\"why\":\"비싸다고 느끼는 정도를 나타내요.\",\"distractors\":[{\"answer\":\"항상\",\"why\":\"빈도를 나타내는 말이 아니에요.\"},{\"answer\": \"skill\":\"상황에서 의미 구별\",\"quick\":false}],\"followup\":{\"concepts\":{\"earth-warrior\":{\"diag\":\"D03\",\"title\":\"土와 士의 가로획\",\"rule\":\"土는 아래 가로획이 길고, 士는 위 가로획이 길어요.\",\"practice\":{\"prompt\":\"‘흙’에 맞는 한자를 고르세요.\",\"fragment\":\"畑の〔　〕が乾いています。\",\"reading\":\"はたけの つちが かわいています。\",\"translation\":\"밭의 흙이 말라 있어요.\",\"answer\":\"土\",\"why\":\"土는 흙을 뜻하며 아래 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"士\",\"why\":\"士는 武士처럼 사람의 신분이나 직함에 쓰여요.\"}]},\"retest\":{\"prompt\":\"‘무사’를 완성하세요.\",\"fragment\":\"武〔　〕は刀を持っていました。\",\"reading\":\"ぶしは かたなを もっていました。\",\"translation\":\"무사는 칼을 가지고 있었어요.\",\"answer\":\"士\",\"why\":\"武士는 무사예요. 士의 위 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"土\",\"why\":\"土는 흙이나 땅을 뜻하며 武士의 표기에 쓰이지 않아요.\"}]}},\"not-yet-end\":{\"diag\":\"D07\",\"title\":\"未와 末의 가로획\",\"rule\":\"未는 아랫줄이 길고 아직이라는 뜻이에요. 末은 윗줄이 길고 끝이라는 뜻이에요.\",\"practice\":{\"prompt\":\"‘미정’을 완성하세요.\",\"fragment\":\"予定は〔　〕定です。\",\"reading\":\"よていは みていです。\",\"translation\":\"일정은 아직 정해지지 않았어요.\",\"answer\":\"未\",\"why\":\"未定의 未는 ‘아직’을 뜻해요.\",\"distractors\":[{\"answer\":\"末\",\"why\":\"末은 마지막을 뜻하며 ‘아직 정해지지 않음’과 맞지 않아요.\"}]},\"retest\":{\"prompt\":\"‘월말’을 완성하세요.\",\"fragment\":\"月〔　〕に報告します。\",\"reading\":\"げつまつに ほうこくします。\",\"translation\":\"월말에 보고할게요.\",\"answer\":\"末\",\"why\":\"月末은 달의 끝이에요. 末의 위 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"未\",\"why\":\"未는 未定의 ‘아직’이라는 뜻이에요. 달의 끝을 뜻하는 글자는 末이에요.\"}]}},\"person-enter\":{\"diag\":\"D11\",\"title\":\"人과 入의 획 방향\",\"rule\":\"人은 왼쪽으로 내리는 획이 위에서 시작해요. 入은 오른쪽으로 내리는 획이 더 위에서 시작해요.\",\"practice\":{\"prompt\":\"‘세 사람’을 완성하세요.\",\"fragment\":\"この部屋に三〔　〕います。\",\"reading\":\"この へやに さんにん います。\",\"translation\":\"이 방에 세 사람이 있어요.\",\"answer\":\"人\",\"why\":\"三人은 사람 셋을 세는 말이에요.\",\"distractors\":[{\"answer\":\"入\",\"why\":\"入은 들어가다라는 뜻이에요. 사람 수에는 人을 써요.\"}]},\"retest\":{\"prompt\":\"‘들어왔어요’를 완성하세요.\",\"fragment\":\"先生が教室に〔　〕りました。\",\"reading\":\"せんせいが きょうしつに はいりました。\",\"translation\":\"선생님이 교실에 들어오셨어요.\",\"answer\":\"入\",\"why\":\"入りました는 入る의 과거형이에요.\",\"distractors\":[{\"answer\":\"人\",\"why\":\"人은 사람을 뜻하는 한자이고 入る의 동사 표기에 들어가지 않아요.\"}]}},\"day-eye\":{\"diag\":\"D15\",\"title\":\"日과 目의 안쪽 획\",\"rule\":\"日은 안쪽 가로획이 하나, 目는 둘이에요.\",\"practice\":{\"prompt\":\"기간 ‘3일’을 완성하세요.\",\"fragment\":\"三〔　〕間旅行しました。\",\"reading\":\"みっかかん りょこうしました。\",\"translation\":\"3일 동안 여행했어요.\",\"answer\":\"日\",\"why\":\"三日間의 日은 날짜 단위예요.\",\"distractors\":[{\"answer\":\"目\",\"why\":\"目는 二日目처럼 순서를 나타낼 때 붙어요.\"}]},\"retest\":{\"prompt\":\"순서 ‘둘째 날’을 완성하세요.\",\"fragment\":\"二日〔　〕に京都へ行きました。\",\"reading\":\"ふつかめに きょうとへ いきました。\",\"translation\":\"둘째 날에 교토에 갔어요.\",\"answer\":\"目\",\"why\":\"二日目는 이틀째라는 순서예요.\",\"distractors\":[{\"answer\":\"日\",\"why\":\"날짜 단위 日은 二日에 이미 들어 있어요. 순서를 붙이는 글자는 目예요.\"}]}},\"king-ball\":{\"diag\":\"D20\",\"title\":\"王과 玉의 점획\",\"rule\":\"王에는 오른쪽 아래 점이 없고, 玉에는 있어요.\",\"practice\":{\"prompt\":\"‘공’에 맞는 표기를 고르세요.\",\"fragment\":\"白い〔　〕が転がった。\",\"reading\":\"しろい たまが ころがった。\",\"translation\":\"하얀 공이 굴러갔어요.\",\"answer\":\"玉\",\"why\":\"玉는 たま라고 읽으며 둥근 공이나 구슬을 뜻해요.\",\"distractors\":[{\"answer\":\"王\",\"why\":\"王은 왕을 뜻해요. 굴러가는 물체의 표기에 맞지 않아요.\"}]},\"retest\":{\"prompt\":\"‘임금’을 나타내는 한자를 고르세요.\",\"fragment\":\"その国の〔　〕は若いです。\",\"reading\":\"その くにの おうは わかいです。\",\"translation\":\"그 나라의 왕은 젊어요.\",\"answer\":\"王\",\"why\":\"나라의 통치자는 王이라고 써요.\",\"distractors\":[{\"answer\":\"玉\",\"why\":\"점이 있는 玉는 공이나 구슬을 뜻해요.\"}]}},\"shell-see\":{\"diag\":\"D25\",\"title\":\"貝와 見의 끝 획\",\"rule\":\"貝의 아래 두 획은 八처럼 벌어져요. 見의 마지막 획은 오른쪽으로 굽어요.\",\"practice\":{\"prompt\":\"‘조개’를 뜻하는 글자를 고르세요.\",\"fragment\":\"海で小さな〔　〕を拾いました。\",\"reading\":\"うみで ちいさな かいを ひろいました。\",\"translation\":\"바다에서 작은 조개를 주웠어요.\",\"answer\":\"貝\",\"why\":\"貝는 かい, 조개를 뜻해요.\",\"distractors\":[{\"answer\":\"見\",\"why\":\"見은 보다와 관련돼요. 조개를 뜻하는 표기는 貝예요.\"}]},\"retest\":{\"prompt\":\"‘견학’을 완성하세요.\",\"fragment\":\"博物館を〔　〕学しました。\",\"reading\":\"はくぶつかんを けんがくしました。\",\"translation\":\"박물관을 견학했어요.\",\"answer\":\"見\",\"why\":\"見学은 실제로 보고 배운다는 뜻이에요.\",\"distractors\":[{\"answer\":\"貝\",\"why\":\"貝는 조개예요. 보는 행위와 ",\"rule\":\"1단 동사는 마지막 る를 떼고 た를 붙여요.\",\"practice\":{\"prompt\":\"「見る」의 보통체 과거형을 고르세요.\",\"fragment\":\"昨日、その映画を〔　〕。\",\"reading\":\"きのう、その えいがを みた。\",\"translation\":\"어제 그 영화를 봤어요.\",\"answer\":\"見た\",\"why\":\"見る는 1단 동사여서 見た가 돼요.\",\"distractors\":[{\"answer\":\"見った\",\"why\":\"5단 る 동사처럼 촉음 っ을 넣은 형태예요.\"},{\"answer\":\"見て\",\"why\":\"見て는 연결이나 부탁에 사용하는 て형이에요.\"}]},\"retest\":{\"prompt\":\"「食べる」의 보통체 과거형을 고르세요.\",\"fragment\":\"昼にパンを〔　〕。\",\"reading\":\"ひるに パンを たべた。\",\"translation\":\"점심에 빵을 먹었어요.\",\"answer\":\"食べた\",\"why\":\"食べる는 る를 떼고 た를 붙여요.\",\"distractors\":[{\"answer\":\"食べった\",\"why\":\"1단 동사에는 っ이 들어가지 않아요.\"},{\"answer\":\"食べて\",\"why\":\"食べて는 て형이고 이 문항은 과거형을 묻고 있어요.\"}]}},\"sonnani\":{\"diag\":\"D16\",\"title\":\"そんなに와 정도\",\"rule\":\"そんなに는 ‘그렇게까지, 그 정도로’라는 정도를 나타내요.\",\"practice\":{\"prompt\":\"문장에서 「そんなに」의 뜻을 고르세요.\",\"fragment\":\"そんなに急がなくても大丈夫です。\",\"reading\":\"そんなに いそがなくても だいじょうぶです。\",\"translation\":\"그렇게까지 서두르지 않아도 괜찮아요.\",\"answer\":\"그렇게까지\",\"why\":\"여기서는 서두르는 정도를 낮추는 말이에요.\",\"distractors\":[{\"answer\":\"반드시\",\"why\":\"의무를 나타내는 말이 아니에요.\"},{\"answer\":\"벌써\",\"why\":\"시간보다 동작의 정도를 나타내요.\"}]},\"retest\":{\"prompt\":\"문장에서 「そんなに」의 뜻을 고르세요.\",\"fragment\":\"そんなに高いとは思わなかった。\",\"reading\":\"そんなに たかいとは おもわなかった。\",\"translation\":\"그렇게 비쌀 줄은 몰랐어요.\",\"answer\":\"그렇게\",\"why\":\"비싸다고 느끼는 정도를 나타내요.\",\"distractors\":[{\"answer\":\"항상\",\"why\":\"빈도를 나타내는 말이 아니에요.\"},{\"answer\":\"드디어\",\"why\":\"기다린 일이 일어났다는 시간의 뜻은 아니에요.\"}]}},\"mada\":{\"diag\":\"D21\",\"title\":\"まだ와 남아 있는 상태\",\"rule\":\"まだ는 아직 어떤 상태가 이어지거나 일이 완료되지 않았다는 뜻이에요.\",\"practice\":{\"prompt\":\"문장에서 「まだ」의 뜻을 고르세요.\",\"fragment\":\"仕事はまだ終わっていません。\",\"reading\":\"しごとは まだ おわっていません。\",\"translation\":\"일은 아직 끝나지 않았어요.\",\"answer\":\"아직\",\"why\":\"완료되지 않은 상태예요.\",\"distractors\":[{\"answer\":\"이미\",\"why\":\"이미는 완료 또는 선행을 뜻해서 이 まだ와 맞지 않아요.\"},{\"answer\":\"곧\",\"why\":\"곧은 미래 가까운 시점을 뜻해요.\"}]},\"retest\":{\"prompt\":\"문장에서 「まだ」의 뜻을 고르세요.\",\"fragment\":\"会議までまだ時間があります。\",\"reading\":\"かいぎ 정\" aria-hidden=\"true\">\u003c/section>\u003csection class=\"kr-hero\">\u003cdiv class=\"kr-question-frame\" data-kr-frame=\"question\">\u003cp class=\"kr-prompt\">이 일이 일어나면 알려 달라는 조건을 표현하세요.\u003c/p>\u003cdiv class=\"kr-quiz-expression\" lang=\"ja\">来月、日本語の試験を〔　〕、知らせてください。\u003c/div>\u003cp class=\"kr-extra\">기준 동사 · 受ける（うける）\u003c/p>\u003c/div>\u003cdiv class=\"kr-quiz-options\" role=\"group\" aria-label=\"선택지\">\u003cbutton type=\"button\" data-idx=\"1\" aria-pressed=\"false\">受けた\u003c/button>\u003cbutton type=\"button\" data-idx=\"2\" aria-pressed=\"false\">受けたら\u003c/button>\u003cbutton type=\"button\" data-idx=\"3\" aria-pressed=\"false\">受ける\u003c/button>\u003c/div>\u003cp class=\"kr-quiz-status\" aria-live=\"polite\">먼저 떠올린 뒤 답면을 확인하세요.\u003c/p>\u003cdiv class=\"kr-quiz-feedback\" data-kr-frame=\"answer\" tabindex=\"-1\" aria-live=\"polite\" aria-hidden=\"true\">\u003cp class=\"kr-quiz-result\">\u003c/p>\u003cp class=\"kr-result-caption\">정답\u003c/p>\u003cdiv class=\"kr-answer-main\">受けたら\u003c/div>\u003cp class=\"kr-result-field\">읽기 · うけたら\u003c/p>\u003cp class=\"kr-result-field\">뜻 · 시험을 치다\u003c/p>\u003csection class=\"kr-answer-section\">\u003ch3>핵심 해설\u003c/h3>\u003cp>受ける（うける）는 1단 동사입니다. 어떤 일이 일어난 뒤의 조건을 말할 때 「Vたら」를 씁니다. 여기서는 受けたら를 씁니다.\u003c/p>\u003c/section>\u003csection class=\"kr-answer-section\">\u003ch3>비교\u003c/h3>\u003cdiv>\u003cul>\u003cli>\u003cstrong>受けた\u003c/strong> · 受けた는 보통체 과거형입니다. 이 문장의 조건에 필요한 형태는 조건형입니다.\u003c/li>\u003cli>\u003cstrong>受けたら\u003c/strong> · 受ける（うける）는 1단 동사입니다. 어떤 일이 일어난 뒤의 조건을 말할 때 「Vたら」를 씁니다. 여기서는 受けたら를 씁니다.\u003c/li>\u003cli>\u003cstrong>受ける\u003c/strong> · 受ける는 사전형입니다. 이 문장의 조건에 필요한 형태는 조건형입니다.\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\u003csection class=\"kr-answer-section\">\u003ch3>예문과 해석\u003c/h3>\u003cp lang=\"ja\">\u003cruby>来月\u003crt>らいげつ\u003c/rt>\u003c/ruby>、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>の\u003cruby>試験\u003crt>しけん\u003c/rt>\u003c/ruby>を\u003cmark>\u003cruby>受け\u003crt>うけ\u003c/rt>\u003c/ruby>\u003c/mark>\u003cmark>たら\u003c/mark>、\u003cruby>知らせ\u003crt>しらせ\u003c/rt>\u003c/ruby>てください。\u003c/p>\u003cp>다음 달에 일본어 시험을 치면 알려 주세요.\u003c/p>\u003c/section>\u003csection class=\"kr-answer-section\">\u003cdetails>\u003csummary>문항 근거\u003c/summary>\u003cp>사용자 제공 JLPT MAX 어휘·예문 자료 · ci-a42e8cd7de770a900ff8 / ex-648148f46d2121b8eb65 · 기준 예문을 활용 문장으로 편집 · \u003ca href=\"https://www.coelang.tufs.ac.jp/mt/ja/gmod/\">근거 열기\u003c/a>\u003c/p>\u003c/details>\u003c/section>\u003c/div>\u003c/section>\u003cfooter class=\"kr-card-id\">\u003cdiv class=\"kr-id-line\">NoteID KR-N-X110-VRB-2C93D78777A74C3E\u003c/div>\u003cdiv class=\"kr-version\">\u003cspan>덱 v1.10.0-RC1\u003c/span>\u003cspan>실전 v1.7.0\u003c/span>\u003cspan>공통 UI KR-1.7.1-RC2\u003c/span>\u003cspan>수정 2026-11-20\u003c/span>\u003c/div>\u003cdiv class=\"kr-platform-date\">운영 기준 2026-11-19 · RULE-06 v1.3.0\u003c/div>\u003c/footer>\u003cscript type=\"application/json\" data-kr180-bank>{\"version\":\"v1.10.0-RC1\",\"diagnosis\":[{\"id\":\"D01\",\"track\":\"read\",\"prompt\":\"역을 뜻하는 「駅」의 읽기를 고르세요.\",\"stimulus\":\"駅で友達を待ちます。\",\"options\":[\"せき\",\"えき\",\"いき\"],\"answer\":\"えき\",\"feedback\":\"駅（えき）는 ‘역’입니다.\",\"skill\":\"한자 읽기\",\"quick\":true},{\"id\":\"D02\",\"track\":\"write\",\"prompt\":\"‘손 수’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"手\",\"feedback\":\"手의 마지막 획은 아래에서 왼쪽으로 살짝 꺾입니다.\",\"skill\":\"모양 회상\",\"quick\":true},{\"id\":\"D03\",\"track\":\"similar\",\"prompt\":\"‘토요일’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕曜日（どようび）\",\"options\":[\"士\",\"王\",\"土\"],\"answer\":\"土\",\"feedback\":\"土曜日에는 아래 가로획이 긴 土가 들어갑니다.\",\"skill\":\"가로획 길이\",\"quick\":true},{\"id\":\"D04\",\"track\":\"verb\",\"prompt\":\"「書く」의 て형을 고르세요.\",\"stimulus\":\"書く\",\"options\":[\"書って\",\"書いて\",\"書んで\"],\"answer\":\"書いて\",\"feedback\":\"書く의 く는 て형에서 いて가 됩니다.\",\"skill\":\"연결형\",\"quick\":true},{\"id\":\"D05\",\"track\":\"read\",\"prompt\":\"「確認」의 읽기를 고르세요.\",\"stimulus\":\"この書類を確認してください。\",\"options\":[\"かくにん\",\"かんにん\",\"かくじん\"],\"answer\":\"かくにん\",\"feedback\":\"確認（かくにん）은 ‘확인’입니다.\",\"skill\":\"음독 결합\",\"quick\":true},{\"id\":\"D06\",\"track\":\"write\",\"prompt\":\"‘나무 목’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"木\",\"feedback\":\"木의 표준 획순은 가로·세로·왼쪽 삐침·오른쪽 파임입니다.\",\"skill\":\"획순\",\"quick\":true},{\"id\":\"D07\",\"track\":\"similar\",\"prompt\":\"‘미래’를 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕来（みらい）\",\"options\":[\"未\",\"末\",\"本\"],\"answer\":\"未\",\"feedback\":\"未来의 未는 두 가로획 중 아래쪽이 더 깁니다.\",\"skill\":\"가로획 길이\",\"quick\":true},{\"id\":\"D08\",\"track\":\"verb\",\"prompt\":\"「読む」의 た형을 고르세요.\",\"stimulus\":\"読む\",\"options\":[\"読んだ\",\"読いた\",\"読った\"],\"answer\":\"読んだ\",\"feedback\":\"読む의 む는 た형에서 んだ가 됩니다.\",\"skill\":\"과거형\",\"quick\":true},{\"id\":\"D09\",\"track\":\"read\",\"prompt\":\"「提案」의 읽기를 고르세요.\",\"stimulus\":\"彼女は新しい方法を提案しました。\",\"options\":[\"だいあん\",\"ていなん\",\"ていあん\"],\"answer\":\"ていあん\",\"feedback\":\"提案（ていあん）은 ‘제안’입니다.\",\"skill\":\"음독 결합\",\"quick\":true},{\"id\":\"D10\",\"track\":\"write\",\"prompt\":\"‘날 일’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"日\",\"feedback\":\"日은 네 획입니다. 테두리 안 가로획이 하나입니다.\",\"skill\":\"획수\",\"quick\":true},{\"id\":\"D11\",\"track\":\"similar\",\"prompt\":\"‘입구’를 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕口（いりぐち）\",\"options\":[\"人\",\"入\",\"大\"],\"answer\":\"入\",\"feedback\":\"入口에는 入이 들어갑니다. 入의 긴 획은 오른쪽 아래로 내려갑니다.\",\"skill\":\"삐침 방향\",\"quick\":true},{\"id\":\"D12\",\"track\":\"verb\",\"prompt\":\"「行く」의 て형을 고르세요.\",\"stimulus\":\"行く\",\"options\":[\"行いて\",\"行んで\",\"行って\"],\"answer\":\"行って\",\"feedback\":\"行く의 て형은 예외적으로 行って입니다.\",\"skill\":\"연결형 예외\",\"quick\":true},{\"id\":\"D13\",\"track\":\"read\",\"prompt\":\"「工場」의 읽기를 고르세요.\",\"stimulus\":\"弟は工場で働いています。\",\"options\":[\"こうしょう\",\"こうじょう\",\"こうじょ\"],\"answer\":\"こうじょう\",\"feedback\":\"工場（こうじょう）는 ‘공장’입니다. 뒤 음절의 탁음과 장음을 확인하세요.\",\"skill\":\"한자어 읽기\",\"quick\":false},{\"id\":\"D14\",\"track\":\"write\",\"prompt\":\"‘흰 백’에 해당하는 한자 한 글자를 쓰세요.\",\"s ":[{\"answer\":\"行いて\",\"why\":\"일반 く 동사 규칙을 적용한 형태예요. 行く는 예외예요.\"},{\"answer\":\"行んで\",\"why\":\"んで는 む·ぶ·ぬ 동사에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「行く」를 て형으로 바꿔 행동을 연결하세요.\",\"fragment\":\"スーパーへ〔　〕、牛乳を買った。\",\"reading\":\"スーパーへ いって、ぎゅうにゅうを かった。\",\"translation\":\"슈퍼에 가서 우유를 샀어요.\",\"answer\":\"行って\",\"why\":\"行って가 가는 행동을 뒤 행동과 이어 줘요.\",\"distractors\":[{\"answer\":\"行いて\",\"why\":\"예외 동사 行く에는 いて 대신 って가 들어가요.\"},{\"answer\":\"行った\",\"why\":\"行った는 과거를 나타내요. 이 문항은 연결하는 て형을 묻고 있어요.\"}]}},\"r-nai\":{\"diag\":\"D17\",\"title\":\"5단 る 동사의 ない형\",\"rule\":\"5단 る 동사는 る를 ら로 바꾸고 ない를 붙여요.\",\"practice\":{\"prompt\":\"「入る」의 ない형을 고르세요.\",\"fragment\":\"ここには〔　〕でください。\",\"reading\":\"ここには はいらないで ください。\",\"translation\":\"여기에는 들어가지 마세요.\",\"answer\":\"入らない\",\"why\":\"入る는 5단 동사라서 入らない가 돼요.\",\"distractors\":[{\"answer\":\"入ない\",\"why\":\"る를 그대로 떼면 안 돼요. 여기서는 ら로 바꿔요.\"},{\"answer\":\"入りない\",\"why\":\"入り는 入ります의 어간이에요. ない형 앞에는 入ら를 써요.\"}]},\"retest\":{\"prompt\":\"「帰る」를 ない형으로 바꿔 ‘일찍 귀가해야 한다’를 완성하세요.\",\"fragment\":\"今日は早く〔　〕といけません。\",\"reading\":\"きょうは はやく かえらないと いけません。\",\"translation\":\"오늘은 일찍 귀가해야 해요.\",\"answer\":\"帰らない\",\"why\":\"帰る는 5단 동사예요. 帰らないといけません으로 필요성을 표현해요.\",\"distractors\":[{\"answer\":\"帰ない\",\"why\":\"1단 동사처럼 る를 뺀 형태예요. 帰る에는 ら가 필요해요.\"},{\"answer\":\"帰りない\",\"why\":\"帰り는 帰ります에 쓰여요. ない형은 帰らない예요.\"}]}},\"s-masu\":{\"diag\":\"D22\",\"title\":\"5단 す 동사의 ます형\",\"rule\":\"5단 す 동사는 す를 し로 바꾸고 ます를 붙여요.\",\"practice\":{\"prompt\":\"「出す」의 ます형을 골라 ‘제출하겠습니다’를 완성하세요.\",\"fragment\":\"明日、書類を〔　〕。\",\"reading\":\"あした、しょるいを だします。\",\"translation\":\"내일 서류를 제출하겠습니다.\",\"answer\":\"出します\",\"why\":\"出す의 す를 し로 바꾸면 出します가 돼요.\",\"distractors\":[{\"answer\":\"出せます\",\"why\":\"가능형이라 ‘제출할 수 있습니다’라는 뜻이에요.\"},{\"answer\":\"出すます\",\"why\":\"사전형 그대로 ます를 붙이지 않아요.\"}]},\"retest\":{\"prompt\":\"「話す」의 ます형을 골라 ‘말합니다’를 완성하세요.\",\"fragment\":\"日本語で〔　〕。\",\"reading\":\"にほんごで はなします。\",\"translation\":\"일본어로 말합니다.\",\"answer\":\"話します\",\"why\":\"話す의 す → し로 바꿔 話します라고 해요.\",\"distractors\":[{\"answer\":\"話せます\",\"why\":\"가능형이라 ‘말할 수 있습니다’라는 뜻이에요.\"},{\"answer\":\"話すます\",\"why\":\"ます 앞에서는 す를 し로 바꿔요.\"}]}},\"one-past\":{\"diag\":\"D27\",\"title\":\"1단 동사의 た형\",\"rule\":\"1단 동사는 마지막 る를 떼고 た를 붙여요.\",\"practice\":{\"prompt\":\"「見る」의 보통체 과거형을 고르세요.\",\"fragment\":\"昨日、その映画を〔　〕。\",\"reading\":\"きのう、その えいがを みた。\",\"translation\":\"어제 그 영화를 봤어요.\",\"answer\":\"見た\",\"why\":\"見る는 1단 동사여서 見た가 돼요.\",\"distractors\":[{\"answer\":\"見った\",\"why\":\"5단 る 동사처럼 촉음 っ을 넣은 형태예요.\"},{\"answer\":\"見て\",\"why\":\"見て는 연결이나 부탁에 사용하는 て형이에요.\"}]},\"retest\":{\"prompt\":\"「食べる」의 보통체 과거형을 고르세요.\",\"fragment\":\"昼にパンを〔　〕。\",\"reading\":\"ひるに パンを たべた。\",\"translation\":\"점심에 빵을 먹었어요.\",\"answer\":\"食べた\",\"why\":\"食べる는 る를 떼고 た를 붙여요.\",\"distractors\":[{\"answer\":\"食べった\",\"why\":\"1단 동사에는 っ이 들어가지 않아요.\"},{\"answer\":\"食べて\",\"why\":\"食べて는 て형이고 이 문항은 과거형을 묻고 있어요.\"}]}},\"sonnani\":{\"diag\":\"D16\",\"title\":\"そんなに와 정도\",\"rule\":\"そんなに는 ‘그렇게까지, 그 정도로’라는 정도를 나타내요.\",\"practice\":{\"prompt\":\"문장에서 「そんなに」의 뜻을 고르세요.\",\"fragment\":\"そんなに急がなくても大丈夫です。\",\"reading\":\"そんなに いそがなくても だいじょうぶです。\",\"translation\":\"그렇게까지 서두르지 않아도 괜찮아요.\",\"answer\":\"그렇게까지\",\"why\":\"여기서는 서두르는 정도를 낮추는 말이에요.\",\"distractors\":[{\"answer\":\"반드시\",\"why\":\"의무를 나타내는 말이 아니에요.\"},{\"answer\":\"벌써\",\"why\":\"시간보다 동작의 정도를 나타내요.\"}]},\"retest\":{\"prompt\":\"문장에서 「そんなに」의 뜻을 고르세요.\",\"fragment\":\"そんなに高いとは思わなかった。\",\"reading\":\"そんなに たかいとは おもわなかった。\",\"translation\":\"그렇게 비쌀 줄은 몰랐어요.\",\"answer\":\"그렇게\",\"why\":\"비싸다고 느끼는 정도를 나타내요.\",\"distractors\":[{\"answer\":\"항상\",\"why\":\"빈도를 나타내는 말이 아니에요.\"},{\"answer\":\"드디어\",\"why\":\"기다린 일이 일어났다는 시간의 뜻은 아니에요.\"}]}},\"mada\":{\"diag\":\"D21\",\"title\":\"まだ와 남아 있는 상태\",\"rule\":\"まだ는 아직 어떤 상태가 이어지거나 일이 완료되지 않았다는 뜻이에요.\",\"practice\":{\"prompt\":\"문장에서 「まだ」의 뜻을 고르세요.\",\"fragment\":\"仕事はまだ終わっていません。\",\"reading\":\"しごとは まだ おわっていません。\",\"translation\":\"일은 아직 끝나지 않았어요.\",\"answer\":\"아직\",\"why\":\"완료되지 않은 상태예요.\",\"distractors\":[{\"answer\":\"이미\",\"why\":\"이미는 완료 또는 선행을 뜻해서 이 まだ와 맞지 않아요. quick\":false},{\"id\":\"D14\",\"track\":\"write\",\"prompt\":\"‘흰 백’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"白\",\"feedback\":\"白은 위에 짧은 삐침이 있는 5획 글자입니다.\",\"skill\":\"모양 회상\",\"quick\":false},{\"id\":\"D15\",\"track\":\"similar\",\"prompt\":\"‘목표’를 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕標（もくひょう）\",\"options\":[\"日\",\"貝\",\"目\"],\"answer\":\"目\",\"feedback\":\"目標의 目는 테두리 안 가로획이 둘입니다.\",\"skill\":\"안쪽 획 비교\",\"quick\":false},{\"id\":\"D16\",\"track\":\"context\",\"prompt\":\"이 문장에서 「そんなに」의 뜻을 고르세요.\",\"stimulus\":\"そんなに心配しなくても大丈夫です。\",\"options\":[\"반드시\",\"그 정도로\",\"벌써\"],\"answer\":\"그 정도로\",\"feedback\":\"そんなに는 걱정의 정도를 나타냅니다. ‘그렇게까지 걱정하지 않아도 괜찮습니다’로 옮길 수 있습니다.\",\"skill\":\"정도를 나타내는 말\",\"quick\":false},{\"id\":\"D17\",\"track\":\"verb\",\"prompt\":\"「帰る」의 ない형을 고르세요.\",\"stimulus\":\"帰る\",\"options\":[\"帰らない\",\"帰ない\",\"帰りない\"],\"answer\":\"帰らない\",\"feedback\":\"帰る는 5단 동사입니다. る를 ら로 바꾸고 ない를 붙입니다.\",\"skill\":\"부정형\",\"quick\":false},{\"id\":\"D18\",\"track\":\"read\",\"prompt\":\"「夕方」의 읽기를 고르세요.\",\"stimulus\":\"夕方に連絡します。\",\"options\":[\"ゆうかた\",\"ゆがた\",\"ゆうがた\"],\"answer\":\"ゆうがた\",\"feedback\":\"夕方（ゆうがた）는 ‘저녁 무렵’입니다. 方는 이 단어에서 がた로 읽습니다.\",\"skill\":\"훈독 결합\",\"quick\":false},{\"id\":\"D19\",\"track\":\"write\",\"prompt\":\"‘털 모’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"毛\",\"feedback\":\"毛의 마지막 획은 아래쪽에서 오른쪽으로 굽습니다.\",\"skill\":\"마지막 획\",\"quick\":false},{\"id\":\"D20\",\"track\":\"similar\",\"prompt\":\"‘임금님’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕様（おうさま）\",\"options\":[\"玉\",\"王\",\"主\"],\"answer\":\"王\",\"feedback\":\"王様에는 오른쪽 아래에 점이 없는 王이 들어갑니다.\",\"skill\":\"점획 비교\",\"quick\":false},{\"id\":\"D21\",\"track\":\"context\",\"prompt\":\"이 문장에서 「まだ」의 뜻을 고르세요.\",\"stimulus\":\"まだ雨が降っています。\",\"options\":[\"이미\",\"곧\",\"아직\"],\"answer\":\"아직\",\"feedback\":\"내리고 있는 비가 지금도 이어집니다. 여기서 まだ는 ‘아직’입니다.\",\"skill\":\"상태의 지속\",\"quick\":false},{\"id\":\"D22\",\"track\":\"verb\",\"prompt\":\"「話す」의 ます형을 고르세요.\",\"stimulus\":\"話す\",\"options\":[\"話せます\",\"話します\",\"話すます\"],\"answer\":\"話します\",\"feedback\":\"話す의 す를 し로 바꾸고 ます를 붙입니다. 話せます는 ‘말할 수 있습니다’입니다.\",\"skill\":\"정중형\",\"quick\":false},{\"id\":\"D23\",\"track\":\"read\",\"prompt\":\"「操作」의 읽기를 고르세요.\",\"stimulus\":\"この機械の操作は簡単です。\",\"options\":[\"そうさ\",\"そうしゃ\",\"しょうさ\"],\"answer\":\"そうさ\",\"feedback\":\"操作（そうさ）는 기기 등을 ‘조작함’을 뜻합니다.\",\"skill\":\"음독 결합\",\"quick\":false},{\"id\":\"D24\",\"track\":\"write\",\"prompt\":\"‘소 우’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"牛\",\"feedback\":\"牛의 가운데 세로획은 위 가로획 위로 올라갑니다.\",\"skill\":\"세로획 위치\",\"quick\":false},{\"id\":\"D25\",\"track\":\"similar\",\"prompt\":\"‘조개껍데기’를 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕殻（かいがら）\",\"options\":[\"貝\",\"見\",\"目\"],\"answer\":\"貝\",\"feedback\":\"貝殻의 貝는 아래쪽 두 짧은 획이 양옆으로 벌어집니다.\",\"skill\":\"아래쪽 획 비교\",\"quick\":false},{\"id\":\"D26\",\"track\":\"context\",\"prompt\":\"이 문장에서 「間に合います」의 뜻을 고르세요.\",\"stimulus\":\"急げば電車に間に合います。\",\"options\":[\"전철이 연착됩니다\",\"약속 시간이 바뀝니다\",\"전철 시간에 늦지 않습니다\"],\"answer\":\"전철 시간에 늦지 않습니다\",\"feedback\":\"전철이 떠나기 전에 도착할 수 있다는 뜻입니다.\",\"skill\":\"상황에서 의미 구별\",\"quick\":false},{\"id\":\"D27\",\"track\":\"verb\",\"prompt\":\"「食べる」의 た형을 고르세요.\",\"stimulus\":\"食べる\",\"options\":[\"食べて\",\"食べった\",\"食べた\"],\"answer\":\"食べた\",\"feedback\":\"食べる는 1단 동사입니다. る를 떼고 た를 붙입니다.\",\"skill\":\"과거형\",\"quick\":false},{\"id\":\"D28\",\"track\":\"context\",\"prompt\":\"이 문장에서 「つい」의 뜻을 고르세요.\",\"stimulus\":\"おいしそうで、つい食べ過ぎました。\",\"options\":[\"일부러\",\"나도 모르게\",\"정확히\"],\"answer\":\"나도 모르게\",\"feedback\":\"맛있어 보여서 그만 많이 먹었다는 뜻입니다.\",\"skill\":\"의도와 행동\",\"quick\":false},{\"id\":\"D29\",\"track\":\"context\",\"prompt\":\"이 문장에서 「届く」의 뜻을 고르세요.\",\"stimulus\":\"明日、荷物が届く予定です。\",\"options\":[\"보내다\",\"포장하다\",\"도착하다\"],\"answer\":\"도착하다\",\"feedback\":\"荷物が届く는 짐이나 택배가 도착한다는 뜻입니다.\",\"skill\":\"자동사 의미\",\"quick\":false},{\"id\":\"D30\",\"track\":\"context\",\"prompt\":\"이 문장에서 「たいてい」의 뜻을 고르세요.\",\"stimulus\":\"平日はたいてい家で夕食を食べます。\",\"options\":[\"대개\",\"가끔\",\"꼭\"],\"answer\":\"대개\",\"feedback\":\"평일에는 ‘대체로’ 집에서 저녁을 먹는다는 말입니다.\",\"skill\":\"빈도를 나타내는 말\",\"quick\":false}],\"tracks\":{\"read\":{\"name\":\"한자 읽기\",\"priority\":2,\"plan\":\"급수에 맞는 읽기부터 하루 6분\",\"query\":\"deck:\\\"일본어::01_학습::한자혁명\\\" card:\\\"한자 읽기\\\"\"},\"write\":{\"name\":\"한자 쓰기\",\"priority\":1,\"plan\":\"뜻을 보고 손으로 쓰기 하루 6분\",\"query\":\"deck:\\\"일본어::01_학습::한자혁명\\\" card:\\\"한자 쓰기\\\"\"},\"similar\":{\"name\":\"유사 한자\",\"priority\":0,\"plan\":\"두 글자의 다른 획을 짚으며 하루 6분\",\"query\":\"deck:\\\"일본어::02_실전문제::한자혁명::유사 한자\\\"\"},\"verb\":{\"name\":\"동사 활용\",\"priority\":3,\"plan\":\"기본형을 지정된 활용형으로 바꾸기 하루 6분\",\"query\":\"deck:\\\"일본어::02_실전문제::한자혁명::동사 활용\\\"\"},\"context\":{\"name\":\"어휘·문맥\",\"priority\":4,\"plan\":\"예문에서 단어 뜻을 골라보는 연습을 하루 6분\",\"query\":\"deck:\\\"일본어::02_실전문제::한자혁명::어휘·문맥\\\"\"}},\"audio\":{},\"correction\":{\"id\":\"KR-N-X-CTX-1006\",\"text\":\"v1.8.0-RC1 · ‘그렇다’ → ‘그렇게까지 / 그 정도로’. ‘그렇게 많이’도 문맥상 가능합니다.\",\"url\":\"https://dictionary.cambridge.org/ja/dictionary/japanese-english/%E3%81%9D%E3%82%93%E3%81%AA%E3%81%AB\"},\"practice\":[{\"id\":\"P01\",\"track\":\"read\",\"prompt\":\"「手紙」의 읽기를 고르세요.\",\"stimulus\":\"友達に手紙を書きました。\",\"options\":[\"てかみ\",\"てがみ\",\"しゅがみ\"],\"answer\":\"てがみ\",\"feedback\":\"手紙（てがみ）는 ‘편지’입니다.\",\"skill\":\"훈독 결합\",\"quick\":false},{\"id\":\"P02\",\"track\":\"read\",\"prompt\":\"「申請」의 읽기를 고르세요.\",\"stimulus\":\"オンラインで申請できます。\",\"options\":[\"しんせい\",\"しんしょう\",\"しんぜい\"],\"answer\":\"しんせい\",\"feedback\":\"申請（しんせい）는 ‘신청’입니다.\",\"skill\":\"한자어 읽기\",\"quick\":false},{\"id\":\"P03\",\"track\":\"read\",\"prompt\":\"「日曜日」의 읽기를 고르세요.\",\"stimulus\":\"日曜日は家で休みます。\",\"options\":[\"ひようび\",\"にようび\",\"にちようび\"],\"answer\":\"にちようび\",\"feedback\":\"日曜日（にちようび）는 ‘일요일’입니다.\",\"skill\":\"음독 결합\",\"quick\":false},{\"id\":\"P04\",\"track\":\"write\",\"prompt\":\"‘오른 우’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"右\",\"feedback\":\"右에는 아래쪽에 口가 있습니다.\",\"skill\":\"아래쪽 형태\",\"quick\":false},{\"id\":\"P05\",\"track\":\"write\",\"prompt\":\"‘일천 천’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"千\",\"feedback\":\"千의 첫 획은 왼쪽으로 내려오는 짧은 삐침입니다.\",\"skill\":\"첫 획\",\"quick\":false},{\"id\":\"P06\",\"track\":\"write\",\"prompt\":\"‘임금 왕’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"王\",\"feedback\":\"王은 가로획 셋과 세로획 하나로 이루어집니다.\",\"skill\":\"획수와 모양\",\"quick\":false},{\"id\":\"P07\",\"track\":\"similar\",\"prompt\":\"‘태양’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕陽（たいよう）\",\"options\":[\"犬\",\"大\",\"太\"],\"answer\":\"太\",\"feedback\":\"太는 점획이 아래쪽에 있습니다.\",\"skill\":\"점획 비교\",\"quick\":false},{\"id\":\"P08\",\"track\":\"similar\",\"prompt\":\"‘본점’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕店（ほんてん）\",\"options\":[\"本\",\"木\",\"末\"],\"answer\":\"本\",\"feedback\":\"本에는 木 아래에 짧은 가로획이 하나 더 있습니다.\",\"skill\":\"아래쪽 획 비교\",\"quick\":false},{\"id\":\"P09\",\"track\":\"similar\",\"prompt\":\"‘견학’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕学（けんがく）\",\"options\":[\"貝\",\"見\",\"目\"],\"answer\":\"見\",\"feedback\":\"見의 오른쪽 아래 획은 굽어서 위로 올라갑니다.\",\"skill\":\"마지막 획 비교\",\"quick\":false},{\"id\":\"P10\",\"track\":\"verb\",\"prompt\":\"「泳ぐ」의 て형을 고르세요.\",\"stimulus\":\"泳ぐ\",\"options\":[\"泳いで\",\"泳いて\",\"泳んで\"],\"answer\":\"泳いで\",\"feedback\":\"泳ぐ의 ぐ는 て형에서 いで로 바뀝니다.\",\"skill\":\"연결형\",\"quick\":false},{\"id\":\"P11\",\"track\":\"verb\",\"prompt\":\"「待つ」의 た형을 고르세요.\",\"stimulus\":\"待つ\",\"options\":[\"待いた\",\"待った\",\"待つた\"],\"answer\":\"待った\",\"feedback\":\"待つ의 つ는 た형에서 った로 바뀝니다.\",\"skill\":\"과거형\",\"quick\":false},{\"id\":\"P12\",\"track\":\"verb\",\"prompt\":\"「起きる」의 ない형을 고르세요.\",\"stimulus\":\"起きる\",\"options\":[\"起きらない\",\"起きりない\",\"起きない\"],\"answer\":\"起きない\",\"feedback\":\"起きる는 1단 동사입니다. る를 떼고 ない를 붙입니다.\",\"skill\":\"부정형\",\"quick\":false},{\"id\":\"P13\",\"track\":\"context\",\"prompt\":\"이 문장에서 「ほとんど」의 뜻을 고르세요.\",\"stimulus\":\"宿題はほとんど終わりました。\",\"options\":[\"아직\",\"거의\",\"한꺼번에\"],\"answer\":\"거의\",\"feedback\":\"숙제가 ‘거의’ 끝났다는 뜻입니다.\",\"skill\":\"정도를 나타내는 말\",\"quick\":false},{\"id\":\"P14\",\"track\":\"context\",\"prompt\":\"이 문장에서 「間もなく」의 뜻을 고르세요.\",\"stimulus\":\"間もなく電車が来ます。\",\"options\":[\"곧\",\"이미\",\"일부러\"],\"answer\":\"곧\",\"feedback\":\"잠시 후에 전철이 온다는 뜻입니다.\",\"skill\":\"시간을 나타내는 말\",\"quick\":false},{\"id\":\"P15\",\"track\":\"context\",\"prompt\":\"이 문장에서 「見直しました」의 뜻을 고르세요.\",\"stimulus\":\"提出前に書類を見直しました。\",\"options\":[\"새로 발급했습니다\",\"제출을 미뤘습니다\",\"다시 살폈습니다\"],\"answer\":\"다시 살폈습니다\",\"feedback\":\"제출 전에 서류를 다시 읽고 확인했다는 뜻입니다.\",\"skill\":\"상황에서 의미 구별\",\"quick\":false}],\"followup\":{\"concepts\":{\"earth-warrior\":{\"diag\":\"D03\",\"title\":\"土와 士의 가로획\",\"rule\":\"土는 아래 가로획이 길고, 士는 위 가로획이 길어요.\",\"practice\":{\"prompt\":\"‘흙’에 맞는 한자를 고르세요.\",\"fragment\":\"畑の〔　〕が乾いています。\",\"reading\":\"はたけの つちが かわいています。\",\"translation\":\"밭의 흙이 말라 있어요.\",\"answer\":\"土\",\"why\":\"土는 흙을 뜻하며 아래 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"士\",\"why\":\"士는 武士처럼 사람의 신분이나 직함에 쓰여요.\"}]},\"retest\":{\"prompt\":\"‘무사’를 완성하세요.\",\"fragment\":\"武〔　〕は刀を持っていました。\",\"reading\":\"ぶしは かたなを もっていました。\",\"translation\":\"무사는 칼을 가지고 있었어요.\",\"answer\":\"士\",\"why\":\"武士는 무사예요. 士의 위 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"土\",\"why\":\"土는 흙이나 땅을 뜻하며 武士의 표기에 쓰이지 않아요.\"}]}},\"not-yet-end\":{\"diag\":\"D07\",\"title\":\"未와 末의 가로획\",\"rule\":\"未는 아랫줄이 길고 아직이라는 뜻이에요. 末은 윗줄이 길고 끝이라는 뜻이에요.\",\"practice\":{\"prompt\":\"‘미정’을 완성하세요.\",\"fragment\":\"予定は〔　〕定です。\",\"reading\":\"よていは みていです。\",\"translation\":\"일정은 아직 정해지지 않았어요.\",\"answer\":\"未\",\"why\":\"未定의 未는 ‘아직’을 뜻해요.\",\"distractors\":[{\"answer\":\"末\",\"why\":\"末은 마지막을 뜻하며 ‘아직 정해지지 않음’과 맞지 않아요.\"}]},\"retest\":{\"prompt\":\"‘월말’을 완성하세요.\",\"fragment\":\"月〔　〕に報告します。\",\"reading\":\"げつまつに ほうこくします。\",\"translation\":\"월말에 보고할게요.\",\"answer\":\"末\",\"why\":\"月末은 달의 끝이에요. 末의 위 가로획이 더 길어요.\",\"distractors\":[{\"answer\":\"未\",\"why\":\"未는 未定의 ‘아직’이라는 뜻이에요. 달의 끝을 뜻하는 글자는 末이에요.\"}]}},\"person-enter\":{\"diag\":\"D11\",\"title\":\"人과 入의 획 방향\",\"rule\":\"人은 왼쪽으로 내리는 획이 위에서 시작해요. 入은 오른쪽으로 내리는 획이 더 위에서 시작해요.\",\"practice\":{\"prompt\":\"‘세 사람’을 완성하세요.\",\"fragment\":\"この部屋に三〔　〕います。\",\"reading\":\"この へやに さんにん います。\",\"translation\":\"이 방에 세 사람이 있어요.\",\"answer\":\"人\",\"why\":\"三人은 사람 셋을 세는 말이에요.\",\"distractors\":[{\"answer\":\"入\",\"why\":\"入은 들어가다라는 뜻이에요. 사람 수에는 人을 써요.\"}]},\"retest\":{\"prompt\":\"‘들어왔어요’를 완성하세요.\",\"fragment\":\"先生が教室に〔　〕りました。\",\"reading\":\"せんせいが きょうしつに はいりました。\",\"translation\":\"선생님이 교실에 들어오셨어요.\",\"answer\":\"入\",\"why\":\"入りました는 入る의 과거형이에요.\",\"distractors\":[{\"answer\":\"人\",\"why\":\"人은 사람을 뜻하는 한자이고 入る의 동사 표기에 들어가지 않아요.\"}]}},\"day-eye\":{\"diag\":\"D15\",\"title\":\"日과 目의 안쪽 획\",\"rule\":\"日은 안쪽 가로획이 하나, 目는 둘이에요.\",\"practice\":{\"prompt\":\"기간 ‘3일’을 완성하세요.\",\"fragment\":\"三〔　〕間旅行しました。\",\"reading\":\"みっかかん りょこうしました。\",\"translation\":\"3일 동안 여행했어요.\",\"answer\":\"日\",\"why\":\"三日間의 日은 날짜 단위예요.\",\"distractors\":[{\"answer\":\"目\",\"why\":\"目는 二日目처럼 순서를 나타낼 때 붙어요.\"}]},\"retest\":{\"prompt\":\"순서 ‘둘째 날’을 완성하세요.\",\"fragment\":\"二日〔　〕に京都へ行きました。\",\"reading\":\"ふつかめに きょうとへ いきました。\",\"translation\":\"둘째 날에 교토에 갔어요.\",\"answer\":\"目\",\"why\":\"二日目는 이틀째라는 순서예요.\",\"distractors\":[{\"answer\":\"日\",\"why\":\"날짜 단위 日은 二日에 이미 들어 있어요. 순서를 붙이는 글자는 目예요.\"}]}},\"king-ball\":{\"diag\":\"D20\",\"title\":\"王과 玉의 점획\",\"rule\":\"王에는 오른쪽 아래 점이 없고, 玉에는 있어요.\",\"practice\":{\"prompt\":\"‘공’에 맞는 표기를 고르세요.\",\"fragment\":\"白い〔　〕が転がった。\",\"reading\":\"しろい たまが ころがった。\",\"translation\":\"하얀 공이 굴러갔어요.\",\"answer\":\"玉\",\"why\":\"玉는 たま라고 읽으며 둥근 공이나 구슬을 뜻해요.\",\"distractors\":[{\"answer\":\"王\",\"why\":\"王은 왕을 뜻해요. 굴러가는 물체의 표기에 맞지 않아요.\"}]},\"retest\":{\"prompt\":\"‘임금’을 나타내는 한자를 고르세요.\",\"fragment\":\"その国の〔　〕は若いです。\",\"reading\":\"その くにの おうは わかいです。\",\"translation\":\"그 나라의 왕은 젊어요.\",\"answer\":\"王\",\"why\":\"나라의 통치자는 王이라고 써요.\",\"distractors\":[{\"answer\":\"玉\",\"why\":\"점이 있는 玉는 공이나 구슬을 뜻해요.\"}]}},\"shell-see\":{\"diag\":\"D25\",\"title\":\"貝와 見의 끝 획\",\"rule\":\"貝의 아래 두 획은 八처럼 벌어져요. 見의 마지막 획은 오른쪽으로 굽어요.\",\"practice\":{\"prompt\":\"‘조개’를 뜻하는 글자를 고르세요.\",\"frag \":\"読む의 む는 った로 바뀌지 않아요.\"}]}},\"iku-te\":{\"diag\":\"D12\",\"title\":\"行く의 예외 て형\",\"rule\":\"行く의 て형은 예외적으로 行って예요.\",\"practice\":{\"prompt\":\"「行く」의 て형을 고르세요.\",\"fragment\":\"先に駅へ〔　〕ください。\",\"reading\":\"さきに えきへ いって ください。\",\"translation\":\"먼저 역으로 가 주세요.\",\"answer\":\"行って\",\"why\":\"行く는 예외라서 行って가 돼요.\",\"distractors\":[{\"answer\":\"行いて\",\"why\":\"일반 く 동사 규칙을 적용한 형태예요. 行く는 예외예요.\"},{\"answer\":\"行んで\",\"why\":\"んで는 む·ぶ·ぬ 동사에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「行く」를 て형으로 바꿔 행동을 연결하세요.\",\"fragment\":\"スーパーへ〔　〕、牛乳を買った。\",\"reading\":\"スーパーへ いって、ぎゅうにゅうを かった。\",\"translation\":\"슈퍼에 가서 우유를 샀어요.\",\"answer\":\"行って\",\"why\":\"行って가 가는 행동을 뒤 행동과 이어 줘요.\",\"distractors\":[{\"answer\":\"行いて\",\"why\":\"예외 동사 行く에는 いて 대신 って가 들어가요.\"},{\"answer\":\"行った\",\"why\":\"行った는 과거를 나타내요. 이 문항은 연결하는 て형을 묻고 있어요.\"}]}},\"r-nai\":{\"diag\":\"D17\",\"title\":\"5단 る 동사의 ない형\",\"rule\":\"5단 る 동사는 る를 ら로 바꾸고 ない를 붙여요.\",\"practice\":{\"prompt\":\"「入る」의 ない형을 고르세요.\",\"fragment\":\"ここには〔　〕でください。\",\"reading\":\"ここには はいらないで ください。\",\"translation\":\"여기에는 들어가지 마세요.\",\"answer\":\"入らない\",\"why\":\"入る는 5단 동사라서 入らない가 돼요.\",\"distractors\":[{\"answer\":\"入ない\",\"why\":\"る를 그대로 떼면 안 돼요. 여기서는 ら로 바꿔요.\"},{\"answer\":\"入りない\",\"why\":\"入り는 入ります의 어간이에요. ない형 앞에는 入ら를 써요.\"}]},\"retest\":{\"prompt\":\"「帰る」를 ない형으로 바꿔 ‘일찍 귀가해야 한다’를 완성하세요.\",\"fragment\":\"今日は早く〔　〕といけません。\",\"reading\":\"きょうは はやく かえらないと いけません。\",\"translation\":\"오늘은 일찍 귀가해야 해요.\",\"answer\":\"帰らない\",\"why\":\"帰る는 5단 동사예요. 帰らないといけません으로 필요성을 표현해요.\",\"distractors\":[{\"answer\":\"帰ない\",\"why\":\"1단 동사처럼 る를 뺀 형태예요. 帰る에는 ら가 필요해요.\"},{\"answer\":\"帰りない\",\"why\":\"帰り는 帰ります에 쓰여요. ない형은 帰らない예요.\"}]}},\"s-masu\":{\"diag\":\"D22\",\"title\":\"5단 す 동사의 ます형\",\"rule\":\"5단 す 동사는 す를 し로 바꾸고 ます를 붙여요.\",\"practice\":{\"prompt\":\"「出す」의 ます형을 골라 ‘제출하겠습니다’를 완성하세요.\",\"fragment\":\"明日、書類を〔　〕。\",\"reading\":\"あした、しょるいを だします。\",\"translation\":\"내일 서류를 제출하겠습니다.\",\"answer\":\"出します\",\"why\":\"出す의 す를 し로 바꾸면 出します가 돼요.\",\"distractors\":[{\"answer\":\"出せます\",\"why\ mpt\":\"문장에서 「つい」의 뜻을 고르세요.\",\"fragment\":\"疲れていて、つい電車で寝てしまった。\",\"reading\":\"つかれていて、つい でんしゃで ねてしまった。\",\"translation\":\"피곤해서 전철에서 그만 잠들어 버렸어요.\",\"answer\":\"그만\",\"why\":\"의도치 않게 잠들었다는 뜻이에요.\",\"distractors\":[{\"answer\":\"언제나\",\"why\":\"되풀이되는 빈도가 아니라 의도치 않은 한 행동을 말해요.\"},{\"answer\":\"정확히\",\"why\":\"정확성에 관한 말이 아니에요.\"}]}},\"todoku\":{\"diag\":\"D29\",\"title\":\"届く와 도착하는 대상\",\"rule\":\"届く는 물건이나 소식이 도착한다는 자동사예요.\",\"practice\":{\"prompt\":\"문장에서 「届いた」의 뜻을 고르세요.\",\"fragment\":\"昨日、注文した本が届いた。\",\"reading\":\"きのう、ちゅうもんした ほんが とどいた。\",\"translation\":\"어제 주문한 책이 도착했어요.\",\"answer\":\"도착했어요\",\"why\":\"本が届いた에서 주어는 도착한 책이에요.\",\"distractors\":[{\"answer\":\"책을 보냈어요\",\"why\":\"보내거나 가져다주는 쪽의 행동에는 届ける를 쓸 수 있어요.\"},{\"answer\":\"책을 주문했어요\",\"why\":\"주문한 것은 注文した에 이미 나와요.\"}]},\"retest\":{\"prompt\":\"문장에서 「届きます」의 뜻을 고르세요.\",\"fragment\":\"新しい書類は明日届きます。\",\"reading\":\"あたらしい しょるいは あした とどきます。\",\"translation\":\"새 서류는 내일 도착해요.\",\"answer\":\"도착해요\",\"why\":\"書類は届きます에서 서류가 받는 곳에 도착해요.\",\"distractors\":[{\"answer\":\"가져다줘요\",\"why\":\"누군가가 가져다주는 동작은 届ける와 구별해요.\"},{\"answer\":\"작성해요\",\"why\":\"서류 작성이 아니라 배송이나 전달의 결과예요.\"}]}},\"taitei\":{\"diag\":\"D30\",\"title\":\"たいてい와 빈도\",\"rule\":\"たいてい는 대개, 보통이라는 빈도의 말이에요.\",\"practice\":{\"prompt\":\"문장에서 「たいてい」의 뜻을 고르세요.\",\"fragment\":\"休みの日はたいてい八時に起きます。\",\"reading\":\"やすみの ひは たいてい はちじに おきます。\",\"translation\":\"쉬는 날에는 보통 8시에 일어나요.\",\"answer\":\"보통\",\"why\":\"대부분의 쉬는 날이 그렇다는 말이에요.\",\"distractors\":[{\"answer\":\"가끔\",\"why\":\"가끔은 더 낮은 빈도예요.\"},{\"answer\":\"반드시\",\"why\":\"예외 없이 지켜야 할 조건이라는 뜻이 아니에요.\"}]},\"retest\":{\"prompt\":\"문장에서 「たいてい」의 뜻을 고르세요.\",\"fragment\":\"彼はたいてい歩いて学校へ行きます。\",\"reading\":\"かれは たいてい あるいて がっこうへ いきます。\",\"translation\":\"그는 대개 걸어서 학교에 가요.\",\"answer\":\"대개\",\"why\":\"일반적으로 하는 행동이라는 뜻이에요.\",\"distractors\":[{\"answer\":\"드물게\",\"why\":\"빈도가 낮다는 말은 반대 방향이에요.\"},{\"answer\":\"이미\",\"why\":\"시간이 앞섰다는 뜻이 아니라 행동의 빈도예요.\"}]}},\"koujou\":{\"diag\":\"D13\",\"title\":\"工場의 탁음과 장음\",\"rule\":\"工場를 こうじょう로 읽을
