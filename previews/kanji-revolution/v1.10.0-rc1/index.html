l\":\"kanji\",\"card\":2},{\"id\":\"extra-words\",\"label\":\"단어 읽기\",\"group\":\"학습 카드\",\"model\":\"words\"},{\"id\":\"complete\",\"label\":\"학습·실전 모든 카드\",\"group\":\"통합\",\"model\":\"all\"}],\"level_filters\":{\"N5\":\"(\\\"JLPT:N5 · 학습용\\\" or \\\"JLPT:N5\\\" or \\\"LevelSource:N5\\\")\",\"N4\":\"(\\\"JLPT:N4 · 학습용\\\" or \\\"JLPT:N4\\\" or \\\"LevelSource:N4\\\")\",\"N3\":\"(\\\"JLPT:N3 · 학습용\\\" or \\\"JLPT:N3\\\" or \\\"LevelSource:N3\\\")\",\"N2\":\"(\\\"JLPT:N2 · 학습용\\\" or \\\"JLPT:N2\\\" or \\\"LevelSource:N2\\\")\",\"N1\":\"(\\\"JLPT:N1 · 학습용\\\" or \\\"JLPT:N1\\\" or \\\"LevelSource:N1\\\")\"},\"all_levels_label\":\"N5~N1 전체\"};\nwindow.krFiltersMarkup=\"\u003cdetails class=\\\"af-helper\\\" data-af-helper>\\n  \u003csummary>오답·플래그로 복습할 카드 찾기\u003c/summary>\\n  \u003cdiv class=\\\"af-body\\\">\\n    \u003cp class=\\\"af-description\\\">\u003cstrong>1. 조건 선택 → 2. 검색식 복사 → 3. Anki의 ‘찾기’에 붙여넣기 → ‘모으기’\u003c/strong>\u003cbr>이 도우미는 조건을 Anki 검색식으로 바꿉니다. 실제 카드 기록을 조회하고 모으는 일은 Anki가 합니다.\u003c/p>\\n    \u003cdiv class=\\\"af-fields\\\">\\n      \u003clabel>급수 / 구분\u003cselect data-af-field=\\\"level\\\">\u003c/select>\u003c/label>\\n      \u003clabel>학습·문제 유형\u003cselect data-af-field=\\\"area\\\">\u003c/select>\u003c/label>\\n      \u003clabel>모을 기준\u003cselect data-af-field=\\\"reason\\\">\u003coption value=\\\"again_or_flag\\\">오답 + 플래그\u003c/option>\u003coption value=\\\"again\\\">오답 : 다시 평가\u003c/option>\u003coption value=\\\"flag\\\">헷갈림 : 플래그\u003c/option>\u003coption value=\\\"hard\\\">어려움 평가\u003c/option>\u003coption value=\\\"lapses\\\">반복 실패 : 누적 3회 이상\u003c/option>\u003c/select>\u003c/label>\\n      \u003clabel>평가 기록의 기간\u003cselect data-af-field=\\\"days\\\">\u003coption value=\\\"1\\\">오늘\u003c/option>\u003coption value=\\\"7\\\" selected>최근 7일\u003c/option>\u003coption value=\\\"14\\\">최근 14일\u003c/option>\u003coption value=\\\"30\\\">최근 30일\u003c/option>\u003c/select>\u003c/label>\\n      \u003clabel>한 번에 모을 카드\u003cselect data-af-field=\\\"limit\\\">\u003coption value=\\\"20\\\">20장\u003c/option>\u003coption value=\\\"50\\\">50장\u003c/option>\u003coption value=\\\"100\\\">100장\u003c/option>\u003coption value=\\\"200\\\">200장\u003c/option>\u003c/select>\u003c/label>\\n      \u003clabel>선택 기준\u003cselect data-af-field=\\\"order\\\">\u003coption value=\\\"random\\\">랜덤\u003c/option>\u003coption value=\\\"lapses\\\">복습 실패 횟수 많은 순\u003c/option>\u003c/select>\u003c/label>\\n    \u003c/div>\\n    \u003cp class=\\\"af-summary\\\" data-af-summary>\u003c/p>\\n    \u003cp class=\\\"af-description\\\" data-af-explanation>\u003c/p>\\n    \u003cp class=\\\"af-description\\\" data-af-order-explanation>\u003c/p>\\n    \u003clabel class=\\\"af-query-label\\\">Anki의 ‘찾기’에 넣을 검색식 — 아래 내용 전체\u003ctextarea data-af-query rows=\\\"3\\\" readonly spellcheck=\\\"false\\\" autocapitalize=\\\"off\\\" autocorrect=\\\"off\\\" aria-label=\\\"생성된 필터 검색식\\\">\u003c/textarea>\u003c/label>\\n    \u003cdiv class=\\\"af-buttons\\\">\u003cbutton type=\\\"button\\\" data-af-copy>검색식 복사\u003c/button>\u003cbutton type=\\\"button\\\" data-af-select>전체 선택 · 직접 복사\u003c/button>\u003c/div>\\n    \u003cp class=\\\"af-message\\\" data-af-message role=\\\"status\\\" aria-live=\\\"polite\\\">\u003c/p>\\n    \u003cdetails class=\\\"af-guide\\\" data-af-copy-check>\u003csummary>복사·붙여넣기가 되는지 확인\u003c/summary>\\n      \u003cp>PC에서는 위 ‘전체 선택 · 직접 복사’를 누른 뒤 \u003cstrong>Ctrl+C\u003c/strong>를 누르세요. iPhone·iPad에서는 검색식 칸을 길게 눌러 전체 선택 후 ‘복사’를 누르세요.\u003c/p>\\n      \u003clabel class=\\\"af-query-label\\\">이 확인 칸에 직접 붙여넣어 보세요\u003ctextarea data-af-paste rows=\\\"3\\\" spellcheck=\\\"false\\\" autocapitalize=\\\"off\\\" autocorrect=\\\"off\\\" placeholder=\\\"PC: 여기를 누르고 Ctrl+V / 모바일: 길게 눌러 붙여넣기\\\" aria-label=\\\"복사한 검색식 붙여넣기 확인\\\">\u003c/textarea>\u003c/label>\\n      \u003cp data-af-paste-result class=\\\"af-message\\\" role=\\\"status\\\" aria-live=\\\"polite\\\">아직 확인하지 않았습니다.\u003c/p>\\n      \u003cp>이 칸은 붙여넣기 확인용입니다. 실제 필터 덱은 Anki에서 만듭니다. 여기에는 들어가는데 Anki에 들어가지 않으면 Anki 창의 ‘찾기’를 클릭한 뒤 Ctrl+A → Ctrl+V를 누르세요.\u003c/p>\\n    \u003c/details>\\n    \u003cdl class=\\\"af-settings\\\">\\n      \u003cdt>Anki에 넣을 이름 예시\u003c/dt>\u003cdd data-af-name>\u003c/dd>\\n      \u003cdt>개수 제한\u003c/dt>\u003cdd data-af-limit>\u003c/dd>\\n      \u003cdt>선택 기준\u003c/dt>\u003cdd data-af-order>\u003c/dd>\\n      \u003cdt>일정 조정\u003c/dt>\u003cdd>추가 연습에서 기존 간격을 유지하려면 체크 해제\u003c/dd>\\n    \u003c/dl>\\n    \u003cdetails class=\\\"af-guide\\\" data-af-concept>\u003csummary>검색식이 카드 기록을 찾는 원리 · 예시로 보기\u003c/summary>\\n      \u003cp>\u003cstrong>노트에는 한자·뜻·급수 같은 내용이 들어 있고, 그 노트에서 만든 각 카드에는 평가 이력과 깃발이 따로 연결됩니다.\u003c/strong> Anki의 카드 정보에서 그 기록을 확인할 수 있습니다. 같은 노트의 읽기·쓰기 카드도 평가와 깃발은 서로 다를 수 있습니다.\u003c/p>\\n      \u003cp>이 도우미는 선택한 급수·유형·수집 기준을 Anki가 원래 지원하는 검색 문법으로 조합합니다. 검색식 자체에 카드나 학습기록이 들어 있지는 않습니다.\u003c/p>\\n      \u003cdl class=\\\"af-settings\\\" data-af-tokens>\u003c/dl>\\n      \u003cp>아래는 \u003cstrong>설명용 카드 5장\u003c/strong>입니다. 모두 선택한 급수·유형에 속한다고 가정합니다. 사용자의 실제 기록과 연결되어 있지 않습니다.\u003c/p>\\n      \u003cdiv class=\\\"af-table-wrap\\\">\u003ctable class=\\\"af-demo-table\\\">\u003cthead>\u003ctr>\u003cth>카드\u003c/th>\u003cth>‘다시’ 기록\u003c/th>\u003cth>현재 주황 깃발\u003c/th>\u003cth>‘어려움’ 기록\u003c/th>\u003cth>복습 실패 누계\u003c/th>\u003cth>조건 일치\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody data-af-demo-body>\u003c/tbody>\u003c/table>\u003c/div>\\n      \u003cp class=\\\"af-description\\\">A는 오늘 ‘다시’를 누른 후 ‘알맞음’으로 맞혔습니다. 마지막 평가가 알맞음이어도 오늘의 다시 기록은 남습니다. 복습 실패 누계는 복습 단계에서 잊어 다시 학습으로 돌아간 횟수이며, 학습 중 누른 모든 ‘다시’의 합계와는 다릅니다.\u003c/p>\\n      \u003cbutton type=\\\"button\\\" data-af-demo-build>예시 카드로 ‘모으기’ 실행\u003c/button>\\n      \u003cp data-af-demo-result class=\\\"af-message\\\" role=\\\"status\\\" aria-live=\\\"polite\\\">조건을 고른 뒤 예시 버튼을 누르면, 모일 카드와 순서를 볼 수 있습니다.\u003c/p>\\n    \u003c/details>\\n    \u003cdetails class=\\\"af-guide\\\">\u003csummary>Anki에서 필터 덱 만들기 · 다음에 다시 모으기\u003c/summary>\\n      \u003col>\u003cli>위 검색식을 복사합니다. 자동 복사가 안 되면 ‘전체 선택 · 직접 복사’를 사용합니다.\u003c/li>\u003cli>PC Anki에서 \u003cstrong>도구 → 필터 덱 만들기\u003c/strong>를 엽니다.\u003c/li>\u003cli>‘이름’을 정하고, \u003cstrong>‘찾기’를 클릭 → Ctrl+A → Ctrl+V\u003c/strong>로 기존 검색식 전체를 교체합니다. 이름은 복습 공간의 이름이고, 어떤 카드를 모을지는 ‘찾기’가 정합니다.\u003c/li>\u003cli>개수 제한과 선택 기준을 위 안내대로 맞추고 ‘모으기(Build)’를 누릅니다. 검색식만 붙여넣은 단계에서는 아직 카드가 모이지 않습니다.\u003c/li>\u003cli>Anki 덱 목록에서 정한 이름을 열어 복습합니다. 다음에는 같은 덱의 ‘다시 만들기(Rebuild)’로 새 기록을 반영합니다.\u003c/li>\u003c/ol>\\n      \u003cp>iPhone·iPad는 학습 화면의 Anki 도구 메뉴 → Filter/Cram에서 같은 검색식을 사용합니다. 앱·언어에 따라 버튼 이름이 다를 수 있습니다.\u003c/p>\\n      \u003cp>‘오답’은 Anki에서 직접 누른 ‘다시’ 평가 기록입니다. 카드 안에서 틀린 보기를 선택한 것만으로 이 기록이 생기지는 않습니다. ‘헷갈림’은 직접 붙인 주황 깃발입니다.\u003c/p>\\n      \u003cp>‘오답 + 플래그’는 \u003cstrong>둘 중 하나만 해당해도\u003c/strong> 모읍니다. 두 조건을 모두 충족해야 한다는 뜻이 아닙니다. 주황 깃발에는 기간 제한이 없습니다.\u003c/p>\\n      \u003cp>일시중지·묻힌 카드·다른 필터 덱에 들어간 카드는 모을 수 없습니다. 실제 수집 수는 Anki에서 확인하세요. 필터 덱의 학습 단계를 마친 카드는 원래 덱으로 돌아갑니다. 남은 카드는 ‘비우기(Empty)’로 돌려보낼 수 있습니다.\u003c/p>\\n      \u003cp>이미 저장한 Anki 필터 덱의 조건은 자동 변경되지 않습니다. 조건이나 노트 유형 이름을 바꿨다면 Anki의 찾기도 새 검색식으로 교체하세요.\u003c/p>\\n      \u003cp>선택 조건은 이 기기에 저장됩니다. 붙여넣기 확인 칸의 내용은 저장하지 않습니다.\u003c/p>\\n    \u003c/details>\\n  \u003c/div>\\n\u003c/details>\\n\";\n(function () {\n  'use strict';\n  var VERSION = '1.0.0';\n  var PREF_KEY = 'anki-filter-helper:' + String((window.AnkiFilterHelperConfig || {}).product_id || 'unconfigured') + ':v1';\n  var PROVIDED = window.AnkiFilterHelperConfig;\n  if (!PROVIDED || !PROVIDED.product_id || !PROVIDED.models || !Array.isArray(PROVIDED.areas) || !PROVIDED.areas.length || !Array.isArray(PROVIDED.levels)) {\n    window.AnkiFilterHelperError = '과목별 필터 설정이 필요합니다.';\n    Array.from(document.querySelectorAll('[data-af-helper]')).forEach(function(box){box.textContent = window.AnkiFilterHelperError;});\n    return;\n  }\n  var MODELS = PROVIDED.models;\n  var AREAS = PROVIDED.areas;\n  var LEVELS = PROVIDED.levels;\n  var LEVEL_FIELD = PROVIDED.level_field || 'Level';\n  var ALL_LABEL = PROVIDED.all_levels_label || '전체';\n  var REASONS = [\n    {id:'again_or_flag',label:'오답 + 플래그',short:'오답·플래그'},\n    {id:'again',label:'오답 : 다시 평가',short:'최근오답'},\n    {id:'flag',label:'헷갈림 : 플래그',short:'플래그'},\n    {id:'hard',label:'어려움 평가',short:'어려움'},\n    {id:'lapses',label:'반복 실패 : 누적 3회 이상',short:'반복실패'}\n  ];\n  var DEFAULTS = Object.assign({level:'all',area:AREAS[0].id,reason:'again_or_flag',days:7,limit:20,order:'random'},PROVIDED.defaults || {});\n\n  function member(value, choices, fallback) {\n    return choices.indexOf(value) >= 0 ? value : fallback;\n  }\n  function normalize(value) {\n    value = value && typeof value === 'object' ? value : {};\n    return {\n      level: member(value.level,['all'].concat(LEVELS.map(function(x){return x.id;})),DEFAULTS.level),\n      area: member(value.area,AREAS.map(function(a){return a.id;}),DEFAULTS.area),\n      reason: member(value.reason,REASONS.map(function(a){return a.id;}),DEFAULTS.reason),\n      days: member(Number(value.days),[1,7,14,30],DEFAULTS.days),\n      limit: member(Number(value.limit),[20,50,100,200],DEFAULTS.limit),\n      order: member(value.order,['random','lapses'],DEFAULTS.order)\n    };\n  }\n  function term(field, value) {\n    return '\"' + field + ':' + String(value).replace(/\\\\/g,'\\\\\\\\').replace(/\"/g,'\\\\\"') + '\"';\n  }\n  function spec(config) {\n    var c = normalize(config);\n    var area = AREAS.filter(function(a){return a.id === c.area;})[0];\n    var reason = REASONS.filter(function(a){return a.id === c.reason;})[0];\n    var parts = [];\n    if (area.scope) parts.push(area.scope);\n    else if (area.model === 'all') {\n      parts.push('(' + Object.keys(MODELS).map(function(k){return term('note',MODELS[k]);}).join(' or ') + ')');\n    } else parts.push(term('note',MODELS[area.model]));\n    if (area.card) parts.push('card:' + area.card);\n    if (area.legacy && c.level === 'all') {\n      var shared=parts[0]+' '+term(area.field,area.value);\n      var older=term('note',MODELS[area.legacy.model])+(area.legacy.field?' '+term(area.legacy.field,area.legacy.value):'');\n      parts[0]='(('+shared+') or ('+older+'))';\n    } else if (area.field) parts.push(term(area.field,area.value));\n    if (area.filter) parts.push(area.filter);\n    if (c.level !== 'all') parts.push(PROVIDED.level_filters[c.level]);\n    var recent = 'rated:' + c.days + ':';\n    var explanation;\n    if (c.reason === 'again_or_flag') {\n      parts.push('(' + recent + '1 or flag:2)');\n      explanation = '최근 ' + c.days + '일의 ‘다시’ 평가 또는 현재 주황 깃발, 둘 중 하나만 해당해도 모읍니다. 깃발에는 기간 제한이 없습니다.';\n    } else if (c.reason === 'again') {\n      parts.push(recent + '1');\n      explanation = '일반 학습에서 최근 ' + c.days + '일 안에 ‘다시’를 한 번 이상 누른 카드입니다.';\n    } else if (c.reason === 'flag') {\n      parts.push('flag:2');\n      explanation = '주황 깃발을 직접 단 카드입니다. 깃발을 단 날짜는 이 조건에 사용하지 않습니다.';\n    } else if (c.reason === 'hard') {\n      parts.push(recent + '2');\n      explanation = '최근 ' + c.days + '일 안에 Anki의 ‘어려움’을 누른 카드입니다.';\n    } else {\n      parts.push('is:review prop:lapses>=3');\n      explanation = '복습 단계에서 다시 학습으로 돌아간 누적 횟수가 3회 이상인 카드입니다. 기간 조건은 없습니다.';\n    }\n    var tokens = [{label:'노트 유형',code:parts[0],meaning:area.model === 'all' ? '이 제품의 학습·실전 노트 유형 안에서 찾습니다.' : '선택한 유형의 노트에서 만든 카드 안에서 찾습니다.'}];\n    if (area.card) tokens.push({label:'카드 유형',code:'card:' + area.card,meaning:'같은 노트에서 만든 카드 중 ‘' + area.label + '’ 카드만 찾습니다.'});\n    if (area.field) tokens.push({label:'문제 유형',code:term(area.field,area.value),meaning:area.value + '에 해당하는 내용만 찾습니다.'});\n    if (c.level !== 'all') tokens.push({label:PROVIDED.level_label || '급수·구분',code:PROVIDED.level_filters[c.level],meaning:'선택한 급수·구분에 해당하는 카드만 찾습니다.'});\n    tokens.push({label:'카드 기록',code:parts[parts.length-1],meaning:explanation});\n    return {\n      config:c,search:parts.join(' '),limit:c.limit,\n      order:c.order === 'lapses' ? '복습 실패 횟수 많은 순 · Most lapses' : '랜덤',\n      deckName:'00_' + PROVIDED.product_id + '_복습_' + (c.level === 'all' ? ALL_LABEL : c.level) + '_' + area.label.replace(/\\s+/g,'') + '_' + reason.short,\n      summary:(c.level === 'all' ? ALL_LABEL : c.level) + ' · ' + area.label + ' · ' + reason.label,\n      explanation:explanation,usesDays:c.reason !== 'flag' && c.reason !== 'lapses',tokens:tokens,\n      orderExplanation:c.order === 'lapses'\n        ? '선택 기준: 검색 조건에 맞는 카드 중, 복습 실패 누계가 많은 카드부터 최대 ' + c.limit + '장을 모읍니다. 이 누계는 최근 기간의 ‘다시’ 횟수와 다릅니다. Anki 창에서도 같은 선택 기준을 지정하세요.'\n        : '선택 기준: 검색 조건에 맞는 카드 중 무작위로 최대 ' + c.limit + '장을 모읍니다. Anki 창에서도 ‘랜덤’을 지정하세요.'\n    };\n  }\n  var DEMO_CARDS = [\n    {id:'A',again:[0],hard:[],flag:0,lapses:2,last:'알맞음'},\n    {id:'B',again:[],hard:[],flag:2,lapses:0,last:'알맞음'},\n    {id:'C',again:[10],hard:[],flag:0,lapses:5,last:'다시'},\n    {id:'D',again:[],hard:[0],flag:0,lapses:1,last:'어려움'},\n    {id:'E',again:[2],hard:[0],flag:2,lapses:4,last:'어려움'}\n  ];\n  function demoMatches(card, config) {\n    var c = normalize(config);\n    var again = card.again.some(function(day){return day \u003c c.days;});\n    var hard = card.hard.some(function(day){return day \u003c c.days;});\n    if (c.reason === 'again_or_flag') return again || card.flag === 2;\n    if (c.reason === 'again') return again;\n    if (c.reason === 'flag') return card.flag === 2;\n    if (c.reason === 'hard') return hard;\n    return card.lapses >= 3;\n  }\n  function readConfig() {\n    try {\n      var raw = window.localStorage.getItem(PREF_KEY);\n      return normalize(raw ? JSON.parse(raw) : window.__ankiFilterHelperPrefs);\n    }\n    catch (error) { return normalize(window.__ankiFilterHelperPrefs); }\n  }\n  function saveConfig(c) {\n    window.__ankiFilterHelperPrefs = c;\n    try { window.localStorage.setItem(PREF_KEY,JSON.stringify(c)); return true; }\n    catch (error) { return false; }\n  }\n  function feedbackHint(root) {\n    var recap = root.querySelector('[data-pq-choice-summary]');\n    var hint = root.querySelector('[data-af-review-hint]');\n    if (!recap || recap.dataset.pqResult !== 'wrong') {\n      if (hint) hint.remove();\n      return;\n    }\n    if (!hint) {\n      hint = document.createElement('p');\n      hint.className = 'af-review-hint';\n      hint.setAttribute('data-af-review-hint','');\n      hint.setAttribute('role','status');\n      recap.parentNode.insertBefore(hint,recap.nextSibling);\n    }\n    var preview = root.dataset.apMode === 'preview';\n    hint.textContent = preview\n      ? '실제 Anki 일반 학습에서 ‘다시’를 한 번 누르면 최근 오답 조건에 해당합니다. 카드 수집은 Anki 필터 덱의 ‘모으기(Build)’ 또는 ‘다시 만들기(Rebuild)’에서 실행하세요.'\n      : (root.dataset.apFace === 'front'\n        ? '일반 학습에서 Anki의 ‘정답 보기’를 연 뒤, 아래 평가에서 ‘다시’를 한 번 누르세요. 이후 Anki 필터 덱에서 ‘모으기(Build)’ 또는 ‘다시 만들기(Rebuild)’로 카드를 모읍니다.'\n        : '일반 학습에서 아래 Anki 평가의 ‘다시’를 한 번 누르세요. 이후 Anki 필터 덱에서 ‘모으기(Build)’ 또는 ‘다시 만들기(Rebuild)’로 카드를 모읍니다.');\n  }\n  function mount(root) {\n    if (!root || root.dataset.afReady === VERSION) return;\n    var box = root.querySelector('[data-af-helper]');\n    if (!box) return;\n    root.dataset.afReady = VERSION;\n    var controls = Array.from(box.querySelectorAll('[data-af-field]'));\n    var areaSelect = box.querySelector('[data-af-field=\"area\"]');\n    var levelSelect = box.querySelector('[data-af-field=\"level\"]');\n    levelSelect.textContent = '';\n    [{id:'all',label:ALL_LABEL}].concat(LEVELS).forEach(function(item){\n      var option = document.createElement('option');option.value=item.id;option.textContent=item.label || item.id;levelSelect.appendChild(option);\n    });\n    levelSelect.disabled = !LEVELS.length;\n    var current = readConfig();\n    var groups = {};\n    AREAS.forEach(function(a) {\n      if (!groups[a.group]) {\n        var group = document.createElement('optgroup');\n        group.label = a.group;\n        areaSelect.appendChild(group);\n        groups[a.group] = group;\n      }\n      var option = document.createElement('option');\n      option.value = a.id; option.textContent = a.label;\n      groups[a.group].appendChild .querySelector('canvas');\n  var status = root.querySelector('.kr-pad-status');\n  var toggle = root.querySelector('[data-action=\"enable\"]');\n  var active = null, pointerId = null, enabled = false, observer = null;\n  var ctx = null, draftKey = 'kr-pad-v022-front';\n  var state = null, notice = '', edited = false;\n  function validStrokes(strokes) {\n    return Array.isArray(strokes) && strokes.length \u003c= 500 && strokes.every(function (s) {\n      return Array.isArray(s) && s.length \u003c= 10000 && s.every(function (p) {\n        return p && typeof p.x === 'number' && typeof p.y === 'number' &&\n          isFinite(p.x) && isFinite(p.y) && p.x >= 0 && p.x \u003c= 1 && p.y >= 0 && p.y \u003c= 1;\n      });\n    });\n  }\n  function readStore(store, key) {\n    try { return window[store].getItem(key); } catch (_) { return null; }\n  }\n  function writeStore(store, key, raw) {\n    try { window[store].setItem(key, raw); } catch (_) {}\n  }\n  function parsed(raw) {\n    try { return JSON.parse(raw || 'null'); } catch (_) { return null; }\n  }\n  function parseDraft(raw) {\n    var item = parsed(raw);\n    if (item && typeof item.key === 'string' && Number.isFinite(item.savedAt) && validStrokes(item.strokes)) return item;\n    return null;\n  }\n  function readDraft() {\n    var direct = parseDraft(window.__krPadFrontDraft) || parseDraft(readStore('sessionStorage', draftKey));\n    if (direct && direct.key === key) return direct;\n    var shared = parseDraft(readStore('localStorage', draftKey));\n    if (shared && shared.key === key && (!direct || shared.savedAt >= direct.savedAt)) return shared;\n    if (direct || shared) return null;\n    var previous = parsed(readStore('sessionStorage', 'kr-pad-v021-last'));\n    if (!previous || previous.key !== key || !validStrokes(previous.strokes)) return null;\n    return previous;\n  }\n  function saveDraft(strokes, wasEnabled) {\n    // Only the front-side draft is saved here. Parsing it on the back creates independent arrays.\n    var raw = JSON.stringify({key:key, strokes:strokes, enabled:wasEnabled, savedAt:Date.now()});\n    window.__krPadFrontDraft = raw;\n    writeStore('sessionStorage', draftKey, raw);\n    writeStore('localStorage', draftKey, raw);\n    return raw;\n  }\n  if (canvas) {\n    var initial = side === 'back' ? readDraft() : null;\n    state = {key:key, strokes:initial ? initial.strokes : [], enabled:Boolean(initial && initial.enabled)};\n    window.__krPadState = state;\n    try { ctx = canvas.getContext('2d'); } catch (_) {}\n  }\n  function persist() {\n    if (!canvas) return;\n    state.enabled = enabled;\n    window.__krPadState = state;\n    if (side === 'front') {\n      saveDraft(state.strokes, enabled);\n      if (window.parent !== window) {\n        window.parent.postMessage({ type: 'kr-pad', note: key, strokes: state.strokes, enabled: enabled }, '*');\n      }\n    }\n  }\n  function stop(e) {\n    e.stopPropagation();\n    if (e.stopImmediatePropagation) e.stopImmediatePropagation();\n    if (e.cancelable) e.preventDefault();\n  }\n  function redraw() {\n    if (!canvas || !ctx) return;\n    var r = canvas.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 3);\n    if (!r.width || !r.height) return;\n    canvas.width = Math.round(r.width * d); canvas.height = Math.round(r.height * d);\n    ctx.setTransform(d, 0, 0, d, 0, 0);\n    ctx.strokeStyle = getComputedStyle(root).getPropertyValue('--kr-text').trim() || '#242722';\n    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';\n    state.strokes.forEach(function (stroke) {\n      ctx.beginPath();\n      stroke.forEach(function (p, i) {\n        if (i) ctx.lineTo(p.x * r.width, p.y * r.height); else ctx.moveTo(p.x * r.width, p.y * r.height);\n      });\n      if (stroke.length === 1) ctx.lineTo(stroke[0].x * r.width + 0.1, stroke[0].y * r.height + 0.1);\n      ctx.stroke();\n    });\n    if (status) status.textContent = notice || (state.strokes.length + '획 · ' + (enabled ? '필기 중 · 직접 비교' : '필기 시작을 눌러 입력'));\n  }\n  function setEnabled(value) {\n    notice = '';\n    enabled = Boolean(value && ctx);\n    if (pad) { pad.hidden = false; pad.classList.toggle('kr-active', enabled); }\n    if (canvas) {\n      canvas.style.pointerEvents = enabled ? 'auto' : 'none';\n      canvas.setAttribute('aria-disabled', String(!enabled));\n    }\n    if (toggle) {\n      toggle.setAttribute('aria-pressed', String(enabled));\n      toggle.textContent = enabled ? '필기 잠금' : '필기 시작';\n      toggle.disabled = !ctx;\n    }\n    if (!enabled) { active = null; pointerId = null; }\n    redraw();\n    if (!ctx && status) status.textContent = '이 화면에서 필기판을 초기화하지 못했습니다. 앱·버전을 확인해 주세요.';\n    persist();\n  }\n  function point(e) {\n    var r = canvas.getBoundingClientRect();\n    if (!r.width || !r.height) return null;\n    var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;\n    return x >= 0 && x \u003c= 1 && y >= 0 && y \u003c= 1 ? { x: x, y: y } : null;\n  }\n  function down(e) {\n    if (!enabled) return;\n    stop(e);\n    if (active || e.isPrimary === false || (e.button !== undefined && e.button !== 0)) return;\n    var p = point(e); if (!p || state.strokes.length >= 500) return;\n    edited = true; notice = '';\n    active = [p]; pointerId = e.pointerId; state.strokes.push(active);\n    if (e.pointerId !== undefined && canvas.setPointerCapture) {\n      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}\n    }\n    redraw();\n  }\n  function move(e) {\n    if (!enabled) return;\n    stop(e);\n    if (!active || (pointerId !== undefined && e.pointerId !== pointerId)) return;\n    var p = point(e);\n    if (!p) { active = null; pointerId = null; persist(); return; }\n    if (active.length \u003c 10000) active.push(p);\n    redraw();\n  }\n  function up(e) {\n    if (!enabled) return;\n    stop(e);\n    if (pointerId !== null && pointerId !== undefined && e.pointerId !== pointerId) return;\n    if (e.pointerId !== undefined && canvas.releasePointerCapture) {\n      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}\n    }\n    active = null; pointerId = null; redraw(); persist();\n  }\n  function touch(type, e) {\n    if (!enabled) return;\n    stop(e);\n    if (type === 'touchstart' && e.touches && e.touches.length > 1) return;\n    var t = e.changedTouches && e.changedTouches[0]; if (!t) return;\n    var x = { clientX: t.clientX, clientY: t.clientY, pointerId: t.identifier,\n      cancelable: false, stopPropagation: function () {}, stopImmediatePropagation: function () {} };\n    if (type === 'touchstart') down(x); else if (type === 'touchmove') move(x); else up(x);\n  }\n  function onMessage(e) {\n    if (!canvas || side !== 'back' || e.source !== window.parent || !e.data ||\n      e.data.type !== 'kr-pad-sync' || e.data.note !== key || !validStrokes(e.data.strokes)) return;\n    var raw = saveDraft(e.data.strokes, Boolean(e.data.enabled));\n    if (!edited) {\n      state.strokes = parsed(raw).strokes;\n      redraw(); persist();\n    }\n  }\n  function restore() {\n    var original = readDraft();\n    if (!original || !original.strokes.length) {\n      notice = '불러올 앞면 필기가 없습니다. 한자 쓰기 앞면에서 필기 시작을 눌러 써주세요.';\n    } else {\n      state.strokes = original.strokes;\n      active = null; pointerId = null;\n      edited = true;\n      notice = '앞면 필기 ' + state.strokes.length + '획을 불러왔습니다.';\n      persist();\n    }\n    redraw();\n  }\n  if (canvas) {\n    if (window.PointerEvent) {\n      canvas.addEventListener('pointerdown', down); canvas.addEventListener('pointermove', move);\n      canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n    } else {\n      canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move);\n      canvas.addEventListener('mouseup', up); canvas.addEventListener('mouseleave', up);\n      ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (type) {\n        canvas.addEventListener(type, function (e) { touch(type, e); }, { passive: false });\n      });\n    }\n    ['click', 'dblclick', 'contextmenu', 'touchstart', 'touchmove', 'touchend'].forEach(function (type) {\n      canvas.addEventListener(type, function (e) { if (enabled) stop(e); }, { passive: false });\n    });\n    if (window.parent !== window) window.addEventListener('message', onMessage);\n    if (window.ResizeObserver) { observer = new ResizeObserver(redraw); observer.observe(canvas); }\n    setEnabled(side === 'back' && state.enabled);\n  }\n  root.querySelectorAll('button[data-action]').forEach(function (button) {\n    button.addEventListener('click', function (e) {\n      stop(e); var action = button.getAttribute('data-action');\n      if (action === 'enable' && canvas) setEnabled(!enabled);\n      if (action === 'undo' && canvas) { state.strokes.pop(); active = null; pointerId = null; edited = true; notice = ''; redraw(); persist(); }\n      if (action === 'clear' && canvas) { state.strokes = []; active = null; pointerId = null; edited = true; notice = ''; redraw(); persist(); }\n      if (action === 'ghost') {\n        var ghost = root.querySelector('.kr-ghost');\n        if (ghost) { ghost.hidden = !ghost.hidden; button.setAttribute('aria-pressed', String(!ghost.hidden)); }\n      }\n      if (action === 'sync' && canvas) restore();\n      if (action === 'replay') {\n        var img = root.querySelector('.kr-stroke img');\n        if (img) { var next = img.cloneNode(); next.src = img.src.split('#')[0] + '#kr' + Date.now(); img.replaceWith(next); }\n      }\n    });\n  });\n  window.__krPadCleanup = function () {\n    if (observer) observer.disconnect();\n    window.removeEventListener('message', onMessage);\n  };\n})();\n\u003c/script>\n\u003cscript type=\"application/json\" data-kr180-bank>{\"version\":\"v1.10.0-RC1\",\"diagnosis\":[{\"id\":\"D01\",\"track\":\"read\",\"prompt\":\"역을 뜻하는 「駅」의 읽기를 고르세요.\",\"stimulus\":\"駅で友達を待ちます。\",\"options\":[\"せき\",\"えき\",\"い 지\",\"why\":\"여기서는 서두르는 정도를 낮추는 말이에요.\",\"distractors\":[{\"answer\":\"반드시\",\"why\":\"의무를 나타내는 말이 아니에요.\"},{\"answer\":\"벌써\",\"why\":\"시간보다 동작의 정도를 나타내요.\"}]},\"retest\":{\"prompt\":\"문장에서 「そんなに」의 뜻을 고르세요.\",\"fragment\":\"そんなに高いとは思わなかった。\",\"reading\":\"そんなに たかいとは おもわなかった。\",\"translation\":\"그렇게 비쌀 줄은 몰랐어요.\",\"answer\":\"그렇게\",\"why\":\"비싸다고 느끼는 정도를 나타내요.\",\"distractors\":[{\"answer\":\"항상\",\"why\":\"빈도를 나타내는 말이 아니에요.\"},{\"answer\":\"드디어\",\"why\":\"기다린 일이 일어났다는 시간의 뜻은 아니에요.\"}]}},\"mada\":{\"diag\":\"D21\",\"title\":\"まだ와 남아 있는 상태\",\"rule\":\"まだ는 아직 어떤 상태가 이어지거나 일이 완료되지 않았다는 뜻이에요.\",\"practice\":{\"prompt\":\"문장에서 「まだ」의 뜻을 고르세요.\",\"fragment\":\"仕事はまだ終わっていません。\",\"reading\":\"しごとは まだ おわっていません。\",\"translation\":\"일은 아직 끝나지 않았어요.\",\"answer\":\"아직\",\"why\":\"완료되지 않은 상태예요.\",\"distractors\":[{\"answer\":\"이미\",\"why\":\"이미는 완료 또는 선행을 뜻해서 이 まだ와 맞지 않아요.\"},{\"answer\":\"곧\",\"why\":\"곧은 미래 가까운 시점을 뜻해요.\"}]},\"retest\":{\"prompt\":\"문장에서 「まだ」의 뜻을 고르세요.\",\"fragment\":\"会議までまだ時間があります。\",\"reading\":\"かいぎまで まだ じかんが あります。\",\"translation\":\"회의까지 아직 시간이 있어요.\",\"answer\":\"아직\",\"why\":\"아직 시간이 남아 있다는 뜻이에요.\",\"distractors\":[{\"answer\":\"벌써\",\"why\":\"벌써는 예상보다 빠른 시점을 말해요.\"},{\"answer\":\"가끔\",\"why\":\"빈도를 나타내는 말이에요.\"}]}},\"maniau\":{\"diag\":\"D26\",\"title\":\"間に合う와 시간 맞추기\",\"rule\":\"間に合う는 정해진 시각이나 마감에 늦지 않는다는 뜻이에요.\",\"practice\":{\"prompt\":\"문장에서 「間に合います」의 뜻을 고르세요.\",\"fragment\":\"今から出れば、会議に間に合います。\",\"reading\":\"いまから でれば、かいぎに まにあいます。\",\"translation\":\"지금 출발하면 회의 시간에 맞아요.\",\"answer\":\"시간에 맞습니다\",\"why\":\"출발 시각과 회의 시각을 맞출 수 있다는 뜻이에요.\",\"distractors\":[{\"answer\":\"회의가 연기됩니다\",\"why\":\"회의 시간을 미룬다는 말이 없어요.\"},{\"answer\":\"회의를 끝냅니다\",\"why\":\"회의 종료가 아니라 시작 시각에 맞추는 장면이에요.\"}]},\"retest\":{\"prompt\":\"문장에서 「間に合う」의 뜻을 고르세요.\",\"fragment\":\"急げば、締め切りに間に合う。\",\"reading\":\"いそげば、しめきりに まにあう。\",\"translation\":\"서두르면 마감에 맞출 수 있어요.\",\"answer\":\"마감에 맞춥니다\",\"why\":\"締め切りに間に合う는 마감에 늦지 않는다는 뜻이에요.\",\"distractors\":[{\"answer\":\"마감을 바꿉니다\",\"why\":\"마감 ) {\n    try { return window[store].getItem(key); } catch (_) { return null; }\n  }\n  function writeStore(store, key, raw) {\n    try { window[store].setItem(key, raw); } catch (_) {}\n  }\n  function parsed(raw) {\n    try { return JSON.parse(raw || 'null'); } catch (_) { return null; }\n  }\n  function parseDraft(raw) {\n    var item = parsed(raw);\n    if (item && typeof item.key === 'string' && Number.isFinite(item.savedAt) && validStrokes(item.strokes)) return item;\n    return null;\n  }\n  function readDraft() {\n    var direct = parseDraft(window.__krPadFrontDraft) || parseDraft(readStore('sessionStorage', draftKey));\n    if (direct && direct.key === key) return direct;\n    var shared = parseDraft(readStore('localStorage', draftKey));\n    if (shared && shared.key === key && (!direct || shared.savedAt >= direct.savedAt)) return shared;\n    if (direct || shared) return null;\n    var previous = parsed(readStore('sessionStorage', 'kr-pad-v021-last'));\n    if (!previous || previous.key !== key || !validStrokes(previous.strokes)) return null;\n    return previous;\n  }\n  function saveDraft(strokes, wasEnabled) {\n    // Only the front-side draft is saved here. Parsing it on the back creates independent arrays.\n    var raw = JSON.stringify({key:key, strokes:strokes, enabled:wasEnabled, savedAt:Date.now()});\n    window.__krPadFrontDraft = raw;\n    writeStore('sessionStorage', draftKey, raw);\n    writeStore('localStorage', draftKey, raw);\n    return raw;\n  }\n  if (canvas) {\n    var initial = side === 'back' ? readDraft() : null;\n    state = {key:key, strokes:initial ? initial.strokes : [], enabled:Boolean(initial && initial.enabled)};\n    window.__krPadState = state;\n    try { ctx = canvas.getContext('2d'); } catch (_) {}\n  }\n  function persist() {\n    if (!canvas) return;\n    state.enabled = enabled;\n    window.__krPadState = state;\n    if (side === 'front') {\n      saveDraft(state.strokes, enabled);\n      if (window.parent !== window) {\n        window.parent.postMessage({ type: 'kr-pad', note: key, strokes: state.strokes, enabled: enabled }, '*');\n      }\n    }\n  }\n  function stop(e) {\n    e.stopPropagation();\n    if (e.stopImmediatePropagation) e.stopImmediatePropagation();\n    if (e.cancelable) e.preventDefault();\n  }\n  function redraw() {\n    if (!canvas || !ctx) return;\n    var r = canvas.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 3);\n    if (!r.width || !r.height) return;\n    canvas.width = Math.round(r.width * d); canvas.height = Math.round(r.height * d);\n    ctx.setTransform(d, 0, 0, d, 0, 0);\n    ctx.strokeStyle = getComputedStyle(root).getPropertyValue('--kr-text').trim() || '#242722';\n    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';\n    state.strokes.forEach(function (stroke) {\n      ctx.beginPath();\n      stroke.forEach(function (p, i) {\n        if (i) ctx.lineTo(p.x * r.width, p.y * r.height); else ctx.moveTo(p.x * r.width, p.y * r.height);\n      });\n      if (stroke.length === 1) ctx.lineTo(stroke[0].x * r.width + 0.1, stroke[0].y * r.height + 0.1);\n      ctx.stroke();\n    });\n    if (status) status.textContent = notice || (state.strokes.length + '획 · ' + (enabled ? '필기 중 · 직접 비교' : '필기 시작을 눌러 입력'));\n  }\n  function setEnabled(value) {\n    notice = '';\n    enabled = Boolean(value && ctx);\n    if (pad) { pad.hidden = false; pad.classList.toggle('kr-active', enabled); }\n    if (canvas) {\n      canvas.style.pointerEvents = enabled ? 'auto' : 'none';\n      canvas.setAttribute('aria-disabled', String(!enabled));\n    }\n    if (toggle) {\n      toggle.setAttribute('aria-pressed', String(enabled));\n      toggle.textContent = enabled ? '필기 잠금' : '필기 시작';\n      toggle.disabled = !ctx;\n    }\n    if (!enabled) { active = null; pointerId = null; }\n    redraw();\n    if (!ctx && status) status.textContent = '이 화면에서 필기판을 초기화하지 못했습니다. 앱·버전을 확인해 주세요.';\n    persist();\n  }\n  function point(e) {\n    var r = canvas.get || !e.data ||\n      e.data.type !== 'kr-pad-sync' || e.data.note !== key || !validStrokes(e.data.strokes)) return;\n    var raw = saveDraft(e.data.strokes, Boolean(e.data.enabled));\n    if (!edited) {\n      state.strokes = parsed(raw).strokes;\n      redraw(); persist();\n    }\n  }\n  function restore() {\n    var original = readDraft();\n    if (!original || !original.strokes.length) {\n      notice = '불러올 앞면 필기가 없습니다. 한자 쓰기 앞면에서 필기 시작을 눌러 써주세요.';\n    } else {\n      state.strokes = original.strokes;\n      active = null; pointerId = null;\n      edited = true;\n      notice = '앞면 필기 ' + state.strokes.length + '획을 불러왔습니다.';\n      persist();\n    }\n    redraw();\n  }\n  if (canvas) {\n    if (window.PointerEvent) {\n      canvas.addEventListener('pointerdown', down); canvas.addEventListener('pointermove', move);\n      canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n    } else {\n      canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move);\n      canvas.addEventListener('mouseup', up); canvas.addEventListener('mouseleave', up);\n      ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (type) {\n        canvas.addEventListener(type, function (e) { touch(type, e); }, { passive: false });\n      });\n    }\n    ['click', 'dblclick', 'contextmenu', 'touchstart', 'touchmove', 'touchend'].forEach(function (type) {\n      canvas.addEventListener(type, function (e) { if (enabled) stop(e); }, { passive: false });\n    });\n    if (window.parent !== window) window.addEventListener('message', onMessage);\n    if (window.ResizeObserver) { observer = new ResizeObserver(redraw); observer.observe(canvas); }\n    setEnabled(side === 'back' && state.enabled);\n  }\n  root.querySelectorAll('button[data-action]').forEach(function (button) {\n    button.addEventListener('click', function (e) {\n      stop(e); var action = button.getAttribute('data-action');\n      if (action === 'enable' && canvas) setEnabled(!enabled);\n      if (action === 'undo' && canvas) { state.strokes.pop(); active = null; pointerId = null; edited = true; notice = ''; redraw(); persist(); }\n      if (action === 'clear' && canvas) { state.strokes = []; active = null; pointerId = null; edited = true; notice = ''; redraw(); persist(); }\n      if (action === 'ghost') {\n        var ghost = root.querySelector('.kr-ghost');\n        if (ghost) { ghost.hidden = !ghost.hidden; button.setAttribute('aria-pressed', String(!ghost.hidden)); }\n      }\n      if (action === 'sync' && canvas) restore();\n      if (action === 'replay') {\n        var img = root.querySelector('.kr-stroke img');\n        if (img) { var next = img.cloneNode(); next.src = img.src.split('#')[0] + '#kr' + Date.now(); img.replaceWith(next); }\n      }\n    });\n  });\n  window.__krPadCleanup = function () {\n    if (observer) observer.disconnect();\n    window.removeEventListener('message', onMessage);\n  };\n})();\n\u003c/script>\n\u003cdiv hidden data-kr180-review>\u003cdiv data-review-prompt>見送る\u003c/div>\u003cdiv data-review-answer>みおくる / 배웅하다\u003c/div>\u003c/div>\u003cdiv data-kr190-word hidden>\u003cspan data-word>見送る\u003c/span>\u003cspan data-reading>みおくる\u003c/span>\u003c/div>\u003cscript type=\"application/json\" data-kr180-bank>{\"version\":\"v1.10.0-RC1\",\"diagnosis\":[{\"id\":\"D01\",\"track\":\"read\",\"prompt\":\"역을 뜻하는 「駅」의 읽기를 고르세요.\",\"stimulus\":\"駅で友達を待ちます。\",\"options\":[\"せき\",\"えき\",\"いき\"],\"answer\":\"えき\",\"feedback\":\"駅（えき）는 ‘역’입니다.\",\"skill\":\"한자 읽기\",\"quick\":true},{\"id\":\"D02\",\"track\":\"write\",\"prompt\":\"‘손 수’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"手\",\"feedback\":\"手의 마지막 획은 아래에서 왼쪽으로 살짝 꺾입니다.\",\"skill\":\"모양 회상\",\"quick\":true},{\"id\":\"D03\",\"track\":\"similar\",\"prompt\":\"‘토요일’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕曜日（どようび）\",\"options\":[\"士\",\"王\",\"土\"],\"answer\":\"土\",\"feedback\":\"土曜日에는 아래 가로획이 긴 土가 들어갑니다.\",\"skill\":\" 의무나 필연을 나타내지 않아요.\"}]},\"retest\":{\"prompt\":\"문장에서 「つい」의 뜻을 고르세요.\",\"fragment\":\"疲れていて、つい電車で寝てしまった。\",\"reading\":\"つかれていて、つい でんしゃで ねてしまった。\",\"translation\":\"피곤해서 전철에서 그만 잠들어 버렸어요.\",\"answer\":\"그만\",\"why\":\"의도치 않게 잠들었다는 뜻이에요.\",\"distractors\":[{\"answer\":\"언제나\",\"why\":\"되풀이되는 빈도가 아니라 의도치 않은 한 행동을 말해요.\"},{\"answer\":\"정확히\",\"why\":\"정확성에 관한 말이 아니에요.\"}]}},\"todoku\":{\"diag\":\"D29\",\"title\":\"届く와 도착하는 대상\",\"rule\":\"届く는 물건이나 소식이 도착한다는 자동사예요.\",\"practice\":{\"prompt\":\"문장에서 「届いた」의 뜻을 고르세요.\",\"fragment\":\"昨日、注文した本が届いた。\",\"reading\":\"きのう、ちゅうもんした ほんが とどいた。\",\"translation\":\"어제 주문한 책이 도착했어요.\",\"answer\":\"도착했어요\",\"why\":\"本が届いた에서 주어는 도착한 책이에요.\",\"distractors\":[{\"answer\":\"책을 보냈어요\",\"why\":\"보내거나 가져다주는 쪽의 행동에는 届ける를 쓸 수 있어요.\"},{\"answer\":\"책을 주문했어요\",\"why\":\"주문한 것은 注文した에 이미 나와요.\"}]},\"retest\":{\"prompt\":\"문장에서 「届きます」의 뜻을 고르세요.\",\"fragment\":\"新しい書類は明日届きます。\",\"reading\":\"あたらしい しょるいは あした とどきます。\",\"translation\":\"새 서류는 내일 도착해요.\",\"answer\":\"도착해요\",\"why\":\"書類は届きます에서 서류가 받는 곳에 도착해요.\",\"distractors\":[{\"answer\":\"가져다줘요\",\"why\":\"누군가가 가져다주는 동작은 届ける와 구별해요.\"},{\"answer\":\"작성해요\",\"why\":\"서류 작성이 아니라 배송이나 전달의 결과예요.\"}]}},\"taitei\":{\"diag\":\"D30\",\"title\":\"たいてい와 빈도\",\"rule\":\"たいてい는 대개, 보통이라는 빈도의 말이에요.\",\"practice\":{\"prompt\":\"문장에서 「たいてい」의 뜻을 고르세요.\",\"fragment\":\"休みの日はたいてい八時に起きます。\",\"reading\":\"やすみの ひは たいてい はちじに おきます。\",\"translation\":\"쉬는 날에는 보통 8시에 일어나요.\",\"answer\":\"보통\",\"why\":\"대부분의 쉬는 날이 그렇다는 말이에요.\",\"distractors\":[{\"answer\":\"가끔\",\"why\":\"가끔은 더 낮은 빈도예요.\"},{\"answer\":\"반드시\",\"why\":\"예외 없이 지켜야 할 조건이라는 뜻이 아니에요.\"}]},\"retest\":{\"prompt\":\"문장에서 「たいてい」의 뜻을 고르세요.\",\"fragment\":\"彼はたいてい歩いて学校へ行きます。\",\"reading\":\"かれは たいてい あるいて がっこうへ いきます。\",\"translation\":\"그는 대개 걸어서 학교에 가요.\",\"answer\":\"대개\",\"why\":\"일반적으로 하는 행동이라는 뜻이에요.\",\"distractors\":[{\"answer\":\"드물게\",\"why\":\"빈도가 낮다는 말은 반대 방향이에요.\"},{\"answer\":\"이미\",\"why\":\"시간이 앞섰다는 뜻이 아니라 행동의 빈도예요.\"}]}},\"koujou\":{\"diag\":\"D13\",\"title\": .querySelector('.kr-pad'), canvas = root.querySelector('canvas');\n  var status = root.querySelector('.kr-pad-status');\n  var toggle = root.querySelector('[data-action=\"enable\"]');\n  var active = null, pointerId = null, enabled = false, observer = null;\n  var ctx = null, draftKey = 'kr-pad-v022-front';\n  var state = null, notice = '', edited = false;\n  function validStrokes(strokes) {\n    return Array.isArray(strokes) && strokes.length \u003c= 500 && strokes.every(function (s) {\n      return Array.isArray(s) && s.length \u003c= 10000 && s.every(function (p) {\n        return p && typeof p.x === 'number' && typeof p.y === 'number' &&\n          isFinite(p.x) && isFinite(p.y) && p.x >= 0 && p.x \u003c= 1 && p.y >= 0 && p.y \u003c= 1;\n      });\n    });\n  }\n  function readStore(store, key) {\n    try { return window[store].getItem(key); } catch (_) { return null; }\n  }\n  function writeStore(store, key, raw) {\n    try { window[store].setItem(key, raw); } catch (_) {}\n  }\n  function parsed(raw) {\n    try { return JSON.parse(raw || 'null'); } catch (_) { return null; }\n  }\n  function parseDraft(raw) {\n    var item = parsed(raw);\n    if (item && typeof item.key === 'string' && Number.isFinite(item.savedAt) && validStrokes(item.strokes)) return item;\n    return null;\n  }\n  function readDraft() {\n    var direct = parseDraft(window.__krPadFrontDraft) || parseDraft(readStore('sessionStorage', draftKey));\n    if (direct && direct.key === key) return direct;\n    var shared = parseDraft(readStore('localStorage', draftKey));\n    if (shared && shared.key === key && (!direct || shared.savedAt >= direct.savedAt)) return shared;\n    if (direct || shared) return null;\n    var previous = parsed(readStore('sessionStorage', 'kr-pad-v021-last'));\n    if (!previous || previous.key !== key || !validStrokes(previous.strokes)) return null;\n    return previous;\n  }\n  function saveDraft(strokes, wasEnabled) {\n    // Only the front-side draft is saved here. Parsing it on the back creates independent arrays.\n    var raw = JSON.stringify({key:key, strokes:strokes, enabled:wasEnabled, savedAt:Date.now()});\n    window.__krPadFrontDraft = raw;\n    writeStore('sessionStorage', draftKey, raw);\n    writeStore('localStorage', draftKey, raw);\n    return raw;\n  }\n  if (canvas) {\n    var initial = side === 'back' ? readDraft() : null;\n    state = {key:key, strokes:initial ? initial.strokes : [], enabled:Boolean(initial && initial.enabled)};\n    window.__krPadState = state;\n    try { ctx = canvas.getContext('2d'); } catch (_) {}\n  }\n  function persist() {\n    if (!canvas) return;\n    state.enabled = enabled;\n    window.__krPadState = state;\n    if (side === 'front') {\n      saveDraft(state.strokes, enabled);\n      if (window.parent !== window) {\n        window.parent.postMessage({ type: 'kr-pad', note: key, strokes: state.strokes, enabled: enabled }, '*');\n      }\n    }\n  }\n  function stop(e) {\n    e.stopPropagation();\n    if (e.stopImmediatePropagation) e.stopImmediatePropagation();\n    if (e.cancelable) e.preventDefault();\n  }\n  function redraw() {\n    if (!canvas || !ctx) return;\n    var r = canvas.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 3);\n    if (!r.width || !r.height) return;\n    canvas.width = Math.round(r.width * d); canvas.height = Math.round(r.height * d);\n    ctx.setTransform(d, 0, 0, d, 0, 0);\n    ctx.strokeStyle = getComputedStyle(root).getPropertyValue('--kr-text').trim() || '#242722';\n    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';\n    state.strokes.forEach(function (stroke) {\n      ctx.beginPath();\n      stroke.forEach(function (p, i) {\n        if (i) ctx.lineTo(p.x * r.width, p.y * r.height); else ctx.moveTo(p.x * r.width, p.y * r.height);\n      });\n      if (stroke.length === 1) ctx.lineTo(stroke[0].x * r.width + 0.1, stroke[0].y * r.height + 0.1);\n      ctx.stroke();\n    });\n    if (status) status.textContent = notice || (state.strokes.length + '획 · ' + (enabled ? '필기 중 · 직접 비교' : '필기 시작을 눌러 입력'));\n  }\n  function setEnabled(value) {\n    notice = '';\n    enabled = Boolean(value && ctx);\n    if (pad) { pad.hidden = false; pad.classList.toggle('kr-active', enabled); }\n    if (canvas) {\n      canvas.style.pointerEvents = enabled ? 'auto' : 'none';\n      canvas.setAttribute('aria-disabled', String(!enabled));\n    }\n    if (toggle) {\n      toggle.setAttribute('aria-pressed', String(enabled));\n      toggle.textContent = enabled ? '필기 잠금' : '필기 시작';\n      toggle.disabled = !ctx;\n    }\n    if (!enabled) { active = null; pointerId = null; }\n    redraw();\n    if (!ctx && status) status.textContent = '이 화면에서 필기판을 초기화하지 못했습니다. 앱·버전을 확인해 주세요.';\n    persist();\n  }\n  function point(e) {\n    var r = canvas.getBoundingClientRect();\n    if (!r.width || !r.height) return null;\n    var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;\n    return x >= 0 && x \u003c= 1 && y >= 0 && y \u003c= 1 ? { x: x, y: y } : null;\n  }\n  function down(e) {\n    if (!enabled) return;\n    stop(e);\n    if (active || e.isPrimary === false || (e.button !== undefined && e.button !== 0)) return;\n    var p = point(e); if (!p || state.strokes.length >= 500) return;\n    edited = true; notice = '';\n    active = [p]; pointerId = e.pointerId; state.strokes.push(active);\n    if (e.pointerId !== undefined && canvas.setPointerCapture) {\n      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}\n    }\n    redraw();\n  }\n  function move(e) {\n    if (!enabled) return;\n    stop(e);\n    if (!active || (pointerId !== undefined && e.pointerId !== pointerId)) return;\n    var p = point(e);\n    if (!p) { active = null; pointerId = null; persist(); return; }\n    if (active.length \u003c 10000) active.push(p);\n    redraw();\n  }\n  function up(e) {\n    if (!enabled) return;\n    stop(e);\n    if (pointerId !== null && pointerId !== undefined && e.pointerId !== pointerId) return;\n    if (e.pointerId !== undefined && canvas.releasePointerCapture) {\n      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}\n    }\n    active = null; pointerId = null; redraw(); persist();\n  }\n  function touch(type, e) {\n    if (!enabled) return;\n    stop(e);\n    if (type === 'touchstart' && e.touches && e.touches.length > 1) return;\n    var t = e.changedTouches && e.changedTouches[0]; if (!t) return;\n    var x = { clientX: t.clientX, clientY: t.clientY, pointerId: t.identifier,\n      cancelable: false, stopPropagation: function () {}, stopImmediatePropagation: function () {} };\n    if (type === 'touchstart') down(x); else if (type === 'touchmove') move(x); else up(x);\n  }\n  function onMessage(e) {\n    if (!canvas || side !== 'back' || e.source !== window.parent || !e.data ||\n      e.data.type !== 'kr-pad-sync' || e.data.note !== key || !validStrokes(e.data.strokes)) return;\n    var raw = saveDraft(e.data.strokes, Boolean(e.data.enabled));\n    if (!edited) {\n      state.strokes = parsed(raw).strokes;\n      redraw(); persist();\n    }\n  }\n  function restore() {\n    var original = readDraft();\n    if (!original || !original.strokes.length) {\n      notice = '불러올 앞면 필기가 없습니다. 한자 쓰기 앞면에서 필기 시작을 눌러 써주세요.';\n    } else {\n      state.strokes = original.strokes;\n      active = null; pointerId = null;\n      edited = true;\n      notice = '앞면 필기 ' + state.strokes.length + '획을 불러왔습니다.';\n      persist();\n    }\n    redraw();\n  }\n  if (canvas) {\n    if (window.PointerEvent) {\n      canvas.addEventListener('pointerdown', down); canvas.addEventListener('pointermove', move);\n      canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n    } else {\n      canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move);\n      canvas.addEventListener('mouseup', up); canvas.addEventListener('mouseleave', up);\n      ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (type) {\n        canvas.addEventListener(type, function (e) { touch(type, e); }, { passive: false });\n      });\n    }\n    ['click', 'dblclick', 'contextmenu', 'touchstart', 'touchmove', 'touchend'].forEach(function (type) {\n      canvas.addEventListener(type, function (e) { if (enabled) stop(e); }, { passive: false });\n    });\n    if (window.parent !== window) window.addEventListener('message', onMessage);\n    if (window.ResizeObserver) { observer = new ResizeObserver(redraw); observer.observe(canvas); }\n    setEnabled(side === 'back' && state.enabled);\n  }\n  root.querySelectorAll('button[data-action]').forEach(function (button) {\n    button.addEventListener('click', function (e) {\n      stop(e); var action = button.getAttribute('data-action');\n      if (action === 'enable' && canvas) setEnabled(!enabled);\n      if (action === 'undo' && canvas) { state.strokes.pop(); active = null; pointerId = null; edited = true; notice = ''; redraw(); persist(); }\n      if (action === 'clear' && canvas) { state.strokes = []; active = null; pointerId = null; edited = true; notice = ''; redraw(); persist(); }\n      if (action === 'ghost') {\n        var ghost = root.querySelector('.kr-ghost');\n        if (ghost) { ghost.hidden = !ghost.hidden; button.setAttribute('aria-pressed', String(!ghost.hidden)); }\n      }\n      if (action === 'sync' && canvas) restore();\n      if (action === 'replay') {\n        var img = root.querySelector('.kr-stroke img');\n        if (img) { var next = img.cloneNode(); next.src = img.src.split('#')[0] + '#kr' + Date.now(); img.replaceWith(next); }\n      }\n    });\n  });\n  window.__krPadCleanup = function () {\n    if (observer) observer.disconnect();\n    window.removeEventListener('message', onMessage);\n  };\n})();\n\u003c/script>\n\u003cscript type=\"application/json\" data-kr180-bank>{\"version\":\"v1.10.0-RC1\",\"diagnosis\":[{\"id\":\"D01\",\"track\":\"read\",\"prompt\":\"역을 뜻하는 「駅」의 읽기를 고르세요.\",\"stimulus\":\"駅で友 nction onMessage(e) {\n    if (!canvas || side !== 'back' || e.source !== window.parent || !e.data ||\n      e.data.type !== 'kr-pad-sync' || e.data.note !== key || !validStrokes(e.data.strokes)) return;\n    var raw = saveDraft(e.data.strokes, Boolean(e.data.enabled));\n    if (!edited) {\n      state.strokes = parsed(raw).strokes;\n      redraw(); persist();\n    }\n  }\n  function restore() {\n    var original = readDraft();\n    if (!original || !original.strokes.length) {\n      notice = '불러올 앞면 필기가 없습니다. 한자 쓰기 앞면에서 필기 시작을 눌러 써주세요.';\n    } else {\n      state.strokes = original.strokes;\n      active = null; pointerId = null;\n      edited = true;\n      notice = '앞면 필기 ' + state.strokes.length + '획을 불러왔습니다.';\n      persist();\n    }\n    redraw();\n  }\n  if (canvas) {\n    if (window.PointerEvent) {\n      canvas.addEventListener('pointerdown', down); canvas.addEventListener('pointermove', move);\n      canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n    } else {\n      canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move);\n      canvas.addEventListener('mouseup', up); canvas.addEventListener('mouseleave', up);\n      ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (type) {\n        canvas.addEventListener(type, function (e) { touch(type, e); }, { passive: false });\n      });\n    }\n    ['click', 'dblclick', 'contextmenu', 'touchstart', 'touchmove', 'touchend'].forEach(function (type) {\n      canvas.addEventListener(type, function (e) { if (enabled) stop(e); }, { passive: false });\n    });\n    if (window.parent !== window) window.addEventListener('message', onMessage);\n    if (window.ResizeObserver) { observer = new ResizeObserver(redraw); observer.observe(canvas); }\n    setEnabled(side === 'back' && state.enabled);\n  }\n  root.querySelectorAll('button[data-action]').forEach(function (button) {\n    button.addEventListener('click', function (e) {\n      stop(e); var action = button.getAttribute('data-action');\n      if (action === 'enable' && canvas) setEnabled(!enabled);\n      if (action === 'undo' && canvas) { state.strokes.pop(); active = null; pointerId = null; edited = true; notice = ''; redraw(); persist(); }\n      if (action === 'clear' && canvas) { state.strokes = []; active = null; pointerId = null; edited = true; notice = ''; redraw(); persist(); }\n      if (action === 'ghost') {\n        var ghost = root.querySelector('.kr-ghost');\n        if (ghost) { ghost.hidden = !ghost.hidden; button.setAttribute('aria-pressed', String(!ghost.hidden)); }\n      }\n      if (action === 'sync' && canvas) restore();\n      if (action === 'replay') {\n        var img = root.querySelector('.kr-stroke img');\n        if (img) { var next = img.cloneNode(); next.src = img.src.split('#')[0] + '#kr' + Date.now(); img.replaceWith(next); }\n      }\n    });\n  });\n  window.__krPadCleanup = function () {\n    if (observer) observer.disconnect();\n    window.removeEventListener('message', onMessage);\n  };\n})();\n\u003c/script>\n\u003cdiv hidden data-kr180-review>\u003cdiv data-review-prompt>買い物\u003c/div>\u003cdiv data-review-answer>かいもの / 쇼핑\u003c/div>\u003c/div>\u003cdiv data-kr190-word hidden>\u003cspan data-word>買い物\u003c/span>\u003cspan data-reading>かいもの\u003c/span>\u003c/div>\u003cscript type=\"application/json\" data-kr180-bank>{\"version\":\"v1.10.0-RC1\",\"diagnosis\":[{\"id\":\"D01\",\"track\":\"read\",\"prompt\":\"역을 뜻하는 「駅」의 읽기를 고르세요.\",\"stimulus\":\"駅で友達を待ちます。\",\"options\":[\"せき\",\"えき\",\"いき\"],\"answer\":\"えき\",\"feedback\":\"駅（えき）는 ‘역’입니다.\",\"skill\":\"한자 읽기\",\"quick\":true},{\"id\":\"D02\",\"track\":\"write\",\"prompt\":\"‘손 수’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"手\",\"feedback\":\"手의 마지막 획은 아래에서 왼쪽으로 살짝 꺾입니다.\",\"skill\":\"모양 회상\",\"quick\":true},{\"id\":\"D03\",\"track\":\"similar\",\"prompt\":\"‘토요일’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕曜日（どようび）\",\"options\":[\"士\" ":\"貝와 見의 끝 획\",\"rule\":\"貝의 아래 두 획은 八처럼 벌어져요. 見의 마지막 획은 오른쪽으로 굽어요.\",\"practice\":{\"prompt\":\"‘조개’를 뜻하는 글자를 고르세요.\",\"fragment\":\"海で小さな〔　〕を拾いました。\",\"reading\":\"うみで ちいさな かいを ひろいました。\",\"translation\":\"바다에서 작은 조개를 주웠어요.\",\"answer\":\"貝\",\"why\":\"貝는 かい, 조개를 뜻해요.\",\"distractors\":[{\"answer\":\"見\",\"why\":\"見은 보다와 관련돼요. 조개를 뜻하는 표기는 貝예요.\"}]},\"retest\":{\"prompt\":\"‘견학’을 완성하세요.\",\"fragment\":\"博物館を〔　〕学しました。\",\"reading\":\"はくぶつかんを けんがくしました。\",\"translation\":\"박물관을 견학했어요.\",\"answer\":\"見\",\"why\":\"見学은 실제로 보고 배운다는 뜻이에요.\",\"distractors\":[{\"answer\":\"貝\",\"why\":\"貝는 조개예요. 보는 행위와 관련된 글자는 見이에요.\"}]}},\"k-te\":{\"diag\":\"D04\",\"title\":\"5단 く 동사의 て형\",\"rule\":\"일반적인 5단 く 동사는 く를 いて로 바꿔요.\",\"practice\":{\"prompt\":\"「歩く」의 て형을 고르세요.\",\"fragment\":\"駅まで〔　〕行きます。\",\"reading\":\"えきまで あるいて いきます。\",\"translation\":\"역까지 걸어가요.\",\"answer\":\"歩いて\",\"why\":\"歩く의 く는 て형에서 いて가 돼요.\",\"distractors\":[{\"answer\":\"歩って\",\"why\":\"って는 う·つ·る 동사 또는 예외 行く에 쓰여요.\"},{\"answer\":\"歩んで\",\"why\":\"んで는 む·ぶ·ぬ 동사의 て형에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「書く」의 て형을 골라 문장을 완성하세요.\",\"fragment\":\"ここに名前を〔　〕ください。\",\"reading\":\"ここに なまえを かいて ください。\",\"translation\":\"여기에 이름을 써 주세요.\",\"answer\":\"書いて\",\"why\":\"書く는 書いて가 돼요. 書いてください는 ‘써 주세요’예요.\",\"distractors\":[{\"answer\":\"書って\",\"why\":\"書く는 行く처럼 って를 쓰는 예외가 아니에요.\"},{\"answer\":\"書んで\",\"why\":\"書く의 어말 く에는 んで가 붙지 않아요.\"}]}},\"m-past\":{\"diag\":\"D08\",\"title\":\"5단 む 동사의 た형\",\"rule\":\"5단 む 동사의 과거형은 む를 んだ로 바꿔요.\",\"practice\":{\"prompt\":\"「休む」의 보통체 과거형을 고르세요.\",\"fragment\":\"昨日は家で〔　〕。\",\"reading\":\"きのうは いえで やすんだ。\",\"translation\":\"어제는 집에서 쉬었어요.\",\"answer\":\"休んだ\",\"why\":\"休む는 む를 んだ로 바꿔 休んだ가 돼요.\",\"distractors\":[{\"answer\":\"休いた\",\"why\":\"いた는 書く → 書いた처럼 일반적인 く 동사에 쓰여요.\"},{\"answer\":\"休った\",\"why\":\"った는 待つ → 待った 같은 동사의 과거형에 쓰여요.\"}]},\"retest\":{\"prompt\":\"「読む」의 보통체 과거형을 고르세요.\",\"fragment\":\"電車の中で本を〔　〕。\",\"reading\":\"でんしゃの なかで ほんを よんだ。\",\"translation\":\"전철 안에서 책을 읽었어요.\",\"answer\":\"読んだ\",\"why\": ion\":\"내일 서류를 제출하겠습니다.\",\"answer\":\"出します\",\"why\":\"出す의 す를 し로 바꾸면 出します가 돼요.\",\"distractors\":[{\"answer\":\"出せます\",\"why\":\"가능형이라 ‘제출할 수 있습니다’라는 뜻이에요.\"},{\"answer\":\"出すます\",\"why\":\"사전형 그대로 ます를 붙이지 않아요.\"}]},\"retest\":{\"prompt\":\"「話す」의 ます형을 골라 ‘말합니다’를 완성하세요.\",\"fragment\":\"日本語で〔　〕。\",\"reading\":\"にほんごで はなします。\",\"translation\":\"일본어로 말합니다.\",\"answer\":\"話します\",\"why\":\"話す의 す → し로 바꿔 話します라고 해요.\",\"distractors\":[{\"answer\":\"話せます\",\"why\":\"가능형이라 ‘말할 수 있습니다’라는 뜻이에요.\"},{\"answer\":\"話すます\",\"why\":\"ます 앞에서는 す를 し로 바꿔요.\"}]}},\"one-past\":{\"diag\":\"D27\",\"title\":\"1단 동사의 た형\",\"rule\":\"1단 동사는 마지막 る를 떼고 た를 붙여요.\",\"practice\":{\"prompt\":\"「見る」의 보통체 과거형을 고르세요.\",\"fragment\":\"昨日、その映画を〔　〕。\",\"reading\":\"きのう、その えいがを みた。\",\"translation\":\"어제 그 영화를 봤어요.\",\"answer\":\"見た\",\"why\":\"見る는 1단 동사여서 見た가 돼요.\",\"distractors\":[{\"answer\":\"見った\",\"why\":\"5단 る 동사처럼 촉음 っ을 넣은 형태예요.\"},{\"answer\":\"見て\",\"why\":\"見て는 연결이나 부탁에 사용하는 て형이에요.\"}]},\"retest\":{\"prompt\":\"「食べる」의 보통체 과거형을 고르세요.\",\"fragment\":\"昼にパンを〔　〕。\",\"reading\":\"ひるに パンを たべた。\",\"translation\":\"점심에 빵을 먹었어요.\",\"answer\":\"食べた\",\"why\":\"食べる는 る를 떼고 た를 붙여요.\",\"distractors\":[{\"answer\":\"食べった\",\"why\":\"1단 동사에는 っ이 들어가지 않아요.\"},{\"answer\":\"食べて\",\"why\":\"食べて는 て형이고 이 문항은 과거형을 묻고 있어요.\"}]}},\"sonnani\":{\"diag\":\"D16\",\"title\":\"そんなに와 정도\",\"rule\":\"そんなに는 ‘그렇게까지, 그 정도로’라는 정도를 나타내요.\",\"practice\":{\"prompt\":\"문장에서 「そんなに」의 뜻을 고르세요.\",\"fragment\":\"そんなに急がなくても大丈夫です。\",\"reading\":\"そんなに いそがなくても だいじょうぶです。\",\"translation\":\"그렇게까지 서두르지 않아도 괜찮아요.\",\"answer\":\"그렇게까지\",\"why\":\"여기서는 서두르는 정도를 낮추는 말이에요.\",\"distractors\":[{\"answer\":\"반드시\",\"why\":\"의무를 나타내는 말이 아니에요.\"},{\"answer\":\"벌써\",\"why\":\"시간보다 동작의 정도를 나타내요.\"}]},\"retest\":{\"prompt\":\"문장에서 「そんなに」의 뜻을 고르세요.\",\"fragment\":\"そんなに高いとは思わなかった。\",\"reading\":\"そんなに たかいとは おもわなかった。\",\"translation\":\"그렇게 비쌀 줄은 몰랐어요.\",\"answer\":\"그렇게\",\"why\":\"비싸다고 느끼는 정도를 나타내요.\",\"distractors\":[{\"answer\":\"항상\",\"why\":\"빈도를 나타내는 말이 이미\",\"why\":\"시간이 앞섰다는 뜻이 아니라 행동의 빈도예요.\"}]}},\"koujou\":{\"diag\":\"D13\",\"title\":\"工場의 탁음과 장음\",\"rule\":\"工場를 こうじょう로 읽을 때 뒤의 じょう에 탁음과 장음이 있어요.\",\"practice\":{\"prompt\":\"「工場」의 읽기를 고르세요.\",\"fragment\":\"工場では車を作っています。\",\"reading\":\"こうじょうでは くるまを つくっています。\",\"translation\":\"공장에서는 자동차를 만들고 있어요.\",\"answer\":\"こうじょう\",\"why\":\"이 문맥의 工場는 공장이라는 뜻의 こうじょう예요.\",\"distractors\":[{\"answer\":\"こうしょう\",\"why\":\"뒤 음절은 탁음 じ로 시작해요.\"},{\"answer\":\"こうじょ\",\"why\":\"뒤 じょう에는 장음 う가 있어요.\"}]},\"retest\":{\"prompt\":\"새 문장에서 「工場」의 읽기를 고르세요.\",\"fragment\":\"新しい工場ができました。\",\"reading\":\"あたらしい こうじょうが できました。\",\"translation\":\"새 공장이 생겼어요.\",\"answer\":\"こうじょう\",\"why\":\"이 카드의 工場는 こうじょう예요. じょう의 장음까지 읽어요.\",\"distractors\":[{\"answer\":\"こうしょう\",\"why\":\"場를 이 단어에서 しょう로 읽지 않아요.\"},{\"answer\":\"こうじょ\",\"why\":\"공장 독음에는 마지막 장음이 필요해요.\"}]}},\"sousa\":{\"diag\":\"D23\",\"title\":\"操作의 읽기\",\"rule\":\"操作는 そうさ라고 읽고 기기 등을 조작한다는 뜻이에요.\",\"practice\":{\"prompt\":\"「操作」의 읽기를 고르세요.\",\"fragment\":\"この機械の操作を覚えます。\",\"reading\":\"この きかいの そうさを おぼえます。\",\"translation\":\"이 기계의 조작법을 익혀요.\",\"answer\":\"そうさ\",\"why\":\"操는 そう로, 作은 이 단어에서 さ로 읽어요.\",\"distractors\":[{\"answer\":\"しょうさ\",\"why\":\"첫소리는 しょ가 아니라 そ예요.\"},{\"answer\":\"そうしゃ\",\"why\":\"뒤는 しゃ가 아니라 さ예요.\"}]},\"retest\":{\"prompt\":\"새 문장에서 「操作」의 읽기를 고르세요.\",\"fragment\":\"操作の方法を説明します。\",\"reading\":\"そうさの ほうほうを せつめいします。\",\"translation\":\"조작 방법을 설명할게요.\",\"answer\":\"そうさ\",\"why\":\"조작이라는 操作의 읽기는 そうさ예요.\",\"distractors\":[{\"answer\":\"しょうさ\",\"why\":\"操의 이 읽기는 そう예요.\"},{\"answer\":\"そうしゃ\",\"why\":\"作을 이 단어에서 しゃ로 읽지 않아요.\"}]}}},\"byDiagnostic\":{\"D03\":\"earth-warrior\",\"D07\":\"not-yet-end\",\"D11\":\"person-enter\",\"D15\":\"day-eye\",\"D20\":\"king-ball\",\"D25\":\"shell-see\",\"D04\":\"k-te\",\"D08\":\"m-past\",\"D12\":\"iku-te\",\"D17\":\"r-nai\",\"D22\":\"s-masu\",\"D27\":\"one-past\",\"D16\":\"sonnani\",\"D21\":\"mada\",\"D26\":\"maniau\",\"D28\":\"tsui\",\"D29\":\"todoku\",\"D30\":\"taitei\",\"D13\":\"koujou\",\"D23\":\"sou div>\u003cp class=\"kr-result-field\">읽기 · あいて\u003c/p>\u003cp class=\"kr-result-field\">뜻 · 상대\u003c/p>\u003csection class=\"kr-answer-section\">\u003ch3>핵심 해설\u003c/h3>\u003cp>相手（あいて）의 뜻은 ‘상대’입니다. 빈칸에는 相를 씁니다. 相의 한국 훈음은 ‘① 서로 상 ② (자세히) 볼 상 ③ 재상 상’입니다.\u003c/p>\u003c/section>\u003csection class=\"kr-answer-section\">\u003ch3>비교\u003c/h3>\u003cdiv>\u003cul>\u003cli>\u003cstrong>箱\u003c/strong> · 箱는 ‘상자 상’의 글자입니다. 이 문장에서 ‘상대’을 나타내는 표기는 相手입니다.\u003c/li>\u003cli>\u003cstrong>相\u003c/strong> · 相手（あいて）의 뜻은 ‘상대’입니다. 빈칸에는 相를 씁니다.\u003c/li>\u003cli>\u003cstrong>格\u003c/strong> · 格는 ‘틀 격·격식 격’의 글자입니다. 이 문장에서 ‘상대’을 나타내는 표기는 相手입니다.\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\u003csection class=\"kr-answer-section\">\u003ch3>예문과 해석\u003c/h3>\u003cp lang=\"ja\">\u003cruby>試合\u003crt>しあい\u003c/rt>\u003c/ruby>の\u003cruby>相手\u003crt>あいて\u003c/rt>\u003c/ruby>は\u003cruby>去年\u003crt>きょねん\u003c/rt>\u003c/ruby>の\u003cruby>優勝\u003crt>ゆうしょう\u003c/rt>\u003c/ruby>\u003cruby>者\u003crt>しゃ\u003c/rt>\u003c/ruby>です。\u003c/p>\u003cp>시합 상대는 작년 우승자입니다.\u003c/p>\u003c/section>\u003csection class=\"kr-answer-section\">\u003cdetails>\u003csummary>문항 근거\u003c/summary>\u003cp>사용자 제공 JLPT MAX 어휘·예문 자료 · ci-d7e9b2029aae3fc29d4f / ex-31bb2cbb5259ff98ddca · 제공 자료의 예문과 근거를 바탕으로 작성\u003c/p>\u003c/details>\u003c/section>\u003c/div>\u003c/section>\u003cfooter class=\"kr-card-id\">\u003cdiv class=\"kr-id-line\">NoteID KR-N-X110-SIM-6477F568004530A6\u003c/div>\u003cdiv class=\"kr-version\">\u003cspan>덱 v1.10.0-RC1\u003c/span>\u003cspan>실전 v1.7.0\u003c/span>\u003cspan>공통 UI KR-1.7.1-RC2\u003c/span>\u003cspan>수정 2026-11-20\u003c/span>\u003c/div>\u003cdiv class=\"kr-platform-date\">운영 기준 2026-11-19 · RULE-06 v1.3.0\u003c/div>\u003c/footer>\u003cscript type=\"application/json\" data-kr180-bank>{\"version\":\"v1.10.0-RC1\",\"diagnosis\":[{\"id\":\"D01\",\"track\":\"read\",\"prompt\":\"역을 뜻하는 「駅」의 읽기를 고르세요.\",\"stimulus\":\"駅で友達を待ちます。\",\"options\":[\"せき\",\"えき\",\"いき\"],\"answer\":\"えき\",\"feedback\":\"駅（えき）는 ‘역’입니다.\",\"skill\":\"한자 읽기\",\"quick\":true},{\"id\":\"D02\",\"track\":\"write\",\"prompt\":\"‘손 수’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"手\",\"feedback\":\"手의 마지막 획은 아래에서 왼쪽으로 살짝 꺾입니다.\",\"skill\":\"모양 회상\",\"quick\":true},{\"id\":\"D03\",\"track\":\"similar\",\"prompt\":\"‘토요일’을 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕曜日（どようび）\",\"options\":[\"士\",\"王\",\"土\"],\"answer\":\"土\",\"feedback\":\"土曜日에는 아래 가로획이 긴 土가 들어갑니다.\",\"skill\":\"가로획 길이\",\"quick\":true},{\"id\":\"D04\",\"track\":\"verb\",\"prompt\":\"「書く」의 て형을 고르세요.\",\"stimulus\":\"書く\",\"options\":[\"書って\",\"書いて\",\"書んで\"],\"answer\":\"書いて\",\"feedback\":\"書く의 く는 て형에서 いて가 됩니다.\",\"skill\":\"연결형\",\"quick\":true},{\"id\":\"D05\",\"track\":\"read\",\"prompt\":\"「確認」의 읽기를 고르세요.\",\"stimulus\":\"この書類を確認してください。\",\"options\":[\"かくにん\",\"かんにん\",\"かくじん\"],\"answer\":\"かくにん\",\"feedback\":\"確認（かくにん）은 ‘확인’입니다.\",\"skill\":\"음독 결합\",\"quick\":true},{\"id\":\"D06\",\"track\":\"write\",\"prompt\":\"‘나무 목’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"木\",\"feedback\":\"木의 표준 획순은 가로·세로·왼쪽 삐침·오른쪽 파임입니다.\",\"skill\":\"획순\",\"quick\":true},{\"id\":\"D07\",\"track\":\"similar\",\"prompt\":\"‘미래’를 완성하는 한자를 고르세요.\",\"stimulus\":\"〔　〕来（みらい）\",\"options\":[\"未\",\"末\",\"本\"],\"answer\":\"未\",\"feedback\":\"未来의 未는 두 가로획 중 아래쪽이 더 깁니다.\",\"skill\":\"가로획 길이\",\"quick\":true},{\"id\":\"D08\",\"track\":\"verb\",\"prompt\":\"「読む」의 た형을 고르세요.\",\"stimulus\":\"読む\",\"options\":[\"読んだ\",\"読いた\",\"読った\"],\"answer\":\"読んだ\",\"feedback\":\"読む의 む는 た형에서 んだ가 됩니다.\",\"skill\":\"과거형\",\"quick\":true},{\"id\":\"D09\",\"track\":\"read\",\"prompt\":\"「提案」의 읽기를 고르세요.\",\"stimulus\":\"彼女は新しい方法を提案しました。\",\"options\":[\"だいあん\",\"ていなん\",\"ていあん\"],\"answer\":\"ていあん\",\"feedback\":\"提案（ていあん）은 ‘제안’입니다.\",\"skill\":\"음독 결합\",\"quick\":true},{\"id\":\"D10\",\"track\":\"write\",\"prompt\":\"‘날 일’에 해당하는 한자 한 글자를 쓰세요.\",\"stimulus\":\"\",\"options\":[],\"answer\":\"日\",\"feedback\":\"日은 네 획입니다. 테두리 안 가로획이 하나입니다.\",\"skill\"
