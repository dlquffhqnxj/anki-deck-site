<head>

<title>Kanji Revolution v1.2.0-RC1 Preview</title>
<style>
:root{color-scheme:light;--kr-bg:#f2f0e8;--kr-surface:#fffefa;--kr-soft:#f8f5ec;--kr-text:#242a24;--kr-muted:#687168;--kr-line:#d5d9cf;--kr-green:#41664b;--kr-accent:#8a672f;--kr-pale:#f8e8e5}.nightMode,.night_mode{color-scheme:light!important;--kr-bg:#f2f0e8;--kr-surface:#fffefa;--kr-soft:#f8f5ec;--kr-text:#242a24;--kr-muted:#687168;--kr-line:#d5d9cf;--kr-green:#41664b;--kr-accent:#8a672f;--kr-pale:#f8e8e5}
*{box-sizing:border-box}.card{margin:0;background:var(--kr-bg);color:var(--kr-text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK KR","Malgun Gothic",sans-serif;font-size:17px;line-height:1.65;text-align:left;overflow-wrap:anywhere}
.kr-card{max-width:640px;margin:0 auto;padding:16px 14px 28px;color:var(--kr-text)}
.kr-meta{display:flex;gap:7px;align-items:center;margin:0 0 12px;font-size:12px;color:var(--kr-muted);letter-spacing:.02em}.kr-brand{color:var(--kr-green);font-weight:700}.kr-dot{color:var(--kr-line)}.kr-pill{padding:3px 10px;border:1px solid var(--kr-line);border-radius:30px;font-size:12px}
.kr-hero,.kr-section{background:var(--kr-surface);border:1px solid var(--kr-line);border-radius:18px;padding:22px;margin:0 0 14px}.kr-hero{text-align:center;padding:30px 20px;box-shadow:0 5px 16px #24272206}.kr-prompt{font-size:15px;color:var(--kr-muted);margin:0 0 18px}.kr-glyph{font-family:"Noto Sans CJK JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;font-size:clamp(70px,22vw,108px);font-weight:500;line-height:1.2;margin:20px 0 26px;letter-spacing:.04em}.kr-word-prompt{font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif;font-size:clamp(36px,11vw,64px);line-height:1.55;margin:25px 0}.kr-write-hint{font-size:32px;font-weight:650;line-height:1.4;margin:12px 0 22px}.kr-footnote{font-size:12px;color:var(--kr-muted);margin:12px 0 0}.kr-answer{display:grid;grid-template-columns:118px minmax(0,1fr);gap:20px;align-items:center;text-align:left}.kr-answer .kr-glyph{font-size:86px;margin:0;text-align:center}.kr-answer-main{font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif;font-size:26px;color:var(--kr-green);font-weight:700;line-height:1.5}.kr-answer-meaning{font-size:18px;margin-top:6px}.kr-small-title{display:block;margin:0 0 8px;color:var(--kr-muted);font-size:12px;font-weight:600;letter-spacing:.04em}.kr-section h3{font-size:14px;margin:0 0 12px;color:var(--kr-green)}.kr-reading-row{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:7px 0}.kr-reading-row label{font-size:12px;color:var(--kr-muted);padding-top:3px}.kr-ja{font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif}.kr-facts{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--kr-muted);margin-top:12px}.kr-facts span{background:var(--kr-soft);padding:4px 8px;border-radius:7px}.kr-memory{background:var(--kr-soft);border-left:3px solid var(--kr-green)}.kr-memory p{margin:0;font-size:16px}.kr-memory .kr-footnote{font-size:11px;margin-top:10px}.kr-word-list{display:grid;gap:8px}.kr-word{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--kr-line);padding:10px 0}.kr-word:last-child{border:0}.kr-word ruby{font-size:22px;white-space:normal;font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif}.kr-word rt{font-size:11px;color:var(--kr-green)}.kr-word span{font-size:14px;color:var(--kr-muted);text-align:right}
.kr-card details{margin-bottom:12px;background:var(--kr-surface);border:1px solid var(--kr-line);border-radius:14px;overflow:hidden}.kr-card summary{cursor:pointer;padding:13px 16px;font-size:14px;font-weight:600;list-style-position:inside;color:var(--kr-green)}.kr-detail-body{padding:0 16px 16px}.kr-card img{max-width:100%;height:auto;display:block}.kr-source img{border-radius:9px;background:white}.kr-card a{color:var(--kr-accent);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}.kr-source-meta{font-size:12px;color:var(--kr-muted);margin:8px 0;word-break:keep-all}.kr-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:12px 0}.kr-card button{appearance:none;border:1px solid var(--kr-line);border-radius:10px;background:var(--kr-surface);color:var(--kr-green);padding:9px 13px;font:600 13px/1.3 -apple-system,BlinkMacSystemFont,"Noto Sans CJK KR",sans-serif;cursor:pointer;touch-action:manipulation}.kr-card button.primary{background:var(--kr-green);color:var(--kr-surface)}.kr-card button:focus-visible,.kr-card summary:focus-visible{outline:3px solid var(--kr-accent);outline-offset:3px}.kr-card button[aria-pressed="true"]{background:var(--kr-pale);border-color:var(--kr-accent)}
.kr-pad{margin-top:14px}.kr-pad[hidden],.kr-ghost[hidden]{display:none!important}.kr-pad-board{position:relative;width:min(286px,100%);aspect-ratio:1;margin:0 auto;border:1px solid var(--kr-line);border-radius:14px;overflow:hidden;background:var(--kr-surface)}.kr-pad-board:before,.kr-pad-board:after{content:"";position:absolute;pointer-events:none;opacity:.7;z-index:0}.kr-pad-board:before{left:50%;height:100%;border-left:1px dashed var(--kr-line)}.kr-pad-board:after{top:50%;width:100%;border-top:1px dashed var(--kr-line)}.kr-pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2;cursor:crosshair;user-select:none;-webkit-user-select:none}.kr-ghost{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif;font-size:200px;color:var(--kr-accent);opacity:.18;line-height:1;pointer-events:none}.kr-pad-status{text-align:center;color:var(--kr-muted);font-size:12px;margin:6px 0}.kr-stroke img{width:260px;max-width:100%;margin:8px auto;background:#fff;border-radius:12px}.kr-license{font-size:11px;line-height:1.6;color:var(--kr-muted)}.kr-audit{font-size:11px;line-height:1.8;color:var(--kr-muted);padding-top:7px}
@media(max-width:480px){.kr-card{padding:12px 10px 24px}.kr-hero,.kr-section{padding:20px 16px}.kr-answer{grid-template-columns:88px minmax(0,1fr);gap:12px}.kr-answer .kr-glyph{font-size:76px}.kr-answer-main{font-size:23px}.kr-word{gap:10px}.kr-word ruby{font-size:20px}.kr-word span{font-size:13px}.kr-write-hint{font-size:30px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* v0.2.0: textbook illustration and explanation are a single visible unit. */
.kr-mnemonic{display:grid;grid-template-columns:144px minmax(0,1fr);gap:18px;align-items:center;margin:0;padding:4px 0 12px}
.kr-mnemonic+.kr-mnemonic{padding-top:18px;margin-top:10px;border-top:1px solid var(--kr-line)}
.kr-mnemonic>img{width:144px;max-width:100%;height:auto;border-radius:12px;background:#fff;border:1px solid var(--kr-line)}
.kr-mnemonic figcaption{min-width:0}.kr-memory-origin{display:block;color:var(--kr-green);font-size:11px;font-weight:650;margin:0 0 8px;letter-spacing:.04em}
.kr-mnemonic figcaption p{font-size:17px;line-height:1.8;word-break:keep-all;overflow-wrap:anywhere;margin:0}
.kr-mnemonic small{display:block;font-size:11px;color:var(--kr-muted);margin-top:12px}
.kr-memory-content{margin-top:3px}.kr-memory{border-left-width:3px}.kr-memory .kr-footnote{line-height:1.6}
.kr-parent-source{margin-bottom:14px}.kr-parent-source>p,.kr-word-origins{font-size:12px;color:var(--kr-muted)}
.kr-card[data-kind="word"] .kr-answer{grid-template-columns:auto minmax(0,1fr)}
.kr-card[data-kind="word"] .kr-answer .kr-glyph{font-size:44px;max-width:220px;line-height:1.4}
@media(max-width:480px){.kr-mnemonic{grid-template-columns:110px minmax(0,1fr);gap:13px;align-items:start}.kr-mnemonic>img{width:110px}.kr-mnemonic figcaption p{font-size:15px;line-height:1.7}.kr-card[data-kind="word"] .kr-answer .kr-glyph{max-width:130px;font-size:36px}}
@media(max-width:335px){.kr-mnemonic{grid-template-columns:1fr}.kr-mnemonic>img{width:128px;margin:0 auto}.kr-mnemonic figcaption p{font-size:16px}}

/* v0.2.1: keep the writing area discoverable; drawing is opt-in. */
.kr-pad canvas{pointer-events:none;touch-action:auto;cursor:default}
.kr-pad.kr-active canvas{pointer-events:auto;touch-action:none;cursor:crosshair}
.kr-pad.kr-active .kr-pad-board{border-color:var(--kr-green);box-shadow:0 0 0 2px var(--kr-pale)}
.kr-card button:disabled{opacity:.55;cursor:default}
.kr-pad-status{min-height:20px}


/* v1.0.2: ordinary image elements only; no image-coordinate clipping. */
.kr-stable-media{display:block;max-width:100%;height:auto;object-fit:contain}
.kr-source-text{background:#fff;border-radius:3px}
.kr-answer-main>.kr-stable-media,.kr-word-prompt>.kr-stable-media,.kr-write-hint>.kr-stable-media{margin:6px auto}
.kr-glyph>.kr-stable-media{margin:0 auto;border-radius:8px}
.kr-ghost>.kr-stable-media{width:78%;margin:auto}
.kr-scan-word-row{padding:11px 0;border-bottom:1px solid var(--kr-line)}
.kr-scan-word-row:last-child{border:0}
.kr-mnemonic figcaption .kr-source-text{width:auto;max-width:100%}

html,.card,.nightMode,.night_mode{background:var(--kr-bg)!important;color:var(--kr-text)!important}
.kr-card{word-break:keep-all}
.kr-card-id{margin:17px 2px 0;padding-top:12px;border-top:1px solid var(--kr-line);color:var(--kr-muted);font-size:11px;line-height:1.55;word-break:break-word}
.kr-quiz-feedback{display:none;margin-top:16px;background:#eef5eb;border:1px solid var(--kr-line);border-radius:18px;padding:20px}
.kr-quiz-feedback.is-visible{display:block;animation:krReveal .2s ease-out}
.kr-quiz-result{margin:0 0 9px;color:var(--kr-green);font-size:14px;font-weight:800}
.kr-choice-state{margin-left:auto;color:var(--kr-muted);font-size:12px;font-weight:800}
.kr-quiz .kr-correct{border:2px solid #316b3d!important;background:#e7f2e6!important}
.kr-quiz .kr-incorrect{border:2px solid #a64841!important;background:#f8e8e5!important}
.kr-rating-note{margin-top:14px;padding:12px 14px;border-left:3px solid #91a791;border-radius:10px;background:#f1f5ed;color:#4d584d;font-size:13px}
@keyframes krReveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.kr-quiz-feedback{animation:none!important}}

/* Kanji Revolution v1.2.0-RC1 - shared settings and local records UI. */

/* The release remains bright by default. "Device settings" removes the light
   lock and follows the host/WebView colour preference. */
:root.kr-force-light,
body.kr-force-light,
.nightMode.kr-force-light,
.night_mode.kr-force-light {
  color-scheme: light !important;
  --kr-bg:#f3f6f0;
  --kr-surface:#fffefa;
  --kr-soft:#f7f8f2;
  --kr-surface-3:#eef5eb;
  --kr-text:#242a24;
  --kr-muted:#687168;
  --kr-line:#d5d9cf;
  --kr-green:#41664b;
  --kr-accent:#8a672f;
  --kr-pale:#f8e8e5;
  --kr-good:#316b3d;
  --kr-good-bg:#e7f2e6;
  --kr-bad:#a64841;
  --kr-bad-bg:#f8e8e5;
  --kr-shadow:0 14px 36px rgba(48,57,47,.10);
}

:root.kr-force-dark,
body.kr-force-dark,
.nightMode:not(.kr-force-light),
.night_mode:not(.kr-force-light) {
  color-scheme: dark !important;
  --kr-bg:#171b18;
  --kr-surface:#232923;
  --kr-soft:#2a312a;
  --kr-surface-3:#29372c;
  --kr-text:#f2f5ee;
  --kr-muted:#b5beb3;
  --kr-line:#465047;
  --kr-green:#b7ddb9;
  --kr-accent:#f1c77f;
  --kr-pale:#3a302e;
  --kr-good:#a9e0ad;
  --kr-good-bg:#26422b;
  --kr-bad:#ffb5ac;
  --kr-bad-bg:#4a2d2b;
  --kr-shadow:none;
}

body.kr-force-light,
body.kr-force-dark,
.kr-force-light .card,
.kr-force-dark .card {
  background:var(--kr-bg) !important;
  color:var(--kr-text) !important;
}

body.kr-font-serif,
.kr-font-serif .card,
.kr-font-serif .kr-card {
  font-family:Georgia,"Times New Roman","Noto Serif KR","Noto Serif CJK KR",serif !important;
}

body.kr-size-large,
.kr-size-large .card { font-size:19px !important; }

body.kr-size-xlarge,
.kr-size-xlarge .card { font-size:21px !important; }

.kr-meta { overflow:visible; }

.kr-meta-actions {
  display:flex;
  align-items:center;
  gap:6px;
  margin-left:auto;
}

.kr-settings-host { position:relative; display:inline-flex; }

.kr-card .kr-top-button {
  min-height:32px;
  padding:6px 10px;
  border:1px solid var(--kr-line);
  border-radius:10px;
  background:var(--kr-surface);
  color:var(--kr-green);
  box-shadow:none;
  font:800 12px/1.25 -apple-system,BlinkMacSystemFont,"Noto Sans CJK KR","Malgun Gothic",sans-serif;
  white-space:nowrap;
}

.kr-card .kr-record-button { background:var(--kr-soft); }

.kr-card .kr-settings-button[aria-expanded="true"] {
  border-color:var(--kr-green);
  background:var(--kr-surface-3);
}

.kr-settings-panel {
  display:none;
  position:fixed;
  z-index:190;
  top:58px;
  right:12px;
  width:min(390px,calc(100vw - 24px));
  max-height:calc(100vh - 76px);
  max-height:calc(100dvh - 76px);
  padding:14px;
  overflow:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  color:var(--kr-text);
  background:var(--kr-surface);
  border:1px solid var(--kr-line);
  border-radius:15px;
  box-shadow:0 22px 60px rgba(0,0,0,.22);
}

.kr-settings-panel.open { display:block; }

.kr-setting-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 8px;
  color:var(--kr-text);
  font-size:14px;
  font-weight:900;
}

.kr-setting-kicker {
  color:var(--kr-muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:.06em;
}

.kr-setting-row {
  display:grid;
  grid-template-columns:94px minmax(0,1fr);
  align-items:center;
  gap:9px;
  padding:7px 0;
}

.kr-setting-label {
  color:var(--kr-text);
  font-size:12px;
  font-weight:850;
}

.kr-segments {
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  padding:3px;
  background:var(--kr-soft);
  border:1px solid var(--kr-line);
  border-radius:9px;
}

.kr-card .kr-segments button {
  min-height:29px;
  padding:5px 8px;
  color:var(--kr-muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  font-size:11px;
  font-weight:800;
}

.kr-card .kr-segments button.active {
  color:var(--kr-green);
  background:var(--kr-surface);
  border-color:var(--kr-green);
}

.kr-setting-note {
  margin:8px 1px 0;
  color:var(--kr-muted);
  font-size:10px;
  line-height:1.5;
}

.kr-record-modal[aria-hidden="true"] { display:none !important; }

.kr-record-modal {
  position:fixed;
  z-index:210;
  inset:0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  height:100vh;
  height:100dvh;
  min-height:0;
  padding:18px;
  overflow:hidden;
  overscroll-behavior:contain;
  background:rgba(13,20,15,.68);
  box-sizing:border-box;
}

.kr-record-sheet {
  position:relative;
  box-sizing:border-box;
  width:min(790px,100%);
  max-height:calc(100vh - 36px);
  max-height:calc(100dvh - 36px);
  margin:auto;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  color:var(--kr-text);
  background:var(--kr-bg);
  border:1px solid var(--kr-line);
  border-radius:22px;
  box-shadow:0 28px 90px rgba(0,0,0,.30);
}

.kr-record-head {
  position:sticky;
  z-index:3;
  top:0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  padding:23px 24px 18px;
  background:var(--kr-surface);
  border-bottom:1px solid var(--kr-line);
}

.kr-record-eyebrow {
  display:inline-flex;
  padding:4px 10px;
  color:var(--kr-green);
  background:var(--kr-surface-3);
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  letter-spacing:.06em;
}

.kr-record-head h2 {
  margin:8px 0 2px;
  color:var(--kr-text);
  font-size:28px;
  line-height:1.2;
  letter-spacing:-.03em;
}

.kr-record-head p { margin:0; color:var(--kr-muted); font-size:11px; }

.kr-card .kr-record-close,
.kr-record-close {
  flex:0 0 auto;
  width:42px;
  height:42px;
  padding:0;
  color:var(--kr-text);
  background:var(--kr-soft);
  border:1px solid var(--kr-line);
  border-radius:12px;
  font-size:21px;
  font-weight:500;
}

.kr-record-content { min-height:0; padding:20px 22px 34px; }

.kr-record-top {
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  gap:11px;
}

.kr-record-card,
.kr-record-control,
.kr-record-metric,
.kr-record-chart {
  color:var(--kr-text);
  background:var(--kr-surface);
  border:1px solid var(--kr-line);
  border-radius:16px;
}

.kr-record-card { min-height:126px; padding:15px; }

.kr-record-card.today {
  display:flex;
  align-items:center;
  gap:13px;
}

.kr-record-ring {
  --kr-pct:0%;
  display:grid;
  flex:0 0 auto;
  place-items:center;
  width:78px;
  height:78px;
  border-radius:50%;
  background:conic-gradient(var(--kr-green) var(--kr-pct),var(--kr-line) 0);
}

.kr-record-ring:before {
  grid-area:1/1;
  width:61px;
  height:61px;
  content:"";
  background:var(--kr-surface);
  border-radius:50%;
}

.kr-record-ring strong {
  z-index:1;
  grid-area:1/1;
  font-size:17px;
}

.kr-record-ring span { color:var(--kr-muted); font-size:10px; }

.kr-record-label { color:var(--kr-muted); font-size:11px; font-weight:800; }

.kr-record-value { margin-top:5px; font-size:28px; font-weight:900; line-height:1.1; }

.kr-record-value small { margin-left:2px; color:var(--kr-muted); font-size:12px; }

.kr-record-note { margin-top:7px; color:var(--kr-muted); font-size:10px; line-height:1.45; }

.kr-record-controls {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin-top:11px;
}

.kr-record-control {
  display:grid;
  grid-template-columns:1fr minmax(120px,42%);
  align-items:center;
  gap:10px;
  padding:12px 14px;
}

.kr-record-control label { font-size:12px; font-weight:850; }

.kr-record-control input {
  box-sizing:border-box;
  width:100%;
  min-height:38px;
  padding:7px 9px;
  color:var(--kr-text);
  background:var(--kr-soft);
  border:1px solid var(--kr-line);
  border-radius:9px;
  font:700 12px/1.3 inherit;
}

.kr-record-metrics {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:11px;
}

.kr-record-metric { padding:13px; }

.kr-record-metric strong { display:block; margin-top:4px; font-size:19px; line-height:1.25; }

.kr-record-metric span { color:var(--kr-muted); font-size:10px; }

.kr-record-metric em {
  display:block;
  margin-top:5px;
  color:var(--kr-green);
  font-size:10px;
  font-style:normal;
  font-weight:800;
}

.kr-record-progress {
  height:7px;
  margin-top:9px;
  overflow:hidden;
  background:var(--kr-line);
  border-radius:99px;
}

.kr-record-progress span { display:block; height:100%; background:var(--kr-green); border-radius:99px; }

.kr-record-chart { margin-top:11px; padding:16px; }

.kr-record-section-head {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
}

.kr-record-section-head h3 { margin:0; color:var(--kr-text); font-size:14px; }

.kr-record-section-head span { color:var(--kr-muted); font-size:10px; }

.kr-record-bars {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  align-items:end;
  gap:7px;
  height:146px;
  margin-top:14px;
  padding-top:9px;
  border-bottom:1px solid var(--kr-line);
}

.kr-record-day {
  display:grid;
  grid-template-rows:18px 1fr 20px;
  height:100%;
  text-align:center;
}

.kr-record-count { color:var(--kr-muted); font-size:9px; }

.kr-record-barbox { display:flex; align-items:flex-end; justify-content:center; }

.kr-record-bar {
  box-sizing:border-box;
  width:min(30px,70%);
  min-height:3px;
  background:var(--kr-soft);
  border:1px solid var(--kr-line);
  border-radius:7px 7px 2px 2px;
}

.kr-record-day.today .kr-record-bar { background:var(--kr-green); border-color:var(--kr-green); }

.kr-record-daylabel { align-self:end; color:var(--kr-muted); font-size:9px; }

.kr-record-day.today .kr-record-daylabel { color:var(--kr-green); font-weight:900; }

.kr-record-foot {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-top:11px;
  padding:13px 14px;
  background:var(--kr-soft);
  border:1px dashed var(--kr-line);
  border-radius:13px;
}

.kr-record-foot p { margin:0; color:var(--kr-muted); font-size:10px; line-height:1.5; }

.kr-card .kr-record-reset,
.kr-record-reset {
  flex:0 0 auto;
  padding:7px 10px;
  color:var(--kr-bad);
  background:transparent;
  border:1px solid var(--kr-bad);
  border-radius:9px;
  font-size:10px;
  font-weight:850;
}

body.kr-record-body-lock { overflow:hidden !important; }

.kr-force-dark .kr-prompt,
.nightMode:not(.kr-force-light) .kr-prompt,
.night_mode:not(.kr-force-light) .kr-prompt,
.kr-force-dark .kr-quiz .kr-options-answer,

.night_mode:not(.kr-force-light) .kr-quiz .kr-options-answer,
.kr-force-dark .kr-rating-note,
.nightMode:not(.kr-force-light) .kr-rating-note,
.night_mode:not(.kr-force-light) .kr-rating-note {
  color:var(--kr-text) !important;
}

.kr-force-dark .kr-pill,
.nightMode:not(.kr-force-light) .kr-pill,
.night_mode:not(.kr-force-light) .kr-pill,
.kr-force-dark .kr-facts span,
.nightMode:not(.kr-force-light) .kr-facts span,
.night_mode:not(.kr-force-light) .kr-facts span {
  background:var(--kr-soft) !important;
}

.kr-top-button:focus-visible,
.kr-settings-panel button:focus-visible,
.kr-record-modal button:focus-visible,
.kr-record-modal input:focus-visible {

  outline-offset:2px;
}

<script>(function () {

  var modal = null;

  function addEvent(target, name, handler, options) {

  }

    if (document.body) document.body.classList.remove('kr-record-body-lock');
  };

  function safeParse(raw, fallback) {
    try { return JSON.parse(raw); } catch (_) { return fallback; }
  }

  function loadPrefs() {
    var saved = null;
    try { saved = safeParse(localStorage.getItem(PREF_KEY) || '{}', {}); } catch (_) { saved = {}; }
    for (var key in defaults) if (typeof saved[key] === 'undefined') saved[key] = defaults[key];
    if (saved.theme !== 'auto' && saved.theme !== 'light') saved.theme = defaults.theme;
    if (saved.font !== 'serif') saved.font = 'sans';
    if (['base','large','xlarge'].indexOf(saved.size) < 0) saved.size = 'base';
    if (saved.panel !== 'keep') saved.panel = 'close';
    return saved;
  }

  var prefs = loadPrefs();
  var panelOpen = false;
  try { panelOpen = prefs.panel === 'keep' && localStorage.getItem(PANEL_KEY) === '1'; } catch (_) {}

  function savePrefs() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (_) {}
  }

  function setClass(host, name, enabled) {
    if (host && host.classList) host.classList.toggle(name, !!enabled);
  }

  function deviceIsDark() {
    var body = document.body;
    if (body && (body.classList.contains('nightMode') || body.classList.contains('night_mode'))) return true;
    try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (_) { return false; }
  }

  function applyPrefs() {
    var forceLight = prefs.theme === 'light';
    var forceDark = prefs.theme === 'auto' && deviceIsDark();
    var hosts = [document.documentElement, document.body];
    for (var i = 0; i < hosts.length; i++) {
      setClass(hosts[i], 'kr-force-light', forceLight);
      setClass(hosts[i], 'kr-force-dark', forceDark);
      setClass(hosts[i], 'kr-font-serif', prefs.font === 'serif');
      setClass(hosts[i], 'kr-size-large', prefs.size === 'large');
      setClass(hosts[i], 'kr-size-xlarge', prefs.size === 'xlarge');
    }
  }

  function segment(label, key, options) {
    var html = '<div class="kr-setting-row"><div class="kr-setting-label">' + label + '</div><div class="kr-segments">';
    for (var i = 0; i < options.length; i++) {
      var option = options[i];
      html += '<button type="button" data-pref="' + key + '" data-value="' + option[0] + '" class="' + (String(prefs[key]) === String(option[0]) ? 'active' : '') + '">' + option[1] + '</button>';
    }
    return html + '</div></div>';
  }

  function persistPanelState() {
    try { localStorage.setItem(PANEL_KEY, panelOpen ? '1' : '0'); } catch (_) {}
  }

  function renderSettings() {

        applyPrefs();

  function blankRecords() {
    return { schema:2, goal:20, examDate:'', days:{}, seenStudy:{}, seenQuiz:{}, lastEvent:null };
  }

  function loadRecords() {
    var data = null;
    try { data = safeParse(localStorage.getItem(RECORD_KEY) || 'null', null); } catch (_) {}
    if (!data || typeof data !== 'object') data = blankRecords();
    if (!data.days || typeof data.days !== 'object') data.days = {};
    if (!data.seenStudy || typeof data.seenStudy !== 'object') data.seenStudy = {};
    if (!data.seenQuiz || typeof data.seenQuiz !== 'object') data.seenQuiz = {};

    data.goal = Math.max(1, Math.min(500, Number(data.goal) || 20));

  }

  var records = loadRecords();

  function saveRecords() {
    try { localStorage.setItem(RECORD_KEY, JSON.stringify(records)); } catch (_) {}
  }

  function pad(value) { return String(value).length < 2 ? '0' + value : String(value); }
  function dateKey(date) { return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()); }
  function shifted(date, days) { return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days, 12, 0, 0, 0); }

    return isNaN(value.getTime()) ? null : value;
  }

  function dayData(key) {

      quiz:Math.max(0, Number(value.quiz) || 0),
      attempts:Math.max(0, Number(value.attempts) || 0),
      correct:Math.max(0, Number(value.correct) || 0)
    };
  }

  function currentCount(data) { return deck === 'quiz' ? data.quiz : data.study; }

  function recordActivity(correct) {
    if (!noteId) return;
    var eventId = deck + ':' + noteId + ':' + kind;
    var now = Date.now();
    var last = records.lastEvent || {};
    if (last.id === eventId && now - Number(last.time || 0) < 2500) return;
    var today = dateKey(new Date());
    var day = dayData(today);
    if (deck === 'quiz') {
      day.quiz += 1;
      if (typeof correct === 'boolean') {
        day.attempts += 1;
        if (correct) day.correct += 1;
      }
      records.seenQuiz[eventId] = 1;
    } else {
      day.study += 1;
      records.seenStudy[eventId] = 1;
    }
    records.days[today] = day;
    records.lastEvent = { id:eventId, time:now, deck:deck };
    saveRecords();
    if (modal && modal.getAttribute('aria-hidden') === 'false') renderRecords();
  }

  function weekStart(date) {
    var delta = (date.getDay() + 6) % 7;
    return shifted(date, -delta);
  }

  function sumDeck(start, count) {
    var sum = 0;
    for (var i = 0; i < count; i++) sum += currentCount(dayData(dateKey(shifted(start, i))));
    return sum;
  }

  function currentStreak(today) {
    var cursor = today;
    if (!currentCount(dayData(dateKey(cursor)))) cursor = shifted(cursor, -1);
    var streak = 0;
    while (streak < 3660 && currentCount(dayData(dateKey(cursor))) > 0) {
      streak += 1;
      cursor = shifted(cursor, -1);
    }
    return streak;
  }

  function practiceTotals() {
    var attempts = 0, correct = 0;
    Object.keys(records.days).forEach(function (key) {
      var day = dayData(key);
      attempts += day.attempts;
      correct += day.correct;
    });
    return { attempts:attempts, correct:correct, rate:attempts ? Math.round(correct * 100 / attempts) : 0 };
  }

  function dday(today) {
    var target = localDate(records.examDate);
    if (!target) return { value:'미설정', note:'시험일을 입력하세요' };
    var diff = Math.round((target.getTime() - new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12).getTime()) / 86400000);
    if (diff === 0) return { value:'D-DAY', note:records.examDate };
    return { value:diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff), note:records.examDate };
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char];
    });
  }

  function metric(label, value, note, detail, progress) {
    return '<section class="kr-record-metric"><span>' + label + '</span><strong>' + value + '</strong>' +
      (typeof progress === 'number' ? '<div class="kr-record-progress"><span style="width:' + progress + '%"></span></div>' : '') +
      '<em>' + note + '</em><span>' + detail + '</span></section>';
  }

  function chart(today) {
    var labels = ['일','월','화','수','목','금','토'];
    var values = [], max = 1;
    for (var i = 6; i >= 0; i--) {
      var date = shifted(today, -i);
      var count = currentCount(dayData(dateKey(date)));
      values.push({ date:date, count:count, today:i === 0 });
      if (count > max) max = count;
    }
    return values.map(function (item) {
      var height = item.count ? Math.max(8, Math.round(item.count * 100 / max)) : 3;
      return '<div class="kr-record-day' + (item.today ? ' today' : '') + '"><div class="kr-record-count">' + item.count + '</div><div class="kr-record-barbox"><div class="kr-record-bar" style="height:' + height + '%"></div></div><div class="kr-record-daylabel">' + labels[item.date.getDay()] + '</div></div>';
    }).join('');
  }

  function renderRecords() {
    if (!modal) return;
    var today = new Date();
    var todayCount = currentCount(dayData(dateKey(today)));
    var goal = records.goal;
    var goalPct = Math.min(100, Math.round(todayCount * 100 / goal));
    var streak = currentStreak(today);
    var exam = dday(today);
    var seenMap = deck === 'quiz' ? records.seenQuiz : records.seenStudy;
    var seen = Math.min(total, Object.keys(seenMap).length);
    var progress = Math.round(seen * 100 / total);
    var thisStart = weekStart(today);
    var lastStart = shifted(thisStart, -7);
    var thisWeek = sumDeck(thisStart, 7);
    var lastWeek = sumDeck(lastStart, 7);
    var delta = thisWeek - lastWeek;
    var deltaText = lastWeek === 0 ? (thisWeek ? '이번 주 기록 시작' : '변화 없음') : (delta === 0 ? '지난주와 같음' : (delta > 0 ? '+' : '') + delta + '회');
    var practice = practiceTotals();
    var content = q('.kr-record-content', modal);
    content.innerHTML = [
      '<div class="kr-record-top">',
      '<section class="kr-record-card today"><div class="kr-record-ring" style="--kr-pct:' + goalPct + '%"><strong>' + todayCount + '<span>/' + goal + '</span></strong></div><div><div class="kr-record-label">오늘 학습 활동</div><div class="kr-record-value">' + goalPct + '<small>% 달성</small></div><div class="kr-record-note">' + (deck === 'quiz' ? '문제 선택 기준' : '답면 열기 기준') + '</div></div></section>',
      '<section class="kr-record-card"><div class="kr-record-label">연속 학습</div><div class="kr-record-value">' + streak + '<small>일</small></div><div class="kr-record-note">오늘 또는 어제부터 이어진 기록</div></section>',
      '<section class="kr-record-card"><div class="kr-record-label">시험일까지</div><div class="kr-record-value">' + exam.value + '</div><div class="kr-record-note">' + exam.note + '</div></section>',
      '</div>',
      '<div class="kr-record-controls"><div class="kr-record-control"><label for="kr-record-goal">하루 목표</label><input id="kr-record-goal" data-record-goal type="number" min="1" max="500" inputmode="numeric" value="' + goal + '"></div><div class="kr-record-control"><label for="kr-record-exam">시험일</label><input id="kr-record-exam" data-record-exam type="date" value="' + escapeHtml(records.examDate) + '"></div></div>',
      '<div class="kr-record-metrics">',
      metric(deck === 'quiz' ? '퀴즈 덱 진행률' : '학습 덱 진행률', seen + ' / ' + total, progress + '%', seen ? '이 기기에서 본 카드' : '첫 카드를 학습해 보세요', progress),
      metric('이번 주', thisWeek + '회', '월요일부터', deltaText),
      metric('지난 주', lastWeek + '회', '이전 7일', '주간 비교'),
      metric('문제 정답률', practice.attempts ? practice.rate + '%' : '—', practice.correct + ' / ' + practice.attempts + '문제', practice.attempts ? '선택 기록 기준' : '퀴즈 선택 기록 없음'),
      '</div>',
      '<section class="kr-record-chart"><div class="kr-record-section-head"><h3>최근 7일 학습 활동</h3><span>최대 ' + Math.max(1, todayCount) + '회</span></div><div class="kr-record-bars">' + chart(today) + '</div></section>',
      '<div class="kr-record-foot"><p><b>현재 기기에만 저장됩니다.</b><br>Anki의 공식 통계·평점 기록과 별도이며 기기 간 자동 동기화되지 않습니다.</p><button type="button" class="kr-record-reset" data-record-reset>이 기기 기록 초기화</button></div>'
    ].join('');

    var goalInput = q('[data-record-goal]', content);
    var examInput = q('[data-record-exam]', content);
    var resetButton = q('[data-record-reset]', content);
    goalInput.onchange = function () { records.goal = Math.max(1, Math.min(500, Number(goalInput.value) || 20)); saveRecords(); renderRecords(); };
    examInput.onchange = function () { records.examDate = /^\d{4}-\d{2}-\d{2}$/.test(examInput.value || '') ? examInput.value : ''; saveRecords(); renderRecords(); };
    resetButton.onclick = function () {
      if (window.confirm('현재 기기에 저장된 한자혁명 학습 기록을 모두 초기화할까요?')) {
        records = blankRecords();
        saveRecords();
        renderRecords();
      }
    };
  }

  function closeSettings() {
    panelOpen = false;
    persistPanelState();
    renderSettings();
  }

  function openRecords() {
    if (!modal) return;
    previousFocus = document.activeElement;
    closeSettings();
    renderRecords();
    modal.setAttribute('aria-hidden', 'false');
    if (document.body) document.body.classList.add('kr-record-body-lock');
    var close = q('.kr-record-close', modal);
    if (close) close.focus();
  }

  function closeRecords() {
    if (!modal) return;
    modal.setAttribute('aria-hidden', 'true');
    if (document.body) document.body.classList.remove('kr-record-body-lock');
    if (previousFocus && previousFocus.focus) try { previousFocus.focus(); } catch (_) {}
  }

  function setupRecords() {
    var stale = document.querySelector('[data-kr-record-modal="1"]');
    if (stale && stale.parentNode) stale.parentNode.removeChild(stale);
    modal = document.createElement('div');
    modal.className = 'kr-record-modal';
    modal.setAttribute('data-kr-record-modal', '1');
    modal.setAttribute('aria-hidden', 'true');
    modal.innerHTML = '<section class="kr-record-sheet" role="dialog" aria-modal="true" aria-labelledby="kr-record-title"><header class="kr-record-head"><div><span class="kr-record-eyebrow">CURRENT DEVICE</span><h2 id="kr-record-title">내 기록</h2><p>한자혁명 ' + (deck === 'quiz' ? '퀴즈' : '학습') + ' 덱의 기기 로컬 학습 현황</p></div><button type="button" class="kr-record-close" aria-label="내 기록 닫기">×</button></header><div class="kr-record-content"></div></section>';
    document.body.appendChild(modal);
    addEvent(recordButton, 'click', function (event) { event.stopPropagation(); openRecords(); });
    addEvent(q('.kr-record-close', modal), 'click', closeRecords);
    addEvent(modal, 'click', function (event) { if (event.target === modal) closeRecords(); });
  }

  applyPrefs();
  renderSettings();
  setupRecords();

  addEvent(settingsButton, 'click', function (event) {
    event.stopPropagation();
    panelOpen = !panelOpen;
    persistPanelState();
    renderSettings();
  });

  addEvent(document, 'click', function (event) {
    if (!panelOpen || !settingsPanel || !settingsButton) return;
    if (settingsPanel.contains(event.target) || settingsButton.contains(event.target)) return;
    closeSettings();
  });

  addEvent(document, 'keydown', function (event) {
    if (event.key !== 'Escape') return;
    if (modal && modal.getAttribute('aria-hidden') === 'false') closeRecords();
    else if (panelOpen) closeSettings();
  });

  if (window.matchMedia) {
    try {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      var onThemeChange = function () { if (prefs.theme === 'auto') applyPrefs(); };
      if (media.addEventListener) addEvent(media, 'change', onThemeChange);
      else if (media.addListener) { media.addListener(onThemeChange); cleanup.push(function () { try { media.removeListener(onThemeChange); } catch (_) {} }); }
    } catch (_) {}
  }

  if (deck === 'study' && side === 'back') {
    setTimeout(function () { recordActivity(); }, 0);
  }

  if (deck === 'quiz' && side === 'front') {
    var correct = root.getAttribute('data-correct') || '';
    qa('[data-choice]', root).forEach(function (button) {
      addEvent(button, 'click', function () {
        var selected = button.getAttribute('data-choice') || '';
        if (/^[A-D]$/.test(selected) && /^[A-D]$/.test(correct)) recordActivity(selected === correct);
      });
    });
  }
})();</script>
</div>
</body>
</html>
