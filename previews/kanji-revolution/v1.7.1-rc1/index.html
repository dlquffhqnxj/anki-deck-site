조건 선택 → 2. 검색식 복사 → 3. Anki의 ‘찾기’에 붙여넣기 → ‘모으기’\u003c/strong>\u003cbr>이 도우미는 조건을 Anki 검색식으로 바꿉니다. 실제 카드 기록을 조회하고 모으는 일은 Anki가 합니다.\u003c/p>\\n    \u003cdiv class=\\\"af-fields\\\">\\n      \u003clabel>급수 / 구분\u003cselect data-af-field=\\\"level\\\">\u003c/select>\u003c/label>\\n      \u003clabel>학습·문제 유형\u003cselect data-af-field=\\\"area\\\">\u003c/select>\u003c/label>\\n      \u003clabel>모을 기준\u003cselect data-af-field=\\\"reason\\\">\u003coption value=\\\"again_or_flag\\\">오답 + 플래그\u003c/option>\u003coption value=\\\"again\\\">오답 : 다시 평가\u003c/option>\u003coption value=\\\"flag\\\">헷갈림 : 플래그\u003c/option>\u003coption value=\\\"hard\\\">어려움 평가\u003c/option>\u003coption value=\\\"lapses\\\">반복 실패 : 누적 3회 이상\u003c/option>\u003c/select>\u003c/label>\\n      \u003clabel>평가 기록의 기간\u003cselect data-af-field=\\\"days\\\">\u003coption value=\\\"1\\\">오늘\u003c/option>\u003coption value=\\\"7\\\" selected>최근 7일\u003c/option>\u003coption value=\\\"14\\\">최근 14일\u003c/option>\u003coption value=\\\"30\\\">최근 30일\u003c/option>\u003c/select>\u003c/label>\\n      \u003clabel>한 번에 모을 카드\u003cselect data-af-field=\\\"limit\\\">\u003coption value=\\\"20\\\">20장\u003c/option>\u003coption value=\\\"50\\\">50장\u003c/option>\u003coption value=\\\"100\\\">100장\u003c/option>\u003coption value=\\\"200\\\">200장\u003c/option>\u003c/select>\u003c/label>\\n      \u003clabel>선택 기준\u003cselect data-af-field=\\\"order\\\">\u003coption value=\\\"random\\\">랜덤\u003c/option>\u003coption value=\\\"lapses\\\">복습 실패 횟수 많은 순\u003c/option>\u003c/select>\u003c/label>\\n    \u003c/div>\\n    \u003cp class=\\\"af-summary\\\" data-af-summary>\u003c/p>\\n    \u003cp class=\\\"af-description\\\" data-af-explanation>\u003c/p>\\n    \u003cp class=\\\"af-description\\\" data-af-order-explanation>\u003c/p>\\n    \u003clabel class=\\\"af-query-label\\\">Anki의 ‘찾기’에 넣을 검색식 — 아래 내용 전체\u003ctextarea data-af-query rows=\\\"3\\\" readonly spellcheck=\\\"false\\\" autocapitalize=\\\"off\\\" autocorrect=\\\"off\\\" aria-label=\\\"생성된 필터 검색식\\\">\u003c/textarea>\u003c/label>\\n    \u003cdiv class=\\\"af-buttons\\\">\u003cbutton type=\\\"button\\\" data-af-copy>검색식 복사\u003c/button>\u003cbutton type=\\\"button\\\" data-af-select>전체 선택 · 직접 복사\u003c/button>\u003c/div>\\n    \u003cp class=\\\"af-message\\\" data-af-message role=\\\"status\\\" aria-live=\\\"polite\\\">\u003c/p>\\n    \u003cdetails class=\\\"af-guide\\\" data-af-copy-check>\u003csummary>복사·붙여넣기가 되는지 확인\u003c/summary>\\n      \u003cp>PC에서는 위 ‘전체 선택 · 직접 복사’를 누른 뒤 \u003cstrong>Ctrl+C\u003c/strong>를 누르세요. iPhone·iPad에서는 검색식 칸을 길게 눌러 전체 선택 후 ‘복사’를 누르세요.\u003c/p>\\n      \u003clabel class=\\\"af-query-label\\\">이 확인 칸에 직접 붙여넣어 보세요\u003ctextarea data-af-paste rows=\\\"3\\\" spellcheck=\\\"false\\\" autocapitalize=\\\"off\\\" autocorrect=\\\"off\\\" placeholder=\\\"PC: 여기를 누르고 Ctrl+V / 모바일: 길게 눌러 붙여넣기\\\" aria-label=\\\"복사한 검색식 붙여넣기 확인\\\">\u003c/textarea>\u003c/label>\\n      \u003cp data-af-paste-result class=\\\"af-message\\\" role=\\\"status\\\" aria-live=\\\"polite\\\">아직 확인하지 않았습니다.\u003c/p>\\n      \u003cp>이 칸은 붙여넣기 확인용입니다. 실제 필터 덱은 Anki에서 만듭니다. 여기에는 들어가는데 Anki에 들어가지 않으면 Anki 창의 ‘찾기’를 클릭한 뒤 Ctrl+A → Ctrl+V를 누르세요.\u003c/p>\\n    \u003c/details>\\n    \u003cdl class=\\\"af-settings\\\">\\n      \u003cdt>Anki에 넣을 이름 예시\u003c/dt>\u003cdd data-af-name>\u003c/dd>\\n      \u003cdt>개수 제한\u003c/dt>\u003cdd data-af-limit>\u003c/dd>\\n      \u003cdt>선택 기준\u003c/dt>\u003cdd data-af-order>\u003c/dd>\\n      \u003cdt>일정 조정\u003c/dt>\u003cdd>추가 연습에서 기존 간격을 유지하려면 체크 해제\u003c/dd>\\n    \u003c/dl>\\n    \u003cdetails class=\\\"af-guide\\\" data-af-concept>\u003csummary>검색식이 카드 기록을 찾는 원리 · 예시로 보기\u003c/summary>\\n      \u003cp>\u003cstrong>노트에는 한자·뜻·급수 같은 내용이 들어 있고, 그 노트에서 만든 각 카드에는 평가 이력과 깃발이 따로 연결됩니다.\u003c/strong> Anki의 카드 정보에서 그 기록을 확인할 수 있습니다. 같은 노트의 읽기·쓰기 카드도 평가와 깃발은 서로 다를 수 있습니다.\u003c/p>\\n      \u003cp>이 도우미는 선택한 급수·유형·수집 기준을 Anki가 원래 지원하는 검색 문법으로 조합합니다. 검색식 자체에 카드나 학습기록이 들어 있지는 않습니다.\u003c/p>\\n      \u003cdl class=\\\"af-settings\\\" data-af-tokens>\u003c/dl>\\n      \u003cp>아래는 \u003cstrong>설명용 카드 5장\u003c/strong>입니다. 모두 선택한 급수·유형에 속한다고 가정합니다. 사용자의 실제 기록과 연결되어 있지 않습니다.\u003c/p>\\n      \u003cdiv class=\\\"af-table-wrap\\\">\u003ctable class=\\\"af-demo-table\\\">\u003cthead>\u003ctr>\u003cth>카드\u003c/th>\u003cth>‘다시’ 기록\u003c/th>\u003cth>현재 주황 깃발\u003c/th>\u003cth>‘어려움’ 기록\u003c/th>\u003cth>복습 실패 누계\u003c/th>\u003cth>조건 일치\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody data-af-demo-body>\u003c/tbody>\u003c/table>\u003c/div>\\n      \u003cp class=\\\"af-description\\\">A는 오늘 ‘다시’를 누른 후 ‘알맞음’으로 맞혔습니다. 마지막 평가가 알맞음이어도 오늘의 다시 기록은 남습니다. 복습 실패 누계는 복습 단계에서 잊어 다시 학습으로 돌아간 횟수이며, 학습 중 누른 모든 ‘다시’의 합계와는 다릅니다.\u003c/p>\\n      \u003cbutton type=\\\"button\\\" data-af-demo-build>예시 카드로 ‘모으기’ 실행\u003c/button>\\n      \u003cp data-af-demo-result class=\\\"af-message\\\" role=\\\"status\\\" aria-live=\\\"polite\\\">조건을 고른 뒤 예시 버튼을 누르면, 모일 카드와 순서를 볼 수 있습니다.\u003c/p>\\n    \u003c/details>\\n    \u003cdetails class=\\\"af-guide\\\">\u003csummary>Anki에서 필터 덱 만들기 · 다음에 다시 모으기\u003c/summary>\\n      \u003col>\u003cli>위 검색식을 복사합니다. 자동 복사가 안 되면 ‘전체 선택 · 직접 복사’를 사용합니다.\u003c/li>\u003cli>PC Anki에서 \u003cstrong>도구 → 필터 덱 만들기\u003c/strong>를 엽니다.\u003c/li>\u003cli>‘이름’을 정하고, \u003cstrong>‘찾기’를 클릭 → Ctrl+A → Ctrl+V\u003c/strong>로 기존 검색식 전체를 교체합니다. 이름은 복습 공간의 이름이고, 어떤 카드를 모을지는 ‘찾기’가 정합니다.\u003c/li>\u003cli>개수 제한과 선택 기준을 위 안내대로 맞추고 ‘모으기(Build)’를 누릅니다. 검색식만 붙여넣은 단계에서는 아직 카드가 모이지 않습니다.\u003c/li>\u003cli>Anki 덱 목록에서 정한 이름을 열어 복습합니다. 다음에는 같은 덱의 ‘다시 만들기(Rebuild)’로 새 기록을 반영합니다.\u003c/li>\u003c/ol>\\n      \u003cp>iPhone·iPad는 학습 화면의 Anki 도구 메뉴 → Filter/Cram에서 같은 검색식을 사용합니다. 앱·언어에 따라 버튼 이름이 다를 수 있습니다.\u003c/p>\\n      \u003cp>‘오답’은 Anki에서 직접 누른 ‘다시’ 평가 기록입니다. 카드 안에서 틀린 보기를 선택한 것만으로 이 기록이 생기지는 않습니다. ‘헷갈림’은 직접 붙인 주황 깃발입니다.\u003c/p>\\n      \u003cp>‘오답 + 플래그’는 \u003cstrong>둘 중 하나만 해당해도\u003c/strong> 모읍니다. 두 조건을 모두 충족해야 한다는 뜻이 아닙니다. 주황 깃발에는 기간 제한이 없습니다.\u003c/p>\\n      \u003cp>일시중지·묻힌 카드·다른 필터 덱에 들어간 카드는 모을 수 없습니다. 실제 수집 수는 Anki에서 확인하세요. 필터 덱의 학습 단계를 마친 카드는 원래 덱으로 돌아갑니다. 남은 카드는 ‘비우기(Empty)’로 돌려보낼 수 있습니다.\u003c/p>\\n      \u003cp>이미 저장한 Anki 필터 덱의 조건은 자동 변경되지 않습니다. 조건이나 노트 유형 이름을 바꿨다면 Anki의 찾기도 새 검색식으로 교체하세요.\u003c/p>\\n      \u003cp>선택 조건은 이 기기에 저장됩니다. 붙여넣기 확인 칸의 내용은 저장하지 않습니다.\u003c/p>\\n    \u003c/details>\\n  \u003c/div>\\n\u003c/details>\\n\";\n(function () {\n  'use strict';\n  var VERSION = '1.0.0';\n  var PREF_KEY = 'anki-filter-helper:' + String((window.AnkiFilterHelperConfig || {}).product_id || 'unconfigured') + ':v1';\n  var PROVIDED = window.AnkiFilterHelperConfig;\n  if (!PROVIDED || !PROVIDED.product_id || !PROVIDED.models || !Array.isArray(PROVIDED.areas) || !PROVIDED.areas.length || !Array.isArray(PROVIDED.levels)) {\n    window.AnkiFilterHelperError = '과목별 필터 설정이 필요합니다.';\n    Array.from(document.querySelectorAll('[data-af-helper]')).forEach(function(box){box.textContent = window.AnkiFilterHelperError;});\n    return;\n  }\n  var MODELS = PROVIDED.models;\n  var AREAS = PROVIDED.areas;\n  var LEVELS = PROVIDED.levels;\n  var LEVEL_FIELD = PROVIDED.level_field || 'Level';\n  var ALL_LABEL = PROVIDED.all_levels_label || '전체';\n  var REASONS = [\n    {id:'again_or_flag',label:'오답 + 플래그',short:'오답·플래그'},\n    {id:'again',label:'오답 : 다시 평가',short:'최근오답'},\n    {id:'flag',label:'헷갈림 : 플래그',short:'플래그'},\n    {id:'hard',label:'어려움 평가',short:'어려움'},\n    {id:'lapses',label:'반복 실패 : 누적 3회 이상',short:'반복실패'}\n  ];\n  var DEFAULTS = Object.assign({level:'all',area:AREAS[0].id,reason:'again_or_flag',days:7,limit:20,order:'random'},PROVIDED.defaults || {});\n\n  function member(value, choices, fallback) {\n    return choices.indexOf(value) >= 0 ? value : fallback;\n  }\n  function normalize(value) {\n    value = value && typeof value === 'object' ? value : {};\n    return {\n      level: member(value.level,['all'].concat(LEVELS.map(function(x){return x.id;})),DEFAULTS.level),\n      area: member(value.area,AREAS.map(function(a){return a.id;}),DEFAULTS.area),\n      reason: member(value.reason,REASONS.map(function(a){return a.id;}),DEFAULTS.reason),\n      days: member(Number(value.days),[1,7,14,30],DEFAULTS.days),\n      limit: member(Number(value.limit),[20,50,100,200],DEFAULTS.limit),\n      order: member(value.order,['random','lapses'],DEFAULTS.order)\n    };\n  }\n  function term(field, value) {\n    return '\"' + field + ':' + String(value).replace(/\\\\/g,'\\\\\\\\').replace(/\"/g,'\\\\\"') + '\"';\n  }\n  function spec(config) {\n    var c = normalize(config);\n    var area = AREAS.filter(function(a){return a.id === c.area;})[0];\n    var reason = REASONS.filter(function(a){return a.id === c.reason;})[0];\n    var parts = [];\n    if (area.model === 'all') {\n      parts.push('(' + Object.keys(MODELS).map(function(k){return term('note',MODELS[k]);}).join(' or ') + ')');\n    } else parts.push(term('note',MODELS[area.model]));\n    if (area.card) parts.push('card:' + area.card);\n    if (area.legacy && c.level === 'all') {\n      var shared=parts[0]+' '+term(area.field,area.value);\n      var older=term('note',MODELS[area.legacy.model])+(area.legacy.field?' '+term(area.legacy.field,area.legacy.value):'');\n      parts[0]='(('+shared+') or ('+older+'))';\n    } else if (area.field) parts.push(term(area.field,area.value));\n    if (c.level !== 'all') parts.push(term(LEVEL_FIELD, LEVELS.filter(function(x){return x.id === c.level;})[0].value));\n    var recent = 'rated:' + c.days + ':';\n    var explanation;\n    if (c.reason === 'again_or_flag') {\n      parts.push('(' + recent + '1 or flag:2)');\n      explanation = '최근 ' + c.days + '일의 ‘다시’ 평가 또는 현재 주황 깃발, 둘 중 하나만 해당해도 모읍니다. 깃발에는 기간 제한이 없습니다.';\n    } else if (c.reason === 'again') {\n      parts.push(recent + '1');\n      explanation = '일반 학습에서 최근 ' + c.days + '일 안에 ‘다시’를 한 번 이상 누른 카드입니다.';\n    } else if (c.reason === 'flag') {\n      parts.push('flag:2');\n      explanation = '주황 깃발을 직접 단 카드입니다. 깃발을 단 날짜는 이 조건에 사용하지 않습니다.';\n    } else if (c.reason === 'hard') {\n      parts.push(recent + '2');\n n  function escapeHtml(value) {\n    return String(value == null ? '' : value).replace(/[&\u003c>\"']/g, function (char) {\n      return { '&':'&amp;', '\u003c':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;' }[char];\n    });\n  }\n\n  function metric(label, value, note, detail, progress) {\n    return '\u003csection class=\"kr-record-metric\">\u003cspan>' + label + '\u003c/span>\u003cstrong>' + value + '\u003c/strong>' +\n      (typeof progress === 'number' ? '\u003cdiv class=\"kr-record-progress\">\u003cspan style=\"width:' + progress + '%\">\u003c/span>\u003c/div>' : '') +\n      '\u003cem>' + note + '\u003c/em>\u003cspan>' + detail + '\u003c/span>\u003c/section>';\n  }\n\n  function chart(today) {\n    var labels = ['일','월','화','수','목','금','토'];\n    var values = [], max = 1;\n    for (var i = 6; i >= 0; i--) {\n      var date = shifted(today, -i);\n      var count = currentCount(dayData(dateKey(date)));\n      values.push({ date:date, count:count, today:i === 0 });\n      if (count > max) max = count;\n    }\n    return values.map(function (item) {\n      var height = item.count ? Math.max(8, Math.round(item.count * 100 / max)) : 3;\n      return '\u003cdiv class=\"kr-record-day' + (item.today ? ' today' : '') + '\">\u003cdiv class=\"kr-record-count\">' + item.count + '\u003c/div>\u003cdiv class=\"kr-record-barbox\">\u003cdiv class=\"kr-record-bar\" style=\"height:' + height + '%\">\u003c/div>\u003c/div>\u003cdiv class=\"kr-record-daylabel\">' + labels[item.date.getDay()] + '\u003c/div>\u003c/div>';\n    }).join('');\n  }\n\n  function renderRecords() {\n    if (!modal) return;\n    var today = new Date();\n    var todayCount = currentCount(dayData(dateKey(today)));\n    var goal = records.goal;\n    var goalPct = Math.min(100, Math.round(todayCount * 100 / goal));\n    var streak = currentStreak(today);\n    var exam = dday(today);\n    var seenMap = deck === 'quiz' ? records.seenQuiz : records.seenStudy;\n    var seen = deck === 'quiz'\n    ? Math.min(total, new Set(Object.keys(seenMap).map(function (k) { return k.split(':')[1]; }).filter(function (id) {\n      return /^KR-N-(?:X-|SIM-|VERB-|Q-MEAN-|Q-CTX-)/.test(id || '');\n    })).size)\n    : Math.min(total, Object.keys(seenMap).length);\n    var progress = Math.round(seen * 100 / total);\n    var thisStart = weekStart(today);\n    var lastStart = shifted(thisStart, -7);\n    var thisWeek = sumDeck(thisStart, 7);\n    var lastWeek = sumDeck(lastStart, 7);\n    var delta = thisWeek - lastWeek;\n    var deltaText = lastWeek === 0 ? (thisWeek ? '이번 주 기록 시작' : '변화 없음') : (delta === 0 ? '지난주와 같음' : (delta > 0 ? '+' : '') + delta + '회');\n    var practice = practiceTotals();\n    var content = q('.kr-record-content', modal);\n    content.innerHTML = [\n      '\u003cdiv class=\"kr-record-top\">',\n      '\u003csection class=\"kr-record-card today\">\u003cdiv class=\"kr-record-ring\" style=\"--kr-pct:' + goalPct + '%\">\u003cstrong>' + todayCount + '\u003cspan>/' + goal + '\u003c/span>\u003c/strong>\u003c/div>\u003cdiv>\u003cdiv class=\"kr-record-label\">오늘 학습 활동\u003c/div>\u003cdiv class=\"kr-record-value\">' + goalPct + '\u003csmall>% 달성\u003c/small>\u003c/div>\u003cdiv class=\"kr-record-note\">' + (deck === 'quiz' ? '선택·답면 열기 기준' : '답면 열기 기준') + '\u003c/div>\u003c/div>\u003c/section>',\n      '\u003csection class=\"kr-record-card\">\u003cdiv class=\"kr-record-label\">연속 학습\u003c/div>\u003cdiv class=\"kr-record-value\">' + streak + '\u003csmall>일\u003c/small>\u003c/div>\u003cdiv class=\"kr-record-note\">오늘 또는 어제부터 이어진 기록\u003c/div>\u003c/section>',\n      '\u003csection class=\"kr-record-card\">\u003cdiv class=\"kr-record-label\">시험일까지\u003c/div>\u003cdiv class=\"kr-record-value\">' + exam.value + '\u003c/div>\u003cdiv class=\"kr-record-note\">' + exam.note + '\u003c/div>\u003c/section>',\n      '\u003c/div>',\n      '\u003cdiv class=\"kr-record-controls\">\u003cdiv class=\"kr-record-control\">\u003clabel for=\"kr-record-goal\">하루 목표\u003c/label>\u003cinput id=\"kr-record-goal\" data-record-goal type=\"number\" min=\"1\" max=\"500\" inputmode=\"numeric\" value=\"' + goal + '\">\u003c/div>\u003cdiv class=\"kr-record-control\">\u003clabel for=\"kr-record-exam\">시험일\u003c/label>\u003cinput id=\"kr-record-exam\" data-record-exam type=\"date\" value=\"' + escapeHtml(records.examDate) + '\">\u003c/div>\u003c/div>',\n      '\u003cdiv class=\"kr-record-metrics\">',\n      metric(deck === 'quiz' ? '퀴즈 덱 진행률' : '학습 덱 진행률', seen + ' / ' + total, progress + '%', seen ? '이 기기에서 본 카드' : '첫 카드를 학습해 보세요', progress),\n      metric('이번 주', thisWeek + '회', '월요일부터', deltaText),\n      metric('지난 주', lastWeek + '회', '이전 7일', '주간 비교'),\n      metric('문제 정답률', practice.attempts ? practice.rate + '%' : '—', practice.correct + ' / ' + practice.attempts + '문제', practice.attempts ? '선택 기록 기준' : '퀴즈 선택 기록 없음'),\n      '\u003c/div>',\n      '\u003csection class=\"kr-record-chart\">\u003cdiv class=\"kr-record-section-head\">\u003ch3>최근 7일 학습 활동\u003c/h3>\u003cspan>최대 ' + Math.max(1, todayCount) + '회\u003c/span>\u003c/div>\u003cdiv class=\"kr-record-bars\">' + chart(today) + '\u003c/div>\u003c/section>',\n      weakSection(),\n      '\u003cdiv class=\"kr-storage-state\">' + (storageOK ? '저장 범위: 이 기기' : '저장이 제한되어 현재 화면에서만 임시 적용됩니다.') + '\u003c/div>',\n      '\u003cdiv class=\"kr-record-foot\">\u003cp>\u003cb>현재 기기에만 저장됩니다.\u003c/b>\u003cbr>Anki의 공식 통계·평점 기록과 별도이며 기기 간 자동 동기화되지 않습니다.\u003c/p>\u003cbutton type=\"button\" class=\"kr-record-reset\" data-record-reset>이 기기 기록 초기화\u003c/button>\u003c/div>'\n    ].join('');\n\n    bindWeak();\n    var goalInput = q('[data-record-goal]', content);\n    var examInput = q('[data-record-exam]', content);\n    var resetButton = q('[data-record-reset]', content);\n    goalInput.onchange = function () { records.goal = Math.max(1, Math.min(500, Number(goalInput.value) || 20)); saveRecords(); renderRecords(); };\n    examInput.onchange = function () { records.examDate = /^\\d{4}-\\d{2}-\\d{2}$/.test(examInput.value || '') ? examInput.value : ''; saveRecords(); renderRecords(); };\n    resetButton.onclick = function () {\n      if (window.confirm('현재 기기에 저장된 한자혁명 학습 기록을 모두 초기화할까요?')) {\n        records = blankRecords();\n        records.expansionMarksImported = true;\n        saveRecords();\n        renderRecords();\n      }\n    };\n  }\n\n  function closeSettings() {\n    panelOpen = false;\n    persistPanelState();\n    renderSettings();\n  }\n\n  function openRecords() {\n    if (!modal) return;\n    previousFocus = document.activeElement;\n    renderRecords();\n    modal.setAttribute('aria-hidden', 'false');\n    \n    var close = q('.kr-record-close', modal);\n    if (close) close.focus();\n  }\n\n  function closeRecords() {\n    if (!modal) return;\n    modal.setAttribute('aria-hidden', 'true');\n    if (document.body) document.body.classList.remove('kr-record-body-lock');\n    if (previousFocus && previousFocus.focus) try { previousFocus.focus(); } catch (_) {}\n  }\n\n  function setupRecords() {\n    var stale = document.querySelector('[data-kr-record-modal=\"1\"]');\n    if (stale && stale.parentNode) stale.parentNode.removeChild(stale);\n    modal = document.createElement('div');\n    modal.className = 'kr-record-modal';\n    modal.setAttribute('data-kr-record-modal', '1');\n    modal.setAttribute('aria-hidden', 'true');\n    modal.innerHTML = '\u003csection class=\"kr-record-sheet\" role=\"region\" aria-labelledby=\"kr-record-title\">\u003cheader class=\"kr-record-head\">\u003cdiv>\u003cspan class=\"kr-record-eyebrow\">이 기기\u003c/span>\u003ch2 id=\"kr-record-title\">내 기록\u003c/h2>\u003cp>한자혁명 ' + (deck === 'quiz' ? '퀴즈' : '학습') + ' 덱의 기기 로컬 학습 현황\u003c/p>\u003c/div>\u003cbutton type=\"button\" class=\"kr-record-close\" aria-label=\"내 기록 닫기\">×\u003c/button>\u003c/header>\u003cdiv class=\"kr-record-content\">\u003c/div>\u003c/section>';\n    root.insertBefore(modal, settingsPanel.nextSibling);\n    addEvent(recordButton, 'click', function (event) { event.stopPropagation(); openRec   <script>
    const data = JSON.parse(document.getElementById('preview-data').textContent);
    const select = document.getElementById('sample');
    const frame = document.getElementById('card-frame');
    const front = document.getElementById('front');
    const back = document.getElementById('back');
    let observer;

    for (const [role, label] of [['study', '01 학습'], ['practice', '02 실전문제']]) {
      const group = document.createElement('optgroup');
      group.label = label;
      data.samples.forEach((sample, index) => {
        if (role !== sample.role) return;
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = sample.label;
        group.appendChild(option);
      });
      select.appendChild(group);
    }

    function show(side = 'front') {
      const sample = data.samples[Number(select.value)];
      const body = sample[side].replace('<template data-shared-runtime></template>', () => '<script>' + data.runtime + '<\/script>');
      frame.srcdoc = '<!doctype html><html lang="ko"><head><meta charset="utf-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1">' +
        '<style>' + data.css + '\n.card{min-height:0}</style></head><body class="card">' + body + '</body></html>';
      document.getElementById('identity').textContent = sample.note + ' · ' + (side === 'front' ? '앞면' : '답면');
      front.setAttribute('aria-pressed', String(side === 'front'));
      back.setAttribute('aria-pressed', String(side === 'back'));
    }

    frame.addEventListener('load', () => {
      if (observer) observer.disconnect();
      const body = frame.contentDocument.body;
      const card = body.querySelector('[data-kr-unified]');
      if (!card) return;
      const resize = () => requestAnimationFrame(() => {
        if (frame.contentDocument !== body.ownerDocument) return;
        const height = Math.max(440, Math.ceil(card.getBoundingClientRect().bottom + 85)) + 'px';
        if (frame.style.height !== height) frame.style.height = height;
      });
      observer = new ResizeObserver(resize);
      observer.observe(card);
      resize();
    });
    select.addEventListener('change', () => show());
    front.addEventListener('click', () => show());
    back.addEventListener('click', () => show('back'));
    show();
  </script>
