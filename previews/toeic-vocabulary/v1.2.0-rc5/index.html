l()}catch(e){}if(msg)status(msg)}\n  function speak(list){\n    var source=list.filter(function(x){return !!x}),times=Math.max(1,Math.min(3,Number(prefs.repeat)||1)),queue=[];\n    source.forEach(function(x){for(var i=0;i\u003ctimes;i++)queue.push(x)});\n    if(!queue.length)return;if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){status('이 기기에서는 카드 내 TTS를 사용할 수 없습니다.');return}stop();\n    function next(){if(!queue.length){status('');return}var u=new SpeechSynthesisUtterance(queue.shift());u.lang='en-US';u.rate=Number(prefs.speed)||1;u.onstart=function(){status('영어 음성 재생 중 · '+u.rate+'배속 · '+times+'회 설정')};u.onend=function(){speechTimer=setTimeout(next,220)};u.onerror=function(){status('음성 재생을 확인할 수 없습니다. 기기 TTS 설정을 확인해 주세요.')};try{window.speechSynthesis.speak(u)}catch(e){status('음성 재생을 시작하지 못했습니다.')}}next();\n  }\n  function scoped(){var a=text('main'),b=text('secondary');if(prefs.scope==='secondary')return[b];if(prefs.scope==='both')return[a,b];return[a]}\n  function seg(label,key,opts){var h='\u003cdiv class=\"lab-setting-row\"\u003e\u003cdiv class=\"lab-setting-label\"\u003e'+label+'\u003c/div\u003e\u003cdiv class=\"lab-segments\"\u003e';opts.forEach(function(o){h+='\u003cbutton type=\"button\" data-pref=\"'+key+'\" data-value=\"'+o[0]+'\" class=\"'+(String(prefs[key])===String(o[0])?'active':'')+'\"\u003e'+o[1]+'\u003c/button\u003e'});return h+'\u003c/div\u003e\u003c/div\u003e'}\n  function sw(label,key,note){return '\u003cdiv class=\"lab-switch-row\"\u003e\u003cdiv\u003e\u003cdiv class=\"lab-setting-label\"\u003e'+label+'\u003c/div\u003e'+(note?'\u003cdiv class=\"lab-setting-note\"\u003e'+note+'\u003c/div\u003e':'')+'\u003c/div\u003e\u003cbutton type=\"button\" class=\"lab-switch '+(prefs[key]?'on':'')+'\" data-toggle=\"'+key+'\" role=\"switch\" aria-checked=\"'+String(!!prefs[key])+'\" aria-label=\"'+label+'\"\u003e\u003c/button\u003e\u003c/div\u003e'}\n  function renderSettings(){var p=q('.lab-settings-panel'),b=q('.lab-settings-button');if(!p||! r;gap:12px}.lab-record-card{box-sizing:border-box;min-width:0;padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}\n.lab-record-card.today{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:15px;background:linear-gradient(135deg,var(--blue-soft),var(--paper))}\n.lab-record-ring{--lab-pct:0%;display:grid;place-items:center;width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--blue) var(--lab-pct),var(--line) 0);position:relative}.lab-record-ring:after{content:\"\";position:absolute;inset:9px;border-radius:50%;background:var(--paper)}\n.lab-record-ring strong{position:relative;z-index:1;font-size:20px;line-height:1}.lab-record-ring span{font-size:12px;color:var(--muted)}\n.lab-record-label{color:var(--muted);font-size:12px;font-weight:800}.lab-record-value{margin-top:3px;font-size:30px;line-height:1.12;font-weight:880;letter-spacing:-.04em}.lab-record-value small{font-size:14px;color:var(--muted);font-weight:750}.lab-record-note{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.4}\n.lab-record-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.lab-record-control{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--paper)}.lab-record-control label{font-size:12px;font-weight:820}.lab-record-control input{box-sizing:border-box;max-width:155px;min-height:38px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px}\n.lab-record-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.lab-record-metric{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.lab-record-metric strong{display:block;margin-top:4px;font-size:20px;line-height:1.2}.lab-record-metric span{color:var(--muted);font-size:11px}.lab-record-metric em{display:block;margin-top:5px;color:var(--blue);font-size:11px;font-style:normal;font-weight:750}\n.lab-record-chart{margin-top:12px;padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}.lab-record-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.lab-record-section-head h3{margin:0;font-size:15px}.lab-record-section-head span{color:var(--muted);font-size:11px}\n.lab-record-bars{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:8px;height:154px;margin-top:15px;padding-top:10px;border-bottom:1px solid var(--line)}.lab-record-day{display:grid;grid-template-rows:18px 1fr 20px;height:100%;text-align:center}.lab-record-count{color:var(--muted);font-size:10px}.lab-record-barbox{display:flex;align-items:flex-end;justify-content:center}.lab-record-bar{width:min(30px,70%);min-height:3px;border-radius:7px 7px 2px 2px;background:var(--blue-soft);border:1px solid var(--line);box-sizing:border-box}.lab-record-day.today .lab-record-bar{background:var(--blue);border-color:var(--blue)}.lab-record-day.today .lab-record-daylabel{color:var(--blue);font-weight:850}.lab-record-daylabel{align-self:end;color:var(--muted);font-size:10px}\n.lab-record-progress{height:7px;margin-top:9px;border-radius:99px;background:var(--line);overflow:hidden}.lab-record-progress span{display:block;height:100%;border-radius:99px;background:var(--mint)}\n.lab-record-foot{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:12px;padding:13px 14px;border:1px dashed var(--line);border-radius:13px;background:var(--panel)}.lab-record-foot p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.lab-record-reset{flex:0 0 auto;border:1px solid var(--danger);border-radius:9px;padding:7px 10px;background:transparent;color:var(--danger);font-size:11px;font-weight:800;cursor:pointer}\nbody.lab-record-body-lock{overflow:hidden}\nbody.lab-force-light .lab-record-sheet,body.lab-force-light .lab-record-card,body.lab-force /g,' ').trim()}).filter(Boolean),correct=choiceKey(keyEl.textContent||''),feedback=q('.lab-choice-feedback'),locked=false;if(parts.length\u003c2||!correct)return;box.innerHTML='';parts.forEach(function(label){var b=document.createElement('button');b.type='button';b.className='lab-choice-button';b.textContent=label;b.setAttribute('data-choice',choiceKey(label));b.onclick=function(){if(locked)return;locked=true;qa('.lab-choice-button').forEach(function(x){x.disabled=true;if(x.getAttribute('data-choice')===correct)x.classList.add('correct')});var picked=b.getAttribute('data-choice');b.classList.add('selected');if(picked===correct){if(feedback){feedback.className='lab-choice-feedback good';feedback.textContent='정답입니다. 해설로 바로 이동합니다.'}}else{b.classList.add('wrong');if(feedback){feedback.className='lab-choice-feedback bad';feedback.textContent='오답입니다. 해설로 바로 이동합니다.'}}savePracticeChoice(picked,correct);revealInlineExplanation(picked,correct);setTimeout(tryShowNativeAnswer,260)};box.appendChild(b)})}\n  apply();stop();\n  setupMnemonic();setupChoices();setupHint();restorePracticeChoice();\n  qa('[data-play]').forEach(function(el){el.onclick=function(){var role=el.getAttribute('data-play');speak([text(role)])}});\n  var sb=q('.lab-settings-button');if(sb)sb.onclick=function(){panelOpen=!panelOpen;try{localStorage.setItem(OPEN_KEY,panelOpen?'1':'0')}catch(e){}renderSettings()};\n  qa('.lab-memory-image img').forEach(function(img){img.onclick=function(){openImage(img)}});\n  var modal=q('.lab-image-modal'),close=q('.lab-image-close');if(close)close.onclick=closeImage;if(modal)modal.onclick=function(e){if(e.target===modal)closeImage()};\n  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeImage();panelOpen=false;renderSettings()}});\n  document.addEventListener('visibilitychange',function(){if(document.hidden)stop()});\n  renderSettings();if(prefs.auto)setTimeout(function(){speak(scoped())},180);\n})();\u003c/script\u003e\n\u003cscript\u003e\n(function(){\n  'use strict';\n  var RECORD_KEY='toeicLabRecordsV124';\n  var meta=document.querySelector('.lab-record-meta');\n  if(!meta)return;\n  var noteId=(meta.getAttribute('data-note-id')||'').trim();\n  var side=meta.getAttribute('data-side')||'front';\n  var total=Math.max(1,Number(meta.getAttribute('data-total'))||4682);\n  var modal=null,recordButton=null,previousFocus=null;\n\n  function blank(){return{schema:1,goal:20,examDate:'',days:{},seen:{},lastEvent:null}}\n  function load(){\n    try{\n      var data=JSON.parse(localStorage.getItem(RECORD_KEY)||'null')||blank();\n      if(!data.days||typeof data.days!=='object')data.days={};\n      if(!data.seen||typeof data.seen!=='object')data.seen={};\n      data.goal=Math.max(1,Math.min(500,Number(data.goal)||20));\n      data.examDate=/^\\d{4}-\\d{2}-\\d{2}$/.test(data.examDate||'')?data.examDate:'';\n      return data;\n    }catch(e){return blank()}\n  }\n  var records=load();\n  function save(){try{localStorage.setItem(RECORD_KEY,JSON.stringify(records))}catch(e){}}\n  function pad(value){return String(value).length\u003c2?'0'+value:String(value)}\n  function dateKey(date){return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())}\n  function localDate(key){\n    var parts=(key||'').split('-');\n    if(parts.length!==3)return null;\n    var date=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]),12,0,0,0);\n    return isNaN(date.getTime())?null:date;\n  }\n  function shifted(date,days){var copy=new Date(date.getFullYear(),date.getMonth(),date.getDate()+days,12,0,0,0);return copy}\n  function dayData(key){var value=records.days[key]||{};return{reviews:Math.max(0,Number(value.reviews)||0),attempts:Math.max(0,Number(value.attempts)||0),correct:Math.max(0,Number(value.correct)||0)}}\n  function weekStart(date){var delta=(date.getDay()+6)%7;return shifted(date,-delta)}\n  function sumReviews(start,count){var sum=0;for(var i=0;i\u003ccount;i++)sum+=dayData(dateKey(shifted(start,i))).reviews;re settings-button');if(!p||!b)return;b.setAttribute('aria-expanded',String(panelOpen));p.classList.toggle('open',panelOpen);p.innerHTML=seg('화면 테마','theme',[['light','밝게 고정'],['auto','기기 설정']])+seg('영어 글꼴','font',[['sans','고딕'],['serif','명조']])+seg('글자 크기','size',[['base','기본'],['large','크게'],['xlarge','더 크게']])+seg('설정창 동작','panel',[['close','카드 변경 시 닫기'],['keep','열린 상태 유지']])+sw('자동재생','auto','모바일 보안 설정에 따라 첫 재생은 터치가 필요할 수 있습니다.')+seg('재생 범위','scope',[['main','핵심'],['secondary','예문·문제'],['both','둘 다']])+seg('재생 횟수','repeat',[[1,'1회'],[2,'2회'],[3,'3회']])+sw('다른 앱 음악과 함께 재생','mix','오디오 혼합·일시정지는 Anki 앱과 OS 설정이 최종 결정합니다.')+seg('재생 속도','speed',[[.8,'0.8배'],[1,'1배'],[1.2,'1.2배'],[1.5,'1.5배']])+'\u003cbutton type=\"button\" class=\"lab-stop\"\u003e■ 음성 정지\u003c/button\u003e';\n    qa('[data-pref]').forEach(function(el){el.onclick=function(){var k=el.getAttribute('data-pref'),v=el.getAttribute('data-value');prefs[k]=(k==='speed'||k==='repeat')?Number(v):v;if(k==='panel'\u0026\u0026v==='close'){try{localStorage.setItem(OPEN_KEY,'0')}catch(e){}}save();apply();renderSettings()}});\n    qa('[data-toggle]').forEach(function(el){el.onclick=function(){var k=el.getAttribute('data-toggle');prefs[k]=!prefs[k];save();renderSettings();if(k==='auto'){if(prefs.auto)speak(scoped());else stop('자동재생을 껐습니다.')}if(k==='mix')status('음악 동시 재생 선호를 저장했습니다. 실제 혼합은 앱·기기 설정에 따라 달라집니다.')}});\n    var st=q('.lab-stop');if(st)st.onclick=function(){stop('음성을 멈췄습니다.')};\n  }\n  function openImage(img){var m=q('.lab-image-modal'),z=m\u0026\u0026m.querySelector('img');if(m\u0026\u0026z){z.src=img.src;z.alt=img.alt||'교재 연상 삽화';m.classList.add('open')}}\n  function closeImage(){var m=q('.lab-image-modal');if(m)m.classList.remove('open')}\n  function setHintStage(stage){var hb=q('.lab-hint-button'),hp=q('.lab-hint-panel');if(!hb||!hp)return;hp.classList.remove('open','stage-blur','stage-clear');hp.setAttribute('data-stage',stage);if(stage==='blur'){hp.classList.add('open','stage-blur');hb.textContent='② 이미지 선명하게 보기'}else if(stage==='clear'){hp.classList.add('open','stage-clear');hb.textContent='이미지 힌트 닫기'}else{hb.textContent='① 흐린 이미지 힌트 보기'}}\n  function setupHint(){var hb=q('.lab-hint-button'),hp=q('.lab-hint-panel');if(!hb||!hp)return;setHintStage('closed');hb.onclick=function(){var s=hp.getAttribute('data-stage');setHintStage(s==='closed'?'blur':s==='blur'?'clear':'closed')};var img=hp.querySelector('img');if(img)img.onclick=function(){if(hp.getAttribute('data-stage')==='blur')setHintStage('clear');else openImage(img)}}\n  function setupMnemonic(){qa('.lab-mnemonic').forEach(function(el){var raw=(el.textContent||'').trim(),parent=el.parentElement,section=el.closest('.lab-panel'),head=parent\u0026\u0026parent.querySelector('h3'),cap=parent\u0026\u0026parent.querySelector('.lab-sourcecap');if(raw.indexOf('[AI 장면 연상]')===0){var shown=raw.replace(/^\\[AI 장면 연상\\]\\s*/,'');var m=shown.match(/^사무실 전광판의 ‘([^’]+)’ 항목 옆에 ‘([^’]+)’을 나타내는 그림이 뜨는 장면을 한 컷으로 떠올리세요\\.$/);shown=m?('핵심 의미: '+m[2]+'. 이 뜻이 드러나는 장면을 떠올려 보세요.'):shown.replace(/한 컷으로 떠올리세요\\.$/,'떠올려 보세요.');el.textContent=shown;if(head)head.textContent='보조 연상';if(section)section.classList.add('lab-memory-generated');var d=document.createElement('details'),s=document.createElement('summary');d.className='lab-memory-details';s.textContent='보조 연상 열기';d.appendChild(s);parent.insertBefore(d,el);d.appendChild(el);if(cap)cap.textContent='생성 보충 · 상세 출처는 아래 관리 기록에서 확인'}else if(raw.indexOf('[원문 연상]')===0){if(head)head.textContent='교재 연상법 · 기존 내용 유지'}else if(raw.indexOf('[어근·장면 연상]')===0){if(head)head.textContent='어근·장면 연상'}else if(head){head.textContent='연상법'}})}\n  function choiceKey(s){var m=(s||'').replace(/\u003c[^\u003e]*\u003e/g,' ').match(/^\\s*([A-H])(?:[.\\)\\s]|$)/i);return m?m[1].toUpperCase():''}\n  var CHOICE_PREFIX='toeicLabPracticeChoiceV120:';\n  function practiceStorageKey(){var el=q('.lab-practice-id'),id=el?(el.textContent||'').trim():'';return id?CHOICE_PREFIX+id:''}\n  function clearPracticeChoice(){var k=practic 003cscript\u003e\n(function(){\n  'use strict';\n  var RECORD_KEY='toeicLabRecordsV124';\n  var meta=document.querySelector('.lab-record-meta');\n  if(!meta)return;\n  var noteId=(meta.getAttribute('data-note-id')||'').trim();\n  var side=meta.getAttribute('data-side')||'front';\n  var total=Math.max(1,Number(meta.getAttribute('data-total'))||4682);\n  var modal=null,recordButton=null,previousFocus=null;\n\n  function blank(){return{schema:1,goal:20,examDate:'',days:{},seen:{},lastEvent:null}}\n  function load(){\n    try{\n      var data=JSON.parse(localStorage.getItem(RECORD_KEY)||'null')||blank();\n      if(!data.days||typeof data.days!=='object')data.days={};\n      if(!data.seen||typeof data.seen!=='object')data.seen={};\n      data.goal=Math.max(1,Math.min(500,Number(data.goal)||20));\n      data.examDate=/^\\d{4}-\\d{2}-\\d{2}$/.test(data.examDate||'')?data.examDate:'';\n      return data;\n    }catch(e){return blank()}\n  }\n  var records=load();\n  function save(){try{localStorage.setItem(RECORD_KEY,JSON.stringify(records))}catch(e){}}\n  function pad(value){return String(value).length\u003c2?'0'+value:String(value)}\n  function dateKey(date){return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())}\n  function localDate(key){\n    var parts=(key||'').split('-');\n    if(parts.length!==3)return null;\n    var date=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]),12,0,0,0);\n    return isNaN(date.getTime())?null:date;\n  }\n  function shifted(date,days){var copy=new Date(date.getFullYear(),date.getMonth(),date.getDate()+days,12,0,0,0);return copy}\n  function dayData(key){var value=records.days[key]||{};return{reviews:Math.max(0,Number(value.reviews)||0),attempts:Math.max(0,Number(value.attempts)||0),correct:Math.max(0,Number(value.correct)||0)}}\n  function weekStart(date){var delta=(date.getDay()+6)%7;return shifted(date,-delta)}\n  function sumReviews(start,count){var sum=0;for(var i=0;i\u003ccount;i++)sum+=dayData(dateKey [1.5,'1.5배']])+'\u003cbutton type=\"button\" class=\"lab-stop\"\u003e■ 음성 정지\u003c/button\u003e';\n    qa('[data-pref]').forEach(function(el){el.onclick=function(){var k=el.getAttribute('data-pref'),v=el.getAttribute('data-value');prefs[k]=(k==='speed'||k==='repeat')?Number(v):v;if(k==='panel'\u0026\u0026v==='close'){try{localStorage.setItem(OPEN_KEY,'0')}catch(e){}}save();apply();renderSettings()}});\n    qa('[data-toggle]').forEach(function(el){el.onclick=function(){var k=el.getAttribute('data-toggle');prefs[k]=!prefs[k];save();renderSettings();if(k==='auto'){if(prefs.auto)speak(scoped());else stop('자동재생을 껐습니다.')}if(k==='mix')status('음악 동시 재생 선호를 저장했습니다. 실제 혼합은 앱·기기 설정에 따라 달라집니다.')}});\n    var st=q('.lab-stop');if(st)st.onclick=function(){stop('음성을 멈췄습니다.')};\n  }\n  function openImage(img){var m=q('.lab-image-modal'),z=m\u0026\u0026m.querySelector('img');if(m\u0026\u0026z){z.src=img.src;z.alt=img.alt||'교재 연상 삽화';m.classList.add('open')}}\n  function closeImage(){var m=q('.lab-image-modal');if(m)m.classList.remove('open')}\n  function setHintStage(stage){var hb=q('.lab-hint-button'),hp=q('.lab-hint-panel');if(!hb||!hp)return;hp.classList.remove('open','stage-blur','stage-clear');hp.setAttribute('data-stage',stage);if(stage==='blur'){hp.classList.add('open','stage-blur');hb.textContent='② 이미지 선명하게 보기'}else if(stage==='clear'){hp.classList.add('open','stage-clear');hb.textContent='이미지 힌트 닫기'}else{hb.textContent='① 흐린 이미지 힌트 보기'}}\n  function setupHint(){var hb=q('.lab-hint-button'),hp=q('.lab-hint-panel');if(!hb||!hp)return;setHintStage('closed');hb.onclick=function(){var s=hp.getAttribute('data-stage');setHintStage(s==='closed'?'blur':s==='blur'?'clear':'closed')};var img=hp.querySelector('img');if(img)img.onclick=function(){if(hp.getAttribute('data-stage')==='blur')setHintStage('clear');else openImage(img)}}\n  function setupMnemonic(){qa('.lab-mnemonic').forEach(function(el){var raw=(el.textContent||'').trim(),parent=el.parentElement,section=el.closest('.lab-pan ut(next,220)};u.onerror=function(){status('음성 재생을 확인할 수 없습니다. 기기 TTS 설정을 확인해 주세요.')};try{window.speechSynthesis.speak(u)}catch(e){status('음성 재생을 시작하지 못했습니다.')}}next();\n  }\n  function scoped(){var a=text('main'),b=text('secondary');if(prefs.scope==='secondary')return[b];if(prefs.scope==='both')return[a,b];return[a]}\n  function seg(label,key,opts){var h='\u003cdiv class=\"lab-setting-row\"\u003e\u003cdiv class=\"lab-setting-label\"\u003e'+label+'\u003c/div\u003e\u003cdiv class=\"lab-segments\"\u003e';opts.forEach(function(o){h+='\u003cbutton type=\"button\" data-pref=\"'+key+'\" data-value=\"'+o[0]+'\" class=\"'+(String(prefs[key])===String(o[0])?'active':'')+'\"\u003e'+o[1]+'\u003c/button\u003e'});return h+'\u003c/div\u003e\u003c/div\u003e'}\n  function sw(label,key,note){return '\u003cdiv class=\"lab-switch-row\"\u003e\u003cdiv\u003e\u003cdiv class=\"lab-setting-label\"\u003e'+label+'\u003c/div\u003e'+(note?'\u003cdiv class=\"lab-setting-note\"\u003e'+note+'\u003c/div\u003e':'')+'\u003c/div\u003e\u003cbutton type=\"button\" class=\"lab-switch '+(prefs[key]?'on':'')+'\" data-toggle=\"'+key+'\" role=\"switch\" aria-checked=\"'+String(!!prefs[key])+'\" aria-label=\"'+label+'\"\u003e\u003c/button\u003e\u003c/div\u003e'}\n  function renderSettings(){var p=q('.lab-settings-panel'),b=q('.lab-settings-button');if(!p||!b)return;b.setAttribute('aria-expanded',String(panelOpen));p.classList.toggle('open',panelOpen);p.innerHTML=seg('화면 테마','theme',[['light','밝게 고정'],['auto','기기 설정']])+seg('영어 글꼴','font',[['sans','고딕'],['serif','명조']])+seg('글자 크기','size',[['base','기본'],['large','크게'],['xlarge','더 크게']])+seg('설정창 동작','panel',[['close','카드 변경 시 닫기'],['keep','열린 상태 유지']])+sw('자동재생','auto','모바일 보안 설정에 따라 첫 재생은 터치가 필요할 수 있습니다.')+seg('재생 범위','scope',[['main','핵심'],['secondary','예문·문제'],['both','둘 다']])+seg('재생 횟수','repeat',[[1,'1회'],[2,'2회'],[3,'3회']])+sw('다른 앱 음악과 함께 재생','mix','오디오 혼합·일시정지는 Anki 앱과 OS 설정이 최종 결정합니다.')+seg('재생 속도','speed',[[.8,'0.8배'],[1,'1배'],[1.2,'1.2배'],[1.5,'1.5배']])+'\u003cbutton type=\"button\" class=\"lab-stop\"\u003e■ 음성 정지\u003c/button\u003e';\n    qa('[data-pref]').forEach(function(el){el.onclick=function(){var k=el.getAttribute('data-pref'),v=el.getAttribute('data-value');prefs[k]=(k==='speed'||k==='repeat')?Number(v):v;if(k==='panel'\u0026\u0026v==='close'){try{localStorage.setItem(OPEN_KEY,'0')}catch(e){}}save();apply();renderSettings()}});\n    qa('[data-toggle]').forEach(function(el){el.onclick=function(){var k=el.getAttribute('data-toggle');prefs[k]=!prefs[k];save();renderSettings();if(k==='auto'){if(prefs.auto)speak(scoped());else stop('자동재생을 껐습니다.')}if(k==='mix')status('음악 동시 재생 선호를 저장했습니다. 실제 혼합은 앱·기기 설정에 따라 달라집니다.')}});\n    var st=q('.lab-stop');if(st)st.onclick=function(){stop('음성을 멈췄습니다.')};\n  }\n  function openImage(img){var m=q('.lab-image-modal'),z=m\u0026\u0026m.querySelector('img');if(m\u0026\u0026z){z.src=img.src;z.alt=img.alt||'교재 연상 삽화';m.classList.add('open')}}\n  function closeImage(){var m=q('.lab-image-modal');if(m)m.classList.remove('open')}\n  function setHintStage(stage){var hb=q('.lab-hint-button'),hp=q('.lab-hint-panel');if(!hb||!hp)return;hp.classList.remove('open','stage-blur','stage-clear');hp.setAttribute('data-stage',stage);if(stage==='blur'){hp.classList.add('open','stage-blur');hb.textContent='② 이미지 선명하게 보기'}else if(stage==='clear'){hp.classList.add('open','stage-clear');hb.textContent='이미지 힌트 닫기'}else{hb.textContent='① 흐린 이미지 힌트 보기'}}\n  function setupHint(){var hb=q('.lab-hint-button'),hp=q('.lab-hint-panel');if(!hb||!hp)return;setHintStage('closed');hb.onclick=function(){var s=hp.getAttribute('data-stage');setHintStage(s==='closed'?'blur':s==='blur'?'clear':'closed')};var img=hp.querySelector('img');if(img)img.onclick=function(){if(hp.getAttribute('data-stage')==='blur')setHintStage('clear');else openImage(img)}}\n  function setupMnemonic(){qa('.lab-mnemonic').forEach(function(el){var raw=(el.textContent||'').trim(),parent=el.parentElement,section=el.closest('.lab-panel'),head=parent\u0026\u0026parent.querySelector('h3'),cap=parent\u0026\u0026parent.querySelector('.lab-sourcecap');if(raw.indexOf('[AI 장면 연상]')===0){var shown=raw.replace(/^\\[AI 장면 연상\\]\\s*/,'');var m=shown.match(/^사무실 전광판의 ‘([^’]+)’ 항목 옆에 ‘([^’]+)’을 나타내는 그림이 뜨는 장면을 한 컷으로 떠올리세요\\.$/);shown=m?('핵심 의미: '+m[2]+'. 이 뜻이 드러나는 장면을 떠올려 보세요.'):shown.replace(/한 컷으로 떠올리세요\\.$/,'떠올려 보세요.');el.textContent=shown;if(head)head.textContent='보조 연상';if(section)section.classList.add('lab-memory-generated');var d=document.createElement('details'),s=document.createElement('summary');d.className='lab-memory-details';s.textContent='보조 연상 열기';d.appendChild(s);parent.insertBefore(d,el);d.appendChild(el);if(cap)cap.textContent='생성 보충 · 상세 출처는 아래 관리 기록에서 확인'}else if(raw.indexOf('[원문 연상]')===0){if(head)head.textContent='교재 연상법 · 기존 내용 유지'}else if(raw.indexOf('[어근·장면 연상]')===0){if(head)head.textContent='어근·장면 연상'}else if(head){head.textContent='연상법'}})}\n  function choiceKey(s){var m=(s||'').replace(/\u003c[^\u003e]*\u003e/g,' ').match(/^\\s*([A-H])(?:[.\\)\\s]|$)/i);return m?m[1].toUpperCase():''}\n  var CHOICE_PREFIX='toeicLabPracticeChoiceV120:';\n  function practiceStorageKey(){var el=q('.lab-practice-id'),id=el?(el.textContent||'').trim():'';return id?CHOICE_PREFIX+id:''}\n  function clearPracticeChoice(){var k=practiceStorageKey();if(k){try{localStorage.removeItem(k)}catch(e){}}}\n  function savePracticeChoice(picked,correct){var k=practiceStorageKey();if(!k)return;try{localStorage.setItem(k,JSON.stringify({picked:picked,correct:correct,time:Date.now()}))}catch(e){}}\n  function paintChoiceResult(el,picked,correct){if(!el||!picked||!correct)return;var good=picked===correct;el.hidden=false;el.className='lab-choice-result '+(good?'good':'bad');el.textContent='내 선택 '+picked+' · 정답 '+correct+' · '+(good?'정답':'오답')}\n  function moveToExplanation(el){if(!el)return;var reduce=false;try{reduce=window.matchMedia\u0026\u0026window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}setTimeout(function(){try{el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});el.focus({preventScroll:true})}catch(e){try{el.scrollIntoView()}catch(x){}}},40)}\n  function revealInlineExplanation(picked,correct){var el=q('.lab-inline-explanation');if(!el)return;el.hidden=false;paintChoiceResult(el.querySelector('[data-choice-result]'),picked,correct);moveToExplanation(el)}\n  function tryShowNativeAnswer(){try{if(typeof pycmd==='function'){pycmd('ans');return true}}catch(e){}try{if(typeof showAnswer==='function'){showAnswer();return true}}catch(e){}return false}\n  function restorePracticeChoice(){if(q('.lab-practice-front'))return;var k=practiceStorageKey(),raw='';if(!k)return;try{raw=localStorage.getItem(k)||''}catch(e){}if(!raw)return;try{var data=JSON.parse(raw),el=q('[data-choice-result]');if(!data||!data.picked||!data.correct)return;paintChoiceResult(el,data.picked,data.correct);moveToExplanation(el||q('.lab-answer'))}catch(e){}}\n  function setupChoices(){var box=q('.lab-practice-front'),keyEl=q('.lab-answer-key');if(!box||!keyEl)return;clearPracticeChoice();var parts=box.innerHTML.split(/\u003cbr\\s*\\/?\\s*\u003e|\\n/gi).map(function(x){var d=document.createElement('div');d.innerHTML=x;return(d.textContent||'').replace(/\\s+/g,' ').trim()}).filter(Boolean),correct=choiceKey(keyEl.textContent||''),feedback=q('.lab-choice-feedback'),locked=false;if(parts.length\u003c2||!correct)return;box.innerHTML='';parts.forEach(function(label){var b=document.createElement('button');b.type='button';b.className='lab-choice-button';b.textContent=label;b.setAttribute('data-choice',choiceKey(label));b.onclick=function(){if(locked)return;locked=true;qa('.lab-choice-button').forEach(function(x){x.disabled=true;if(x.getAttribute('data-choice')===correct)x.classList.add('correct')});var picked=b.getAttribute('data-choice');b.classList.add('selected');if(picked===correct){if(feedback){feedback.className='lab-choice-feedback good';feedback.textContent='정답입니다. 해설로 바로 이동합니다.'}}else{b.classList.add('wrong');if(feedback){feedback.className='lab-choice-feedback bad';feedback.textContent='오답입니다. 해설로 바로 이동합니다.'}}savePracticeChoice(picked,correct);if(window.toeicLabRecordPractice)window.toeicLabRecordPractice(picked===correct);revealInlineExplanation(picked,correct);setTimeout(tryShowNativeAnswer,260)};box.appendChild(b)})}\n  apply();stop();\n  setupMnemonic();setupChoices();setupHint();restorePracticeChoice();\n  qa('[data-play]').forEach(function(el){el.onclick=function(){var role=el.getAttribute('data-play');speak([text(role)])}});\n  var sb=q('.lab-settings-button');if(sb)sb.onclick=function(){panelOpen=!panelOpen;try{localStorage.setItem(OPEN_KEY,panelOpen?'1':'0')}catch(e){}renderSettings()};\n  qa('.lab-memory-image img').forEach(function(img){img.onclick=function(){openImage(img)}});\n  var modal=q('.lab-image-modal'),close=q('.lab-image-close');if(close)close.onclick=closeImage;if(modal)modal.onclick=function(e){if(e.target===modal)closeImage()};\n  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeImage();panelOpen=false;renderSettings()}});\n  document.addEventListener('visibilitychange',function(){if(document.hidden)stop()});\n  renderSettings();if(prefs.auto)setTimeout(function(){speak(scoped())},180);\n})();\u003c/script\u003e\n\u003cscript\u003e\n(function(){\n  'use strict';\n  var RECORD_KEY='toeicLabRecordsV124';\n  var meta=document.querySelector('.lab-record-meta');\n  if(!meta)return;\n  var noteId=(meta.getAttribute('data-note-id')||'').trim();\n  var side=meta.getAttribute('data-side')||'front';\n  var total=Math.max(1,Number(meta.getAttribute('data-total'))||4682);\n  var modal=null,recordButton=null,previousFocus=null;\n\n  function blank(){return{schema:1,goal:20,examDate:'',days:{},seen:{},lastEvent:null}}\n  function load(){\n    try{\n      var data=JSON.parse(localStorage.getItem(RECORD_KEY)||'null')||blank();\n      if(!data.days||typeof data.days!=='object')data.days={};\n      if(!data.see {try{localStorage.setItem(KEY,JSON.stringify(prefs))}catch(e){}}\n  function apply(){\n    var light=prefs.theme==='light';\n    document.body.classList.toggle('lab-force-light',light);document.documentElement.classList.toggle('lab-force-light',light);\n    document.body.classList.toggle('lab-font-serif',prefs.font==='serif');document.body.classList.toggle('lab-size-large',prefs.size==='large');document.body.classList.toggle('lab-size-xlarge',prefs.size==='xlarge');\n  }\n  function text(role){var el=q('[data-tts-'+role+']');return el?(el.textContent||'').replace(/\\s+/g,' ').trim():''}\n  function status(s){var el=q('.lab-status');if(el)el.textContent=s||''}\n  function stop(msg){if(speechTimer){clearTimeout(speechTimer);speechTimer=null}try{if(window.speechSynthesis)window.speechSynthesis.cancel()}catch(e){}if(msg)status(msg)}\n  function speak(list){\n    var source=list.filter(function(x){return !!x}),times=Math.max(1,Math.min(3,Number(prefs.repeat)||1)),queue=[];\n    source.forEach(function(x){for(var i=0;i\u003ctimes;i++)queue.push(x)});\n    if(!queue.length)return;if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){status('이 기기에서는 카드 내 TTS를 사용할 수 없습니다.');return}stop();\n    function next(){if(!queue.length){status('');return}var u=new SpeechSynthesisUtterance(queue.shift());u.lang='en-US';u.rate=Number(prefs.speed)||1;u.onstart=function(){status('영어 음성 재생 중 · '+u.rate+'배속 · '+times+'회 설정')};u.onend=function(){speechTimer=setTimeout(next,220)};u.onerror=function(){status('음성 재생을 확인할 수 없습니다. 기기 TTS 설정을 확인해 주세요.')};try{window.speechSynthesis.speak(u)}catch(e){status('음성 재생을 시작하지 못했습니다.')}}next();\n  }\n  function scoped(){var a=text('main'),b=text('secondary');if(prefs.scope==='secondary')return[b];if(prefs.scope==='both')return[a,b];return[a]}\n  function seg(label,key,opts){var h='\u003cdiv class=\"lab-setting-row\"\u003e\u003cdiv class=\"lab-setting-label\"\u003e'+label+'\u003c/div\u003e\u003cdiv class=\"lab-segments\"\u003e';opts.forEach(function(o){h+='\u003cbutton type=\"button\" data-pref=\"'+key+'\" data-value=\"'+o[0]+'\" class=\"'+(String(prefs[key])===String(o[0])?'active':'')+'\"\u003e'+o[1]+'\u003c/button\u003e'});return h+'\u003c/div\u003e\u003c/div\u003e'}\n  function sw(label,key,note){return '\u003cdiv class=\"lab-switch-row\"\u003e\u003cdiv\u003e\u003cdiv class=\"lab-setting-label\"\u003e'+label+'\u003c/div\u003e'+(note?'\u003cdiv class=\"lab-setting-note\"\u003e'+note+'\u003c/div\u003e':'')+'\u003c/div\u003e\u003cbutton type=\"button\" class=\"lab-switch '+(prefs[key]?'on':'')+'\" data-toggle=\"'+key+'\" role=\"switch\" aria-checked=\"'+String(!!prefs[key])+'\" aria-label=\"'+label+'\"\u003e\u003c/button\u003e\u003c/div\u003e'}\n  function renderSettings(){var p=q('.lab-settings-panel'),b=q('.lab-settings-button');if(!p||!b)return;b.setAttribute('aria-expanded',String(panelOpen));p.classList.toggle('open',panelOpen);p.innerHTML=seg('화면 테마','theme',[['light','밝게 고정'],['auto','기기 설정']])+seg('영어 글꼴','font',[['sans','고딕'],['serif','명조']])+seg('글자 크기','size',[['base','기본'],['large','크게'],['xlarge','더 크게']])+seg('설정창 동작','panel',[['close','카드 변경 시 닫기'],['keep','열린 상태 유지']])+sw('자동재생','auto','모바일 보안 설정에 따라 첫 재생은 터치가 필요할 수 있습니다.')+seg('재생 범위','scope',[['main','핵심'],['secondary','예문·문제'],['both','둘 다']])+seg('재생 횟수','repeat',[[1,'1회'],[2,'2회'],[3,'3회']])+sw('다른 앱 음악과 함께 재생','mix','오디오 혼합·일시정지는 Anki 앱과 OS 설정이 최종 결정합니다.')+seg('재생 속도','speed',[[.8,'0.8배'],[1,'1배'],[1.2,'1.2배'],[1.5,'1.5배']])+'\u003cbutton type=\"button\" class=\"lab-stop\"\u003e■ 음성 정지\u003c/button\u003e';\n    qa('[data-pref]').forEach(function(el){el.onclick=function(){var k=el.getAttribute('data-pref'),v=el.getAttribute('data-value');prefs[k]=(k==='speed'||k==='repeat')?Number(v):v;if(k==='panel'\u0026\u0026v==='close'){try{localStorage.setItem(OPEN_KEY,'0')}catch(e){}}save();apply();renderSettings()}});\n    qa('[data-toggle]').forEach(function(el){el.onclick=function(){var k=el.getAttribute('data-toggle');prefs[k]=!prefs[k];save();r document.createElement('summary');d.className='lab-memory-details';s.textContent='보조 연상 열기';d.appendChild(s);parent.insertBefore(d,el);d.appendChild(el);if(cap)cap.textContent='생성 보충 · 상세 출처는 아래 관리 기록에서 확인'}else if(raw.indexOf('[원문 연상]')===0){if(head)head.textContent='교재 연상법 · 기존 내용 유지'}else if(raw.indexOf('[어근·장면 연상]')===0){if(head)head.textContent='어근·장면 연상'}else if(head){head.textContent='연상법'}})}\n  function choiceKey(s){var m=(s||'').replace(/\u003c[^\u003e]*\u003e/g,' ').match(/^\\s*([A-H])(?:[.\\)\\s]|$)/i);return m?m[1].toUpperCase():''}\n  var CHOICE_PREFIX='toeicLabPracticeChoiceV120:';\n  function practiceStorageKey(){var el=q('.lab-practice-id'),id=el?(el.textContent||'').trim():'';return id?CHOICE_PREFIX+id:''}\n  function clearPracticeChoice(){var k=practiceStorageKey();if(k){try{localStorage.removeItem(k)}catch(e){}}}\n  function savePracticeChoice(picked,correct){var k=practiceStorageKey();if(!k)return;try{localStorage.setItem(k,JSON.stringify({picked:picked,correct:correct,time:Date.now()}))}catch(e){}}\n  function paintChoiceResult(el,picked,correct){if(!el||!picked||!correct)return;var good=picked===correct;el.hidden=false;el.className='lab-choice-result '+(good?'good':'bad');el.textContent='내 선택 '+picked+' · 정답 '+correct+' · '+(good?'정답':'오답')}\n  function moveToExplanation(el){if(!el)return;var reduce=false;try{reduce=window.matchMedia\u0026\u0026window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}setTimeout(function(){try{el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});el.focus({preventScroll:true})}catch(e){try{el.scrollIntoView()}catch(x){}}},40)}\n  function revealInlineExplanation(picked,correct){var el=q('.lab-inline-explanation');if(!el)return;el.hidden=false;paintChoiceResult(el.querySelector('[data-choice-result]'),picked,correct);moveToExplanation(el)}\n  function tryShowNativeAnswer(){try{if(typeof pycmd==='function'){pycmd('ans');return true}}catch(e){}try{if(typeof showAnswer==='function'){show {\n  'use strict';\n  var RECORD_KEY='toeicLabRecordsV124';\n  var meta=document.querySelector('.lab-record-meta');\n  if(!meta)return;\n  var noteId=(meta.getAttribute('data-note-id')||'').trim();\n  var side=meta.getAttribute('data-side')||'front';\n  var total=Math.max(1,Number(meta.getAttribute('data-total'))||4682);\n  var modal=null,recordButton=null,previousFocus=null;\n\n  function blank(){return{schema:1,goal:20,examDate:'',days:{},seen:{},lastEvent:null}}\n  function load(){\n    try{\n      var data=JSON.parse(localStorage.getItem(RECORD_KEY)||'null')||blank();\n      if(!data.days||typeof data.days!=='object')data.days={};\n      if(!data.seen||typeof data.seen!=='object')data.seen={};\n      data.goal=Math.max(1,Math.min(500,Number(data.goal)||20));\n      data.examDate=/^\\d{4}-\\d{2}-\\d{2}$/.test(data.examDate||'')?data.examDate:'';\n      return data;\n    }catch(e){return blank()}\n  }\n  var records=load();\n  function save(){try{localStorage.setItem(RECORD_KEY,JSON.stringify(records))}catch(e){}}\n  function pad(value){return String(value).length\u003c2?'0'+value:String(value)}\n  function dateKey(date){return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())}\n  function localDate(key){\n    var parts=(key||'').split('-');\n    if(parts.length!==3)return null;\n    var date=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]),12,0,0,0);\n    return isNaN(date.getTime())?null:date;\n  }\n  function shifted(date,days){var copy=new Date(date.getFullYear(),date.getMonth(),date.getDate()+days,12,0,0,0);return copy}\n  function dayData(key){var value=records.days[key]||{};return{reviews:Math.max(0,Number(value.reviews)||0),attempts:Math.max(0,Number(value.attempts)||0),correct:Math.max(0,Number(value.correct)||0)}}\n  function weekStart(date){var delta=(date.getDay()+6)%7;return shifted(date,-delta)}\n  function sumReviews(start,count){var sum=0;for(var i=0;i\u003ccount;i++)sum+=dayData(dateKey(shifted(start,i))).reviews;return sum}\n  function currentStreak(today){\n    var cursor=dayData(dateKey(today)).reviews\u003e0?today:shifted(today,-1),count=0;\n    while(dayData(dateKey(cursor)).reviews\u003e0){count+=1;cursor=shifted(cursor,-1)}\n    return count;\n  }\n  function practiceTotals(){\n    var attempts=0,correct=0;\n    Object.keys(records.days).forEach(function(key){var day=dayData(key);attempts+=day.attempts;correct+=day.correct});\n    return{attempts:attempts,correct:correct,rate:attempts?Math.round(correct*100/attempts):0};\n  }\n  function dday(today){\n    var target=localDate(records.examDate);\n    if(!target)return{value:'미설정',note:'시험일을 입력하세요'};\n    var diff=Math.round((target.getTime()-today.getTime())/86400000);\n    if(diff===0)return{value:'D-DAY',note:records.examDate};\n    return{value:diff\u003e0?'D-'+diff:'D+'+Math.abs(diff),note:records.examDate};\n  }\n  function recordActivity(correct){\n    if(!noteId)return;\n    var now=Date.now(),last=records.lastEvent||{};\n    if(last.id===noteId\u0026\u0026now-Number(last.time||0)\u003c2500)return;\n    var today=dateKey(new Date()),day=dayData(today);\n    day.reviews+=1;\n    if(typeof correct==='boolean'){\n      day.attempts+=1;\n      if(correct)day.correct+=1;\n    }\n    records.days[today]=day;\n    records.seen[noteId]=1;\n    records.lastEvent={id:noteId,time:now};\n    save();\n    if(modal\u0026\u0026modal.getAttribute('aria-hidden')==='false')render();\n  }\n\n  window.toeicLabRecordPractice=function(correct){recordActivity(!!correct)};\n\n  function escapeHtml(text){return String(text).replace(/[\u0026\u003c\u003e\"']/g,function(ch){return{'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;',\"'\":'\u0026#39;'}[ch]})}\n  function metric(label,value,note,extra){return'\u003cdiv class=\"lab-record-metric\"\u003e\u003cspan\u003e'+label+'\u003c/span\u003e\u003cstrong\u003e'+value+'\u003c/strong\u003e\u003cspan\u003e'+note+'\u003c/span\u003e'+(extra?'\u003cem\u003e'+extra+'\u003c/em\u003e':'')+'\u003c/div\u003e'}\n  function bars(today){\n    var days=[],max=1,weekday=['일','월','화','수','목','금','토'];\n    for(var offset=-6;offset\u003c=0;offset++){\n      var date=shifted(today,offset),count=dayData(dateKey(date)).reviews;\n      if(count\u003emax)max=count;\n      days.push({date:date,count:count,today:offset===0});\n    }\n    return days.map(function(item){\n      var height=item.count?Math.max(6,Math.round(item.count*100/max)):3;\n      var title=(item.date.getMonth()+1)+'/'+item.date.getDate()+' · '+item.count+'회';\n      return'\u003cdiv class=\"lab-record-day '+(item.today?'today':'')+'\" title=\"'+title+'\"\u003e\u003cdiv class=\"lab-record-count\"\u003e'+item.count+'\u003c/div\u003e\u003cdiv class=\"lab-record-barbox\"\u003e\u003cdiv class=\"lab-record-bar\" style=\"height:'+height+'%\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"lab-record-daylabel\"\u003e'+weekday[item.date.getDay()]+'\u003c/div\u003e\u003c/div\u003e';\n    }).join('');\n  }\n  function render(){\n    if(!modal)return;\n    var today=new Date(),todayKey=dateKey(today),todayCount=dayData(todayKey).reviews;\n    var goal=records.goal,goalPct=Math.min(100,Math.round(todayCount*100/goal));\n    var streak=currentStreak(today),exam=dday(today),seen=Math.min(total,Object.keys(records.seen).length),progress=Math.round(seen*100/total);\n    var currentStart=weekStart(today),previousStart=shifted(currentStart,-7),thisWeek=sumReviews(currentStart,7),lastWeek=sumReviews(previousStart,7);\n    var delta=thisWeek-lastWeek,deltaText=lastWeek===0?(thisWeek?'이번 주 기록 시작':'변화 없음'):(delta===0?'지난주와 같음':(delta\u003e0?'+':'')+delta+'회');\n    var practice=practiceTotals();\n    var content=modal.querySelector('.lab-record-content');\n    content.innerHTML=[\n      '\u003cdiv class=\"lab-record-top\"\u003e',\n      '\u003csection class=\"lab-record-card today\"\u003e\u003cdiv class=\"lab-record-ring\" style=\"--lab-pct:'+goalPct+'%\"\u003e\u003cstrong\u003e'+todayCount+' ecord-progress\" aria-label=\"덱 진행률 '+progress+'%\"\u003e\u003cspan style=\"width:'+progress+'%\"\u003e\u003c/span\u003e\u003c/div\u003e',\n      '\u003csection class=\"lab-record-chart\"\u003e\u003cdiv class=\"lab-record-section-head\"\u003e\u003ch3\u003e최근 7일 학습 활동\u003c/h3\u003e\u003cspan\u003e최대 '+Math.max.apply(null,[1].concat((function(){var a=[];for(var i=-6;i\u003c=0;i++)a.push(dayData(dateKey(shifted(today,i))).reviews);return a})()))+'회\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"lab-record-bars\"\u003e'+bars(today)+'\u003c/div\u003e\u003c/section\u003e',\n      '\u003cdiv class=\"lab-record-foot\"\u003e\u003cp\u003e\u003cstrong\u003e현재 기기에만 저장됩니다.\u003c/strong\u003e\u003cbr\u003e카드에서 해설을 연 횟수와 문제 선택을 기준으로 하므로 Anki의 평점·복습 로그와 다를 수 있으며, 기기 간 동기화되지 않습니다.\u003c/p\u003e\u003cbutton type=\"button\" class=\"lab-record-reset\" data-record-reset\u003e이 기기 기록 초기화\u003c/button\u003e\u003c/div\u003e'\n    ].join('');\n\n    var goalInput=content.querySelector('[data-record-goal]');\n    var examInput=content.querySelector('[data-record-exam]');\n    var resetButton=content.querySelector('[data-record-reset]');\n    goalInput.onchange=function(){records.goal=Math.max(1,Math.min(500,Number(goalInput.value)||20));save();render()};\n    examInput.onchange=function(){records.examDate=/^\\d{4}-\\d{2}-\\d{2}$/.test(examInput.value||'')?examInput.value:'';save();render()};\n    resetButton.onclick=function(){if(window.confirm('현재 기기에 저장된 TOEIC LAB 학습 기록을 모두 초기화할까요?')){records=blank();save();render()}};\n  }\n  function open(){\n    previousFocus=document.activeElement;\n    render();\n    modal.setAttribute('aria-hidden','false');\n    document.body.classList.add('lab-record-body-lock');\n    var close=modal.querySelector('.lab-record-close');\n    if(close)close.focus();\n  }\n  function close(){\n    if(!modal)return;\n    modal.setAttribute('aria-hidden','true');\n    document.body.classList.remove('lab-record-body-lock');\n    if(previousFocus\u0026\u0026previousFo   var meta=document.querySelector('.lab-record-meta');\n  if(!meta)return;\n  var noteId=(meta.getAttribute('data-note-id')||'').trim();\n  var side=meta.getAttribute('data-side')||'front';\n  var total=Math.max(1,Number(meta.getAttribute('data-total'))||4682);\n  var modal=null,recordButton=null,previousFocus=null;\n\n  function blank(){return{schema:1,goal:20,examDate:'',days:{},seen:{},lastEvent:null}}\n  function load(){\n    try{\n      var data=JSON.parse(localStorage.getItem(RECORD_KEY)||'null')||blank();\n      if(!data.days||typeof data.days!=='object')data.days={};\n      if(!data.seen||typeof data.seen!=='object')data.seen={};\n      data.goal=Math.max(1,Math.min(500,Number(data.goal)||20));\n      data.examDate=/^\\d{4}-\\d{2}-\\d{2}$/.test(data.examDate||'')?data.examDate:'';\n      return data;\n    }catch(e){return blank()}\n  }\n  var records=load();\n  function save(){try{localStorage.setItem(RECORD_KEY,JSON.stringify(records))}catch(e){}}\n  function pad(value){return String(value).length\u003c2?'0'+value:String(value)}\n  function dateKey(date){return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())}\n  function localDate(key){\n    var parts=(key||'').split('-');\n    if(parts.length!==3)return null;\n    var date=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]),12,0,0,0);\n    return isNaN(date.getTime())?null:date;\n  }\n  function shifted(date,days){var copy=new Date(date.getFullYear(),date.getMonth(),date.getDate()+days,12,0,0,0);return copy}\n  function dayData(key){var value=records.days[key]||{};return{reviews:Math.max(0,Number(value.reviews)||0),attempts:Math.max(0,Number(value.attempts)||0),correct:Math.max(0,Number(value.correct)||0)}}\n  function weekStart(date){var delta=(date.getDay()+6)%7;return shifted(date,-delta)}\n  function sumReviews(start,count){var sum=0;for(var i=0;i\u003ccount;i++)sum+=dayData(dateKey(shifted(start,i))).reviews;return sum}\n  function currentStreak(today){\n    var cursor= n\"\u003eIt seems appropriate that the _____ will be used to buy books for the library.\u003c/h1\u003e\u003csection class=\"lab-choices lab-practice-front\"\u003eA. donation\u003cbr\u003eB. donor\u003cbr\u003eC. donate\u003c/section\u003e\u003cdiv class=\"lab-answer-key\" hidden\u003eA. donation\u003c/div\u003e\u003cdiv class=\"lab-practice-id\" hidden\u003ePRA-0001\u003c/div\u003e\u003cdiv class=\"lab-choice-feedback\" role=\"status\"\u003e선택하면 정오답을 표시한 뒤 해설로 바로 이동합니다.\u003c/div\u003e\u003cdiv class=\"lab-inline-explanation\" hidden tabindex=\"-1\"\u003e\u003cdiv class=\"lab-choice-result\" data-choice-result role=\"status\"\u003e\u003c/div\u003e\u003csection class=\"lab-answer\"\u003e\u003ch3\u003e정답\u003c/h3\u003e\u003cdiv class=\"lab-meaning\"\u003eA. donation\u003c/div\u003e\u003c/section\u003e\u003csection class=\"lab-panel lab-example\"\u003e\u003ch3\u003e정답 근거\u003c/h3\u003e\u003cdiv\u003ethe 뒤에서 절의 주어가 되고 단수 동사 will be used와 연결되므로 사물 명사 donation이 맞다.\u003c/div\u003e\u003c/section\u003e\u003csection class=\"lab-panel lab-ko\"\u003e\u003ch3\u003e전체 문장 해석\u003c/h3\u003e\u003cdiv\u003e그 기부금이 도서관 장서를 사는 데 사용되는 것이 적절해 보인다.\u003c/div\u003e\u003c/section\u003e\u003csection class=\"lab-panel lab-caution\"\u003e\u003ch3\u003e오답이 틀린 이유\u003c/h3\u003e\u003cdiv\u003edonor는 ‘기부자’라는 사람 명사이고, donate는 동사라서 이 자리에 맞지 않는다.\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"lab-inline-next\"\u003e해설 확인 후 Anki의 평가 버튼으로 복습 결과를 선택하세요.\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"lab-meta\"\u003e\u003cspan\u003e품사·파생어 선택\u003c/span\u003e\u003cspan\u003e난이도 A\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"lab-toolbar\"\u003e\u003cdiv class=\"lab-audio-buttons\"\u003e\u003cbutton type=\"button\" class=\"lab-sound\" data-play=\"main\"\u003e▶ 문제 듣기\u003c/button\u003e\u003cbutton type=\"button\" class=\"lab-sound\" data-play=\"secondary\"\u003e▶ 보기 듣기\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"lab-settings-host\"\u003e\u003cbutton type=\"button\" class=\"lab-settings-b ta+'회');\n    var practice=practiceTotals();\n    var content=modal.querySelector('.lab-record-content');\n    content.innerHTML=[\n      '\u003cdiv class=\"lab-record-top\"\u003e',\n      '\u003csection class=\"lab-record-card today\"\u003e\u003cdiv class=\"lab-record-ring\" style=\"--lab-pct:'+goalPct+'%\"\u003e\u003cstrong\u003e'+todayCount+'\u003cspan\u003e/'+goal+'\u003c/span\u003e\u003c/strong\u003e\u003c/div\u003e\u003cdiv\u003e\u003cdiv class=\"lab-record-label\"\u003e오늘 학습 활동\u003c/div\u003e\u003cdiv class=\"lab-record-value\"\u003e'+goalPct+'\u003csmall\u003e% 달성\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"lab-record-note\"\u003e해설 열기 또는 문제 선택 기준\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e',\n      '\u003csection class=\"lab-record-card\"\u003e\u003cdiv class=\"lab-record-label\"\u003e연속 학습\u003c/div\u003e\u003cdiv class=\"lab-record-value\"\u003e'+streak+'\u003csmall\u003e일\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"lab-record-note\"\u003e오늘 또는 어제부터 이어진 기록\u003c/div\u003e\u003c/section\u003e',\n      '\u003csection class=\"lab-record-card\"\u003e\u003cdiv class=\"lab-record-label\"\u003e시험일까지\u003c/div\u003e\u003cdiv class=\"lab-record-value\"\u003e'+exam.value+'\u003c/div\u003e\u003cdiv class=\"lab-record-note\"\u003e'+exam.note+'\u003c/div\u003e\u003c/section\u003e',\n      '\u003c/div\u003e',\n      '\u003cdiv class=\"lab-record-controls\"\u003e\u003cdiv class=\"lab-record-control\"\u003e\u003clabel for=\"lab-record-goal\"\u003e하루 목표\u003c/label\u003e\u003cinput id=\"lab-record-goal\" data-record-goal type=\"number\" min=\"1\" max=\"500\" inputmode=\"numeric\" value=\"'+goal+'\"\u003e\u003c/div\u003e\u003cdiv class=\"lab-record-control\"\u003e\u003clabel for=\"lab-record-exam\"\u003e시험일\u003c/label\u003e\u003cinput id=\"lab-record-exam\" data-record-exam type=\"date\" value=\"'+escapeHtml(records.examDate)+'\"\u003e\u003c/div\u003e\u003c/div\u003e',\n      '\u003cdiv class=\"lab-record-metrics\"\u003e',\n      metric('덱 진행률',seen (null);\n})();\n\u003c/script\u003e\n\u003c/body\u003e\u003c/html\u003e"}]</script><script>const data=JSON.parse(document.getElementById('payload').textContent);let sel=0;function draw(){document.getElementById('tabs').innerHTML=data.map((x,i)=>'<button class="'+(i===sel?'active':'')+'" data-i="'+i+'">'+x.label+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{sel=Number(b.dataset.i);draw()});document.getElementById('front').srcdoc=data[sel].front;document.getElementById('back').srcdoc=data[sel].back;document.getElementById('meta').textContent=data[sel].noteid+' · 실제 RC5 APKG 템플릿 렌더링'}draw();</script></body></html>
